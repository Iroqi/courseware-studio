<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JavaScript 的 sort() 到底怎么排序</title>
<style>
  :root{
    color-scheme:dark;
    --bg:#0d0f14; --panel:#181c25; --line:#252b37;
    --fg:#e9ecf3; --dim:#8d95a8; --dim2:#6b748a;
    --key:#f5a623; --ok:#2ecc71; --bad:#ef4d4d;
  }
  *{box-sizing:border-box}
  /* 背景光晕**不用 background-attachment:fixed**：iOS Safari 对它的支持是坏的
     （键盘弹起/滚动时整层抖动或空白）。改成一条 position:fixed 的伪元素层，
     观感一致：底色铺底，光晕钉在视口顶部。 */
  body{margin:0;color:var(--fg);background:var(--bg);
       font:15px/1.7 -apple-system,"Segoe UI",system-ui,"Microsoft YaHei",sans-serif}
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
       background:radial-gradient(1100px 640px at 50% -8%,#151a26 0%,transparent 62%)}
  ::selection{background:rgba(245,166,35,.28);color:#fff}
  /* 键盘焦点必须看得见：交互项一半是运行时动态生成的，全局一条比逐处补更可靠 */
  :focus-visible{outline:2px solid var(--key);outline-offset:2px}

  /* ── ① 进度条：**章节边界直接长在它上面** ─────────────────────────
     原先画布上方还有一行章节胶囊。那是在跟画布抢一行位置，信息又和进度条重复
     ——都是"课程走到哪了"。现在不设那一行：每节起点做成进度条上的一根刻度，
     悬停即报出该处属于哪一节。顶部 / 画布上方都不再有常驻条。
     进度条本身常驻，与 ▶ / ⟲ 一起长在播放器行 .rack 里（位置见下面 ④）。 */
  .bar{position:relative;height:6px;border-radius:3px;background:#242a36;cursor:pointer;
       touch-action:none}   /* 触屏横拖喂给擦洗，不当成页面滚动 */
  /* 视觉高度 6px，但命中区上下各扩 7px——细条上瞄准点击太累 */
  .bar::before{content:"";position:absolute;left:0;right:0;top:-7px;bottom:-7px}
  .bar-fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:3px;background:var(--key);
            z-index:1}
  /* 章节刻度：上下各探出 3px，一眼看出整门课被切成几段。
     2px 宽 / 比条底亮一档——1px 太细，暗底上基本看不见，那这一层信息就白放了。 */
  .bar .tick{position:absolute;top:-3px;width:2px;height:12px;background:#5f6a7d;
             border-radius:1px;z-index:2;pointer-events:none}
  /* 悬停窥探：指着哪一段就报哪一段（连该处时间一起报）。点击仍是自由拖动。 */
  .bar .tip{position:absolute;bottom:15px;transform:translateX(-50%);white-space:nowrap;
            padding:3px 9px;border-radius:6px;background:#232a38;border:1px solid #3b4459;
            font:12px/1.5 ui-monospace,Consolas,monospace;color:var(--fg);
            box-shadow:0 6px 20px rgba(0,0,0,.5);pointer-events:none;
            opacity:0;transition:opacity .12s;z-index:3}
  .bar .tip[data-on="1"]{opacity:1}
  .step{font:12px/1.4 ui-monospace,Consolas,monospace;color:var(--dim);
        white-space:nowrap;text-align:right}

  /* ── 主体：两栏 ─────────────────────────── */
  /* 高屏幕上整块版面垂直居中（margin:auto 而不是 center 对齐：内容一旦超过
     视口高度，auto 会退化成 0，不会像 justify-content:center 那样裁掉顶部）。 */
  /* dvh 跟得住移动端地址栏的收放；不认识的浏览器保留前一条 100vh 兜底 */
  #root{display:flex;min-height:100vh;min-height:100dvh}
  .shell{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start;
         padding:24px 18px;margin:auto;width:100%;max-width:1500px}
  .col-stage{min-width:0}
  .chapter{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin:0 0 10px}
  .chapter .tag{font-size:11px;padding:2px 8px;border-radius:5px;flex:none;
                background:rgba(245,166,35,.14);color:var(--key)}
  .chapter h1{font-size:19px;margin:0;font-weight:700}
  /* tagline 独占一行：和标题挤同一行时长句会在随机位置断行，起行后整句完整 */
  .chapter .tagline{font-size:13px;color:var(--dim);margin:0;flex:1 1 100%}
  .chapter .tagline:empty{display:none}

  /* 舞台：宽度决定高度。**宽度 = 左栏宽度，不单独设 max-width。**
     画布比例已经由内容决定（viewBox 比例 ≈ 各场景内容并集的比例），
     再给画布套一个"看着合适"的上限，只会凭空留出一条没人用的竖带
     （实测：上限 840 在 1920 窗口下留出 284px）。
     要收窄整个版面就改 .shell 的 max-width —— 一处上限同时管住两栏。
     它同时是播放层与门禁的定位参照（这两样浮在它内部，见下）。
     **下缘不圆角**：播放器行紧接在它下面，两层共边成一块。 */
  .stage{position:relative;overflow:hidden;
         background:linear-gradient(180deg,#1c212d 0%,var(--panel) 55%,#161a23 100%);
         box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
         border:1px solid var(--line);border-radius:14px 14px 0 0;padding:10px}
  .stage svg{display:block;width:100%;height:auto;aspect-ratio:1000/460}

  /* ── 画布内播放层（替代原先的顶部走带） ──────────────────────────
     显隐只由 .stage[data-state] 决定，state 由页面写：idle / playing / paused
     **锚在底部、不居中**：画面中心常是正文（比如开场那句要人先猜的问题），
     居中的播放键会正好压住它。底部锚定跟画面内容不抢位置。
     padding-bottom 64px 让胶囊停在字幕带**上方**：idle 时字幕本就收着不叠，
     但开播瞬间两层各 0.32s 交叉淡入淡出，压太近会有一帧并排挤在带子里。 */
  .veilplay{position:absolute;inset:10px;z-index:5;display:flex;align-items:flex-end;
            justify-content:center;padding-bottom:64px;border:0;border-radius:12px;
            background:rgba(10,12,17,.46);color:var(--fg);cursor:pointer;font:inherit;
            transition:opacity .32s ease,background .32s ease}
  .veilplay .vp{display:flex;align-items:center;gap:10px;padding:8px 16px 8px 10px;
            border-radius:999px;background:rgba(9,11,16,.74);
            border:1px solid rgba(255,255,255,.12);box-shadow:0 8px 28px rgba(0,0,0,.45)}
  .veilplay .vp-ico{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;
            justify-content:center;background:var(--key);color:#1a1200;
            font-size:14px;padding-left:3px}
  .veilplay .vp-txt{font-size:14.5px;font-weight:600}
  .veilplay .vp-sub{font:12px/1.4 ui-monospace,Consolas,monospace;color:var(--dim)}
  /* 键盘快捷键的唯一曝光位。原先在字幕条右下角，字幕条删掉后搬进开场这一层：
     只看一次就够（开播后播放器行的 ▶ ⟲ 进度条已经把鼠标操作说清了）。 */
  .veilplay .vp-kbd{font-size:11px;color:var(--dim2);white-space:nowrap;
                    border-left:1px solid rgba(255,255,255,.14);padding-left:10px}
  /* idle：压暗 + 呼吸，明确"点这里开始" */
  .stage[data-state="idle"] .veilplay{animation:breathe 2.8s ease-in-out infinite}
  @keyframes breathe{0%,100%{background:rgba(10,12,17,.46)}50%{background:rgba(10,12,17,.22)}}
  /* playing / paused：整层收起。暂停时**不压暗**——要能看清停在哪一帧；
     恢复播放的入口在画布下面播放器行的 ▶ 上（就像普通播放器）。 */
  .stage[data-state="playing"] .veilplay,
  .stage[data-state="paused"] .veilplay{opacity:0;pointer-events:none}
  /* 未开始时不放字幕：那时"点这里开始"那颗胶囊就锚在画布底部，字幕带也在那儿，
     两条会叠在一起。语义上也顺——字幕是跟着旁白出现的，旁白没响就没有字幕。 */
  .stage[data-state="idle"] #cap{opacity:0}

  .el{opacity:0;transition:opacity .38s ease}
  .el.on{opacity:1}
  .card0{transition:transform .62s cubic-bezier(.22,1,.36,1),fill .4s,stroke .4s}

  /* ── ④ 播放器行：**紧贴在画布下面**，与画布共左右边 ──────────────────
     页面级常驻字幕条不属于当前结构；字幕统一留在画布内。
     字幕已经**长在画布里**（画布下缘那条随句刷新的字幕带，见 §② 的 `#cap`）
     —— 页面级那条与它说的**本来就是同一句话**，白白多占一行。
     现在只剩两层，共边的细节都只画一次：**圆角只给外圈**（stage 收上圆角、
     播放器行收下圆角），**分隔线只由 stage 的 border-bottom 出**（播放器行写
     border-top:0），否则两条 1px 就会贴成一条 2px。
     它就是画布下面那条常驻播放器：进度条永远看得见，暂停 / 恢复的入口永远在。
     进度条同时是**章节地图**（每节起点一根刻度，悬停报出该段章节名与时间），
     所以画布上方不需要章节标签行。 */
  .rack{display:flex;align-items:center;gap:11px;padding:9px 14px;background:#101319;
        border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px}
  .rack .pp{width:28px;height:28px;flex:none;border-radius:50%;border:0;cursor:pointer;
            background:var(--key);color:#1a1200;font-size:11px;line-height:1;padding-left:2px;
            transition:filter .13s}
  .rack .pp:hover{filter:brightness(1.12)}
  .rack .rew{width:26px;height:26px;flex:none;border-radius:50%;border:0;cursor:pointer;
             background:rgba(255,255,255,.09);color:var(--fg);font-size:11px;line-height:1}
  .rack .rew:hover{background:rgba(255,255,255,.18)}
  /* 倍速：画面/字幕/门禁全是 currentTime 的函数，改的只是时钟走多快——见 §⑦ 接线 */
  .rack .spd{min-width:34px;height:26px;flex:none;border-radius:13px;border:0;cursor:pointer;
             background:rgba(255,255,255,.09);color:var(--fg);
             font:11px/1 ui-monospace,Consolas,monospace}
  .rack .spd:hover{background:rgba(255,255,255,.18)}
  /* 非 1× 常亮描色：当下时钟被改过速，得一眼看得见，不然读数会对不上嘴 */
  .rack .spd[data-off]{background:rgba(245,166,35,.16);color:var(--key)}
  .rack .fs{width:26px;height:26px;flex:none;border-radius:50%;border:0;cursor:pointer;
            background:rgba(255,255,255,.09);color:var(--fg);display:grid;place-items:center}
  .rack .fs:hover{background:rgba(255,255,255,.18)}
  .rack .fs[hidden]{display:none}          /* display:grid 会盖掉 UA 的 [hidden]，自己补一刀 */
  .fs .ic-out{display:none}
  body[data-fs="1"] .fs .ic-in{display:none}
  body[data-fs="1"] .fs .ic-out{display:block}
  .rack .bar{flex:1;min-width:60px}
  .rack .step{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
  /* 门禁开着时本行变灰且不可点：门禁的语义是"答对才继续"，还让点 ▶ 就等于白设。
     但**只变灰、不收起**——学习者的视线在画布上，行没了反而更懵。
     （窄屏悬浮态例外：那本来就要到 3s 自动收起，门禁下直接压成不显形。） */
  .rack[data-gated="1"]{opacity:.5;pointer-events:none}

  /* ②b 门禁：**从画布内浮出** —— 提问本身就是画面的一部分。
     开门禁时抬高舞台的高度下限（下面那条 :has 规则）：画布窄时舞台按 1000/460
     比例算出的高度装不下一张卡，overflow:hidden 会把卡片裁掉；极端情况（矮视口、
     超高卡片）卡片在压暗层内滚动兜底。
     入场分两层：整卡升起（gateIn），卡内三段再依次落位（cardIn + 错开的 delay）——
     题目不是"啪"地砸上来，而是先告诉你"停一下"，再逐层展开。 */
  .gate{position:absolute;inset:10px;z-index:9;display:flex;padding:20px;
        border-radius:12px;overflow:auto;
        scrollbar-width:thin;scrollbar-color:#3a4359 transparent;
        background:rgba(6,8,12,.92);backdrop-filter:blur(4px);
        animation:gateIn .3s ease both}
  .gate[hidden]{display:none}
  /* 出场**不是硬切**：加 .leaving 淡出上移，动画走完再由 JS 盖上 hidden，然后才起播旁白
     （否则旁白在还压着暗的画布底下就开口了，听着像"上一句被切掉、下一句突然开始"） */
  .gate.leaving{animation:gateOut .24s ease forwards;pointer-events:none}
  @keyframes gateIn{from{opacity:0;transform:translateY(12px) scale(.985)}
                    to{opacity:1;transform:none}}
  @keyframes gateOut{to{opacity:0;transform:translateY(-8px) scale(.99)}}
  /* 门禁开着时画布内的播放层让位（播放器行在画布外面，由页面写 .rack[data-gated="1"]）。
     用 :has 而不是改 data-state——data-state 记录的是"音频在干什么"，不该被门禁污染。 */
  .stage:has(.gate:not([hidden])) .veilplay{opacity:0;pointer-events:none}
  /* 门禁开着时把舞台抬到至少装得下一张卡；min() 里的视口项保证矮屏上不整块跳出屏幕，
     剩下装不下的由 .gate 的 overflow:auto 滚动兜底。导出探针截图时门禁是关着的，此规则不生效。 */
  .stage:has(.gate:not([hidden])){min-height:min(640px, calc(100vh - 150px));
        min-height:min(640px, calc(100dvh - 150px))}   /* 后一条在支持 dvh 的浏览器接管 */
  .gate .g-card{width:100%;max-width:660px;margin:auto;background:#1e2431;   /* 比 --panel 亮一档才压得住背景；居中靠 auto 边距，align-items:center 配 overflow 会把卡片顶部裁掉且滚不回来 */
        border:1px solid #3a4359;border-radius:14px;padding:18px 20px;
        box-shadow:0 20px 56px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06)}
  .gate .g-card>*{animation:cardIn .3s ease both}
  .gate .g-card>*:nth-child(1){animation-delay:.04s}
  .gate .g-card>*:nth-child(2){animation-delay:.11s}
  .gate .g-card>*:nth-child(3){animation-delay:.18s}
  @keyframes cardIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  .gate .kick{margin:0 0 9px;font-size:11.5px;letter-spacing:.07em;color:var(--key)}
  .gate .q{font-weight:600;font-size:16.5px;line-height:1.55;margin:0 0 12px}
  .opts{display:flex;gap:8px;flex-wrap:wrap}
  /* 注意别写 `font:13.5px inherit`——font 简写缺字族是整条作废，
     按钮会悄悄回落到正文 15px。逐项写。 */
  .opt{background:var(--panel);color:var(--fg);border:1px solid #333b4d;border-radius:999px;
       padding:7px 15px;cursor:pointer;font-size:13.5px;transition:.13s}
  .opt:hover:not(:disabled){border-color:var(--key);color:var(--key);background:#1e2431}
  .opt:disabled{cursor:default;opacity:.85}
  .opt[data-selected="1"]{border-color:var(--key)}
  .interaction-feedback{margin-top:9px;font-size:13.5px;color:var(--dim);min-height:18px}
  .interaction-feedback.is-correct{color:var(--ok)}
  .interaction-feedback.is-wrong{color:var(--bad)}
  .gate-next{display:flex;align-items:center;gap:11px;margin-top:11px;padding-top:11px;
             border-top:1px solid #262c3a}
  .gate-next[hidden]{display:none}
  /* 「继续」键与卡里的提交键同款（.gate-next / .act-row 两条路径共用一套样式） */
  .gate-next .go,.act-row .go{background:var(--key);color:#14181f;border:0;border-radius:999px;
                 padding:8px 18px;cursor:pointer;font-weight:600;font-size:13.5px;
                 transition:filter .13s}
  .gate-next .go:hover:not(:disabled),.act-row .go:hover:not(:disabled){filter:brightness(1.1)}
  .gate-next .go:disabled,.act-row .go:disabled{background:#2b3242;color:var(--dim2);cursor:default}
  .gate-next .hint{font-size:12.5px;color:var(--dim2)}
  /* 卡里的提交行（排序题 / 归类型题共用） */
  .act-row{display:flex;align-items:center;gap:10px;margin-top:10px}

  /* hotspot（在图上点部位）：可点区是**盖在静态图上的按钮**，left/top 用百分比——
     跟着图一起缩放；用按钮而不是 SVG 里的 <g>，键盘与触屏才点得到。
     圈里不写字（写了等于给答案），虚线本身就是"这里可以点"的提示。 */
  .hotspot-stage{position:relative;margin:4px 0 12px}
  .hotspot-stage svg{display:block;width:100%;height:auto}
  .hotspot-stage .hs{position:absolute;transform:translate(-50%,-50%);border-radius:50%;
        border:1.6px dashed #62708c;background:rgba(245,166,35,.08);padding:0;
        display:flex;align-items:center;justify-content:center;cursor:pointer;
        font-weight:700;font-size:15px;color:#98a2b8;transition:.16s}
  .hotspot-stage .hs:hover{border-color:var(--key);background:rgba(245,166,35,.16);color:var(--key)}
  .hotspot-stage .hs[data-hotspot-state="hit"]{border-style:solid;border-color:var(--ok);
        background:rgba(46,204,113,.18);color:var(--ok)}
  .hotspot-stage .hs[data-hotspot-state="hit"]::after{content:"✓"}
  .hotspot-stage .hs[data-hotspot-state="miss"]{border-style:solid;border-color:var(--bad);
        background:rgba(239,77,77,.14);color:var(--bad);cursor:default}
  .hotspot-stage .hs[data-hotspot-state="miss"]::after{content:"✕"}
  [data-interaction][data-locked="1"] .hotspot-stage .hs{cursor:default}

  /* bucket（放进筐）：钩子名 .bucket-item / [data-drop] / [data-drop-slot] /
     [data-bucket-submit] 由运行时逐字匹配，写错的表现是"拖不动"且不报错 */
  .bucket-tray{list-style:none;margin:0 0 10px;padding:8px;min-height:42px;
        display:flex;flex-wrap:wrap;gap:6px;border:1px dashed #333b4d;border-radius:10px;
        background:#1a2029}
  .bucket-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .bucket-drop{border:1px dashed #3a4359;border-radius:10px;padding:9px 10px;background:#1a2029;
        transition:border-color .16s}
  .bucket-drop:hover{border-color:var(--key)}
  .bucket-drop .b-label{display:block;font-size:11.5px;color:var(--dim2);margin-bottom:7px}
  .bucket-slot{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;
        gap:6px;min-height:34px}
  .bucket-item{display:inline-flex;align-items:center;padding:7px 12px;border-radius:8px;
        background:var(--panel);border:1px solid #333b4d;cursor:grab;user-select:none;
        font-size:13.5px;transition:border-color .13s,color .13s}
  .bucket-item:hover{border-color:var(--key)}
  /* 触屏点选态（点 A → 点 B，A 挪到 B 的位置）：sequence / bucket 同一视觉语言 */
  .bucket-item[data-picked="1"],.sequence-item[data-picked="1"]{border-color:var(--key);color:var(--key);
        box-shadow:0 0 0 2px rgba(245,166,35,.18)}
  .bucket-item[data-bucket-state="hit"]{border-color:var(--ok);color:var(--ok)}
  .bucket-item[data-bucket-state="miss"]{border-color:var(--bad);color:var(--bad)}

  /* sequence / bucket 共用的拖拽态：原项留流内变淡，浮动克隆跟手（克隆由运行时内联定位）。
     touch-action 取 pan-y 而不是 none：none 能把触屏拖拽喂给手势，代价是手指在条目上
     竖滑时门禁卡片滚不动。pan-y 把竖滑还给页面滚动（拖到一半浏览器会发 pointercancel，
     运行时收到取消不当成点选）；触屏的重排/归筐因此走**点选**主路径（runtime onTap），
     鼠标拖拽完全不受影响（touch-action 只管触屏与手写笔）。 */
  .sequence-item,.bucket-item{touch-action:pan-y}
  .drag-src{opacity:.45}
  .drag-ghost{border-color:var(--key)!important;box-shadow:0 12px 28px rgba(0,0,0,.5);
        transform:rotate(1.2deg)}
  .sequence-list{list-style:none;margin:2px 0 10px;padding:0;display:flex;flex-direction:column;gap:7px}
  .sequence-item{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:9px;
                 background:var(--panel);border:1px solid #333b4d;cursor:grab;
                 font-size:13.5px;user-select:none;transition:border-color .13s}
  .sequence-item:hover{border-color:var(--key)}
  .sequence-item .s-handle{color:var(--dim2);font-size:12px}
  .sequence-item .s-idx{font:11px ui-monospace,Consolas,monospace;color:var(--dim2)}

  /* recall（复述 / 对照）：钩子名 [data-recall-reveal] / .recall-answer 由运行时
     逐字匹配。答案盘由页面填好再解除 hidden——初始必须藏着，露了门禁就白设。 */
  .recall-answer{margin:2px 0 10px;padding:10px 12px;border-radius:10px;
        border:1px solid #333b4d;border-left:3px solid var(--key);background:#1a2029;
        font-size:14px;line-height:1.65;color:var(--dim)}

  /* preGate：跳出画布动画前的 ~1.1s 视觉缓冲。**环要真的走完**——
     "还要等一下"和"卡住了"是两种体感，区别就在这 1.1 秒里有没有东西在动。 */
  .pregate{position:absolute;inset:10px;z-index:8;display:flex;align-items:center;
           justify-content:center;gap:12px;border-radius:12px;background:rgba(6,8,12,.9);
           animation:gateIn .25s ease both}
  .pregate[hidden]{display:none}
  .pregate .pg-ring{width:34px;height:34px;flex:none}
  /* 2πr = 2×3.1416×15 ≈ 94.25：dasharray 取周长，dashoffset 从整周长走到 0 */
  .pregate .pg-arc{stroke-dasharray:94.25;stroke-dashoffset:94.25;
           animation:ringFill 1.1s linear forwards}
  @keyframes ringFill{to{stroke-dashoffset:0}}
  .pregate .pg-txt{font-size:14px;color:var(--dim)}

  /* ── ③ 侧栏 ─────────────────────────────── */
  /* 侧栏整块要比背景"亮一档"：卡片底只比页面深一点点时，右边这一列读起来是一列漂着的
     文字而不是一个区域，和左边舞台的重量不匹配。 */
  .col-side{position:sticky;top:18px;display:flex;flex-direction:column;gap:12px;
            max-height:calc(100vh - 36px);max-height:calc(100dvh - 36px);
            overflow:auto;padding-right:2px;
            scrollbar-width:thin;scrollbar-color:#2a3140 transparent}
  .card{background:#1a1f2b;border:1px solid #2b3242;border-radius:12px;padding:13px 14px}
  .card>h2{font-size:11px;letter-spacing:.12em;color:var(--dim);margin:0 0 6px;font-weight:600}

  /* 参考要点：一列"主题行"，**不套第二层框**。
     曾经每张 note 自带边框和底色 = 卡片里再嵌六张小卡，340px 窄栏里六层框反复切割，
     视觉重量全花在容器搬运上。现在分隔只靠一条 1px 发丝线，层级靠**字号与悬挂缩进**：
     标题 14px 实色、正文 13px 暗色、缩进与标题文字左边界对齐。 */
  .notes{list-style:none;margin:0;padding:0}
  .note + .note{border-top:1px solid #232936}
  .note-h{display:flex;align-items:center;gap:9px;padding:10px 4px;width:100%;
          text-align:left;border:0;background:none;appearance:none;font:inherit;
          font-size:14px;font-weight:600;color:var(--fg);cursor:pointer;user-select:none;
          border-radius:8px;transition:background .14s}
  .note-h:hover{background:rgba(255,255,255,.035)}
  .note-h .n-ico{font-size:15px;line-height:1;flex:none;width:21px;text-align:center}
  .note-h .n-caret{margin-left:auto;transition:transform .2s;color:var(--dim2);font-size:10px}
  .note[data-open="0"] .n-caret{transform:rotate(-90deg)}
  /* 折叠必须 display:none：grid-template-rows:0fr 收不干净，卡片下沿会留一条 1px 残影 */
  .note[data-open="0"] .note-body{display:none}
  .note[data-open="1"] .note-body{animation:noteIn .22s ease both}
  @keyframes noteIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  /* 悬挂缩进：正文左边界对齐**标题文字**，不是 emoji 的左边界——标题与正文因此共用
     一条文字栏。注意 emoji 在 15px 字号下实测占 20.6px 宽（emoji 字形比字号宽），
     所以给 .n-ico 钉了 21px 槽宽，缩进 = note-h 左内边距 4 + 槽宽 21 + gap 9 = 34px。
     按字号 15px 算缩进会左偏 ~6px，标题和正文就成了两条错开的栏。 */
  .n-inner{padding:0 4px 11px 34px}
  /* 三类信息**等级不同**：小结就是正文，扩展/注意才是附注。曾三行各配一个药丸标签——
     2 个字的标签在窄栏里挤占字宽，蓝橙红底色又不对读者表意；现在只给后两种留标签，
     且降级成不带底色的暗色小字，小结直接以正文字重承接。 */
  .n-row{display:flex;gap:9px;padding:5px 0;font-size:13px;line-height:1.6;color:var(--dim)}
  .n-row.s{color:#aab2c4}
  .n-tag{flex:none;font-size:11px;font-weight:600;padding-top:1px;opacity:.85}
  .n-tag.x{color:#c9924a}
  .n-tag.c{color:#d4756f}
  .n-txt{color:var(--dim)}
  /* 结论式短代码行：编程课里一行代码顶三行文字。340px 窄栏下可用宽 269px，
     半角 ≤39 字符 / 全角 ≤21 字符不折行（实测值，layout.md §6）——放"一眼看懂的
     结论"，不是完整示例。// 开头的行自动降为暗色注释。 */
  .n-code{margin:6px 0 2px;padding:8px 10px;border-radius:8px;background:#10141c;
          border:1px solid #232936;white-space:pre-wrap;word-break:break-all;
          font:12.5px/1.7 ui-monospace,Consolas,"Courier New",monospace;color:#c9d1e0}
  .n-code .cm{color:#7c8698}
  /* kv 对照行：多条并列的「记法 → 结论」速记，code 的姊妹形态——一条结论用 code，
     两三条并列结论用 kv（如 负/零/正 三契约）。左列等宽记法、右列结论，
     grid 自动排行，不套框；✓/✗ 字形自带语义，不再给判决配色。 */
  .n-kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:6px 0 2px;
        font-size:12.5px;line-height:1.6}
  .kv-k{font-family:ui-monospace,Consolas,"Courier New",monospace;color:#c9d1e0;white-space:pre}
  .kv-v{color:var(--dim)}
  /* 跳转锚：侧栏与时间轴唯一的挂钩。只写 audio.currentTime——与点进度条同一
     seek 语义（timeupdate 兜底重画），不改播放/暂停态、不产证据。 */
  .n-jump{display:inline-flex;align-items:center;gap:5px;margin-top:8px;padding:3px 9px;
          border:1px solid #2b3242;border-radius:999px;font-size:11.5px;color:#8ea1c8;
          background:none;cursor:pointer;transition:border-color .15s,color .15s}
  .n-jump:hover{border-color:#4a5670;color:#c9d1e0}

  @media (max-width:1020px){
    .shell{grid-template-columns:minmax(0,1fr)}
    .col-side{position:static;max-height:none;overflow:visible}
  }
  /* 窄屏（手机）：播放器行是 nowrap flex，按钮 + 读数 + 进度条最小宽加起来就顶到
     390px 了——收 gap / 内边距 / 字号，进度条让到 40px；读数兜底可省略号收缩，
     宁可截尾也不许把全屏按钮挤出屏幕。键盘提示对触屏无意义，直接收起。 */
  @media (max-width:560px){
    .rack{gap:7px;padding:8px 10px}
    .rack .bar{min-width:40px}
    .rack .step{font-size:11px}
    .vp-kbd{display:none}
    /* 播放器行改悬浮收起式：默认藏进画布下缘，点画布唤出，3s 无操作收回
       （显隐与计时由 JS 写 data-show，见 §⑦ 尾部）。从流里抽出来才真的"腾出空间"。 */
    .col-stage{position:relative}
    .rack{position:absolute;left:10px;right:10px;bottom:10px;z-index:7;
          border-radius:14px;border-top:1px solid var(--line);
          background:rgba(16,19,25,.94);opacity:0;transform:translateY(12px);
          pointer-events:none;transition:opacity .22s ease,transform .22s ease}
    .rack[data-show="1"]{opacity:1;transform:none;pointer-events:auto}
    /* 门禁开着时唤出播放器行没有意义。隐形必须同时断点击——data-show 的
       pointer-events:auto 与这条同权重在后，不写 none 会留下"看不见的 ▶/⟲"
       压在画布下缘吃掉点击。 */
    .rack[data-gated="1"]{opacity:0;pointer-events:none}
  }
  /* 矮屏（手机横屏）宽有 800+，够不着宽度断点，但画布受高度限制等比缩小后
     小字照样糊——触摸/门禁这类"页面外壳"规则按 宽 ≤560 或 高 ≤560 生效。
     rack 收紧与悬浮只归宽度块（横屏不全屏时播放器行常驻）。 */
  @media (max-width:560px), (max-height:560px){
    /* 触摸目标：26–28px 的圆按钮在手机上偏小（触控规范约 44px）。用透明伪元素
       外扩热区，视觉分毫不动。横向只扩 4px：窄屏 rack 的 gap 收到 7px，
       4+4−7=1px 与相邻热区轻微交叠，按下 DOM 靠后者，影响可忽略；
       上下没有邻居，放心扩 8px。 */
    .rack .pp,.rack .rew,.rack .spd,.rack .fs{position:relative}
    .rack .pp::before,.rack .rew::before,.rack .spd::before,.rack .fs::before{content:"";position:absolute;inset:-8px -4px}
    /* 低端机 GPU 上 backdrop-filter 很贵，而压暗层本就 .92 不透明、blur 几乎看不出来 */
    .gate{backdrop-filter:none;-webkit-backdrop-filter:none}
    /* 小字提级：门禁引导语、标签这类 ≤11.5px 的字在手机上是糊的，统一 +1px */
    .gate .kick{font-size:12.5px}
    .n-tag{font-size:11.5px}
    .n-jump{font-size:12.5px}
    .chapter .tagline{font-size:14px}
  }
  /* 画布静态文字（场景头 / 字幕）按字号分档提级，与 mk() 的 tfs() 档位同比例
     （≤14 ×2、≤19 ×1.7）；动态图元走 JS。1000 宽的 viewBox 压到手机上
     14px 只剩视觉 5–10px，不救就是看不清的课。
     例外：字幕 17→26 只提 ×1.53——整行长文，按 1.7 档放到 29px 就会换行压图。
     这里只读 html[data-compact]；开关的唯一判定与理由见 JS 的 setCompact()。 */
  html[data-compact="1"] #cap-text{font-size:26px}
  html[data-compact="1"] .stage svg text[font-size="14"]{font-size:28px}
  html[data-compact="1"] .stage svg text[font-size="17"]{font-size:29px}
  html[data-compact="1"] .stage svg text[font-size="27"]{font-size:35px}
  /* 竖屏手机：画布按宽铺开后很矮，画布内文字跟着缩——给一条软提示，不强制横屏。 */
  .rotate-hint{display:none}
  @media (orientation:portrait) and (max-width:560px){
    .rotate-hint{display:block;margin-top:8px;text-align:center;font-size:12px;color:var(--dim2)}
    /* 窄屏下播放器行浮在 col-stage 下缘，正好压在提示上——唤出时让位 */
    .rack[data-show="1"] + .rotate-hint{display:none}
  }

  /* ④b 全屏模式：对整条画布列（舞台 + 播放器行）请求全屏，章节头与侧栏退场。
     门禁浮在舞台内部，照常可用；SVG 靠 preserveAspectRatio=meet 等比居中，
     舞台被拉多高都不会变形。iOS Safari 不支持 Element.requestFullscreen，
     JS 检测后直接收起按钮。 */
  .col-stage:fullscreen{position:relative;display:flex;flex-direction:column;padding:18px 22px;background:var(--bg)}
  .col-stage:fullscreen .chapter{display:none}
  .col-stage:fullscreen .stage{flex:1;min-height:0}
  /* 只撑主画布（.stage 的直接子 svg）；不带后代选择器，否则 preGate 的
     34px 圆环 svg 会被同一条 width/height:100% 拉满整屏。 */
  .col-stage:fullscreen .stage > svg{width:100%;height:100%;aspect-ratio:auto}
  /* 全屏下播放器行走和窄屏一样的悬浮收起式（声明与 ≤560 媒体块成对，改一处两处都要改）：
     常驻会白占一行，全屏的意义就是让画布尽量大；点画布唤出、再点收回。 */
  .col-stage:fullscreen .rack{position:absolute;left:10px;right:10px;bottom:10px;z-index:7;
    border-radius:14px;border-top:1px solid var(--line);background:rgba(16,19,25,.94);
    opacity:0;transform:translateY(12px);pointer-events:none;
    transition:opacity .22s ease,transform .22s ease}
  .col-stage:fullscreen .rack[data-show="1"]{opacity:1;transform:none;pointer-events:auto}
  .col-stage:fullscreen .rack[data-gated="1"]{opacity:0;pointer-events:none}

  /* 晕动 / 减动效偏好：呼吸、入场、环都收掉。动画只负责"好看"，不承担状态；
     JS 等的是 animationend / 自己的计时器，时长趋 0 时两者照常触发。 */
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
                         transition-duration:.01ms!important}
  }
</style>
</head>
<body>
<div id="root">
  <div class="shell">
    <main class="col-stage">

      <!-- ① 章节头：回答"这一节讲什么"。**画布上方只留这一行**——
           "进行到哪一节、整门课多长"由画布下面的进度条承担（章节刻度 + 悬停显名）。 -->
      <div class="chapter">
        <span class="tag" id="ch-tag">准备</span>
        <h1 id="ch-title">JavaScript 的 sort() 到底怎么排序</h1>
        <p class="tagline" id="ch-tagline"></p>
      </div>

      <!-- ② 舞台 = 画布 + 播放层 + 门禁，后两者浮在它内部；字幕长在画布里。
           播放器行紧贴在它下面（见 ④），两层共边成一块。 -->
      <div class="stage" id="stage" data-state="idle">
        <svg viewBox="0 0 1000 460" preserveAspectRatio="xMidYMid meet"
             role="img" aria-label="排序过程可视化">
          <line x1="0" y1="230" x2="1000" y2="230" stroke="#1b2029" stroke-width="1" opacity=".35"/>

          <!-- 舞台 A：三个数字块（seg-1）。标题行写成代码而不是句子——
               与旁白说的话形不相似，不构成双字幕（判据见 stage.md §2 纪律 3） -->
          <g id="stA" class="el">
            <text x="500" y="52" text-anchor="middle" fill="#8d95a8" font-size="14">🔤 [10, 9, 1].sort() → [1, 10, 9]</text>
            <g id="a-body"></g>
          </g>

          <!-- 舞台 B：字符串逐位比较（seg-2） -->
          <g id="stB" class="el">
            <text x="500" y="52" text-anchor="middle" fill="#8d95a8" font-size="14">🔎 第一位不同就决定大小；都没不同则短的更小</text>
            <g id="b-body"></g>
          </g>

          <!-- 舞台 C：比较函数契约（seg-4） -->
          <g id="stC" class="el">
            <text x="500" y="48" text-anchor="middle" fill="#8d95a8" font-size="14">⚖️ 比较函数的返回值：只看符号，不看数值</text>
            <g id="c-body"></g>
          </g>

          <!-- 舞台 D：布尔值陷阱（seg-5） -->
          <g id="stD" class="el">
            <text x="500" y="46" text-anchor="middle" fill="#8d95a8" font-size="14">🔢 比较函数返回布尔值时会发生什么</text>
            <g id="d-body"></g>
            <g id="d-blocks"></g>
          </g>

          <!-- 舞台 E：稳定性（seg-6） -->
          <g id="stE" class="el">
            <text x="500" y="48" text-anchor="middle" fill="#8d95a8" font-size="14">⚓ 稳定：相等的元素不互换，原来的先后带进结果</text>
            <g id="e-body"></g>
          </g>

          <!-- 舞台 F：开场 / 结尾提问 -->
          <g id="stF" class="el">
            <text id="f-q" x="500" y="196" text-anchor="middle" fill="#e9ecf3"
                  font-size="27" font-weight="700"></text>
          </g>

          <!-- 舞台 G：巧合（seg-3） -->
          <g id="stG" class="el">
            <text x="500" y="46" text-anchor="middle" fill="#8d95a8" font-size="14">🎲 字符串序 vs 数值序：什么时候一致，什么时候不一致</text>
            <g id="g-body"></g>
          </g>

          <!-- ── 字幕带：**画布内的唯一字幕** ──
               为什么在画布里而不在画布下面：每个场景本来就要在底部写一句
               "这一句讲的是什么"，以前分散在各场景自己的 `<text>` 里，位置在
               y=386~436 之间飘、字号 14~18 不等 —— 切换场景时字幕会跳。
               现在收成一条**位置 / 字号固定**的带（分隔线 404、文字 438），
               文案**逐句取时间轴里这一句的口播原文**（见 JS 的 §③ 字幕带），念什么就显什么。
               宽度撑满、居中，像视频硬字幕 —— 它是画面的一部分，不是页面元素。 -->
          <g id="cap" class="el">
            <line x1="40" y1="404" x2="960" y2="404" stroke="#232a38" stroke-width="1"/>
            <text id="cap-text" data-courseware-caption="1" x="500" y="438" text-anchor="middle"
                  font-size="17" font-weight="600" fill="#c9d1e0"></text>
          </g>
        </svg>

        <!-- ②a 画布内播放层：整块画布都是点区。未开始时压暗 + 呼吸，底部提示
             "点这里开始"；一开播就收起。提示锚在**底部**而不是画面中心——
             中心常是正文（开场那句要人先猜的问题就在那），居中的键会正好压住它。 -->
        <button class="veilplay" id="veilplay" type="button"
                aria-label="播放 / 暂停">
          <span class="vp">
            <span class="vp-ico">▶</span>
            <span class="vp-txt">点这里开始</span>
            <span class="vp-sub" id="vp-sub"></span>
            <span class="vp-kbd">空格 播放/暂停 · ←→ 前后 8 秒 · F 全屏</span>
          </span>
        </button>

        <!-- ②b 门禁：**从画布内浮出**。放画布下面会被漏看——
             学习者的视线还在画布上，第一反应是"卡住了"。
             五块卡片 = 五种门禁形态（前四种判定、recall 只对照），开哪块由 openGate
             决定；形态怎么挑见 interactions.md §2。用不上的那几块可以不写进页面。 -->
        <section class="gate" id="gate" hidden>
          <div class="g-card">
            <p class="kick" id="gate-kick" aria-live="polite">播放已暂停 · 答对后继续</p>
            <div id="gate-host">

              <!-- ①choice：单选（基线形态） -->
              <div data-interaction data-interaction-type="choice" id="gate-block" hidden>
                <p class="q" id="gate-q"></p>
                <div class="opts" id="gate-opts"></div>

<script>
(function(){
  'use strict';
  var audio = document.getElementById('main-audio');

  window.__coursewareRenderTrace = [];
  var NS = 'http://www.w3.org/2000/svg';

  function el(id){ return document.getElementById(id); }
  var mqNarrow = window.matchMedia('(max-width:560px)');
  var mqShort  = window.matchMedia('(max-height:560px)');
  // 小屏唯一判定 = 宽 ≤560 或 高 ≤560（手机横屏宽 800+ 但高不足 400，画布按高缩得更狠）；

  // 结果写进 html[data-compact]：CSS 字号分档、mk()、stageFit 都只认这一个开关，
  // 判定不散落第二处。
  function setCompact(){
    var on = !window.__coursewareShotMode && (mqNarrow.matches || mqShort.matches);
    if (on) document.documentElement.dataset.compact = '1';
    else delete document.documentElement.dataset.compact;

  function compact(){ return document.documentElement.dataset.compact === '1'; }
  setCompact();
  // 小屏画布字号分档：viewBox 1000 宽在手机上整体缩到 ~0.4–0.8，正文图元 11–14px
  // 只有视觉 4–10px。越小的字乘得越狠——小字才是真看不清的；大字本来就够大，
  // 轻放一档，免得互相挤位。所有 SVG 图元都从 mk() 出门，在这一点统一处理就够了。
  function tfs(fs){ return fs <= 14 ? 2.0 : fs <= 19 ? 1.7 : fs <= 26 ? 1.45 : 1.3; }
  function mk(tag, attrs){ var n = document.createElementNS(NS, tag);
    if (tag === 'text' && compact() && attrs['font-size'])

    for (var k in attrs) n.setAttribute(k, attrs[k]); return n; }
  function clear(node){ while (node.firstChild) node.removeChild(node.firstChild); }

    var m = Math.floor(t/60), s = Math.floor(t%60);

  function sceneIndexOf(sid){
    for (var i=0;i<scenes.length;i++) if (scenes[i].step_id === sid) return i;
    return -1;
  }

  // ══ ① 当前句查找：全局秒 → {scene, index, sentence} ══════════════════
  function sentAt(t){
    for (var i=0;i<scenes.length;i++){
      var r = scenes[i].runtime;
      if (t < r.start || t >= r.end) continue;
      var ns = r.narration || [], k = -1;
      for (var j=0;j<ns.length;j++){
        if (t >= ns[j].start && t < ns[j].start + ns[j].duration){ k = j; break; }
      }
      return {scene: scenes[i], index: k, sceneIndex: i, sentence: k < 0 ? null : ns[k]};
    }
    return {scene: null, index: -1, sceneIndex: -1, sentence: null};
  }

  // ══ ② 舞台渲染器：每个场景一个纯函数，输入「这一段里的第几句」 ═══════
  // 纪律：不读 currentTime、不 setTimeout；步数与句数一一对齐；只清内层容器；
  //       位移一律走 setAttribute('transform')，不用 CSS transform。
  var BAY = [300, 500, 700], CY = 232, BAY_SRC = ['10','9','1'];

   *  逐句对账：s0 引入(要自己传) · s1 <0 排前 · s2 =0 相等 · s3 >0 排后
   *            · s4 只看符号不看数值 · s5 落到 a-b 升序 / b-a 降序
   *  阈值**显式写成常量**，不写推导表达式；s4/s5 各给独立画面，不连停在同态。 */
  function renderC(step){
    only('stC');
    clear(el('c-body'));
    var cases = [
      {sign:'a - b < 0', act:'a 排在 b 前面', col:'#2ecc71', dx:[-100, 100]},
      {sign:'a - b = 0', act:'两者相等',       col:'#8d95a8', dx:[-52, 52]},
      {sign:'a - b > 0', act:'a 排在 b 后面', col:'#ef4d4d', dx:[100, -100]}
    ];
    // 契约态：s1→<0，s2→=0，s3→>0；s4/s5 不再停留 >0（各给独立画面）
    var pick = (step >= 3 && step < 4) ? 2 : (step === 2) ? 1 : (step === 1) ? 0 : -1;
    var c = pick >= 0 ? cases[pick] : null;
    var cy = 224;
    el('c-body').appendChild(mk('rect', {x:240, y:cy-150, width:520, height:58, rx:12,
      fill:'#161a23', stroke:'#2a3140'}));
    // 顶部公式行：引入 → 三种契约 → s4 强调「只看符号」→ s5「落到升降序」
    var headFill, headText;
    if (step === 4){ headFill = '#f5a623'; headText = '只看符号：负 / 0 / 正，数值本身不参与'; }
    else if (step === 5){ headFill = '#f5a623'; headText = 'a - b 升序 · b - a 降序'; }
    else if (pick === -1){ headFill = '#8d95a8'; headText = '不传比较函数 → 字符串序；要按数值排，得自己传'; }
    else { headFill = c.col; headText = '(a, b) => a - b    →    ' + c.sign; }
    el('c-body').appendChild(txt({x:500, y:cy-111, 'text-anchor':'middle', 'font-size':19,
      'font-family':'ui-monospace,Consolas,monospace', fill: headFill}, headText));
    // a / b 两个方块：契约态间滑动；s4/s5 收拢居中、描边变橙把视线压到符号上
    var aX = pick >= 0 ? 500 + cases[pick].dx[0] : 448;
    var bX = pick >= 0 ? 500 + cases[pick].dx[1] : 552;
    var boxStroke = (step === 4 || step === 5) ? '#f5a623' : null;
    [['a','#4d90f0', aX], ['b','#f5a623', bX]].forEach(function(q){
      var g = mk('g', {});
      g.setAttribute('style', 'transition:transform .7s cubic-bezier(.22,1,.36,1)');
      g.setAttribute('transform', 'translate(' + q[2] + ',' + cy + ')');
      g.appendChild(mk('rect', {x:-52, y:-40, width:104, height:80, rx:13,
        fill:'#1c212c', stroke: boxStroke || q[1], 'stroke-width':2}));
      g.appendChild(txt({x:0, y:13, 'text-anchor':'middle', 'font-size':34, 'font-weight':'700',
        fill:q[1]}, q[0]));
      el('c-body').appendChild(g);
    });
    if (pick === 1){
      el('c-body').appendChild(txt({x:500, y:cy+14, 'text-anchor':'middle', 'font-size':30,
        'font-weight':'700', fill:'#8d95a8'}, '='));
    }
    // 图内短标注（**不是口播原句**）：s4「只看符号」、s5「升降序」各给一个独立标签——
    // 这些是图元的标注/公式，与旁白那句话不同（判据见 stage.md §2 纪律 3）
    var footFill, footText;
    if (step === 4){ footFill = '#8d95a8'; footText = '符号相同 = 结果相同：只看 ± 与 0'; }
    else if (step === 5){ footFill = '#2ecc71'; footText = '取 a-b 升序排 · 取反成 b-a 降序'; }
    else if (pick === -1){ footFill = '#8d95a8'; footText = '（比较函数决定 a 与 b 的先后）'; }
    else { footFill = c.col; footText = c.act; }
    el('c-body').appendChild(txt({x:500, y:cy+120, 'text-anchor':'middle', 'font-size':16,
      fill: footFill}, footText));
  }

  /** 舞台 D：布尔值陷阱（6 句） */
  function renderD(step){
    only('stD');
    clear(el('d-body')); clear(el('d-blocks'));
    var G = el('d-body');
    // 管线在 step≥2 才长出右边「0」这一段。未长出时整条右移配平重心，
    // 长出后归位——两种步态的画面重心都 ≈500，不留右侧大空带。
    G.setAttribute('transform', 'translate(' + (step >= 2 ? 0 : 93) + ',0)');
    G.appendChild(mk('rect', {x:150, y:110, width:290, height:66, rx:12,
      fill:'#161a23', stroke:'#2a3140'}));
    G.appendChild(txt({x:295, y:151, 'text-anchor':'middle', 'font-size':18,
      'font-family':'ui-monospace,Consolas,monospace', fill:'#ef4d4d'}, '(a, b) => a < b'));

    var branchOn = step >= 1;
    G.appendChild(mk('line', {x1:446, y1:143, x2:536, y2:143, stroke:'#2f3646', 'stroke-width':2}));
    G.appendChild(txt({x:491, y:133, 'text-anchor':'middle', 'font-size':11, fill:'#5d6577'}, '求值'));
    G.appendChild(mk('rect', {x:544, y:86, width:120, height:48, rx:10, fill:'#1c212c',
      stroke: branchOn ? '#2ecc71' : '#2a3140', 'stroke-width':2}));
    G.appendChild(txt({x:604, y:117, 'text-anchor':'middle', 'font-size':17, 'font-weight':'600',
      fill: branchOn ? '#2ecc71' : '#5d6577'}, 'true'));
    G.appendChild(mk('rect', {x:544, y:152, width:120, height:48, rx:10,
      fill: branchOn ? 'rgba(239,77,77,.12)' : '#1c212c',
      stroke: branchOn ? '#ef4d4d' : '#2a3140', 'stroke-width':2}));
    G.appendChild(txt({x:604, y:183, 'text-anchor':'middle', 'font-size':17, 'font-weight':'600',
      fill: branchOn ? '#ef4d4d' : '#5d6577'}, 'false'));

    if (step >= 2){
      G.appendChild(mk('line', {x1:680, y1:176, x2:760, y2:176, stroke:'#ef4d4d', 'stroke-width':2}));
      G.appendChild(mk('rect', {x:766, y:152, width:110, height:48, rx:10,
        fill:'rgba(239,77,77,.12)', stroke:'#ef4d4d', 'stroke-width':2}));
      G.appendChild(txt({x:821, y:184, 'text-anchor':'middle', 'font-size':20, 'font-weight':'700',
        'font-family':'ui-monospace,Consolas,monospace', fill:'#ef4d4d'}, '0'));
      G.appendChild(txt({x:821, y:222, 'text-anchor':'middle', 'font-size':12, fill:'#8d95a8'},
        '被当成「相等」'));
    }

    var messy = step >= 4;
    var vals = messy ? ['9','1','10'] : ['10','9','1'];
    var BX = [370, 500, 630];
    vals.forEach(function(v, i){
      var g = mk('g', {});
      var base = 'translate(' + BX[i] + ',330)';
      g.setAttribute('transform', messy ? base + ' translate(' + (-4 + i*4) + ',0)' : base);
      g.appendChild(mk('rect', {x:-40, y:-32, width:80, height:64, rx:11,
        fill: messy ? 'rgba(239,77,77,.10)' : '#1c212c',
        stroke: messy ? '#ef4d4d' : '#394052', 'stroke-width':2}));
      g.appendChild(txt({x:0, y:11, 'text-anchor':'middle', 'font-size':28, 'font-weight':'700',
        'font-family':'ui-monospace,Consolas,monospace',
        fill: messy ? '#ef4d4d' : '#e9ecf3'}, v));
      el('d-blocks').appendChild(g);
    });
  }

  /** 舞台 E：稳定性（4 句）
   *  逐句对账：s0 稳定(引入) · s1 相等元素保序 · s2 多级排序好用 · s3 同分维持姓名顺序
   *  s2/s3 各给独立画面，不连停在同态。 */
  function renderE(step){
    only('stE');
    clear(el('e-body'));
    var G = el('e-body');
    var sorted = step >= 1;
    var before = [['小明',90], ['小红',90], ['小刚',80]];
    var after = [['小刚',80], ['小明',90], ['小红',90]];
    var data = sorted ? after : before;

    [0,1].forEach(function(col){
      var ox = 208 + col * 584;
      G.appendChild(txt({x:ox, y:100, 'text-anchor':'middle', 'font-size':13, fill:'#5d6577'},
        col === 0 ? '录入顺序' : '按分数排序后'));
      if (col === 1 && !sorted){
        G.appendChild(txt({x:ox, y:230, 'text-anchor':'middle', 'font-size':22, fill:'#3d465a'}, '?'));
        return;
      }
      data.forEach(function(s, i){
        var y = 150 + i * 72;
        // 同分 90 的是 小明/小红（排完后是 i=1、i=2），相对顺序没变 → 高亮 i>=1
        var hi = col === 1 && sorted && i >= 1;
        G.appendChild(mk('rect', {x:ox-146, y:y-26, width:292, height:52, rx:11,
          fill: hi ? 'rgba(46,204,113,.10)' : '#1c212c',
          stroke: hi ? '#2ecc71' : '#394052', 'stroke-width':2,
          style:'transition:fill .4s,stroke .4s'}));
        G.appendChild(txt({x:ox-106, y:y+8, 'text-anchor':'middle', 'font-size':18,
          'font-weight':'600', fill:'#e9ecf3'}, s[0]));
        G.appendChild(txt({x:ox+92, y:y+8, 'text-anchor':'middle', 'font-size':18,
          'font-family':'ui-monospace,Consolas,monospace', fill:'#f5a623'}, s[1]));
      });
    });

    // s1「相等元素保序」：把同分的两人（小明/小红，排完是 i=1、2）跨两列连起来看
    if (step === 1){
      [1,2].forEach(function(i){
        var y = 150 + i * 72;
        G.appendChild(mk('line', {x1:208+146, y1:y, x2:208+584-146, y2:y, stroke:'#2ecc71',
          'stroke-width':1.5, 'stroke-dasharray':'4 4', opacity:'.5'}));
      });
    }
    // s2「多级排序时特别有用」：标出「两级」这个动作，与 s1 区分
    if (step === 2){
      G.appendChild(txt({x:792, y:118, 'text-anchor':'middle', 'font-size':12,
        'font-family':'ui-monospace,Consolas,monospace', fill:'#f5a623'},
        '两级：先姓名 → 再分数'));
    }
    // s3「同分的人维持姓名的顺序」：给并列的两人补一个括注，与 s2 区分
    if (step === 3){
      G.appendChild(txt({x:792, y:344, 'text-anchor':'middle', 'font-size':12,
        'font-family':'ui-monospace,Consolas,monospace', fill:'#2ecc71'},
        '同分 90 · 按姓名保持先后'));
    }
  }

  /** 舞台 F：开场 / 结尾提问 */
  function renderF(which){
    only('stF');
    el('f-q').textContent = which === 'open' ? '[10, 9, 1].sort()  →  ?'
                                             : '🤔 为什么是 [1, 10, 9] ？';
  }

  /** 舞台 G：巧合（5 句） */
  function renderG(step){
    only('stG');
    clear(el('g-body'));
    var box = el('g-body');
    var groups = [
      {nums:['1','2','10'], label:'位数不同（1 位 / 2 位）', luck:false},
      {nums:['1','2','3'],  label:'位数相同（都是 1 位）',   luck:true}
    ];
    var visible = step >= 1 ? groups : [groups[0]];
    if (step === 3) visible = [groups[0]];      // 聚焦「破功」这组
    if (step >= 4)  visible = groups;           // 收尾恢复对照

    var ROW_H = 126, BLK = 68, baseY = visible.length > 1 ? 212 : 258;
    visible.forEach(function(g, gi){
      var oy = baseY + gi * ROW_H;
      var col = g.luck ? '#2ecc71' : '#ef4d4d';
      box.appendChild(txt({x:500, y:oy - 50, 'text-anchor':'middle', 'font-size':13, fill:col},
        g.label));
      var span = (g.nums.length - 1) * 132;
      g.nums.forEach(function(v, i){
        var x = 500 - span/2 + i * 132;
        box.appendChild(mk('rect', {x:x-46, y:oy-BLK/2, width:92, height:BLK, rx:12,
          fill:'#1c212c', stroke:col, 'stroke-width':2, opacity: g.luck ? '1' : '.8',
          style:'transition:stroke .4s,opacity .4s'}));
        box.appendChild(txt({x:x, y:oy+11, 'text-anchor':'middle', 'font-size':28,
          'font-weight':'700', 'font-family':'ui-monospace,Consolas,monospace', fill:col}, v));
      });
    });
  }

  var RENDER = {
    'opening': function(){ renderF('open'); },
    'seg-1': renderA,
    'seg-2': renderB,
    'seg-3': renderG,
    'seg-4': renderC,
    'seg-5': renderD,
    'seg-6': renderE,
    'closing': function(){ renderF('close'); }
  };

  // ══ ③ 字幕带：字幕文案唯一来自时间轴 ══════════════════════════════════
  // sentAt() 给出当前句，capShow(hit.sentence) 把这一句口播原文直接写进画布——
  // 念什么就显什么；页面不维护第二份字幕文案（理由与 gap-hold 见 stage.md §4）。
  // `hl:true` 的那一句是结论，用主色点一下（标在 narration-source.json 的 `hl` 里，
  // build_timeline 落到句子身上，见 script.md §1）。**强调色只有这一个**——
  // 红/绿那套语义色留给画面本身，字幕带不做第二套颜色编码。
  /** 写一条字幕：**文案就是这一句本身**，页面里不留第二份。
   *  只有开场前 / 课程结束时传 null 收起；场景与句间空档不调用本函数，
   *  字幕停在上一句上（不清空、不闪白，见 stage.md §4） */
  function capShow(s){                     // s = sentAt() 返回的当前句；null = 收起
    if (!s || !s.text){ show('cap', false); return; }
    var t = el('cap-text');
    t.textContent = s.text;
    t.setAttribute('fill', s.hl ? '#f5a623' : '#c9d1e0');
    show('cap', true);
  }

  // ══ ④ 侧栏：参考要点（renderNotes）══════════════════════════════════════
  // 侧栏 = 常驻结构化文档（小结/扩展/注意 + 可选 code 短代码行 / kv 对照行 / at 跳转锚），
  // 不产证据（interactions.md §1）：不随旁白高亮、不读 data-kp；加载时渲染一次，
  // **播放中不同步**。at 是唯一例外：点击只是替用户 seek 一下，走带逻辑本身不读侧栏。
  // 要做"可观测判断"的手感实验一律走画布门禁，这里只留挂不上转折点的纯手感对照。
  var NOTES = [
    { ico:'🔤', title:'默认是字符串序', open:true,
      s:'不传比较函数时，元素先转成字符串，再按字符逐个比较。',
      x:'所以 [10,9,1] 会得到 [1,10,9]。',
      c:'想按数值排，必须自己传比较函数。',
      code:'// 结论，不是 bug\n[10,9,1].sort() → [1,10,9]', at:4.939 },
    { ico:'🔎', title:'逐位比较', open:false,
      s:'从左到右，第一个不同的字符定胜负；前缀相同则短的更小。',
      x:'"1" vs "10"：首位相等，短的没有第二位，算小。',
      c:'比较的是"字符"，不是"数值"——反直觉的根源。',
      code:'"1" < "10"  → true', at:20.846 },
    { ico:'🎲', title:'位数相同才碰巧一致', open:false,
      s:'[1,2,3] 看着对，只是因为位数恰好相同。',
      x:'一旦位数不同，字符串序和数值序就分道扬镳。',
      c:'别被这个巧合骗过。',
      code:'[1,2,3].sort() → [1,2,3] ✓ 巧合', at:44.722 },
    { ico:'⚖️', title:'比较函数只看符号', open:false,
      s:'返回 负 / 零 / 正，分别代表 a 在 b 前 / 相等 / a 在 b 后。',
      x:'(a,b)=>a-b 就把数值排序交还给手写逻辑。',
      c:'返回布尔值是常见错误（见「返回数字，不是布尔值」）。',
      kv:[['返回 < 0','a 排在 b 前'],['返回 0','相等'],['返回 > 0','a 排在 b 后']], at:60.404 },
    { ico:'🔢', title:'返回数字，不是布尔值', open:false,
      s:'(a,b)=>a<b 返回 true/false，会被当成 1 / 0。',
      x:'',
      c:'结果是乱序，而且不报错——最隐蔽的坑。',
      kv:[['(a,b) => a < b','✗ 返回布尔'],['(a,b) => a - b','✓ 返回数字']], at:78.426 },
    { ico:'⚓', title:'稳定排序', open:false,
      s:'比较结果为 0（相等）的元素，保持原有的相对顺序。',
      x:'同分时谁先录入，谁就排在前面。',
      c:'JS 的 sort 自 ES2019 起保证稳定。', at:94.599 }
  ];
  function renderNotes(){
    var host = el('notes');
    NOTES.forEach(function(n){
      var li = document.createElement('li');
      li.className = 'note'; li.dataset.open = n.open ? '1' : '0';
      // 折叠头是 <button> 不是 <div>：div 上只挂 click，键盘 / 屏幕阅读器
      // 根本进不来——全局 :focus-visible 也救不了没有 tabindex 的元素
      var head = document.createElement('button'); head.className='note-h'; head.type='button';
      head.setAttribute('aria-expanded', n.open ? 'true' : 'false');
      var ico = document.createElement('span'); ico.className='n-ico'; ico.textContent=n.ico;
      var title = document.createElement('span'); title.textContent=n.title;
      var caret = document.createElement('span'); caret.className='n-caret'; caret.textContent='▾';
      head.append(ico,title,caret);
      var body = document.createElement('div'); body.className='note-body';
      var inner = document.createElement('div'); inner.className='n-inner';
      // 三类信息等级不同（CSS §③）：小结 = 正文不给标签，扩展/注意留暗色小字标签。
      // 空值直接跳过——曾经无条件渲染三行，x 留空时会多出一条"只有标签没有正文"的断行。
      [["s",null,n.s],["x","扩展",n.x],["c","注意",n.c]].forEach(function(row){
        if (!row[2]) return;
        var line=document.createElement('div'); line.className='n-row '+row[0];
        if (row[1]){
          var tag=document.createElement('span'); tag.className='n-tag '+row[0]; tag.textContent=row[1];
          line.appendChild(tag);
        }
        var txt=document.createElement('span'); txt.className='n-txt'; txt.textContent=row[2];
        line.appendChild(txt); inner.appendChild(line);
      });
      // code：结论式短代码行（每行 ≤26 字符，窄栏不折行），// 开头的行降为暗色注释。
      // 全部走 textContent——侧栏文案来自构建脚本，不给它经 HTML 解析的机会。
      if (n.code){
        var pre=document.createElement('div'); pre.className='n-code';
        var lines=n.code.split('\n');
        lines.forEach(function(line, i){
          if (line.indexOf('//') === 0){
            var cm=document.createElement('span'); cm.className='cm'; cm.textContent=line;
            pre.appendChild(cm);
          } else pre.appendChild(document.createTextNode(line));
          if (i < lines.length-1) pre.appendChild(document.createTextNode('\n'));
        });
        inner.appendChild(pre);
      }
      // kv：并列的「记法 → 结论」速记行（一条用 code，两三条并列判决用 kv）。
      if (n.kv){
        var box=document.createElement('div'); box.className='n-kv';
        n.kv.forEach(function(p){
          var k=document.createElement('span'); k.className='kv-k'; k.textContent=p[0];
          var v=document.createElement('span'); v.className='kv-v'; v.textContent=p[1];
          box.append(k,v);
        });
        inner.appendChild(box);
      }
      // at：跳转锚。只写 currentTime，与点进度条同一 seek 语义（timeupdate 兜底重画），
      // 不碰播放/暂停态——侧栏对走带逻辑保持只读。
      if (typeof n.at === 'number'){
        var jb=document.createElement('button'); jb.className='n-jump'; jb.type='button';
        jb.textContent='\u21e8 看这一节 '+fmt(n.at);
        jb.addEventListener('click', function(){ audio.currentTime = n.at; });
        inner.appendChild(jb);
      }
      body.appendChild(inner); li.append(head,body);
      li.querySelector('.note-h').addEventListener('click', function(){
        li.dataset.open = (li.dataset.open === '1') ? '0' : '1';
        this.setAttribute('aria-expanded', li.dataset.open === '1' ? 'true' : 'false');
      });
      host.appendChild(li);
    });
  }
  renderNotes();

  // ══ ⑤ 门禁：唯一的证据通道。五种形态各一（数量与题型怎么选见 interactions.md
  //    §1–§2；这里五种全放是把机制演示全，不是让你照抄数量） ═══════════════
  // 三道 at:'end' 的锚点都是末句播完那一刻（interactions.md §3）。
  var GATES = [
    // ① sequence：考**前面讲过的**流程（interactions.md §3：at-start 的门禁考旧内容）。
    // 逐位比较三步是 seg-2 教的，所以挂 seg-6 开头——挂 seg-2 开头等于用题目考
    // 这一场正要讲、还没讲的东西，第一遍学的学习者必错。
    { scene:'seg-6', type:'sequence', preGate:true,
      q:'把「字符串逐位比较」的三步按正确顺序排好',
      // items 入列顺序即初始呈现：必须 ≠ correct，否则不排任何序直接提交
      // 就能放行，"唯一证据通道"形同虚设。
      seq:{ items:[{id:'c', t:'短的那个没有该位，就算小'},
                   {id:'a', t:'从第一位开始逐位比'},
                   {id:'b', t:'都相同就往后一位继续比'}],
            correct:['a','b','c'] } },
    // ② choice：概念判断（基线形态）
    { scene:'seg-3', type:'choice', preGate:true,
      q:'[2, 10, 1].sort() 的结果是？',
      opts:[{id:'a', t:'[1, 2, 10]'},
            {id:'b', t:'[1, 10, 2]', correct:true},
            {id:'c', t:'[10, 2, 1]'}],
      fb:{right:'对。字符串序："1" < "10" < "2"，因为第二位 0 < 2。',
          wrong:'按字符串序想：先比第一位，都是 "1" 和 "2"… 再想第二步。'} },
    // ③ hotspot：在图上点部位（这张图是卡里那张，见 interactions.md §2「可点区放哪」）
    { scene:'seg-4', at:'end', type:'hotspot', preGate:true,
      q:'「ab」比「abc」小——这个结论是在哪一步定下来的？在图上点出那一步。',
      spots:[{id:'step1', t:'逐位比较并向后推进',
              feedback:'那一步只管"两边这一位都有"的情形，「ab」已经没这一位了。'},
             {id:'step2', t:'都相同就往后一位',
              feedback:'再往后也没有了：短的那个走完了，这时才轮到长度说话。'},
             {id:'step3', t:'短的那个该位缺失就算小', correct:true,
              feedback:'对。长度不同的比较，是在"短的一方没有这一位"时定下来的。'}] },
    // ④ bucket：归类 / 边界（哪些属于"逐位比较"、哪些只在长度不同时才发生）
    { scene:'seg-5', at:'end', type:'bucket', preGate:true,
      q:'这四件事，哪些是"逐位比较"本身、哪些只在长度不同时才发生？',
      items:[{id:'pos',   t:'两边都有这一位，就比大小', correct:'same',
              feedback:'逐位比较就是这件事：从第一位起，逐位比。'},
             {id:'next',  t:'相同就往后挪一位',       correct:'same',
              feedback:'还是逐位比较——只是指针往后走了一步。'},
             {id:'short', t:'短的那个该位缺失',       correct:'diff',
              feedback:'这一步只在长度不同时才会遇到。'},
             {id:'small', t:'它就算小',               correct:'diff',
              feedback:'这是长度不同时的结论，不是逐位比较本身。'}] },
    // ⑤ recall：主动回忆（唯一不判定的形态）。放在**生成性转折点**：逐位比较
    // 刚在 seg-2 讲完，先让消费者用自己的话复述一遍再往下走——检索本身就是教学
    // 动作，点「看参考答案」对照后即放行（runtime.md §2）。与 seg-6 开头的
    // sequence 考同一内容但间隔更远、动作不同（复述 vs 排序），不算重复设卡。
    { scene:'seg-2', at:'end', type:'recall', preGate:true,
      q:'先别看画布：逐位比较里，大小是怎么定出来的？两边都有该位、和位数不一样时，分别是哪种情形？',
      a:'两边都有这一位：从左往右比，第一个不同的位定大小；各位都相同：短的那个没有该位，它算小。' }
  ];
  var gateEl = el('gate'), gateHost = el('gate-host'), gateNext = el('gate-next'),
      gateGo = el('gate-go'), gateHint = el('gate-hint'), preGateEl = el('pregate'),
      gateBlock = el('gate-block'), gateQ = el('gate-q'), gateOpts = el('gate-opts'),
      gateFb = el('gate-fb'),
      gateHot = el('gate-hot'), hotQ = el('hot-q'), hotFb = el('hot-fb'),
      gateBucket = el('gate-bucket'), bkQ = el('bk-q'), bkTray = el('bk-tray'),
      bkFb = el('bk-fb'),
      gateSeq = el('gate-seq'), seqQ = el('seq-q'), seqList = el('seq-list'),
      seqFb = el('seq-fb'),
      gateRecall = el('gate-recall'), rcQ = el('rc-q'), rcA = el('rc-a'),
      rcFb = el('rc-fb');
  // 一张卡一种形态：判定与锁定状态都从这两张表取，别再写 if (type === '…') 的长链
  var CARDS = { choice:gateBlock, hotspot:gateHot, bucket:gateBucket,
                sequence:gateSeq, recall:gateRecall };
  var TYPE_HINT = { choice:'选对答案即可继续', hotspot:'点对部位即可继续',
                    bucket:'分对即可继续', sequence:'排对顺序即可继续',
                    recall:'自己复述一遍，对照参考答案即可继续' };
  function gateType(i){ return (GATES[i] || {}).type || 'choice'; }
  function gateCard(i){ return CARDS[gateType(i)]; }
  var gOpen = -1, gShown = [], gAnswered = [], gateClosing = 0;
  var GATE_OUT_MS = 240;      // 与 CSS 里 .gate.leaving 的 0.24s 对齐

  function clearHot(card){
    Array.prototype.forEach.call(card.querySelectorAll('[data-hotspot-id]'), function(s){
      delete s.dataset.hotspotState; });
  }
  // 几种卡片互斥显隐 + 清掉上一题留下的锁定 / 作答标记——locked 不清的话，
  // 下一题刚打开就"看起来已经答对"。运行时的接线标记 bound/gesture 属于持久按钮，
  // **不能在这里清**：清了重接线时会叠第二层监听，表现是"点一下触发两次"。
  function clearGateCards(){
    Object.keys(CARDS).forEach(function(k){
      CARDS[k].hidden = true;
      // 运行时答对时给卡加 .is-completed（runtime.md §3），重开必须去掉
      CARDS[k].classList.remove('is-completed');
      // data-selected 挂在选项 <button> 上、不在卡片根上：它随 buildChoice
      // 重建选项一并消失，这里无需（也无处）清
      ['locked','completed'].forEach(function(x){ delete CARDS[k].dataset[x]; });
      clearHot(CARDS[k]);
    });
    [gateFb, hotFb, bkFb, seqFb, rcFb].forEach(function(n){ n.hidden = true;
      n.classList.remove('is-correct','is-wrong'); n.textContent = ''; });
    // recall 的答案盘是 runtime 点开时填的：重开必须藏回去并清空，
    // 否则第二次打开题面下方直接挂着参考答案（locked 洗了也白洗）。
    rcA.hidden = true; rcA.textContent = '';
  }

  // preGate 引导过渡（interactions.md §4）：一次性 setTimeout（非 setInterval），
  // 先显 ~1.1s 缓冲浮层（里面有会走完的进度环）、同时冻结音频，再揭开题目卡。
  // 计时器句柄要留着：浮层显示期间这道题可能被 seek / resetGates 取消，
  // 届时回调必须作废（gOpen 已不是这道题），否则浮层消失后会揭开一张半开的门禁。
  var preGateTimer = 0;
  function preGateOpen(i, cb){
    var g = GATES[i];
    if (!audio.paused) audio.pause();
    // 冻结 + 回退到场景起点。例外：at:'end' 的题面就是刚讲完那句，回退等于重播整场（interactions.md §3）
    var sc = scenes[sceneIndexOf(g.scene)];
    if (g.at !== 'end') audio.currentTime = sc.runtime.start;
    if (g.preGate){
      preGateEl.hidden = false;
      clearTimeout(preGateTimer);
      preGateTimer = setTimeout(function(){
        preGateTimer = 0;
        preGateEl.hidden = true;
        if (gOpen === i) cb();
      }, 1100);
    } else cb();
  }

  // ── 五个建卡器：只做两件事——写 data-interaction、把动态节点建出来 ──────────
  function buildChoice(g, c){
    c.dataset.interaction = JSON.stringify({
      options: g.opts.map(function(o){
        var opt = {id:o.id, label:o.t, correct:!!o.correct};
        if (g.fb) opt.feedback = o.correct ? g.fb.right : g.fb.wrong;   // fb 可省略（interactions.md §4），缺省交给 runtime 默认话术
        return opt;
      })
    });
    gateQ.textContent = g.q;
    clear(gateOpts);
    g.opts.forEach(function(o){
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'opt'; b.textContent = o.t; b.dataset.choiceId = o.id;
      gateOpts.appendChild(b);
    });
  }
  function buildHotspot(g, c){
    c.dataset.interaction = JSON.stringify({
      options: (g.spots || []).map(function(s){
        return {id:s.id, label:s.t, correct:!!s.correct, feedback:s.feedback};
      })
    });
    hotQ.textContent = g.q;
  }
  function buildBucket(g, c){
    var answer = {}, why = {};
    (g.items || []).forEach(function(it){ answer[it.id] = it.correct; why[it.id] = it.feedback; });
    c.dataset.interaction = JSON.stringify({ answer:answer, feedback:why });
    bkQ.textContent = g.q;
    clear(bkTray); clear(el('bk-same')); clear(el('bk-diff'));    // 重开时洗回待放区
    (g.items || []).forEach(function(it){
      var li = document.createElement('li');
      li.className = 'bucket-item'; li.dataset.bucketItem = it.id; li.textContent = it.t;
      bkTray.appendChild(li);
    });
  }
  function buildSequence(g, c){
    // 钩子名逐字对齐 runtime.md §2：.sequence-list / .sequence-item /
    // [data-sequence-submit] —— 类名写错运行时只是不接线、表现"拖不动"
    var cfg = g.seq || {};
    c.dataset.interaction = JSON.stringify({ correct_order: cfg.correct || [] });
    seqQ.textContent = g.q;
    clear(seqList);
    (cfg.items || []).forEach(function(it, n){
      var li = document.createElement('li');
      li.className = 'sequence-item'; li.dataset.sequenceId = it.id;
      var handle=document.createElement('span'); handle.className='s-handle'; handle.textContent='⠿';
      var idx=document.createElement('span'); idx.className='s-idx'; idx.textContent=String(n+1);
      var text=document.createElement('span'); text.textContent=it.t || '';
      li.append(handle,idx,text); seqList.appendChild(li);
    });
  }
  function buildRecall(g, c){
    // 钩子名逐字对齐 runtime.md §2：[data-recall-reveal] / .recall-answer。
    // 答案只进配置、不进 DOM——点开那一下由 runtime 填进 rcA 并解除 hidden。
    c.dataset.interaction = JSON.stringify({ prompt: g.q, answer: g.a });
    rcQ.textContent = g.q;
    rcA.hidden = true; rcA.textContent = '';   // 双保险：clearGateCards 已洗过
  }
  var BUILD = { choice:buildChoice, hotspot:buildHotspot,
                bucket:buildBucket, sequence:buildSequence, recall:buildRecall };

  function openGate(i){
    if (gOpen >= 0) return;
    clearTimeout(gateClosing); gateEl.classList.remove('leaving');   // 别接着上一题的淡出
    var g = GATES[i], t = gateType(i), c = CARDS[t];
    try {
      gateHost.dataset.stepId = g.scene;          // 作答归到这个场景上
      clearGateCards();
      gateNext.hidden = true;
      c.hidden = false;
      BUILD[t](g, c);
      // 动态块必须重新接线。**接在揭开浮层之前**：契约抛错时浮层还挂着 hidden，
      // 学习者不会看到一张永远点不动的半开门禁；错误本身交给 QA/控制台暴露。
      if (window.coursewareStudioWire) window.coursewareStudioWire();
      // 上一题答对时运行时禁用了卡里所有按钮；重开要放回来（否则这一次点不动）
      Array.prototype.forEach.call(c.querySelectorAll('button'), function(b){ b.disabled = false; });
      gateGo.textContent = '答对后继续'; gateGo.disabled = true;
      // 开题提示写 .kick（卡内可见 + aria-live）：#gate-next 在答对前是 hidden，
      // 写进那里的文字既看不见也不会被读屏播报（#gate-hint 只留给答对后的空格提示）
      el('gate-kick').textContent = '播放在这里暂停 · ' + (TYPE_HINT[t] || '');
      gOpen = i;
      el('rack').dataset.gated = '1';   // 从冻结这一刻起播放器行就不可点（含 1.1s 引导浮层期间）
      el('rack').inert = true;          // CSS 的 pointer-events 挡键盘不挡 Tab：inert 让 ▶ ⟲ ⛶ 连焦点都拿不到
      el('veilplay').inert = true;      // 画布内播放层同理：CSS 只把它压成 opacity:0，
                                        // 焦点常留在它上面（点它开的播），不 inert 就能 Enter 起播绕过门禁
      // 冻结（暂停 + 回退；at:'end' 不回退）交给 preGateOpen，再揭开卡片。
      preGateOpen(i, function(){
        gateEl.hidden = false;
        // 浮层揭开后把焦点送进题目卡：不送的话 Tab 起点还留在画布外
        var f = c.querySelector('button:not([hidden]),[tabindex]:not([hidden])');
        if (f) f.focus();
      });
    } catch (e) {
      // 建卡 / 接线契约抛错：浮层保持 hidden，学习者看不到半开的死门禁；
      // 状态全部还原，错误交给控制台与 check_gates 浏览器模式暴露。
      console.error('[gate] 门禁 #' + i + ' 打开失败：', e);
      gOpen = -1;
      delete gateHost.dataset.stepId;         // 没开成的题不能把场景归属留在 host 上
      el('rack').dataset.gated = '0';
      el('rack').inert = false;
      el('veilplay').inert = false;
      clearTimeout(preGateTimer); preGateTimer = 0; preGateEl.hidden = true;

  }

  // 出场也要有过渡：先淡出上移（.leaving），动画走完再盖上 hidden。
  // 音频等这 240ms 过去才起播——否则旁白在还压着暗的画布底下就开口了（同一理由见上面 .gate.leaving 的 CSS 注释）
  function closeGate(instant){
    el('rack').dataset.gated = '0';     // 播放器行不参与淡出，立刻放回来（写 '0'，别 delete）
    el('rack').inert = false;
    el('veilplay').inert = false;
    delete gateHost.dataset.stepId;     // 别把上一题的场景归属留给下一题 / QA
    // 引导浮层显示期间被取消（seek 走 / resetGates）：浮层也要立刻收，计时器作废
    clearTimeout(preGateTimer); preGateTimer = 0; preGateEl.hidden = true;
    gateNext.hidden = true; gOpen = -1;
    clearTimeout(gateClosing);
    if (instant){ gateEl.classList.remove('leaving'); gateEl.hidden = true; return; }
    gateEl.classList.add('leaving');

      gateEl.classList.remove('leaving'); gateEl.hidden = true; }, GATE_OUT_MS);
  }
  function resumeFromGate(){
    if (gOpen < 0) return;
    closeGate();
    setTimeout(function(){ audio.play().catch(function(){}); }, GATE_OUT_MS);
  }
  gateGo.addEventListener('click', resumeFromGate);

  // 运行时在答对时写 data-locked —— 观察它，不轮询。
  // 只看**当前开着的那张卡**：几张卡都读会把上一题留下的 locked 当成这一题的放行信号
  function gateLocked(){ return gOpen >= 0 && gateCard(gOpen).dataset.locked === '1'; }
  var gateObs = new MutationObserver(function(){
    if (gOpen < 0 || !gateLocked()) return;
    gAnswered[gOpen] = true;
    var card = gateCard(gOpen);
    Array.prototype.forEach.call(card.querySelectorAll('button'),
      function(b){ b.disabled = true; });
    gateNext.hidden = false;
    // "是不是最后一题"要按**时间锚点**比，不能按 GATES 数组下标——
    // 声明顺序和播放顺序可以不同（范本就是 seg-6 排在最前），按下标会把文案配反。
    var aMe = gateAnchor(gOpen);
    var last = GATES.every(function(_, k){ return k === gOpen || gateAnchor(k) <= aMe; });
    gateGo.disabled = false;
    gateGo.textContent = last ? '继续看完这一课 →' : '继续（后面还有一题）→';
    gateHint.innerHTML = '也可以按 <b>空格</b> 继续';
    gateGo.focus();
  });
  Object.keys(CARDS).forEach(function(k){
    gateObs.observe(CARDS[k], {attributes:true, attributeFilter:['data-locked']});
  });

  // 锚点：门禁只在**句子边界**开（interactions.md §3）。
  //   默认（挂场景开头）→ 场景起点：这一场还没开播，掐不到任何话。
  //   at:'end'          → 本场**末句播完**那一刻，也就是场景之间的空档。
  // 旧写法按 index === last 判，那是在末句**开头**就停 —— 正好掐断它要考的那句话。
  // GATES[i].scene 必须命中时间轴场景：配了却不弹的门禁由 check_gates 浏览器冒烟
  // 活动驱动拦下（runtime.md §8），所以这里不再写 `!sc` 兜底——与 preGateOpen 同契约。
  function gateAnchor(i){
    var sc = scenes[sceneIndexOf(GATES[i].scene)];
    var r = sc.runtime, ns = r.narration || [];
    if (GATES[i].at === 'end' && ns.length)
      return ns[ns.length-1].start + ns[ns.length-1].duration;
    return r.start;
  }
  // t 落在哪一场 —— **含场景之间的空档**（t 在 [scene.end, next.start) 仍算这一场）。
  // sentAt() 只认句子区间、空档里返回 null，而 at:'end' 的门禁恰恰开在空档里，
  // 所以门禁不能挂在 sentAt 的返回值上判。
  function sceneIdxAt(t){
    for (var i=0;i<scenes.length;i++){
      var r = scenes[i].runtime, nxt = scenes[i+1] ? scenes[i+1].runtime.start : Infinity;
      if (t >= r.start && t < nxt) return i;
    }
    return -1;
  }
  // 放进 tick() 里每帧调一次（幂等）；**空档里也要调**——at:'end' 的门禁就开在那个空档
  // seek 语义（和"锚点只在自然播放经过时打断"对齐）：
  //   · 一帧跳 0.5s 以上算 seek；落点已经越过锚点的门禁**不追溯打断**（否则进度条
  //     拖到场景中途会被 at-start 门禁拽回起点，用户的跳转被吞掉）；
  //   · 门禁开着时 seek 走 → 收起并**撤销 shown**：没答对的题再经过锚点应当重问；
  //     seek 回到锚点之前同样撤销（倒回去重看会再拦），答对过的（gAnswered）不复出。
  var gateLastT = 0;
  function syncGate(){
    // 导出截图模式（export_video.py 注入 __coursewareShotMode）：门禁浮层已被 CSS 压掉，
    // 这里再 return 一下，免得浮层虽不可见仍占着 gOpen 把音频冻结在锚点上。
    if (window.__coursewareShotMode) return;
    var t = audio.currentTime, si = sceneIdxAt(t);
    var jumped = Math.abs(t - gateLastT) > 0.5;
    gateLastT = t;
    if (si < 0){ if (gOpen >= 0) closeGate(); return; }
    var sid = scenes[si].step_id, i = -1;
    for (var k=0;k<GATES.length;k++) if (GATES[k].scene === sid) i = k;
    if (gOpen >= 0){
      if (i !== gOpen){
        if (!gAnswered[gOpen]) gShown[gOpen] = false;   // 没答就跳走：撤销，再经过锚点重问
        closeGate();
      }
      return;
    }
    if (i < 0) return;
    var a = gateAnchor(i);
    if (t < a){
      if (gShown[i] && !gAnswered[i]) gShown[i] = false;   // 回到锚点前：重新武装
      return;
    }
    if (gShown[i] || gAnswered[i]) return;
    if (jumped && t > a + 0.5){ gShown[i] = true; return; } // seek 落在锚点后：不打断这次跳转
    gShown[i] = true;
    openGate(i);
  }
  function resetGates(){ closeGate(true); gShown = []; gAnswered = []; }
  function gateBusy(){ return gOpen >= 0; }
  function gateAnswered(){ return gOpen >= 0 && !!gAnswered[gOpen]; }

  // ══ ⑥ 主循环 ═══════════════════════════════════════════════════════════
  var lastKey = '';
  // 浏览器 QA 在清空逐句 trace 前调用它：trace 与去重状态必须一起重置，
  // 否则单场景单句课件会把唯一一句误判为“没有再次驱动 renderer”。
  window.__coursewareResetRenderTrace = function(){
    window.__coursewareRenderTrace.length = 0;
    lastKey = '';
  };
  var scrubbing = false;            // 进度条擦洗中：见 tick 尾部，门禁延后到松手再开
  function tick(){
    var t = audio.currentTime;
    var hit = sentAt(t);
    el('fill').style.width = (TOTAL ? Math.min(100, t / TOTAL * 100) : 0) + '%';

    if (hit.scene){
      var idx = hit.sceneIndex;
      // 门禁**不在这里判**：它自己看锚点，与"现在第几句"无关（见下面单独的一次 syncGate()）。
      // at:'end' 的门禁开在末句之后的空档里，而空档不属于任何句子。
      var key = hit.scene.step_id + '#' + hit.index;
      // hit.index < 0 = 场景内部两句之间的空档：不重画、不清字幕，停在上一句上
      // （句间本来就有几十毫秒的接缝，闪一下空白比多留半秒更难看）
      if (hit.index >= 0 && key !== lastKey){       // 句号变了才重画
        lastKey = key;
        (RENDER[hit.scene.step_id] || function(){})(hit.index);
        window.__coursewareRenderTrace.push(key);
        stageFit();                             // 换幕即重新取景（小屏缩放+居中）
        capShow(hit.sentence);              // 字幕跟画面同一条命令驱动，不会错位
        el('ch-tag').textContent = segLabel(idx);
        el('ch-title').textContent = hit.scene.content.title || '';
        el('ch-tagline').textContent = hit.scene.content.tagline || '';
      }
      // 读数与画面同生共死：index<0 的空档里（seek 进场景首句之前的缝隙时可能持续
      // 很久）整行**停在上一句上**，否则读数已翻到新场景、舞台还停在旧场景，两头对不上。
      if (hit.index >= 0){
        // 读数只留"第几节 + 时间"：章节名在画布上方的章节头里，重复出现在这条
        // 窄行里既挤进度条，窄屏下还会溢出（段名动辄十几个字）。
        var stepTxt = (idx + 1) + '/' + scenes.length + ' · ' + fmt(t) + ' / ' + fmt(TOTAL);
        var stepEl = el('step');                       // fmt 秒级变化，避免每帧重写
        if (stepEl.textContent !== stepTxt) stepEl.textContent = stepTxt;
      }
    } else if (scenes.length && t < scenes[0].runtime.start){
      capShow(null);                    // 开场前：字幕带整条收起（idle 的 CSS 也压着）
    }
    // 门禁每帧判一次（幂等）：它自己比锚点，所以**空档里也要判**——
    // at:'end' 的门禁正是开在末句之后的那个空档里。
    // 擦洗期间例外：preGateOpen 会把 currentTime 拽回场景起点，和还按着
    // 进度条的手指抢方向盘；松手后补一次 syncGate，锚点照常触发。
    if (!scrubbing) syncGate();
    // 剩下的情况**什么都不做**，两种子情形：
    // ① 两个场景之间的那 0.4 秒空档 —— 字幕与读数停在上一句上，一进空档就清掉，
    //    每换一节都会闪一下空白，所以这里保留上一句；
    // ② t 已经越过了最后一句 —— 也**不要**在这儿判"课程结束"。实测时间轴声明的
    //    end（115.201）比音频真实长度（115.2002）长那么几毫秒，`t >= end` 永远不成立，
    //    写在这儿就是死代码。结束态改挂在 audio 的 `ended` 上（见 §⑦），那才是真的播完。
  }

  // ══ ⑦ 走带 / 章节刻度 / 侧栏杂项 ═════════════════════════════════════
  // **没有顶部走带**：播放层与门禁浮在画布内；字幕在画布里（§③ 字幕带）；播放器行
  // 常驻在画布下面（见 CSS 的 ④ 播放器行 / `.rack`）。
  // 画布的 data-state 是播放层的唯一开关：idle / playing / paused
  var stage = el('stage');
  el('vp-sub').textContent = '全程 ' + fmt(TOTAL);

  // 播放层直接控制音频；runtime 不拥有播放时钟。
  el('veilplay').addEventListener('click', function(){
    if (audio.paused) audio.play().catch(function(){}); else audio.pause();
  });
  // 播放器行上的播放/暂停：它就是那条常驻播放器的按钮。idle 时点它也能直接起播
  // （音频 play 事件会切换页面播放态，播放层随后收起）。
  el('pp').addEventListener('click', function(){
    if (audio.paused) audio.play().catch(function(){}); else audio.pause();
  });
  el('rew').addEventListener('click', function(){
    audio.currentTime = 0; resetGates(); lastKey = '';
  });
  // 倍速：画面、字幕、门禁全是 currentTime 的纯函数，变速只是让时钟走快点——
  // 整页不需要任何第二套逻辑，这是"单一时钟"白送的能力。导出截图页直接 seek，
  // 不经过 playbackRate，成片与 1× 播的一模一样。
  var SPEEDS = [1, 1.25, 1.5, 2, 0.75], spdBtn = el('spd'), spdI = 0;
  spdBtn.addEventListener('click', function(){
    spdI = (spdI + 1) % SPEEDS.length;
    audio.playbackRate = SPEEDS[spdI];
    spdBtn.textContent = SPEEDS[spdI] + '×';
    if (SPEEDS[spdI] === 1) delete spdBtn.dataset.off; else spdBtn.dataset.off = '1';
    spdBtn.setAttribute('aria-label', '播放倍速 ' + SPEEDS[spdI] + '×（点击切换）');
  });
  // 全屏：对整条画布列（舞台 + 播放器行）请求全屏，门禁浮在舞台内照常可用。
  // 不支持 Element.requestFullscreen 的环境（iOS Safari）收起按钮，不留死控件。
  var fsBtn = el('fs'), colStage = document.querySelector('.col-stage');
  if (!(colStage && colStage.requestFullscreen)) fsBtn.hidden = true;
  fsBtn.addEventListener('click', function(){
    if (document.fullscreenElement){ document.exitFullscreen().catch(function(){}); return; }
    colStage.requestFullscreen().catch(function(){});   // 被拒绝（非手势调用等）就什么都不做
  });
  document.addEventListener('fullscreenchange', function(){
    var on = !!document.fullscreenElement;
    document.body.dataset.fs = on ? '1' : '0';
    fsBtn.setAttribute('aria-label', on ? '退出全屏' : '全屏');
    fsBtn.title = on ? '退出全屏 (Esc)' : '全屏 (F)';
    rackReset();                                 // 进/出全屏同样切换播放器行形态（函数声明提升，这里可前向引用）
  });

  // 悬浮态 = 窄屏或全屏：播放器行默认藏起（CSS 把 .rack 变成画布下缘的浮层），
  // 点画布唤出、再点收回；没收回来就 3s 无操作兜底收起；按住进度条期间不收回。
  // 宽屏非全屏不挂这些行为，.rack 照常常驻。
  function floating(){ return mqNarrow.matches || !!document.fullscreenElement; }
  var rackHideTimer = 0, rackHold = false;
  function rackArm(){ if (!floating()) return;
    clearTimeout(rackHideTimer);
    rackHideTimer = setTimeout(function(){
      if (!rackHold && !gateBusy()) el('rack').dataset.show = '0';
    }, 3000);
  }
  function rackShow(){ if (!floating()) return;
    el('rack').dataset.show = '1'; rackArm(); }
  el('stage').addEventListener('click', function(){
    if (!floating() || gateBusy()) return;
    if (el('rack').dataset.show === '1'){       // 再点一下画布 = 收回去，别让人等自动收起
      clearTimeout(rackHideTimer); el('rack').dataset.show = '0';
    } else rackShow();
  });
  el('rack').addEventListener('pointerdown', function(){ rackHold = true; });
  document.addEventListener('pointerup', function(){ rackHold = false; rackArm(); });
  function rackReset(){                          // 进出悬浮态都先收起；常驻形态清掉属性
    el('rack').dataset.show = floating() ? '0' : '';
  }
  function onCompactChange(){
    setCompact();
    lastKey = ''; tick();                       // 小屏档位变了，当前句重画一次（含重取景）
    rackReset();
  }
  [mqNarrow, mqShort].forEach(function(mq){    // 转屏会跨高度线，两个媒体查询都要听
    if (mq.addEventListener) mq.addEventListener('change', onCompactChange);
    else if (mq.addListener) mq.addListener(onCompactChange);   // Safari <14
  });
  rackReset();
  function setState(s){
    stage.dataset.state = s;
    el('pp').textContent = (s === 'playing') ? '❚❚' : '▶';
  }
  audio.addEventListener('play',  function(){ setState('playing'); });
  audio.addEventListener('pause', function(){ setState('paused');  });
  audio.addEventListener('ended', function(){
    setState('paused');
    // 结束态挂在这儿，不挂在 tick 的 `t >= end` 上（那个条件实测永不成立，见 §⑥）。
    // 这句话写在播放器行的读数里——它就在进度条旁边，说"拖动重看"时手和眼在同一处；
    // 字幕带则收起，因为旁白已经没声了。
    capShow(null);
    el('step').textContent = '课程结束 · 拖动进度条可重看';
  });
  audio.addEventListener('timeupdate', tick);          // 兜底：seek / 元数据就绪时也走一次
  audio.addEventListener('loadedmetadata', tick);
  // 播放中改用 rAF 逐帧驱动：timeupdate 只有 ~4Hz（换句最多晚 250ms），再叠上 .38s 淡入
  // 就成了"字幕念到了、画面慢半拍"。tick 内部按句号去重，逐帧调用不会重画。
  var rafId = 0;
  // tick 抛错不能把循环打断：一次渲染错误（renderer / 门禁建卡）若逃出这里，
  // rAF 链就断了，画面从此冻结在坏帧上，直到下次 play 才复活——逐帧驱动必须
  // 在 finally 里续上，错误本身交给控制台与 check_gates 的 JS 错误报告。
  function rafTick(){
    try { tick(); }
    catch (e) { console.error('[tick]', e); }
    finally { rafId = requestAnimationFrame(rafTick); }
  }
  audio.addEventListener('play',  function(){ if (!rafId) rafTick(); });
  audio.addEventListener('pause', function(){ if (rafId){ cancelAnimationFrame(rafId); rafId = 0; } });

  // 进度条 seek：点一下跳过去，按住拖就是擦洗（实时跟着走，松手定住）。
  // setPointerCapture 让指针拖出条外也继续跟手；触屏靠 CSS 的 touch-action:none
  // 把横拖喂给这里（进度条只有几像素高，不让它起手滚页面是可接受的取舍）。
  var barEl = el('bar');
  barEl.addEventListener('pointerdown', function(e){
    if (!TOTAL || e.button !== 0) return;
    e.preventDefault();
    barEl.setPointerCapture(e.pointerId);
    scrubbing = true;
    var seek = function(x){
      var r = barEl.getBoundingClientRect();
      audio.currentTime = Math.max(0, Math.min(1, (x - r.left) / r.width)) * TOTAL;
    };
    seek(e.clientX);
    var move = function(ev){ if (ev.pointerId === e.pointerId) seek(ev.clientX); };
    var stop = function(ev){
      if (ev.pointerId !== e.pointerId) return;
      barEl.removeEventListener('pointermove', move);
      barEl.removeEventListener('pointerup', stop);
      barEl.removeEventListener('pointercancel', stop);
      scrubbing = false;
      tick();                     // 松手补判：擦洗跨过的门禁锚点在这儿兑现
    };
    barEl.addEventListener('pointermove', move);
    barEl.addEventListener('pointerup', stop);
    barEl.addEventListener('pointercancel', stop);
  });
  document.addEventListener('keydown', function(e){
    if (gateBusy()){
      if (e.code === 'Space'){
        // 与非门禁分支同一口径：落在按钮上的空格留给按钮自己。runtime 在条目
        // keydown 层已消费的那一下（hotspot/sequence/bucket）会带 defaultPrevented；
        // choice 是原生 button，空格在 keyup 合成 click——在这里 preventDefault
        // 会把它掐死（非门禁分支的注释写的就是这个坑）。
        if (e.defaultPrevented) return;
        if (e.target && e.target.closest && e.target.closest('button,[role=button]')) return;
        e.preventDefault();
        // 「先选一个答案」同样只能写 .kick：此刻 #gate-next 整行还 hidden，
        // 写进 hidden 的行既看不见也播报不到
        if (gateAnswered()) resumeFromGate(); else el('gate-kick').textContent = '先选一个答案 · 答对后继续';
      }
      return;
    }
    if (e.code === 'Space' && !e.repeat){
      // 焦点在按钮上时把空格留给按钮自己（选项 / 继续 / 折叠头）：
      // 这里 preventDefault 会掐掉按钮的空格激活，键盘用户按了没反应还顺手切了播放
      if (e.target && e.target.closest && e.target.closest('button,[role=button]')) return;
      e.preventDefault();
      if (audio.paused) audio.play().catch(function(){}); else audio.pause();
    }
    // !e.repeat：按住 ←→ 不放时 keydown 连发，8s 一跳会瞬间蹿过门禁锚点区，
    // 和 F 键同理（下面一行）——连发是"快速擦洗"手势，不是用户的判断。
    if (e.code === 'ArrowRight' && !e.repeat) audio.currentTime = Math.min(TOTAL, audio.currentTime + 8);
    if (e.code === 'ArrowLeft' && !e.repeat)  audio.currentTime = Math.max(0, audio.currentTime - 8);
    if ((e.key === 'f' || e.key === 'F') && !e.ctrlKey && !e.metaKey && !e.altKey && !e.repeat
        && !fsBtn.hidden) fsBtn.click();   // F 切全屏；放行 Ctrl/Cmd+F（页内查找），掐掉按键连发
  });

  // 章节刻度：每节起点在进度条上留一根。第一根贴在 0%，不必画。
  scenes.forEach(function(sc, i){
    if (i === 0 || !TOTAL) return;
    var tk = document.createElement('div');
    tk.className = 'tick';
    tk.style.left = (sc.runtime.start / TOTAL * 100) + '%';
    el('bar').appendChild(tk);
  });
  // 章节归属与 tick/场景头用**同一个** sceneIdxAt（空档算前一场）：
  // 另写一份按 `t < end` 的判法，鼠标指在换场空档上时气泡报下一节、画面却还是上一节，两头对不上。
  function segLabel(i){
    return i === 0 ? '开场'
      : (i === scenes.length - 1 ? '结尾' : '第 ' + i + ' 节');
  }
  // 悬停窥探：指着进度条上哪一段，就报哪一段的章节名与该处时间。
  // 点击仍然是**自由拖动**（跟正常视频网站一样），章节刻度只负责"看得见边界"。
  el('bar').addEventListener('mousemove', function(e){
    var r = el('bar').getBoundingClientRect();
    if (!r.width || !TOTAL) return;
    var ratio = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
    var t = ratio * TOTAL, i = Math.max(0, sceneIdxAt(t)), tip = el('bar-tip');
    tip.textContent = segLabel(i) + ' · ' + (scenes[i].content.title || scenes[i].step_id)
      + ' · ' + fmt(t);
    var half = (tip.offsetWidth || 160) / 2;          // 贴边时把气泡压回条内
    tip.style.left = Math.max(half, Math.min(r.width - half, ratio * r.width)) + 'px';
    tip.dataset.on = '1';
  });
  el('bar').addEventListener('mouseleave', function(){
    delete el('bar-tip').dataset.on;
  });

  tick();
})();
</script>
</body>
</html>
