   *    · dir   可选：'max'（量超过界 = 越界，缺省）/ 'min'（量低于界 = 越界：水位、
   *            最低要求、误差下限）；
   *    · scale 可选：满量程的数值（缺省 100），把 0–1 的比例翻成人话读数；
   *    · unit  可选：读数单位（'%' / 'ms' / 'GB'），直接拼在数字后面；
   *    · lab   可选：界值的整句文案（"预算 80""安全水位"），给了就不写数字；
   *    · num   可选：false → 只留线与区带，不写任何读数。
   *    参照物 / 量任一不在台上 → 整条静默不登记（半条界线比没有界线更误导，与
   *    lanes / range / loupe / callout 同一口径）。 */
  function limit(key, opt){
    if (!opt) return;
    var of = host(opt.of);
    if (!of || !of.isConnected) return;
    var at = +opt.at;
    if (!isFinite(at)) return;
    at = Math.max(0, Math.min(1, at));
    var pr = (opt.probe === undefined || opt.probe === null) ? null : host(opt.probe);
    if ((opt.probe !== undefined) && (opt.probe !== null) && (!pr || !pr.isConnected)) return;
    var sc = +opt.scale;
    LIM.push({key:key, of:of, probe:pr, at:at,
              axis: opt.axis === 'y' ? 'y' : 'x',
              dir: opt.dir === 'min' ? 'min' : 'max',
              scale: isFinite(sc) ? sc : 100,
              unit: opt.unit || '', lab: opt.lab || null,
              num: opt.num !== false});
  }

  /** 同值不重写（与 rangeSet / laneSet 同一课：先 String() 再比）。 */
  function limitSet(e, k, v){
    v = String(v);
    if (e.getAttribute(k) !== v) e.setAttribute(k, v);
  }

  /** 这一拍的几何 + 判定，全现量：
   *    · of 盒 = 界线所在的那把尺子；probe 盒 = 量的当前位置（**包含 probe 自己的
   *      transform**——meter 用 scale 长，boxIn 会把这一层的矩阵一起乘进去）；
   *    · 值沿"量增长的方向"归一成 0–1（x 轴取右缘、y 轴取顶边），与 `at` 同单位比较，
   *      所以判定不依赖 pixel 数字，也不受镜头推拉影响；
   *    · 越界侧 = dir 之外那一半（max 时是右/上，min 时是左/下）；
   *    · 量不到任一件返回 null（宁缺，不画一条糊在错误位置的线）。 */
  function limitGeom(s){
    var ofb = boxIn(s.of, el('cam'));
    if (!ofb || !ofb.w || !ofb.h) return null;
    var T = limitTokens(), cap = T.cap, ax = s.axis === 'y' ? 'y' : 'x';
    var line, caps, zone, over = false, dv = 0, vf = 0;
    if (ax === 'x'){
      var lx = ofb.x + ofb.w * s.at;
      line = limRect(lx, ofb.y - cap, 1, ofb.h + cap * 2);
      caps = [limRect(lx - cap / 2, ofb.y - cap, cap, 1),
              limRect(lx - cap / 2, ofb.y + ofb.h + cap - 1, cap, 1)];
      var zx = s.dir === 'min' ? ofb.x : lx;
      var zx2 = s.dir === 'min' ? lx : ofb.x + ofb.w;
      zone = limRect(zx, ofb.y, Math.max(0, zx2 - zx), ofb.h);
    } else {
      var ly = ofb.y + ofb.h * (1 - s.at);          // y 轴从下往上：at .8 在靠上的位置
      line = limRect(ofb.x - cap, ly, ofb.w + cap * 2, 1);
      caps = [limRect(ofb.x - cap, ly - cap / 2, 1, cap),
              limRect(ofb.x + ofb.w + cap - 1, ly - cap / 2, 1, cap)];
      var zy = s.dir === 'min' ? ly : ofb.y;
      var zy2 = s.dir === 'min' ? ofb.y + ofb.h : ly;
      zone = limRect(ofb.x, zy, ofb.w, Math.max(0, zy2 - zy));
    }
    if (s.probe){
      var pb = boxIn(s.probe, el('cam'));
      if (!pb) return null;
      vf = ax === 'x' ? (pb.x + pb.w - ofb.x) / ofb.w : (ofb.y + ofb.h - pb.y) / ofb.h;
      over = s.dir === 'max' ? vf > s.at + .001 : vf < s.at - .001;
      dv = Math.abs(vf - s.at) * s.scale;
    }
    return {ofb:ofb, line:line, caps:caps, zone:zone, over:over, dv:dv};
  }
  function limRect(x, y, w, h){ return {x:x, y:y, w:w, h:h}; }

  /** 按 key 建一条界线（区带 / 线 / 两端头 / 两个读数），建过就复用。全部
   *  createElementNS、不进 put()：注记没有"上一状态"要补间，每拍由 limitWrite() 写死。
   *  区带先建（压在线的下面），读数最后建（压在区带上面）。 */
  function limitBuild(s){
    var g = LIM_G[s.key];
    if (g && g.root.parentNode) return g;
    if (g && g.root.parentNode) g.root.parentNode.removeChild(g.root);
    var layer = el('limits');
    if (!layer) return null;
    var root = document.createElementNS(NS, 'g');
    root.setAttribute('class', 'lim');
    root.setAttribute('data-helper', 'limit');
    var zone = document.createElementNS(NS, 'rect'); zone.setAttribute('class', 'lim-z');
    var line = document.createElementNS(NS, 'rect'); line.setAttribute('class', 'lim-l');
    var a1 = document.createElementNS(NS, 'rect'); a1.setAttribute('class', 'lim-a');
    var a2 = document.createElementNS(NS, 'rect'); a2.setAttribute('class', 'lim-a');
    var lab = document.createElementNS(NS, 'text');
    lab.setAttribute('class', 'lim-lab halo'); lab.setAttribute('text-anchor', 'middle');
    var d = document.createElementNS(NS, 'text');
    d.setAttribute('class', 'lim-d halo'); d.setAttribute('text-anchor', 'middle');
    root.appendChild(zone); root.appendChild(line);
    root.appendChild(a1); root.appendChild(a2);
    root.appendChild(lab); root.appendChild(d);
    layer.appendChild(root);
    g = LIM_G[s.key] = {root:root, zone:zone, line:line, a1:a1, a2:a2,
                        lab:lab, d:d, labw:0, labt:null, dt:null, hid:false, s:s};
    return g;
  }

  /** 摘掉一条界线（连同 LIM_S 那一位判定：留下旧判定，重建出来的同一个 key 会少切
   *  一次 class，停在"没越界"的外观上——这是 0.49.0 那个起点 bug 的另一副面孔）。 */
  function removeLimit(key){
    var g = LIM_G[key];
    if (g){
      if (g.root.parentNode) g.root.parentNode.removeChild(g.root);
      delete LIM_G[key];
    }
    delete LIM_S[key];
  }

  /** 一位小数就够小、整数才够稳（差值读数每帧都在动，用整数量，文字才不每帧重排）。 */
  function limNum(v){
    if (!isFinite(v)) return '0';
    var a = Math.abs(v);
    var r = a >= 10 ? Math.round(v) : Math.round(v * 10) / 10;
    return String(r);
  }

  /** 把这一拍的几何与判定写进这条界线。几何四个数一次写齐（无补间）；**补间只有颜色**
   *  （越界切 class，CSS 用 --dur-lim 过去）。读数：
   *    · 界线读数在端头外（x 轴在上方、y 轴在右端外），整签压回本步取景窗——与 range
   *      同一档：读数在这条原语里是主角，宁可往里缩也不能被裁掉；
   *    · 差值签只跟着界线读数走一行（不与"量在哪"抢位置）：越界时它才是被读的那句
   *      "超 18ms"；
   *    · 宽度只在文字变了时量一次，且 num:false 时整族不量（藏起来量出 0，与
   *      laneLabW / rangeWrite 同一个坑，这里干脆绕开它）。 */
  function limitWrite(s){
    var g = limitBuild(s);
    if (!g) return;
    var o = limitGeom(s);
    if (!o){ removeLimit(s.key); return; }
    var T = limitTokens(), A = s.__win || FULL, ofb = o.ofb;
    limitSet(g.zone, 'x', f1(o.zone.x)); limitSet(g.zone, 'y', f1(o.zone.y));
    limitSet(g.zone, 'width', f1(o.zone.w)); limitSet(g.zone, 'height', f1(o.zone.h));
    limitSet(g.line, 'x', f1(o.line.x)); limitSet(g.line, 'y', f1(o.line.y));
    limitSet(g.line, 'width', f1(o.line.w)); limitSet(g.line, 'height', f1(o.line.h));
    limitSet(g.a1, 'x', f1(o.caps[0].x)); limitSet(g.a1, 'y', f1(o.caps[0].y));
    limitSet(g.a1, 'width', f1(o.caps[0].w)); limitSet(g.a1, 'height', f1(o.caps[0].h));
    limitSet(g.a2, 'x', f1(o.caps[1].x)); limitSet(g.a2, 'y', f1(o.caps[1].y));
    limitSet(g.a2, 'width', f1(o.caps[1].w)); limitSet(g.a2, 'height', f1(o.caps[1].h));
    /* 判定 → class，只在变了时切一次（同值不重写在颜色这一侧落成"切一次档位"）。 */
    var st = o.over ? 1 : 0;
    if (LIM_S[s.key] !== st){
      LIM_S[s.key] = st;
      if (o.over) g.root.classList.add('over'); else g.root.classList.remove('over');
    }
    if (g.hid !== (s.num === false)){
      g.hid = s.num === false;
      if (g.hid){ g.root.classList.add('hid'); }
      else { g.root.classList.remove('hid'); g.labw = 0; }   // 请回来之后必须重量一次
    }
    if (!s.num) return;
    var fs = T.fs, cap = T.cap, ax = s.axis === 'y' ? 'y' : 'x';
    var bt = s.lab || (limNum(s.at * s.scale) + s.unit);
    if (g.labt !== bt){
      g.lab.textContent = bt; g.labt = bt;
      g.labw = g.lab.getComputedTextLength ? g.lab.getComputedTextLength() : 0;
    }
    var dt = (s.dir === 'max' ? '超 ' : '差 ') + Math.round(o.dv) + s.unit;
    if (g.dt !== dt){ g.d.textContent = dt; g.dt = dt; }
    if (ax === 'x'){
      /* 两行读数**占位恒定**（差值签藏起来时那一行空着）：界值不能因为"越界了"就往
         上跳一截——那会让同一句里两次读到它停在不同高度。上方两行放不下就一起落到
         带子下方（宁可探出去，也不压住量本身）。 */
      var ty2, ty1 = ofb.y - cap - 4;
      if (ty1 - fs - 2 >= A[1] + 1){ ty2 = ty1; ty1 = ty2 - fs - 2; }
      else { ty1 = ofb.y + ofb.h + cap + fs + 2; ty2 = ty1 + fs + 2; }
      ty1 = Math.max(A[1] + fs, ty1);
      ty2 = ty1 + fs + 4;
      var w = g.labw || 0, cx = o.line.x;
      if (w && A[2] > w + 4) cx = Math.max(A[0] + w / 2 + 2, Math.min(A[0] + A[2] - w / 2 - 2, cx));
      else if (A[2] <= w + 4) cx = A[0] + A[2] / 2;
      limitSet(g.lab, 'text-anchor', 'middle'); limitSet(g.d, 'text-anchor', 'middle');
      limitSet(g.lab, 'x', f1(cx)); limitSet(g.lab, 'y', f1(ty1));
      limitSet(g.d, 'x', f1(cx)); limitSet(g.d, 'y', f1(ty2));
    } else {
      var rightOK = (ofb.x + ofb.w + cap + 6 + (g.labw || 0)) <= A[0] + A[2] - 2;
      var tx = rightOK ? ofb.x + ofb.w + cap + 6 : ofb.x - cap - 6;
      limitSet(g.lab, 'text-anchor', rightOK ? 'start' : 'end');
      limitSet(g.d, 'text-anchor', rightOK ? 'start' : 'end');
      var by = o.line.y + fs * .35;
      by = Math.max(A[1] + fs, Math.min(A[1] + A[3] - 2, by));
      limitSet(g.lab, 'x', f1(tx)); limitSet(g.lab, 'y', f1(by));
      limitSet(g.d, 'x', f1(tx)); limitSet(g.d, 'y', f1(by + fs + 2));
    }
  }

  /** 排这一句的界线（layoutRanges 之后、camSet 之前，与其余 layout 同批）。
   *  只做两件事：收孤儿（参照物或量被 sweep() 摘走 → 整条摘，连判定一起清）、
   *  每步现画一次（这一句的取景窗成了读数的安全区）。 */
  function layoutLimits(stepId, index){
    var live = {}, k, g;
    var win = (CAM[stepId] || [])[index] || FULL;
    for (k in LIM_G){
      g = LIM_G[k];
      if (!g.s || !g.s.of.isConnected || (g.s.probe && !g.s.probe.isConnected)){
        removeLimit(k); continue;
      }
    }
    LIM.forEach(function(s){
      live[s.key] = 1; s.__win = win;
      limitWrite(s);
    });
    for (k in LIM_G) if (!live[k]) removeLimit(k);       // 不登记即摘（无跨步账本）
  }

  /** 逐拍（与 rangeTock / lanesTock 同批）。**这一族不吃时间**：界线位置与判定都是
   *  现量的函数，所以没有起点、没有补间、没有"追上之后改直写"那一套。它每拍重量的
   *  理由只有一个——量在长（meter 的 scale、对象入场、卡片被挪位），界线要跟着那颗量
   *  的当前位置判"到没到"。见旗（导出 / 减动效 / 擦洗）时 meter 会落满，判定自然落
   *  "越界"，定格里读到的就是那一格。 */
  function limitTock(){
    for (var i = 0; i < LIM.length; i++) limitWrite(LIM[i]);
  }

  /* ── 岔路（0.51.0）────────────────────────────────────────────────────────
     词表此前说得出"谁跟谁有关系"（connect 一条双边线）、"这几件算一组"（.brace）、
     "取的是哪几件"（range 一段序号）、"两个版本差在哪"（compare 同窗叠放）。说不出
     的是**从一个岔口出发有几条去路、走了哪条、没走的那条通向哪儿**。"返回负数走这支、
     返回零走那支""本来可以这么化简，被排除了""四种物态里此刻在这一态，按这条规则才
     会跳走"——此前这些只能靠旁白念：画面上既没有一张**数得出条数**的候选清单，也没有
     "没走的那条仍然在场"这个读法。
     四条口径（写错过任何一条都会静默失效或读错）：
       ① **未选支常驻在场**（淡虚线），不消失也不压暗——"本来可以去哪儿"就是这条原语
          要说的内容，那是清单不是干扰；选中那一支只**换档**（实线 + 强调橙），既不
          长出来也不收回，所以它不替代 connect()（一条关系的有无，有生长与收回）、
          也不替代 drawTo()（一条路走到第几段）。
       ② **条数是读数**：支数 = to 的长度，作者既不填坐标也不填条数；读数写
          `n 条 · →第 k 条`，`at` 缺省（还没选）时写 `n 条 · 未选`，整张扇面停在中性档。
       ③ **一切现量**：岔口点是 from 盒朝诸去向重心那条边界的出口，各支末端取去向盒
          的边缘再退 --fork-gap（§5：不悬空留缝、不插进图形内部），箭头再占掉
          --fork-head。对象还在入场、还在挪位时支跟着它落位，所以擦洗 / 逐帧冷启动 /
          导出读的都是同一格。
       ④ **任一件不在场，整张扇面不登记**（数错条数比不数更误导，与 lanes / range
          同口径）；没有 gone，不登记即摘。FORK_S 只记上一拍选中的第几条，用来避免
          每帧重写 class。 */

  /** 令牌缓存（与 limitTokens 同一口径：设计期参数，读一次就缓存；改名删名落默认档）。 */
  function forkTokens(){
    if (FORK_T) return FORK_T;
    FORK_T = {node:morphTok('--fork-node', 2.6), head:morphTok('--fork-head', 7),
              gap:morphTok('--fork-gap', 2), pad:morphTok('--fork-pad', 6),
              fs:morphTok('--fork-fs', 10)};
    return FORK_T;
  }

  /** 登记一张候选清单。opt：
   *    · from 必填：岔口——出发的那个图元（id 或节点），岔口点钉在它的边界上；
   *    · to   必填：去向清单（数组，一项一条支）。**声明顺序 = "第几条路"的编号**
   *            （旁白说"第二条"就数第二条），扇面上的左右先后由几何现量决定，两支
   *            从同一点张开、天然不交叉，所以作者不用管排布；
   *    · at   可选：走了哪一条（0 基，越界夹到 [0, n−1]）。不给或给负数 = 还没选 →
   *            整张扇面停在中性档、读数写"未选"（"先摆出几种可能"那一拍就是这一档，
   *            它是内容而不是没演完）；
   *    · lab  可选：与 to 同长的短签数组，写在每条支上（触发条件 / 理由）；缺项留空；
   *    · num  可选：false → 不写条数读数，支与箭头照常。
   *  岔口不在台上、to 为空、或任一去向不在台上 → 整张静默不登记。 */
  function fork(key, opt){
    if (!opt) return;
    var fm = host(opt.from);
    if (!fm || !fm.isConnected) return;
    var list = opt.to;
    if (!list || !list.length) return;
    var arms = [], i, a;
    for (i = 0; i < list.length; i++){
      a = host(list[i]);
      if (!a || !a.isConnected) return;          // 缺一支整张不画：条数就是读数
      arms.push(a);
    }
    var at = Math.round(+opt.at);
    if (!isFinite(at)) at = -1;                  // 没给 / 不是数 = 还没选
    else if (at >= 0) at = Math.min(arms.length - 1, Math.max(0, at));
    var labs = opt.lab || [];
    FORK.push({key:key, from:fm, to:arms, at:at, n:arms.length,
               lab:arms.map(function(_, j){ return labs[j] == null ? '' : String(labs[j]); }),
               num: opt.num !== false});
  }

  /** 同值不重写（与 limitSet / rangeSet 同一课：先 String() 再比）。 */
  function forkSet(e, k, v){
    v = String(v);
    if (e.getAttribute(k) !== v) e.setAttribute(k, v);
  }

  /** 盒边界上朝"目标中心"的那个出口，外推 gap 个单位的呼吸缝。算法与 connEdge 同一条
   *  （§5 连线纪律），只是缝宽从 --fork-gap 读而不是写死 2——同一族里两端各留多少
   *  是设计档，不该散落成魔法数。tgt 传退化盒（w/h = 0）：这里只用它的中心。 */
  function forkEdge(box, tgt, gap){
    var cx = box.x + box.w / 2, cy = box.y + box.h / 2;
    var dx = tgt.x - cx, dy = tgt.y - cy;
    var ax = Math.abs(dx), ay = Math.abs(dy);
    if (ax < .01 && ay < .01) return null;
    var tx = ax > .01 ? (box.w / 2) / ax : Infinity;
    var ty = ay > .01 ? (box.h / 2) / ay : Infinity;
    var t = Math.min(tx, ty);
    if (!isFinite(t) || t < .01) return null;
    var L = Math.sqrt(dx * dx + dy * dy) || 1;
    return {x: cx + dx * t + dx / L * gap, y: cy + dy * t + dy / L * gap};
  }

  /** 箭头三角：尖端在 tip、根在 tip − head·u、半宽 head×.55。自己画而不用 marker-end
   *  （marker 的 fill 切不到 `.pick` 档上），填色不描边（镜头推近时 1px 描边会糊）。 */
  function forkHeadD(tip, ux, uy, head){
    var bx = tip.x - ux * head, by = tip.y - uy * head, hw = head * .55;
    return 'M' + f1(tip.x) + ',' + f1(tip.y) +
           ' L' + f1(bx - uy * hw) + ',' + f1(by + ux * hw) +
           ' L' + f1(bx + uy * hw) + ',' + f1(by - ux * hw) + ' Z';
  }

  /** 这一拍的扇面，全现量。任一件量不到盒、或某一支短得放不下箭头（< 2×head）→
   *  返回 null：半张清单、挤成一坨的扇面都比不画更误导。 */
  function forkGeom(s){
    var T = forkTokens(), n = s.n, i;
    var fb = boxIn(s.from, el('cam'));
    if (!fb || !fb.w || !fb.h) return null;
    var bs = [], gx = 0, gy = 0;
    for (i = 0; i < n; i++){
      var b = boxIn(s.to[i], el('cam'));
      if (!b || !b.w || !b.h) return null;
      bs.push(b); gx += b.x + b.w / 2; gy += b.y + b.h / 2;
    }
    gx /= n; gy /= n;
    var J = forkEdge(fb, {x:gx, y:gy, w:0, h:0}, T.gap);
    if (!J) return null;
    var arms = [];
    for (i = 0; i < n; i++){
      var tip = forkEdge(bs[i], {x:J.x, y:J.y, w:0, h:0}, T.gap);
      if (!tip) return null;
      var dx = tip.x - J.x, dy = tip.y - J.y, L = Math.sqrt(dx * dx + dy * dy);
      if (!isFinite(L) || L < T.head * 2) return null;
      var ux = dx / L, uy = dy / L;
      arms.push({tip:tip, ux:ux, uy:uy, L:L,
                 end:{x: tip.x - ux * T.head, y: tip.y - uy * T.head},
                 mid:{x: J.x + dx * .72, y: J.y + dy * .72}});
    }
    return {J:J, arms:arms, head:T.head, pad:T.pad, fb:fb, c:{x:gx, y:gy}};
  }

  /** 按 key 建一张扇面（岔口点 + 每支一组〔线 / 箭头 / 短签〕+ 条数读数）。建过就
   *  复用；**去向条数变了就重建**（支数组的长度是这一族的几何，补不出"多出来的一
   *  支"，也收不掉"少掉的一支"）。全部 createElementNS、不进 put()：注记没有"上一
   *  状态"要补间，每拍由 forkWrite() 写死。 */
  function forkBuild(s){
    var g = FORK_G[s.key];
    if (g && g.n === s.n && g.root.parentNode) return g;
    if (g) removeFork(s.key);                     // 条数变了：连 FORK_S 那一位一起清
    var layer = el('forks');
    if (!layer) return null;
    var root = document.createElementNS(NS, 'g');
    root.setAttribute('class', 'fork');
    root.setAttribute('data-helper', 'fork');
    var node = document.createElementNS(NS, 'circle');
    node.setAttribute('class', 'fk-n');         // r 归 forkWrite()：尺寸是令牌，不是这里的魔法数
    root.appendChild(node);
    var arms = [], i;
    for (i = 0; i < s.n; i++){
      var q = document.createElementNS(NS, 'g'); q.setAttribute('class', 'fk');
      var a = document.createElementNS(NS, 'line'); a.setAttribute('class', 'fk-a');
      var h = document.createElementNS(NS, 'path'); h.setAttribute('class', 'fk-h');
      var l = document.createElementNS(NS, 'text');
      l.setAttribute('class', 'fk-lab halo'); l.setAttribute('text-anchor', 'middle');
      q.appendChild(a); q.appendChild(h); q.appendChild(l);
      root.appendChild(q);
      arms.push({root:q, a:a, h:h, lab:l, dv:'', lt:null, lw:0});
    }
    var rep = document.createElementNS(NS, 'text');
    rep.setAttribute('class', 'fk-r halo'); rep.setAttribute('text-anchor', 'middle');
    root.appendChild(rep);
    layer.appendChild(root);
    return FORK_G[s.key] = {root:root, node:node, arms:arms, rep:rep,
                            n:s.n, rt:null, rw:0, hid:false, s:s};
  }

  /** 摘掉一张扇面（连同上一拍的选中档：留着它，重建出来的同一个 key 会停在上一次
   *  的颜色上——`at` 从 2 换回 1 时不再切档，画面读成"还是那一条"）。 */
  function removeFork(key){
    var g = FORK_G[key];
    if (g){
      if (g.root.parentNode) g.root.parentNode.removeChild(g.root);
      delete FORK_G[key];
    }
    delete FORK_S[key];
  }

  /** 把这一拍的扇面写齐：几何一次写满（无补间），**补间只有颜色**（选中档切 class）。
   *  短签放在 72% 那一格、沿法向推向"离诸支重心更远"的那一侧——放在支上会糊成一条，
   *  推到在线之外才读得出"这一支说的是这个条件"；读数放在岔口的**背面**（扇面张开
   *  的那一侧留给支），背面方向正对出发件，于是落点推到它沿该方向的盒沿之外——
   *  压在出发件自己的正文上就不叫读数了。并与 limit / range 同一档：读数是主角，
   *  整签压回本步取景窗，宁可往里缩也不能被裁掉。 */
  function forkWrite(s){
    var g = forkBuild(s);
    if (!g) return;
    var o = forkGeom(s);
    if (!o){ removeFork(s.key); return; }
    var A = s.__win || FULL, T = forkTokens(), i;
    forkSet(g.node, 'cx', f1(o.J.x)); forkSet(g.node, 'cy', f1(o.J.y));
    forkSet(g.node, 'r', f1(T.node));            // 岔口点的尺寸从令牌来，不在建镜时写死
    /* 选中档：只在变了时切一次（与 LIM_S 同一件事）。整张一次切，逐支 diff 反而
       会让"换了一条路"读成"一支熄一支亮两拍"。 */
    if (FORK_S[s.key] !== s.at){
      FORK_S[s.key] = s.at;
      for (i = 0; i < g.arms.length; i++){
        if (i === s.at) g.arms[i].root.classList.add('pick');
        else g.arms[i].root.classList.remove('pick');
      }
    }
    for (i = 0; i < o.arms.length; i++){
      var a = o.arms[i], q = g.arms[i];
      forkSet(q.a, 'x1', f1(o.J.x)); forkSet(q.a, 'y1', f1(o.J.y));
      forkSet(q.a, 'x2', f1(a.end.x)); forkSet(q.a, 'y2', f1(a.end.y));
      var hd = forkHeadD(a.tip, a.ux, a.uy, o.head);
      if (q.dv !== hd){ q.h.setAttribute('d', hd); q.dv = hd; }
      var lt = s.lab[i];
      if (q.lt !== lt){
        q.lab.textContent = lt; q.lt = lt;
        q.lw = lt && q.lab.getComputedTextLength ? q.lab.getComputedTextLength() : 0;
      }
      if (!lt) continue;
      /* 法向：垂直于这一支，挑"离线心"那一侧。两支几乎重叠时法向也分得开两侧。 */
      var px = -a.uy, py = a.ux;
      var ox = a.mid.x - o.c.x, oy = a.mid.y - o.c.y;
      if (px * ox + py * oy < 0){ px = -px; py = -py; }
      var lx = a.mid.x + px * (o.pad + T.fs * .55);
      var ly = a.mid.y + py * (o.pad + T.fs * .55) + T.fs * .35;
      var w2 = (q.lw || 0) / 2;
      if (A[2] > w2 * 2 + 4) lx = Math.max(A[0] + w2 + 2, Math.min(A[0] + A[2] - w2 - 2, lx));
      ly = Math.max(A[1] + T.fs, Math.min(A[1] + A[3] - 3, ly));
      forkSet(q.lab, 'x', f1(lx)); forkSet(q.lab, 'y', f1(ly));
    }
    /* 条数读数：`n 条 · →第 k 条` / `n 条 · 未选`。放在岔口背面。 */
    if (!s.num){
      if (!g.hid){ g.hid = true; g.root.classList.add('norep'); }
      return;
    }
    if (g.hid){ g.hid = false; g.root.classList.remove('norep'); g.rw = 0; }  // 请回来之后重量一次
    var rt = s.n + ' 条 · ' + (s.at >= 0 ? '→第 ' + (s.at + 1) + ' 条' : '未选');
    if (g.rt !== rt){
      g.rep.textContent = rt; g.rt = rt;
      g.rw = g.rep.getComputedTextLength ? g.rep.getComputedTextLength() : 0;
    }
    var bx = o.J.x - o.c.x, by = o.J.y - o.c.y;
    var L = Math.sqrt(bx * bx + by * by) || 1;
    /* 岔口的**背面正对着出发件自己**：岔口点就在那只盒的边上，照旧往回退几步会扎进
       盒里、压在出发件的正文上（目测时读数与顶栏的 `< 0` 叠成一片）。方向不变，
       落点改成推到**出发件沿背面那一侧的盒沿之外**：读数读作"从这个件出发有几条路"，
       而不是"盖在这个件上的一行字"。 */
    bx /= L; by /= L;
    var sx = o.fb.x + o.fb.w / 2, sy = o.fb.y + o.fb.h / 2;
    var tx = Math.abs(bx) > .01 ? (o.fb.w / 2) / Math.abs(bx) : Infinity;
    var ty = Math.abs(by) > .01 ? (o.fb.h / 2) / Math.abs(by) : Infinity;
    var bd = Math.min(tx, ty) + T.pad + T.fs * .55;      // 盒沿 + 净空 + 半个字高
    var rx = sx + bx * bd;
    var ry = sy + by * bd + T.fs * .35;
    var w = g.rw || 0;
    if (w && A[2] > w + 4) rx = Math.max(A[0] + w / 2 + 2, Math.min(A[0] + A[2] - w / 2 - 2, rx));
    else if (A[2] <= w + 4) rx = A[0] + A[2] / 2;
    ry = Math.max(A[1] + T.fs, Math.min(A[1] + A[3] - 3, ry));
    forkSet(g.rep, 'x', f1(rx)); forkSet(g.rep, 'y', f1(ry));
  }

  /** 排这一句的扇面（layoutLimits 之后、camSet 之前，与其余 layout 同批）。
   *  两件事：收孤儿（岔口或任一去向被 sweep() 摘走 → 整张摘、连选中档一起清）、
   *  每步现画一次（这一句的取景窗成了条数读数的安全区）。 */
  function layoutForks(stepId, index){
    var live = {}, k, g;
    var win = (CAM[stepId] || [])[index] || FULL;
    for (k in FORK_G){
      g = FORK_G[k];
      var dead = !g.s || !g.s.from.isConnected;
      if (!dead) for (var i = 0; i < g.s.to.length; i++) if (!g.s.to[i].isConnected) dead = true;
      if (dead) removeFork(k);                    // 不登记即摘（无跨步账本）
    }
    FORK.forEach(function(s){ live[s.key] = 1; s.__win = win; forkWrite(s); });
    for (k in FORK_G) if (!live[k]) removeFork(k);
  }

  /** 逐拍（与 limitTock 同批）。**这一族不吃时间**：岔口、支、箭头、短签全是
   *  "from 盒 × 各 to 盒 × at"的现量函数，没有起点、没有补间。它每拍重算的理由只有
   *  一个——对象还在入场、还在挪位（世界层逐句对账、量条还在长），扇面要跟着落位，
   *  而不是钉在换句那一瞬的旧盒上。见旗（导出 / 减动效 / 擦洗）不需要另写兜底：
   *  几何本来就是现量的，选中档由当步 `at` 声明，落的就是"清单摆着、走的是这条"。 */
  function forkTock(){
    for (var i = 0; i < FORK.length; i++) forkWrite(FORK[i]);
  }

  /** 一条注记的全部几何。文字宽度用**探针**量（detached text 挂进同一组、量完就摘）：
   *  药丸宽必须一次写对——先落占位再改宽会让 .nt 把框从占位宽补向真宽，而字已经是
   *  全宽，肉眼看见的是"字从胶囊里挤出来"（§3.4.3 (2) 占位框那条的同一课）。 */
  function layoutCallout(layer, c, win){
    function f(v){ return +v.toFixed(1); }
    var ref = el(c.to);
    if (!ref) return null;
    var u = boxIn(ref, el('cam'));
    if (!u) return null;                       // 量不到：宁可不注（与 spotOn 同口径）
    var o = c.opt || {}, side = o.side || 'r', col = o.col || '#f5a623';
    var fs = scaleFontSize('text', 12), key = 'co-' + c.key;
    // 探针直接挂进图层、量完就摘：**标签组要带着终值 transform 一次入树**。
    // 先建空组再补 transform 会让 .nt 把它从 (0,0) 补向目标——签在淡入前先横跨
    // 半个画布（实测 250ms 时 x 还在 475），且与 calloutLand 的反向缩回叠成两段
    // 互相打架的位移。量宽只要求字体档一致，不需要先进标签组。
    var probe = document.createElementNS(NS, 'text');
    probe.setAttribute('font-size', fs);
    probe.setAttribute('font-weight', '600');
    probe.textContent = c.s;
    layer.appendChild(probe);
    var tw = probe.getComputedTextLength ? probe.getComputedTextLength() : 0;
    layer.removeChild(probe);
    if (!tw) return null;                      // 字体没就绪也宁可不注，不画一个塌盒
    var w = tw + 18, h = fs + 12;
    // 圆点落在被注盒的边上（再向外 2），签摆在该侧外头；r/l 那一档上抬一个签高。
    var dx, dy, outX = 0, outY = 0;
    if (side === 'l'){ dx = u.x - 2; dy = u.y + u.h / 2; outX = -1; }
    else if (side === 't'){ dx = u.x + u.w / 2; dy = u.y - 2; outY = -1; }
    else if (side === 'b'){ dx = u.x + u.w / 2; dy = u.y + u.h + 2; outY = 1; }
    else { dx = u.x + u.w + 2; dy = u.y + u.h / 2; outX = 1; }
    var cx, cy;
    if (side === 'l'){ cx = dx - (16 + w / 2); cy = dy - (h / 2 + 10); }
    else if (side === 't'){ cx = dx; cy = dy - (12 + h / 2); }
    else if (side === 'b'){ cx = dx; cy = dy + (12 + h / 2); }
    else { cx = dx + (16 + w / 2); cy = dy - (h / 2 + 10); }
    // 安全区 = 这一步的取景窗内收 6：推近的镜头里注记也要整块看得见。
    var pad = 6, x0 = win[0] + pad, y0 = win[1] + pad,
        x1 = win[0] + win[2] - pad, y1 = win[1] + win[3] - pad;
    if (w > x1 - x0 || h > y1 - y0) return null;      // 取景窗塞不下这条注记
    cx = Math.max(x0 + w / 2, Math.min(x1 - w / 2, cx));
    cy = Math.max(y0 + h / 2, Math.min(y1 - h / 2, cy));
    // 钳回之后若压住被注对象就整条不画：注记盖住证据比没有注记更糟。
    if (cx - w / 2 < u.x + u.w + 3 && cx + w / 2 > u.x - 3 &&
        cy - h / 2 < u.y + u.h + 3 && cy + h / 2 > u.y - 3) return null;
    // 签的落点方位（反向缩回：从所指处退回自己的位置）。与 transform 一起在**新建
    // 那一次**就写全，见上面探针注释。
    var lx = side === 'l' ? 7 : side === 'r' ? -7 : 0,
        ly = side === 't' ? 7 : side === 'b' ? -7 : 4;
    var g = put(layer, 'g', key, {class:'callout' + (o.gone ? ' gone' : '')});
    var lab = put(g, 'g', key + '-lab', {class:'callout-lab',
      transform:'translate(' + f(cx) + ',' + f(cy) + ')',
      style:'--c-dx:' + lx + 'px;--c-dy:' + ly + 'px'});
    var r = put(lab, 'rect', key + '-r', {x:-w / 2, y:-h / 2, width:w, height:h, rx:h / 2,
      stroke:col, 'stroke-width':1});
    var t = txt(lab, key + '-t', {x:0, y:Math.round(fs * .36), 'text-anchor':'middle',
      'font-size':12, 'font-weight':'600', fill:col}, c.s);
    if (o.dec && t.dataset.decText !== c.s){ decodeArm(t, c.s); t.dataset.decText = c.s; }
    // 圆点 → 引线 → 签：DOM 顺序就是叠放顺序，后画的签压住线尾。
    put(g, 'circle', key + '-dot', {class:'in dot', cx:f(dx), cy:f(dy), r:3.5, fill:col});
    // 引线：沿朝向先直行 10，再斜到签的边缘（离签 3，让药丸把线头盖干净）。
    var sx = dx + outX * 10, sy = dy + outY * 10, ex, ey;
    if (side === 'l'){ ex = cx + w / 2 + 3; ey = cy; }
    else if (side === 't'){ ex = cx; ey = cy + h / 2 + 3; }
    else if (side === 'b'){ ex = cx; ey = cy - h / 2 - 3; }
    else { ex = cx - w / 2 - 3; ey = cy; }
    put(g, 'path', key + '-lead', {class:'draw lead', pathLength:1, stroke:col,
      style:'--delay:calc(var(--dur-in) * .22)',
      d:'M' + f(dx) + ' ' + f(dy) + 'L' + f(sx) + ' ' + f(sy) + 'L' + f(ex) + ' ' + f(ey)});
    return g;
  }
  /** 词拍（0.39.0）：给一件**本步在场**的图元登记一句旁白里的词——念到这个词时，
   *  它会被四角括号框一下，并且一直留到本步结束（标记累积）。
   *  只登记「框谁 + 哪个词 + 第几次出现」：几何由 cueGeom() 在**词窗打开的那一拍**
   *  从 boxIn() 现量（并在 --cue-settle 内跟踪入场补间）；相位由 cueWrite() 按 audio
   *  时钟现算（词窗从句子自己的 text / start / duration 按字数 + 标点权重推出来，
   *  见 cueAt）。作者不填时间、不填坐标——时间归句子，几何归目标，两边都没有第二个数。
   *  `word` 是**检索键**，不是画面文字：它不上屏、不写进任何节点，也不进
   *  check_gates.py 的双字幕比对（那是 txt / badge / callout 的防线）。它必须与
   *  这一句旁白的原字面完全一致（字幕的唯一来源），改讲稿后 cue 不会自己跟着改。
   *  `opt.nth` 取第几次出现（1 起，默认 1）：同一句里"1"出现两次时用它指后一个。 */
  function cue(key, word, opt){
    if (!key || !word) return;
    var nth = opt && opt.nth ? Math.max(1, Math.floor(opt.nth)) : 1;
    CUE.push({key:key, word:String(word), nth:nth});
  }

  /** 把本步登记的词拍排进 #cues：在 tick() 的 worldFor() 之后、camSet() 之前调用
   *  （与 drawCallouts 同一调用点——renderer 跑在主角落位之前，那时树的形状还没齐）。
   *  **只建空括号，不量几何**：词还没念到，量出来的可能是占位框（见 cueGeom 的
   *  实测注记）；d 由 cueWrite() 在词窗打开时补。
   *  **整层重建**而不是 sweep：括号的 key 是「cue:<目标 key>」，同一目标在不同步
   *  可以重复点名；复用节点会把上一次的 .on 留在新一步上，而标记必须随步清零
   *  （(scene, step) 纯函数）。这一层没有退场动画：换步本来就是一次切。 */
  function drawCues(){
    var layer = el('cues');
    if (!layer) return;
    clear(layer);
    CUE.forEach(function(c){
      var node = REG[c.key];
      if (!node || !node.isConnected) return;        // 不在本步台上：静默跳过
      var g = document.createElementNS(NS, 'g');
      g.setAttribute('class', 'cue');
      g.dataset.key = 'cue:' + c.key;
      var p = document.createElementNS(NS, 'path');
      // .crisp 逐图元挂（vector-effect 不继承）：镜头推到 1.8 时括号仍是 1.5px
      // 的注记，不跟着内容变粗——与 .scope / .brace 同一口径。
      p.setAttribute('class', 'cue-b crisp');
      g.appendChild(p);
      layer.appendChild(g);
      c.node = g;
      c.path = p;
      c.measT = -1;                                  // 还没量过：词窗打开时补第一道
      c.on = false;                                  // 新节点无 .on：下一拍由 cueWrite 补
    });
  }
  /** 给一条 cue 现量括号并写进它的 path。四条口径：
     ① **量的是"此刻"**：boxIn 走 transform 属性、不走 getBBox 的补间值之外的东西，
        但目标自己的 width / x 若正在 .nt 里补间，getBBox 读到的就是补间中的当前值——
        这不是缺陷，正是"括号跟着东西一起长"的来源；窗口由 --cue-settle 封口；
     ② **目标不在 / 量不到就跳过**：整条不画（与 callout 同口径），不给一个假框；
     ③ **d 没变就不写**：跟踪窗口里目标常常已经静止，同值重写会让每帧都脏一次布局；
     ④ **臂长按短边收**：40 单位高的字符格也留得下四个角；下限 5、上限 --cue-arm。 */
  function cueGeom(c){
    var node = REG[c.key];
    if (!node || !node.isConnected || !c.path) return;
    var b = boxIn(node, el('cam'));
    if (!b) return;
    var T = cueTokens();
    var arm = Math.max(5, Math.min(T.arm, b.w * .3, b.h * .3));
    var x0 = b.x - T.pad, y0 = b.y - T.pad,
        x1 = b.x + b.w + T.pad, y1 = b.y + b.h + T.pad;
    function f(v){ return +v.toFixed(1); }
    var d = 'M' + f(x0 + arm) + ' ' + f(y0) + 'H' + f(x0) + 'V' + f(y0 + arm) +
            'M' + f(x1 - arm) + ' ' + f(y0) + 'H' + f(x1) + 'V' + f(y0 + arm) +
            'M' + f(x0) + ' ' + f(y1 - arm) + 'V' + f(y1) + 'H' + f(x0 + arm) +
            'M' + f(x1 - arm) + ' ' + f(y1) + 'H' + f(x1) + 'V' + f(y1 - arm);
    if (c.path.getAttribute('d') !== d) c.path.setAttribute('d', d);
    c.measT = audio.currentTime;
  }
  /** 对照窗（0.40.0）：把同一位置上的"改前 / 改后"两版叠进一扇窗，接缝扫到
   *  哪儿，哪一版占到哪儿。before / after 是两个**同构同框**的节点（通常是同一
   *  父容器下、坐标完全相同的两个 <g>）；opt：
   *    · at     0..1 接缝读数。0 = 改前全显，1 = 改后全显（默认 0）
   *    · labels [改前标签, 改后标签]，不传 / 传 null 就不画（交给行题或旁白）
   *    · dim    true 时整扇窗走弱化档（与行/卡的 data-dim 同档）
   *    · pad    取景框相对两版并集的外扩（默认 6 世界单位）
   *  两版必须由 renderer **每步都重挂**（与 DECODE / CALL / CUE 同一纪律）；
   *  compare() 只登记，drawCompares() 在世界层落位后现量、裁切、画框。 */
  function compare(key, before, after, opt){ CMP.push({key:key, a:before, b:after, opt:opt || {}}); }

  /** 接缝走完这一趟用多久：只从令牌读（--dur-cmp-min / --dur-cmp-full）。
      位移越大走得越久，但短推也不低于地板、长扫不超过封顶；擦洗 / 导出截图 /
      reduced-motion 一律 0s——手指到哪儿接缝到哪儿，成片与静止帧都落终值。 */
  function cmpDur(delta){
    var cs = getComputedStyle(document.documentElement);
    var lo = parseFloat(cs.getPropertyValue('--dur-cmp-min'));
    var hi = parseFloat(cs.getPropertyValue('--dur-cmp-full'));
    if (!isFinite(lo) || lo < 0) lo = .45;
    if (!isFinite(hi) || hi < lo) hi = 1;
    if (scrubbing || window.__coursewareShotMode || mqReduce.matches) return 0;
    return Math.max(lo, Math.min(hi, Math.abs(delta) * hi));
  }

  /** 摘掉一版身上的对照标记：data-cmp 一没，clip-path 与它那条 transition 就
      一起失效，节点回到普通图元；顺手把钉 reference box 的隐藏矩形也收掉
      （它的 REG 条目必须一起删，否则同名重建会拿到一个不在树上的旧节点）。 */
  function releaseCompare(node, id){
    if (!node) return;
    node.removeAttribute('data-cmp');
    if (node.style){
      node.style.removeProperty('--cmp-r');
      node.style.removeProperty('--dur-cmp');
    }
    var hk = 'cmp-box:' + id, h = REG[hk];
    if (h){ if (h.parentNode) h.parentNode.removeChild(h); delete REG[hk]; }
  }

  /** 把本步登记的对照窗全部排一遍：在 tick() 的 worldFor() 之后、camSet() 之前
      调用（与 drawCallouts / drawCues 同一调用点）。几何在 #cam 的局部坐标里量，
      之后 camSet 动的是整层 #cam——框和内容一起被镜头带走，不会量一次镜头、再
      吃一次镜头。 */
  function drawCompares(){
    var layer = el('cmp');
    if (!layer) return;
    var live = {}, drawn = {}, i, c, A, B, ia, ib, ba, bb, hkA, hkB, ha, hb, wa, wb, win, r;
    function f(v){ return +v.toFixed(1); }
    for (i = 0; i < CMP.length; i++){
      c = CMP[i]; A = host(c.a); B = host(c.b);
      if (!A || !B || !A.isConnected || !B.isConnected) continue;
      ia = A.id || (A.dataset && A.dataset.key);
      ib = B.id || (B.dataset && B.dataset.key);
      if (!ia || !ib) continue;
      /* ① 先摘掉上一步钉进来的隐藏矩形再量：矩形本身也参与 getBBox，不摘就会
         把窗越撑越大（每一步都按"上一扇更大的窗"再外扩一圈）。 */
      hkA = 'cmp-box:' + ia; hkB = 'cmp-box:' + ib;
      ha = REG[hkA]; hb = REG[hkB];
      if (ha && ha.parentNode) ha.parentNode.removeChild(ha);
      if (hb && hb.parentNode) hb.parentNode.removeChild(hb);
      ba = A.getBBox(); bb = B.getBBox();
      if (!(ba.width > 0 && ba.height > 0) || !(bb.width > 0 && bb.height > 0)) continue;
      var pad = c.opt.pad === undefined ? 6 : Math.max(0, +c.opt.pad || 0);
      var x0 = Math.min(ba.x, bb.x), y0 = Math.min(ba.y, bb.y);
      var x1 = Math.max(ba.x + ba.width, bb.x + bb.width);
      var y1 = Math.max(ba.y + ba.height, bb.y + bb.height);
      var wx = x0 - pad, wy = y0 - pad, ww = (x1 - x0) + pad * 2, wh = (y1 - y0) + pad * 2;
      /* ② 隐藏矩形 = 两版共同的 reference box。clip-path 的百分比以各自节点的
         bbox 为分母；内容少的那版若不垫这枚矩形，接缝就会和另一版对不上。 */
      var boxA = {'data-helper':'cmp', class:'', x:f(wx), y:f(wy),
                  width:f(ww), height:f(wh), fill:'none'};
      var boxB = {'data-helper':'cmp', class:'', x:f(wx), y:f(wy),
                  width:f(ww), height:f(wh), fill:'none'};
      ha = put(A, 'rect', hkA, boxA); if (!ha.parentNode) A.appendChild(ha);
      hb = put(B, 'rect', hkB, boxB); if (!hb.parentNode) B.appendChild(hb);
      wa = boxIn(ha, el('cam')); wb = boxIn(hb, el('cam'));
      if (!wa || !wb) continue;
      win = {x:Math.min(wa.x, wb.x), y:Math.min(wa.y, wb.y),
             w:Math.max(wa.x + wa.w, wb.x + wb.w) - Math.min(wa.x, wb.x),
             h:Math.max(wa.y + wa.h, wb.y + wb.h) - Math.min(wa.y, wb.y)};
      /* ③ 接缝读数与时长：首次建档 / 节点刚换上 data-cmp 时直接落终值——
         对照窗不是"从无到有"的入场，第一帧就该是这一步的读数。 */
      r = c.opt.at === undefined ? 0 : +c.opt.at;
      if (!isFinite(r)) r = 0;
      r = Math.max(0, Math.min(1, r));
      var prev = CMP_R[c.key];
      var dur = prev === undefined ? 0 : cmpDur(r - prev);
      if (!A.getAttribute('data-cmp') || !B.getAttribute('data-cmp')) dur = 0;
      CMP_R[c.key] = r;
      drawn[c.key] = 1;
      var ds = dur.toFixed(3) + 's', rp = (r * 100).toFixed(2) + '%';
      [[A, ia, 'a'], [B, ib, 'b']].forEach(function(pair){
        var n = pair[0], nid = pair[1], side = pair[2];
        if (n.getAttribute('data-cmp') !== side) n.setAttribute('data-cmp', side);
        n.style.setProperty('--dur-cmp', ds);
        n.style.setProperty('--cmp-r', rp);
        live[nid] = {node:n, id:nid};
      });
      /* ④ 框：四角只画 L、不封口（封口读成卡片，L 角读成同一扇观察窗）；
         接缝是一条 1.5px 的琥珀线 + 40 单位渐变扫描光，像一枚正在读过去的头。 */
      var g = put(layer, 'g', 'cmp-' + c.key, {class:'cmp-frame',
        opacity: c.opt.dim ? .45 : 1, style:'--dur-cmp:' + ds});
      var arm = Math.max(4, Math.min(18, win.w * .07, win.h * .3));
      var d = 'M' + f(win.x) + ' ' + f(win.y + arm) + 'V' + f(win.y) + 'H' + f(win.x + arm) +
              'M' + f(win.x + win.w - arm) + ' ' + f(win.y) + 'H' + f(win.x + win.w) +
              'V' + f(win.y + arm) +
              'M' + f(win.x) + ' ' + f(win.y + win.h - arm) + 'V' + f(win.y + win.h) +
              'H' + f(win.x + arm) +
              'M' + f(win.x + win.w - arm) + ' ' + f(win.y + win.h) +
              'H' + f(win.x + win.w) + 'V' + f(win.y + win.h - arm);
      put(g, 'path', 'cmp-' + c.key + '-corner', {class:'cmp-corner crisp', d:d});
      var seam = win.x + win.w * r;
      var sg = put(g, 'g', 'cmp-' + c.key + '-seam', {class:'cmp-seam',
        transform:'translate(' + f(seam) + ',0)'});
      put(sg, 'rect', 'cmp-' + c.key + '-wash', {class:'cmp-wash', x:-20, y:f(win.y),
        width:40, height:f(win.h), fill:'url(#cmpWash)'});
      put(sg, 'line', 'cmp-' + c.key + '-line', {class:'cmp-line crisp',
        x1:0, y1:f(win.y - 4), x2:0, y2:f(win.y + win.h + 4)});
      /* 标签各归自己那一侧：改前（A）在右、改后（B）在左——B 从左边长出来。
         **标签自己也走同一套互补裁切**：每组里垫一枚窗大小的隐藏矩形，再挂
         data-cmp="a"/"b" 与同一个 --cmp-r，于是"这一侧的标签"和"这一侧的内容"
         永远在同一条接缝上收放——不靠 opacity 猜时机，也不会在扫描开始就先把
         改前那枚签淡掉。labels 不传 / 传 null 就不画（窄屏的 s2 用行题）。 */
      var labs = c.opt.labels;
      if (labs && labs.length >= 2){
        [['a', 'la', labs[0], win.x + win.w, 'end'],
         ['b', 'lb', labs[1], win.x, 'start']].forEach(function(q){
          var lk = 'cmp-' + c.key + '-' + q[1], freshL = !REG[lk];
          var lg = put(g, 'g', lk,
            {'data-cmp':q[0], class:'cmp-lab-wrap', style:'--dur-cmp:' + ds});
          put(lg, 'rect', 'cmp-' + c.key + '-' + q[1] + '-box',
            {'data-helper':'cmp', class:'', x:f(win.x), y:f(win.y),
             width:f(win.w), height:f(win.h), fill:'none'});
          put(lg, 'text', 'cmp-' + c.key + '-' + q[1] + '-t',
            {class:'cmp-lab' + (q[0] === 'b' ? ' after' : ''), x:f(q[3]), y:f(win.y - 8),
             'text-anchor':q[4], 'font-size':12}, q[2]);
          // 首次建档且这一趟本来就要补间：先让 0% 的初值落成一次计算样式，
          // 再写目标读数——否则"新建 + 直接写 100%"会被浏览器并成一帧，标签瞬移。
          if (freshL && dur > 0) void lg.getBoundingClientRect();
          lg.style.setProperty('--cmp-r', rp);
        });
      }
    }
    // 本步没再登记的节点：摘标记（两版若都还留在台上，作者负责只留一版）
    for (var k in CMP_MARK)
      if (!live[k]) releaseCompare(CMP_MARK[k].node, CMP_MARK[k].id);
    CMP_MARK = live;
    // 读数账本只保留还在场的对照：下次重新登记时从终值起步，而不是从旧读数补
    for (var k2 in CMP_R) if (!drawn[k2]) delete CMP_R[k2];
    sweep(layer);
  }

  /* 拆解视图的令牌缓存（0.41.0）：与 cueTokens / rollDur 同一口径——设计期参数，
     读一次就缓存；改名删名 parseFloat 得 NaN，落回默认档（.05s / .18s）。 */
  var EX_T = null;
  function exTokens(){
    if (EX_T) return EX_T;
    var cs = getComputedStyle(document.documentElement);
    function n(name, dflt){
      var v = parseFloat(cs.getPropertyValue(name));
      return isFinite(v) ? v : dflt;
    }
    EX_T = {stagger:n('--ex-stagger', .05), cap:n('--ex-cap', .18)};
    return EX_T;
  }
  /** 拆解视图（0.41.0）：把一组纯包装节点沿一条轴分开，露出整体由哪几件组成。
   *  parts 是节点或节点 id 的数组，**必须同父、都是纯包装 <g>**；opt：
   *    · base     **必填**：[[x,y], …] 与 parts 一一对应的装配位（父坐标系）。
   *               这一层的 transform 由 drawExplodes() 独占，renderer 不要再写；
   *               原因见 CSS .explode 边界②——先写装配位再改延迟，CSS 会拿旧延迟
   *               起跑，错峰方向整个反掉（实测）。给坐标、不给 transform，是这条
   *               原语唯一跟别的位移图元不同的接线口径。
   *    · gap      最外件的位移量（默认 24 世界单位）。其余件按"离锚点多远"归一递减：
   *               最外件走满 gap，越靠内走得越少；对称件向两侧各走 gap，所以它们
   *               之间的间距实际增加 2 × gap；
   *    · amount   0..1 开合量。0 = 装配位，1 = 完全拆开（默认 1）。它可跨步变化，
   *               drawExplodes() 用 CSS 补间从上一拍滑到这一拍；
   *    · axis     'x'（默认）或 'y'；
   *    · anchor   某个 part 的序号：它不动，其余相对它展开。不传则取所有件包围盒
   *               中心的均值；
   *    · offsets  自定义每件的 [dx,dy]（同样乘 amount），给了就不走 axis + gap。
   *  与 compare() 同一纪律：explode() 只登记，几何在 drawExplodes() 里现算。
   *  它**不画**任何东西，也不改透明度——"打开"这件事只由 transform 说。 */
  function explode(key, parts, opt){ EXPLODE.push({key:key, parts:parts, opt:opt || {}}); }

  /** 把本步登记的拆解组全部排一遍：在 tick() 的 worldFor() 之后、drawCallouts()
      之前调用。四件事顺序不能换：
        ① 从 opt.base 取**本步装配位**，再用 getBBox() 的局部盒心补上尺寸差
           （text-anchor 不同，盒心 ≠ 坐标点）；
        ② 先落 --ex-delay / --dur-ex，再写目标 transform。CSS transition 是在
           属性写下的那一刻用当时延迟起跑的，所以**只能写一次**：若先写装配位、
           再改延迟，这一趟记住的是上一步的延迟（实测合拢错峰反转）；
        ③ 首次建档且这一拍真有位移：先把 --dur-ex 压成 0s、写装配位并强制一次
           布局，再恢复时长、写目标——不这样做，新建 + 直接位移会被并成一帧，
