        ④ 错峰按离锚点的归一距离：拆开时外圈先走、内圈后走；合拢时反过来（内圈
           先回、外圈最后落定）。方向只看 amount 相对上一拍的增减，不看步号——
           擦洗往回拖时，动画方向也跟着回。
      擦洗 / 导出截图 / reduced-motion 一律把 --dur-ex 压成 0s、延迟归零：手指到
      哪儿、定格在哪一帧，拆解就停在那一拍的开合量上，不留半程。 */
  function drawExplodes(){
    var live = {}, drawn = {}, i, j, k;
    var instant = scrubbing || window.__coursewareShotMode || mqReduce.matches;
    function f(v){ return +v.toFixed(1); }
    for (i = 0; i < EXPLODE.length; i++){
      var reg = EXPLODE[i], parts = reg.parts || [], opt = reg.opt || {}, base = opt.base || [];
      var P = [], ok = true;
      for (j = 0; j < parts.length; j++){
        var n = host(parts[j]);
        if (!n || !n.isConnected || typeof n.getBBox !== 'function'){ ok = false; break; }
        var id = n.id || (n.dataset && n.dataset.key);
        var bp = base[j];
        if (!id || !bp){ ok = false; break; }
        var bx = bp.length !== undefined ? +bp[0] : +bp.x;
        var by = bp.length !== undefined ? +bp[1] : +bp.y;
        if (!isFinite(bx) || !isFinite(by)){ ok = false; break; }
        var bb = n.getBBox();
        P.push({n:n, id:id, bx:bx, by:by,
                cx:bx + bb.x + bb.width / 2, cy:by + bb.y + bb.height / 2});
      }
      if (!ok || !P.length) continue;
      // 锚点：默认取盒心均值；opt.anchor 指定某一件时，那一件原地不动。
      var ax = 0, ay = 0;
      for (j = 0; j < P.length; j++){ ax += P[j].cx; ay += P[j].cy; }
      ax /= P.length; ay /= P.length;
      if (typeof opt.anchor === 'number' && P[opt.anchor]){
        ax = P[opt.anchor].cx; ay = P[opt.anchor].cy;
      }
      var amount = opt.amount === undefined ? 1 : +opt.amount;
      if (!isFinite(amount)) amount = 1;
      amount = Math.max(0, Math.min(1, amount));
      var gap = opt.gap === undefined ? 24 : +opt.gap;
      if (!isFinite(gap)) gap = 24;
      gap = Math.max(0, gap);
      var axis = opt.axis === 'y' ? 'y' : 'x';
      var custom = opt.offsets;
      // 方向与归一距离：只用轴向投影，横向偏移不参与错峰（那是另一条轴的事）。
      var proj = [], dist = [], maxA = 0;
      for (j = 0; j < P.length; j++){
        var pj = axis === 'y' ? P[j].cy - ay : P[j].cx - ax;
        proj.push(pj);
        var a = Math.abs(pj);
        dist.push(a);
        if (a > maxA) maxA = a;
      }
      for (j = 0; j < dist.length; j++) dist[j] = maxA ? dist[j] / maxA : 0;
      var prev = EX_R[reg.key];
      var reverse = prev !== undefined && amount < prev - .0001;
      var T = exTokens();
      var spread = Math.min(T.cap, T.stagger * Math.max(0, P.length - 1));
      for (j = 0; j < P.length; j++){
        var p = P[j], ox, oy;
        if (custom && custom[j] !== undefined && custom[j] !== null){
          var c = custom[j], cx0 = 0, cy0 = 0;
          if (typeof c === 'number'){ if (axis === 'y') cy0 = c; else cx0 = c; }
          else if (c.length !== undefined){ cx0 = +c[0] || 0; cy0 = +c[1] || 0; }
          else { cx0 = +c.x || 0; cy0 = +c.y || 0; }
          ox = cx0 * amount; oy = cy0 * amount;
        } else if (maxA){
          var f0 = proj[j] / maxA * gap * amount;
          ox = axis === 'y' ? 0 : f0;
          oy = axis === 'y' ? f0 : 0;
        } else { ox = 0; oy = 0; }             // 单件 / 全部重合：没有"分开"可演
        var delay = (reverse ? dist[j] : 1 - dist[j]) * spread;
        var ds = delay.toFixed(3) + 's';
        var baseT = 'translate(' + f(p.bx) + ',' + f(p.by) + ')';
        var targetT = 'translate(' + f(p.bx + ox) + ',' + f(p.by + oy) + ')';
        var fresh = !EX_MARK[p.id];
        var moved = Math.abs(ox) > .01 || Math.abs(oy) > .01;
        if (instant){
          p.n.style.setProperty('--dur-ex', '0s');
          p.n.style.setProperty('--ex-delay', '0s');
          if (p.n.getAttribute('transform') !== targetT) p.n.setAttribute('transform', targetT);
        } else if (fresh && moved){
          /* 首次建档：先把时长与延迟都压成 0、写装配位并强制布局，让这一帧真的
             落成计算样式；随后恢复时长、写这一拍的目标与错峰延迟。没有 flush
             的话，新建 + 直接改 transform 会被并成一帧，拆解看起来就是瞬移。 */
          p.n.style.setProperty('--dur-ex', '0s');
          p.n.style.setProperty('--ex-delay', '0s');
          p.n.setAttribute('transform', baseT);
          void p.n.getBoundingClientRect();
          p.n.style.removeProperty('--dur-ex');
          p.n.style.setProperty('--ex-delay', ds);
          if (p.n.getAttribute('transform') !== targetT) p.n.setAttribute('transform', targetT);
        } else {
          p.n.style.removeProperty('--dur-ex');
          p.n.style.setProperty('--ex-delay', ds);
          if (p.n.getAttribute('transform') !== targetT) p.n.setAttribute('transform', targetT);
        }
        live[p.id] = {node:p.n, bx:p.bx, by:p.by, key:reg.key};
      }
      drawn[reg.key] = 1;
      EX_R[reg.key] = amount;
    }
    // 本步没再登记的件：送回它上一次的装配位（不拆成 0,0——那会把它从版面上搬走）。
    // 已经被 sweep 收掉的节点不必救；延迟归零，下一次重建从 0s 起。
    for (k in EX_MARK) if (!live[k]){
      var old = EX_MARK[k], on = old.node;
      if (on && on.isConnected){
        if (on.style){
          if (instant) on.style.setProperty('--dur-ex', '0s');
          else on.style.removeProperty('--dur-ex');
          on.style.setProperty('--ex-delay', '0s');
        }
        var bt = 'translate(' + f(old.bx) + ',' + f(old.by) + ')';
        if (on.getAttribute('transform') !== bt) on.setAttribute('transform', bt);
      }
    }
    EX_MARK = live;
    // 开合量账本只保留还在场的组：下次重新登记时从终值起步，而不是从旧读数补
    for (k in EX_R) if (!drawn[k]) delete EX_R[k];
  }

  /** 撤下本步没写过的图元。递归清整棵子树：某一行这一幕还在，但行里"只有这一步
   *  才有"的那个小挂件不再被引用时，也必须跟着掉——只扫容器一层会把它留在台上。
   *  没有退场动画：要淡出就把 opacity 写成 0 让它再停一步，下一步不再引用它收尾。 */
  function sweep(parent){ prune(host(parent)); }
  function prune(node){
    Array.prototype.slice.call(node.children).forEach(function(n){
      // 对照窗钉 reference box 的隐藏矩形归 drawCompares 管：它随 A/B 存活，
      // 不能按 GEN 收——renderer 每步先跑，drawCompares 后跑，照常收就会在
      // 量窗前把它删掉（见 drawCompares ①）。
      if (n.dataset && n.dataset.helper === 'cmp') return;
      if (n.dataset && n.dataset.key !== undefined){
        if (n._g !== GEN){ retire(n); node.removeChild(n); return; }
      }
      prune(n);
    });
  }
  function retire(node){
    var kids = node.children ? Array.prototype.slice.call(node.children) : [];
    kids.forEach(retire);
    if (node.dataset && node.dataset.key) delete REG[node.dataset.key];
  }
  function fmt(t){ t = Math.max(0, t || 0);
    var m = Math.floor(t/60), s = Math.floor(t%60);
    return (m<10?'0':'')+m+':'+(s<10?'0':'')+s; }
  function sceneIndexOf(sid){
    for (var i=0;i<scenes.length;i++) if (scenes[i].step_id === sid) return i;
    return -1;
  }

  // ══ ① 当前句查找：全局秒 → {scene, index, sentence} ══════════════════
  function sentAt(t){
    for (var i=0;i<scenes.length;i++){
      var r = scenes[i].runtime;
      if (t < r.start || t >= r.end) continue;
      var ns = r.narration || [], k = -1;
      for (var j=0;j<ns.length;j++){
        if (t >= ns[j].start && t < ns[j].start + ns[j].duration){ k = j; break; }
      }
      return {scene: scenes[i], index: k, sceneIndex: i, sentence: k < 0 ? null : ns[k]};
    }
    return {scene: null, index: -1, sceneIndex: -1, sentence: null};
  }

  // ══ ② 舞台：世界谱（常驻实体）+ 相机（取景）+ 每幕的局部图层 ══════════
  // renderer 是**状态函数**：输入"这一幕的第几句"，输出该看到什么状态。
  // 它不计时、不排程、不补间——补间是 CSS 的事（见 CSS 的「舞台运动学」）。
  // 主循环每步做三件事：begin() 开新步 → RENDER[scene](step) → camSet() 落镜头。
  var CY = 232, MONO = 'ui-monospace,Consolas,monospace';
  var poseNow = 'off';           // 当前步的主角姿势，只给窄屏兜底取景判断"灯亮不亮"

  var STAGES = ['stA','stB','stC','stD','stE','stF','stG'];
  /** 换幕：亮着的那一幕留下，其余退场时**连方向 class 一起摘**。
     滞留的 swF/swB 会在下一次入镜时把旧动画重放一遍——正常播放时 sceneSlide
     自己也摘重挂，看不出问题；而截图模式（export_video 每帧一次冷启动）里
     sceneSlide 根本不跑，那一帧就停在半推半进的位移上。 */
  function only(keep){
    STAGES.forEach(function(id){
      if (id !== keep) el(id).classList.remove('swF', 'swB');
      show(id, id === keep);
    });
  }
  /** 换场方向（0.14.0）：给**这一步真正亮着的那一幕**挂位移，不遍历全表——
     只亮着一个，别的幕此刻是 opacity:0，给它们演一遍等于白跑一次动画。
     重触发口径与字幕翻句、章节翻场同款：摘掉 → 读一次几何 → 挂上。方向反过来
     时要先摘掉另一头的 class，否则上一节的位移方向会留在节点上。 */
  function sceneSlide(dir){
    var on = STAGES.filter(function(id){ return el(id).classList.contains('on'); });
    on.forEach(function(id){
      var n = el(id);
      n.classList.remove('swF', 'swB'); void n.getBoundingClientRect();
      n.classList.add(dir > 0 ? 'swF' : 'swB');
    });
  }

  // ── 世界谱：同一批实体跨幕活着，每一幕每一步它们在哪、什么样 ──────────
  // 段与段之间最贵的不是新画面，是"刚才那三个数去哪了"。写进这张表，观众就
  // 看得见主角被收上台、被推到边上、被搞乱、最后回到台上回答问题（POSE 给姿势，
  // WORLD 给哪一步用哪个姿势；不写的那一步沿用上一个姿势，即"不动"）。
  var HERO = ['10', '9', '1'];
  var POSE = {
    off:  {y:CY, xs:[300, 500, 700], k:1,   op:0,  quoted:false, tone:'plain',
           order:['10','9','1']},                     // 退到侧台：位置照常，只是灯灭
    bench:{y:320, xs:[214, 500, 786], k:.6, op:.4,  quoted:false, tone:'plain',
           order:['10','9','1']},                     // 开场：题目下方淡淡一排影子
    bay:  {y:CY, xs:[300, 500, 700], k:1,   op:1,  quoted:false, tone:'plain',
           order:['10','9','1']},
    // 姿势是**整步的快照**，段内不换姿势就不会在两句之间漂一下重心：
    // 旧范本里同一姿势覆盖两句时，位置仍从 step 推导，画面会自己跳。
    sorted:{y:CY, xs:[300, 500, 700], k:1,  op:1,  quoted:false, tone:'amber',
           order:['1','10','9']},
    shelf:{y:84, xs:[330, 500, 670], k:.46, op:.9, quoted:true,  tone:'amber',
           order:['1','10','9']},                     // 收上台当参照；84 让开各幕的抬头行
    messed:{y:300, xs:[366, 496, 626], k:.78, op:1, quoted:false, tone:'red',
           order:['9','1','10']},
    answer:{y:310, xs:[300, 500, 700], k:.9, op:1, quoted:true, tone:'amber',
           order:['1','10','9']}
  };
  var WORLD = {
    'opening': ['bench'],
    'seg-1':   ['bay', 'bay', 'sorted', 'shelf'],
    'seg-2':   ['shelf'],
    'seg-3':   ['shelf'],
    'seg-4':   ['off'],
    'seg-5':   ['off', 'off', 'off', 'off', 'messed', 'messed'],
    'seg-6':   ['off'],
    'closing': ['answer']
  };
  var TONE = {
    plain: {fill:'#e9ecf3', stroke:'#394052', box:'#1c212c'},
    amber: {fill:'#f5a623', stroke:'#f5a623', box:'rgba(245,166,35,.13)'},
    blue:  {fill:'#4d90f0', stroke:'#4d90f0', box:'#1c212c'},
    red:   {fill:'#ef4d4d', stroke:'#ef4d4d', box:'rgba(239,77,77,.10)'}
  };
  /** 把主角三张卡落到某个姿势上。只写目标状态：上台、退场、染色全是 CSS 补间。
     卡框宽度**从标签自己量**（0.15.0「生长」）：写死 96 / 74 的那套数字只算过
     不带引号的字形。quoted 姿势一加引号，实测 '10' 在桌面档（font-size 40）就是
     96.3——已经压过 96 那条边；小屏档由 put 把字号统一放大到 52，同一张卡字宽
     顶到 125.1，框还是 96，字整个糊到框外（'1' / '9' 同样溢出）。量出来的宽度写进
     呈现属性，配合 .nt 新增的 width / rx 补间，上台、退场、加引号都是**框跟着字
     长大**，不是瞬移；窄屏那套字号也因此不用再补第二套数字。
     量之前必须先让标签在树上（getBBox 要布局），所以框分两次写：
       · **建档那一步**先落一个够用的占位框——此时元素还没有"上一计算值"，
         transition 不成立，两次写等于一次落终态，不会闪；DOM 顺序上框在字之前，
         字才压得住底色；
       · **复用的节点**绝不能再写那一遍占位宽：占位值会被当成一次真实状态变化，
         画面先往 96 补间、再掉头补向终态——那是肉眼可见的抖动，不是生长。
     窄屏字号由 put 统一放大，量出来的宽度自然跟着走，不补第二套口径。 */
  function poseWorld(name, fired){
    var p = POSE[name];
    if (!p) return;
    var prevPose = POSE[poseNow];        // 换位行程的基准：上一步姿势（poseNow 下一行才覆盖）
    poseNow = name;
    /* 预备后蓄（0.23.0）：只有**上架子**那一跳有——世界 y 从 232 直冲 84 是 148
       单位的向上位移，直接走读作"被系统搬走了"，先沉 --wind-back 单位再起来才读作
       "它自己跳上去的"。四条口径：
         · 蓄力的那一层在**主角之外**（`w-<v>-ant` → `w-<v>`）：独立 `translate`
           走的是父层坐标系（实测：在 shelf 那一格给主角自己写 `translate:0 9px`，
           屏幕动 13.997 设备px，与它 `scale(.46)` 无关），所以这一层买到的不是
           "躲开缩放"，而是**不占主角的 animation 位子**——主角那层的 `animation`
           已经被 `.in` 占着，同节点两条简写会互相顶掉（0.19.0 老账）；
         · 这一层**从建档那一步就在**（姿势切换时才补挂要把主角 g 重新入树，而重新
           入树的节点没有 before-change style——那一次 148 单位的位移会当场落成终态，
           "跳上去"变"瞬移"，本轮实测过）；平时它是个空状态的 `<g>`，只多一层分组，
           不进任何几何读数（getBBox 逐值不变）；
         · class 由 (scene, step) 推导（`name === 'shelf'`），**不是"记住建上跳"**：
           导出每帧一次冷启动，seek 到 s3 那一帧时它照样是该蓄力的一步（纪律 1）；
           跨幕沿用 shelf 姿势时 class 不变 → put 不重写 → 不重放；
         · 幅度、方向、让出的那一拍全在令牌上（`--wind-back` / `--wind-dy` /
           `--wind-hold`），这里只写"这一步蓄不蓄"（纪律 1）。 */
    var wind = name === 'shelf';
    /* 换位弧凸（0.25.0）：只在这一步真的换位时算弧凸。峰值由**行程**现算——新老槽位
       距离 × --swap-k、封顶 --swap-rise、短于 --swap-min 的平移不演（位移短 = 平移，
       不算换位）；路径写进 --swap-route（路线是数据，与 .ride 同口径），控制点 = 峰值
       ×2（垂直抛物线 50% 处到峰，两端回原点）。三枚令牌从 CSS 读（口径同 --par-far，
       getComputedStyle 只在 poseWorld 每步一次的粒度上取，不做逐卡逐帧读）。 */
    var swapK = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--swap-k')) || .35,
        swapRise = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--swap-rise')) || 140,
        swapMin = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--swap-min')) || 250;
    /* 拖尾跟随（0.26.0）：档位**由行程现推**，不是再写一张姿势表——走得最远的那张就是
       这一步的主动作（rank 0，恰好也是 0.25.0 越过来那一张），其余按行程从大到小排
       1 / 2；行程打平时按 HERO 的书写序，于是让位的两张从左往右读成一道波。没有随机、
       没有历史，同一对姿势永远同一套档位（纪律 1）。行程为 0 的不给档（它没动，
       晚一拍落定是撒谎）。范本实测（bay→sorted）：越过来那张行程 400 单位（屏幕上
       510.4 设备px，差的是相机倍率）拿 rank 0，两张让位的各 200 单位（255.2 设备px）
       **正好打平** → 按 HERO 的书写序分出 .07s / .14s；同一步里那张主动作的
       `--swap-route` 是 `Q 0 -280 0 0`（有弧凸），另两张 `Q 0 0 0 0`（直行）——
       "谁先动"与"谁越过"落在同一个读数上，不是两套各说各话的事实。 */
    var travel = HERO.map(function(v){
      if (!prevPose) return 0;
      var ps = prevPose.order.indexOf(v), q = p.order.indexOf(v);
      return (ps < 0 || q < 0) ? 0 : Math.abs(p.xs[q] - prevPose.xs[ps]);
    });
    var rank = [0, 0, 0];
    travel.map(function(_, i){ return i; })
      .sort(function(a, b){ return travel[b] - travel[a] || a - b; })
      .forEach(function(i, r){ if (travel[i] > 0) rank[i] = r; });
    HERO.forEach(function(v, hi){
      var slot = p.order.indexOf(v), g = 'w-' + v, boxKey = g + '-r';
      var rise = 0;
      if (fired && prevPose && prevPose.op > 0 &&
          prevPose.order.join() !== p.order.join()){
        if (travel[hi] > swapMin) rise = Math.min(swapRise, Math.round(travel[hi] * swapK));
      }
      var S = put('world', 'g', g + '-swp', {class:'swap', 'data-go': fired ? '1' : '0',
        style:'--swap-route:path(\'M 0 0 Q 0 ' + (-rise * 2) + ' 0 0\')'});
      var A = put(S, 'g', g + '-ant', {class: wind ? 'wind' : null});
      put(A, 'g', g, {class: rank[hi] ? 'trail' : null,
        style: rank[hi] ? '--trail-r:' + rank[hi] : null,
        transform:'translate(' + p.xs[slot] + ',' + p.y + ') scale(' + p.k + ')',
        opacity:p.op});
      var t = TONE[p.tone];
      if (!REG[boxKey]) put(g, 'rect', boxKey, {x:-48, y:-46, width:96, height:92, rx:14,
        fill:t.box, stroke:t.stroke, 'stroke-width':2});      // 只给新建档占位
      var lab = txt(g, g + '-t', {x:0, y:14, 'text-anchor':'middle', 'font-size':40,
        'font-weight':'700', 'font-family':MONO, fill:t.fill},
        p.quoted ? "'" + v + "'" : v);
      // 现量字宽：左右各留 14 的呼吸，圆角跟着宽度走（窄框配大圆角会挤成胶囊）
      var w = Math.max(74, Math.round(lab.getBBox().width) + 28);
      put(g, 'rect', boxKey, {x:-w/2, width:w, rx:Math.min(20, Math.round(w/6))});
    });
  }
  /** 换位弧痕（0.36.0）：本幕**最近一次看得见的换序**，纯扫描 WORLD/POSE 现推，
      不记历史（纪律 1——导出每帧冷启动，靠"上一帧"的写法在这里会整幕失明）。
      返回换序前后的两个姿势快照 {pre, post}，或 null。五条判据：
       ① 换序的两端都得在台上（op>0）：off → messed 这种"灯亮之前就换过了"不算
          ——看不见的位置，谈不上"从哪儿来"；
       ② 两端必须在**同一排**（y、k 相同）：bay → shelf 是把整排收上去，不是换位，
          给收架子画弧会让读者去找一段不存在的行程；
       ③ 现在这一步的姿势必须**还停在换序结果上**（order / y / k 全同）：弧痕是
          "刚才怎么换的"的遗留物，不是追着卡片走的挂件——这一排一被收起、被搞乱，
          弧痕立刻撤掉（与 .wake 正好互补：余像只活在行程里，弧痕只活在**没变**的
          静止帧里）；
       ④ 同幕第二次可见换序只认最近一次；每一扫都是 (scene, step) 的纯函数，跨幕
          沿用（worldFor 只在幕内回推）同口径，导出 seek 到换位后的那一帧照样在；
       ⑤ 判据全部读整步快照（POSE 的 order / xs / y / k / op），不读任何测量值：
          "弧痕在不在"与"卡片在不在"是同一张表上的同一条事实，不会两套口径打架。 */
  function traceAt(sid, step){
    var seq = WORLD[sid], nowName = null, cur = null, pre = null, post = null;
    if (!seq) return null;
    for (var i = 0; i <= step && i < seq.length; i++){
      if (!seq[i]) continue;
      nowName = seq[i];
      var q = POSE[nowName];
      if (!q || q.op <= 0) continue;
      if (cur && q.order.join() !== cur.order.join()){ pre = cur; post = q; }
      cur = q;
    }
    var now = nowName ? POSE[nowName] : null;
    if (!pre || !post || !now || now.op <= 0) return null;
    if (now.order.join() !== post.order.join()) return null;
    if (now.y !== post.y || now.k !== post.k) return null;
    if (pre.y !== post.y || pre.k !== post.k) return null;
    return {pre: pre, post: post};
  }
  /** 把弧痕画进世界层的最上面（这个组在第一次 worldFor 末尾建档，晚于三张卡，
      所以永远压在它们上面；每步 put 同一个 key，弧的多寡由 sweep 收口）。四条几何
      口径：
       ① 端点 = **槽位**，不是卡片：x 从旧姿势的 xs 到新姿势的 xs，y 取新姿势卡顶
          再让 8（范本 178）。于是 '1' 越过整行是 700→300（峰 64），两张让位的各
          200（峰 32）——弧高与行程成正比，三条弧自己分层，不会糊成一条；
       ② 弧高 = min(--trace-max, 行程 × --trace-k)，再按**舞台顶**封一次顶
          （y0 - 14）：排在画面高处的一行（比如上架子之后 y=84）画不下高弧时压扁，
          压到 8 以下干脆不画——宁可不画，不画一条贴边的假弧；
       ③ 行程 < --trace-min（40）不画：那是挪了半格，不是换位。与 --swap-min
          （250）同一判断，但这里量的是"看得出来的弧"，阈值小得多；
       ④ 只画**换了槽位**的卡（a !== b），并给每弧的起点补一枚空心小圆
          （r 2.6）：没有箭头时，圆点是唯一的"从哪儿出发"读数。
      同幕真出现第二次换序时，d 与 cx / cy 都在 .nt 的补间清单里，弧会 morph 过去
      而不是瞬移；范本里弧痕只出现一次（bay→sorted），下一步直接收架子，第二次换序
      没有消费者。 */
  function drawTraces(sid, step){
    var layer = put('world', 'g', 'w-traces', {class:'traces'});
    var tr = traceAt(sid, step);
    if (tr){
      var cs = getComputedStyle(document.documentElement);
      var k = parseFloat(cs.getPropertyValue('--trace-k')) || .16,
          max = parseFloat(cs.getPropertyValue('--trace-max')) || 96,
          min = parseFloat(cs.getPropertyValue('--trace-min')) || 40;
      var pre = tr.pre, post = tr.post;
      var y0 = Math.round(post.y - 46 * post.k - 8), room = y0 - 14;
      HERO.forEach(function(v){
        var a = pre.order.indexOf(v), b = post.order.indexOf(v);
        if (a < 0 || b < 0 || a === b) return;
        var x0 = pre.xs[a], x1 = post.xs[b], dx = Math.abs(x1 - x0);
        if (dx < min) return;
        var peak = Math.min(max, dx * k, room);
        if (peak < 8) return;
        put(layer, 'path', 'w-tr-' + v, {class:'in',
          d:'M' + x0 + ' ' + y0 + 'Q' + (x0 + x1) / 2 + ' ' + (y0 - peak * 2) +
            ' ' + x1 + ' ' + y0});
        put(layer, 'circle', 'w-tr-' + v + '-o', {class:'in', cx:x0, cy:y0, r:2.6});
      });
    }
    sweep(layer);
  }
  /** 这一幕的第 step 句，主角该在哪。WORLD 里没写到的步**沿用本幕最近一个写过的
   *  姿势**（"沿用"在画面上就是站着不动），但沿用是**在这一步就地回推**，不是记
   *  住"上一幕演到哪儿"——导出 mp4 是每帧一次冷启动、直接 seek 到那一秒，只跑这一
   *  步的 renderer。靠历史的话，第一句的姿势会漏进后面每一帧（实测过：整幕都挂着
   *  开场那排影子）。所以状态必须是 (scene, step) 的纯函数。 */
  function worldFor(sid, step){
    var seq = WORLD[sid], name = null, base = null, fired = false;
    if (seq) for (var i = 0; i <= step && i < seq.length; i++){
      if (!seq[i]) continue;
      name = seq[i];
      var q = POSE[name];
      /* 换位弧凸的档位（0.25.0）：本幕内**第一个可见姿势**（op>0）之后，又出现一个
         不同序的可见姿势 = 这幕里真的换过位置（含本步）。扫到就算数（sticky），所以
         "排好了 → 收上架子"那一步不重放；开头灯灭着的 off（op=0）不立基准，看不见
         位置的换位（off → messed）不演弧凸。跨幕沿用（worldFor 只在幕内回推）同口径。 */
      if (q.op > 0){
        var o = q.order.join();
        if (!base) base = o;
        else if (o !== base) fired = true;
      }
    }
    poseWorld(name || 'off', fired);    // 这一幕没写世界谱 = 主角不在台上
    drawTraces(sid, step);              // 弧痕画在卡之后：后建档 = 压在卡上（见 drawTraces）
  }

  // ── 相机：每一步声明一个取景窗，镜头怎么推怎么摇全在这张表里 ──────────
  // 取景窗是世界坐标 [x, y, w, h]；没写的那一步 = FULL = 不动镜头（桌面端与改造前
  // 一模一样，不会莫名缩放）。窗的中心被钉到可用区中心，所以**声明了窗就等于
  // 声明了重心**——stage.md §6 那条"逐场景量 getBBox 配平"从此有了机械抓手。
  // 缩放系数只在 [0.85, 1.8] 之间：下限之下会把窗外的东西裁掉（宁可多看不看不看），
  // 上限之上字会糊到画布外。窗比这更宽/更窄时按钳位后的倍率走，看到的只会比窗多。
  var VIEW = {x:10, y:10, w:980, h:384};
  var FULL = [VIEW.x, VIEW.y, VIEW.w, VIEW.h];
  var CAM = {
    // seg-1：三个数从"站着"到"被收上架子"。s3 之后台上只剩架子那一排，镜头跟着
    // 推近，不然半屏都是空的（内容重心在 y≈110，FULL 会把镜头钉在 202）。
    'seg-1': [
      FULL,                     // s0 结果摆在那儿：全场
      [200, 40, 600, 260],      // s1 两条断言 + 三张卡
      [200, 44, 600, 300],      // s2 排好了 + 徽标：内容最长的一刻
      [250, 40, 500, 140]       // s3 收上架子：只剩头顶那一排，推近看它
    ],
    // seg-2：三个数收在架子上（世界层），下面两行是逐位比较。镜头跟着"看哪一行、
    // 看哪一位"走——旁白说到第二位时画面就在第二位上，不用读者自己找。
    'seg-2': [
      FULL,                     // s0 规则总述：全场
      [230, 61, 580, 120],      // s1 第一位相等：推到第一行（架子留在窗里当参照）
      [300, 72, 460, 110],     // s2 第二位：再推到"有 / 没有"这一列
      [250, 62, 560, 130],     // s3 落判决：收回整行
      [250, 262, 560, 120],     // s4 换第二行，第一位定胜负
      [150, 0, 700, 250]        // s5 串起来：架子那排 + 结论行，第二行留在画外
    ],
    // seg-4：a / b 两个块在契约之间移动。这一幕的内容从抬头行(48)一直排到脚注(344)，
    // 竖向是缩放的上限——所以镜头只在 s1 推近、s5 拉回，中间不假装有运镜。
    'seg-4': [
      FULL,                     // s0 引入：连顶部公式条一起看
      [230, 40, 540, 315],      // s1–s3 三条契约：收拢到 a/b 这一对
      [230, 40, 540, 315],
      [230, 40, 540, 315],
      [230, 40, 540, 315],      // s4 只看符号：靠方块合拢 + 描边变色说话
      FULL                      // s5 升降序：拉回全场
    ],
    // seg-5：管线讲完（s0–s3 挤在画面上半截），s4 数据被搞乱、s5 给出正确写法，
    // 内容一路长到 y=374——镜头在后果落地这一刻**往后拉**，把新出现的东西收进画面。
    'seg-5': [
      [140, 40, 760, 200],      // s0–s3 管线：收在写法和 true/false 上
      [140, 40, 760, 200],
      [140, 40, 760, 200],
      [140, 40, 760, 200],
      [140, 40, 760, 340],      // s4 乱了 + 不报错：拉远
      [140, 40, 760, 340]       // s5 正确写法：留在拉远后的取景里收尾
    ]
  };
  /** 视差远景层的位移（0.14.0）：#depth 与 #cam 同级同坐标系，镜头平移多少，
     远景按 --par-far 走其中一小段——**同向、但慢**，于是相对画面就在往后退，
     画面上读起来正是"远处比近处慢"（真实摄影机摇镜时背景跟得少）。
     远景**只跟着漂、不跟着放大**：这一条恰恰是"它很远"的线索，跟着缩放就成同
     一张纸了。系数只从令牌读，令牌被改名或删掉时 parseFloat 得 NaN、落回范本
     默认档，画面不至于整层静止。位移挂在**属性**上（不改变任何 getBBox()），
     所以取景、命中区与 QA 几何判定都不受影响。 */
  function depthShift(now){
    var p = el('depth');
    if (!p) return;                            // 页面没建远景层：不替它编一个
    var css = getComputedStyle(document.documentElement).getPropertyValue('--par-far');
    var f = parseFloat(css);
    if (!isFinite(f)) f = .45;
    p.setAttribute('transform',
      'translate(' + (now.tx * f).toFixed(1) + ',' + (now.ty * f).toFixed(1) + ')');
  }
  /** 对焦（0.35.0）：取景窗推到多深，远景就虚多少（浅景深 / rack focus）。
     状态 = (取景窗倍率) 的纯函数，由 camSet 每步现算写进 --defocus；CSS 只补间
     过程（与运镜共用 --cam-dur）。三条边界：
       ① 只对**声明过的取景窗**演：窄屏 contentBox 兜底取景是自适应不是叙事推近，
          不虚；FULL 与中等景别（k ≤ --defocus-in）恒锐；
       ② 参数只从令牌读（--defocus-in 阈值 / --defocus-max 上限），改名删名
          parseFloat 得 NaN 落回范本默认档（1.30 / 2px）；
       ③ 只挂 #depth（远景装饰层）：命中、QA 几何与取景判定都不受影响；擦洗时
          与镜头同一节奏地追（--cam-dur 地板档），导出截图切掉补间后落当步值。 */
  function depthFocus(now, declared){
    var p = el('depth');
    if (!p) return;                            // 页面没建远景层：不替它编一个
    var blur = 0;
    if (declared){
      var cs = getComputedStyle(document.documentElement);
      var in0 = parseFloat(cs.getPropertyValue('--defocus-in'));
      var max0 = parseFloat(cs.getPropertyValue('--defocus-max'));
      if (!isFinite(in0)) in0 = 1.30;
      if (!isFinite(max0)) max0 = 2;
      // 1.8 与 camCalc 的钳位上限同源：失焦只跟"这一趟推得多深"走，不另立倍率。
      if (now.k > in0) blur = Math.min(1, (now.k - in0) / (1.8 - in0)) * max0;
    }
    p.style.setProperty('--defocus', blur.toFixed(2) + 'px');
  }
  function camCalc(f){
    var k = Math.max(0.85, Math.min(VIEW.w / f[2], VIEW.h / f[3], 1.8));
    // 平移量算一次、回传一次：视差层要用的就是这个数，让它在 depthShift 里
    // 重算第五版钳位公式，早晚和实际画面不一致（同上面那条注释的理由）。
    var cx = f[0] + f[2] / 2, cy = f[1] + f[3] / 2;
    return {cx:cx, cy:cy, k:k, tx:500 - k * cx, ty:202 - k * cy};
  }
  /** 位移定拍（0.24.0）：一趟镜头的时长**由这一趟真的走了多少推出来**，不再是恒定的
   *  .6s。JS 只写两个读数——`--cam-pan`（平移行程，viewBox 单位）与 `--cam-zoom`
   *  （倍率的相对变化，无量纲）；权重、地板、封顶全在 CSS 那一处 clamp()（见 :root
   *  的 --cam-dur），几何归代码、时间归令牌，两边都不留第二个数。五条边界：
   *    ① **先写读数、后写 transform，顺序是原语的一部分**：#cam 的 transition-duration
   *       读的是 --cam-dur，而它只在样式重新计算时才求值。反过来写（先 transform、
   *       中间夹一次强制布局——下面重触发运镜模糊用的 getBoundingClientRect 正是
   *       一次强制布局）时，浏览器会用**上一趟那一步**求出的时长来补这一趟，实测
   *       读数是"transform 已经新了、跑动中的动画时长还是旧的"（见 stage.md §3.4
   *       那条"看着跑通了、读数其实是错的"）；
   *    ② 读数写在 **documentElement** 上而不是 #cam 上：--cam-pan / --cam-zoom 是
   *       未注册的常量替换，写在谁身上都只会被自己读；写根上是为了让 #cam 与 #depth
   *       **两个消费者共读同一个派生值**（写在 #cam 上，视差层就得再算一遍第五版
   *       钳位公式——正是 depthShift 上面那条注释要避免的事）；
   *    ③ 冷启动（`camAt` 为 null，没有"上一状态"）写 0 / 0，落到的就是地板那一档，
   *       与擦洗 / 导出截图模式同一格——导出的每一帧都是一次冷启动，直接 seek 到
   *       那一秒，靠"上一趟的时长"就是靠历史（纪律：状态必须是 (scene, step) 的
   *       纯函数）；
   *    ④ 擦洗与导出截图模式下也写 0 / 0：手指在进度条上跑时画面本来就在连续跳，
   *       按行程定拍只会让镜头永远在追（运镜模糊与方向感换场同一判据、同一行守卫）；
   *    ⑤ **--cam-pan / --cam-zoom 故意不注册**：它们是"这一趟走了多少"的读数，
   *       不该被补间——补间一个行程数会得到"时长自己也在爬"的第二套动画（与
   *       --spot-k / --squash-x 同一条口径）。 */
  function camRun(prev, now){
    var root = document.documentElement;
    var pan = 0, zoom = 0;
    if (prev && !scrubbing && !window.__coursewareShotMode){
      pan = Math.hypot(now.tx - prev.tx, now.ty - prev.ty);
      zoom = Math.abs(now.k / prev.k - 1);
    }
    root.style.setProperty('--cam-pan', pan.toFixed(1));
    root.style.setProperty('--cam-zoom', zoom.toFixed(3));
    el('cam').setAttribute('transform',
      'translate(' + now.tx.toFixed(1) + ',' + now.ty.toFixed(1) + ') scale(' + now.k.toFixed(3) + ')');
    return now;
  }
  /** 运动模糊的判据：镜头**动了多少**才糊（不是每步都糊）。位移按世界坐标算，
     倍率按相对变化算——推拉 22% 以上、或平移 180 单位以上才算"一次运镜"。
     擦洗期间不糊：手指在进度条上跑的时候画面本来就在连续跳，糊只会变成一团糊。 */
  var camAt = null;
  function camBlurOK(prev, now){
    if (!prev) return false;                       // 冷启动第一步不糊（没有"上一状态"）
    var dx = now.cx - prev.cx, dy = now.cy - prev.cy;
    return Math.sqrt(dx * dx + dy * dy) > 180 || Math.abs(now.k / prev.k - 1) > 0.22;
  }
  /** 一盏灯要照住的落点：把目标节点在自己坐标系里的 getBBox()，一路乘到 #cam
   *  坐标系。为什么不用 getScreenCTM()——它返回的是**此刻**的矩阵，而镜头和台标
   *  正在补间，半途取到的是"上一帧的位置"，灯会照歪。这里读的是 transform
   *  **属性**（baseVal），也就是动画的目标值：灯要照的是"要去的地方"，不是
   *  "此刻飘着的地方"。旋转/斜切会放大包围盒，所以取两角点再做并集。 */
  function camBox(node){
    var bb = node.getBBox();
    if (!bb.width || !bb.height) return null;
    var cam = el('cam');
    if (!cam || !window.DOMMatrix) return null;
    var m = new DOMMatrix(), n = node;
    while (n && n !== cam){
      var l = n.transform && n.transform.baseVal;
      if (l && l.numberOfItems){
        var t = new DOMMatrix();
        for (var i = 0; i < l.numberOfItems; i++) t = t.multiply(l.getItem(i).matrix);
        m = t.multiply(m);
      }
      n = n.parentNode;
    }
    var p1 = new DOMPoint(bb.x, bb.y).matrixTransform(m);
    var p2 = new DOMPoint(bb.x + bb.width, bb.y + bb.height).matrixTransform(m);
    return {x:Math.min(p1.x, p2.x), y:Math.min(p1.y, p2.y),
            w:Math.abs(p2.x - p1.x), h:Math.abs(p2.y - p1.y)};
  }
  /** 亮灯：keys 是本步要指的节点 id（可以多个，取并集）。半径 = 半对角线 + pad，
   *  取**外接圆**而不是内切方——方角不该先黑下去。pad 默认 26：洞边到暗边之间还
   *  有一整段羽化（--spot-soft），多出来的这点是给"灯有余量"的观感留的。
   *  一个都没找到时按灭——宁可不照，也不照一个错的地方。 */
  function spotOn(keys, pad){
    var b = null;
    (keys || []).forEach(function(id){
      var n = el(id); if (!n) return;
      var q = camBox(n); if (!q) return;
      b = !b ? q : {
        x:Math.min(b.x, q.x), y:Math.min(b.y, q.y),
        w:Math.max(b.x + b.w, q.x + q.w) - Math.min(b.x, q.x),
        h:Math.max(b.y + b.h, q.y + q.h) - Math.min(b.y, q.y)};
    });
    if (!b) return spotOff();
    var spot = el('spot'); if (!spot) return;
    var r = Math.hypot(b.w, b.h) / 2 + (pad == null ? 26 : pad);
    spot.style.setProperty('--spot-x', (b.x + b.w / 2).toFixed(1) + 'px');
    spot.style.setProperty('--spot-y', (b.y + b.h / 2).toFixed(1) + 'px');
    spot.style.setProperty('--spot-r', r.toFixed(1) + 'px');
    spot.dataset.on = '1';
  }
  function spotOff(){ var s = el('spot'); if (s) s.dataset.on = '0'; }
  /** 可见内容的并集包围盒（窄屏兜底取景用）。世界层只在灯亮着时才计入——
   *  opacity:0 的主角不该把镜头拽向侧台。 */
  function contentBox(){
    var b = null;
    var ids = STAGES.filter(function(s){ return el(s).classList.contains('on'); });
    if (POSE[poseNow] && POSE[poseNow].op > 0) ids = ids.concat(['world']);
    // 引线标注（0.38.0）是这一步的**内容**又不是任何一幕的子树：窄屏兜底取景若漏掉
    // 这一层，贴着画布边的那条注记会被自适应的镜头顶到裁切线外。空层 bbox 为 0，
    // 下面的守卫会跳过它（与没开灯的世界层同一口径）。
    ids = ids.concat(['callouts']);
    ids.forEach(function(id){
      var bb = el(id).getBBox();
      if (!bb.width || !bb.height) return;
      b = !b ? {x:bb.x, y:bb.y, w:bb.width, h:bb.height} : {
        x:Math.min(b.x, bb.x), y:Math.min(b.y, bb.y),
        w:Math.max(b.x + b.w, bb.x + bb.width) - Math.min(b.x, bb.x),
        h:Math.max(b.y + b.h, bb.y + bb.height) - Math.min(b.y, bb.y)};
    });
    return b;
  }
  /** 落镜头：这一幕这一步声明过取景窗就用它；没声明时桌面回 FULL（与改造前的
   *  "不做任何变换"等价），窄屏按内容包围盒居中（改造前小屏自适应取景的口径——小画布
   *  塞不下大窗，窗要重算，所以窄屏下这一步盖过 CAM）。 */
  function camSet(sid, step){
    var declared = (CAM[sid] || [])[step];
    var now;
    if (!declared && compact()){
      var b = contentBox();
      now = camCalc(b || FULL);
    } else {
      now = camCalc(declared || FULL);
    }
    camRun(camAt, now);           // 先写行程读数再写 transform：见 camRun 边界 ①
    depthShift(now);              // 远景跟着漂一小段（视差），与镜头同一个坐标系
    depthFocus(now, declared);    // 对焦：推到多深，远景就虚多少（只对声明过的窗演）
    // 运镜模糊：只在**真的发生一次大幅运镜**时重触发（判据见 camBlurOK）。
    // 重触发口径与字幕翻句同款：remove → 读一次几何 → add；不达标的这一步必须
    // 主动 remove——否则上一次模糊的 class 还挂着，下一步小移动会再跑一遍动画。
    var cam = el('cam');
    if (camBlurOK(camAt, now) && !scrubbing && !window.__coursewareShotMode){
      cam.classList.remove('blurpass'); void cam.getBoundingClientRect();
      cam.classList.add('blurpass');
    } else cam.classList.remove('blurpass');
    camAt = now;
  }

  /* 色温定调的档表（0.24.0）：气氛跟着"这一段在讲什么"走。三档各说一件事——
     calm 是陈述规则（平），turn 是翻案 / 埋反例（暖一档），key 是契约与结论
     （冷绿一档）。档位按 content.title 那句话的**语气**分，不按场景号取模也不按
     时长分（那种分法换个课程就失效）。没登记的段落继承上一档，见 CSS
     「色温定调」边界 ④。 */
  var MOOD = {
    'opening':'turn',    // 先抛一个"你以为的答案"是错的
    'seg-1':'turn',      // 结果摊开：翻案
    'seg-2':'calm',      // 逐位比较，讲规则
    'seg-3':'calm',      // 位数相同才碰巧一致
    'seg-4':'key',       // 比较函数的契约
    'seg-5':'turn',      // 常见错误：返回了布尔值
    'seg-6':'calm',      // 稳定性，一个补充性质
    'closing':'key'      // 回到开头那句：结论
  };
  /** 换档只在**换节**时写一次（调用点在 tick 的换节分支，与章节翻场同一判据——
   *  挂在换句分支上就成了每句都游一次色）。写在 documentElement 而不是 #stage：
   *  --tint 注册成 inherits:true，两个消费者里有一个在 stage **之外**
   *  （body::before 那圈光晕），写 #stage 就漏了它；补间也只在换档的那个元素上
   *  声明一处（:root 那一行），消费者一条都不写。 */
  function moodSet(sid){
    var m = MOOD[sid];
    if (!m) return;                     // 没登记 ≠ 关掉：什么都不写，气氛保持连续
    document.documentElement.dataset.mood = m;
  }

  /** 舞台 A：三个数字块（4 句）——主角归**世界层**，这一幕只画"旁白正在指的那件事"
   *  s0 结果就摆在那儿（抬头行 + 三张卡，本地层空）
   *  s1「一在十前面，十在九前面」→ 两条弧线把这两个断言画出来
   *  s2「不是缺陷，是默认规则」→ 弧线淡出，卡自己排好（世界的 sorted 姿势），落一枚徽标
   *  s3「先转成字符串」→ 卡被收上架子并带上引号（世界的 shelf 姿势），指认这一步
   *  弧线在 s2 淡掉、s3 撤走：**断言兑现成了事实**。这就是常驻图元买到的表达力——
   *  每步重建节点的话，卡只能瞬移，弧线只能凭空出现又凭空消失。 */
  function renderA(step){
    only('stA');
    // 弧线画在 bay 位（'10'@300 / '9'@500 / '1'@700，卡顶 186）之上。
    // 只在 s1 之后才**建档**：建档即入场，画线动画就在这一刻跑；早一步建好压着
    // opacity:0 的话，动画会在没人看见的那一步跑完，轮到 s1 只剩淡入。
    // s2 写 opacity:0 让它淡出，s3 不再引用 → 由 sweep 撤走。
    if (step >= 1){
      /* 收拢退场的第一个消费者（0.19.0）：旧写法是 s2 写 `opacity:0` 让弧线淡掉——
         淡掉只说"没了"，而这一幕的新意是**断言兑现成了事实**：两条弧线替观众走完的
         那一路（'1' 先 → 尖指 '1'，方向是右→左地画、左→右地读）讲完就该**沿着自己
         的行进方向收走**。sweep 在 s3 把它们撤走这件事不变，改的只是 s2 那一拍从
         "忽然变透明"变成"一路收出去"。
         按边界 ⑤，这个 g 是**纯包装**：只换 `gone` 这一个 class，不写 opacity、
         不写 transform——位移与描边都归内层图元；.nt 的 transition 简写被这一条
         clip-path 简写顶掉是**已知的、且正是想要的**（实测同节点时计算值
         transition-property 只剩 clip-path，见 CSS「收拢退场」⑤）。 */
      var arcs = put('a-body', 'g', 'a-arcs',
        {class: step === 1 ? 'tuckR' : 'tuckR gone'});
      // 箭头从**排得晚的那个**指向**排得早的那个**，箭头尖落在"先"字说的那张卡上：
      // '1' 先 → 尖指 '1'（700）；'10' 先 → 尖指 '10'（300）。方向反了就是另一句话。
      put(arcs, 'path', 'a-arc-1', {class:'draw', pathLength:1, fill:'none',
        stroke:'#8d95a8', 'stroke-width':1.5, 'marker-end':'url(#ah)',
        d:'M300,178 Q500,96 700,178'});
      // 流光叠在**同一个包装 g** 里、另建一个节点（0.18.0 边界③/④）：底线说
      // "这两张卡有先后"，光段说"刚顺着这条关系走了一遍"。两条规则都声明
      // stroke-dasharray，同节点会互相顶掉（实测只剩 .16/1 的图案、线画不满），
      // 所以必须分节点。--delay 排在画线之后（.draw 是 --dur-draw .55s），
      // 先有线、后走光；箭头 marker 只留给底线，光段不带头——它是个事件不是路径。
      put(arcs, 'path', 'a-arc-1-flow', {class:'flow', pathLength:1, fill:'none',
        stroke:'#f5a623', 'stroke-width':2.5, style:'--delay:.55s',
        d:'M300,178 Q500,96 700,178'});
      txt(arcs, 'a-arc-1-lab', {class:'halo', x:500, y:112, 'text-anchor':'middle', 'font-size':13,
        fill:'#8d95a8'}, "'1' 先");
      put(arcs, 'path', 'a-arc-2', {class:'draw', pathLength:1, fill:'none',
        stroke:'#8d95a8', 'stroke-width':1.5, 'marker-end':'url(#ah)',
        d:'M500,178 Q400,140 300,178'});
      txt(arcs, 'a-arc-2-lab', {class:'halo', x:400, y:136, 'text-anchor':'middle', 'font-size':13,
        fill:'#8d95a8'}, "'10' 先");
    }
    // 两枚徽标都传 dec（0.26.0 逐字解码的消费者）：这两句正是本课"把一个结论推出来"
    // 的两拍——'默认规则' 与 '转成字符串' 是观众跟着旁白**认出来**的词，不是查到的。
    if (step === 2) badge('a-body', 'a-rule', 500, 322, '默认规则', '#f5a623', true);
    // 0.38.0 引线标注的消费者①：这句话说的是**被收上架子的那三个数**，不是画布中央
    // 那一小块空地。旧写法用徽标钉在 (500,150)，读者得自己把"转成字符串"和头顶那排
    // 卡连起来；引线把这条关系画出来——圆点落在**中间那张卡（w-10）**的底边，签垂在
    // 架子下方（钉 '9' 会把整条注记带偏到右边，三个数里 10 才是这课的主角）。
    // dec 照旧：这五个字是跟着旁白被认出来的。
    if (step === 3) callout('a-str', 'w-10', '转成字符串', {side:'b', col:'#4d90f0', dec:true});
    sweep('a-body');
  }

  /** 舞台 B：字符串逐位比较——本课最关键的一段（6 句）
   *  抬头行讲规则，架子上那三个带引号的数是 seg-1 收上去的主角（世界层，不动），
   *  这一幕把两对字符串逐位摊开：哪一格被点着，镜头就推到哪一列（取景见 CAM）。 */
  function renderB(step){
    only('stB');
    var cur = step >= 4 ? 1 : 0;              // 第 4 句起看 ("10","9") 这一组
    var rows = [['1','10'], ['10','9']];
    rows.forEach(function(r, ri){
      var baseY = 165 + ri * 135;
      // 换组时上一行不"消失"：挂焦点弱化档位（降饱和 + 微压暗）+ 退到 .45——
      // 它还在那儿当参照，但明显不是这一步的话头（原写法只压 opacity，读起来像
      // "淡出到一半卡住了"；材质变化才是"退居背景"）。
      // 0.28.0 动效目的审计：**还没轮到的第二对也一样**——s0–s3 旁白只讲第一对
      // （"1","10"），第二对（"10","9"）s4 才被点名；但 flip 包装需要 s0 就在场
      // （翻面是"两个状态之间的过渡"，节点必须在补间开始前已经建档），所以不是
      // 删掉它，而是让它整行退居参照（data-dim + .45）——"在但不在重点上"，
      // 同一拍不跟第一对抢淡入的注意力（一屏一个话头，其余压暗，见 renderG 同款）。
      var offRow = (ri !== cur && step >= 4) || (ri === 1 && step < 4);
      var g = put('b-body', 'g', 'b-row' + ri,
        {'data-dim': offRow ? 1 : 0, opacity: offRow ? .45 : 1});
      r.forEach(function(s, cx){
        var ox = 330 + cx * 300;
        s.split('').forEach(function(ch, k){
          var lit = false, col = '#5d6577';
          if (ri === cur){
            // 高亮跟着**旁白指的那一位**走，过了那一句就收：第一对看第二位时，
            // 第二对还没登场；换到第二对之后，第一对那位"空出来的第二位"也不再提。
            if (step >= 1 && step <= 3 && k === 0){ lit = true; col = '#4d90f0'; }   // 首位相等 → 蓝
            if (step >= 2 && step <= 3 && k === 1 && s === '10'){ lit = true; col = '#f5a623'; }
            if (step >= 4 && k === 0){ lit = true; col = '#f5a623'; }   // 第一位定胜负
          }
          var cell = put(g, 'g', 'b-' + ri + cx + k,
            {transform:'translate(' + (ox + k * 46) + ',' + baseY + ')'});
          put(cell, 'rect', 'b-' + ri + cx + k + '-r', {x:-21, y:-26, width:42, height:52, rx:9,
            fill: lit ? 'rgba(245,166,35,.14)' : '#1c212c',
            stroke: lit ? col : '#394052', 'stroke-width':2});
          txt(cell, 'b-' + ri + cx + k + '-t', {x:0, y:10, 'text-anchor':'middle', 'font-size':28,
            'font-weight':'700', 'font-family':MONO, fill: lit ? col : '#8d95a8'}, ch);
        });
        // 「没有第二位」的空位：短串在这个位置是空的，所以它更小
        if (ri === cur && step >= 2 && step <= 3 && s.length === 1){
          /* 圆形绽开（0.20.0）：这一格说的是"这里空着"——**把一个圆从中心推开**
             正好是"这块地方被腾出来"的那个动作，而旧写法在框与字上各挂一次 `.pop`
             （缩放弹入）读起来是"跳出来一个东西"，说的反了。`.bloom` 只挂在包装层，
             内层两个图元改回 `class:null`（一次入场就够，别叠两层，与 .reveal/.featherR
             那两个消费者同写法）。终态在元素自己身上（circle(75%) = 全开，CSS 边界 ②），
             所以导出切掉 animation 之后这一格仍是完整的一张空位。 */
          var gap = put(g, 'g', 'b-' + ri + cx + '-x', {class:'bloom',
            transform:'translate(' + (ox + 46) + ',' + baseY + ')'});
          put(gap, 'rect', 'b-x' + ri + cx + '-r', {class:null, x:-21, y:-26, width:42, height:52,
            rx:9, fill:'none', stroke:'#f5a623', 'stroke-width':2, 'stroke-dasharray':'5 5'});
          txt(gap, 'b-x' + ri + cx + '-t', {class:null, x:0, y:6, 'text-anchor':'middle',
            'font-size':17, fill:'#f5a623'}, '∅');
        }
        txt(g, 'b-' + ri + cx + '-lab', {x:ox, y:baseY + 56, 'text-anchor':'middle',
          'font-size':12, 'font-family':MONO, fill:'#5d6577'}, '"' + s + '"');
      });
      // 判决落地：'vs' 变成 '<'。s3 与 s2 的区别就在这里——上一句还在逐位比字符，
      // 这一句给出先后。两句停在同一帧 = 这一句白说。
      /* 翻面（0.20.0）：这里换的是**说法**而不是颜色——同一个位置上一个符号被另一个
         符号顶掉，正该"当面对质"地翻过去。外层 `b-<ri>-vs-w` 是纯包装：只写
         `data-over` 这一个状态，不写位移/透明度（CSS「翻面」边界 ④，同节点的 .nt
         简写会被 .flip 整串顶掉）。两面各带各的颜色，所以旧写法那句
         `fill: won ? … : …` 没有了——**颜色不再是补间的对象**，它跟着面走，翻页
         中途不会看到一个既不是灰也不是绿的中间色（这是翻面白赚的另一半）。
         两行各按自己的节拍翻：第一行 s3 翻、第二行 s4 翻。 */
      var won = (ri === 0 && step >= 3) || (ri === 1 && step >= 4);
      var fv = put(g, 'g', 'b-' + ri + '-vs-w', {class:'flip', 'data-over': won ? '1' : '0'});
      txt(fv, 'b-' + ri + '-vs', {class:'face', x:480, y:baseY + 10, 'text-anchor':'middle',
        'font-size':30, 'font-weight':'700', fill:'#5d6577'}, 'vs');
      txt(fv, 'b-' + ri + '-vs-b', {class:'face faceB', x:480, y:baseY + 10,
        'text-anchor':'middle', 'font-size':30, 'font-weight':'700', fill:'#2ecc71'}, '<');
    });
    // 对位镜（0.30.0）：旁白这一句在比哪两位，尺子就架在哪一对位置上。
    // s1 比首位（i=0）；s2/s3 比第二位（同一把尺平移一格，k=1）；s4 换到第二对
    // 的首位——旧尺随 sweep 撤走、新尺从零量过去。s0 还没有比较、s5 已是结论，
    // 都不架尺（没有"正在被放在一起量"的东西）。
    if (step >= 1 && step <= 3) scopeFrame('b-body', 'b-scope0', 165, step >= 2 ? 1 : 0);
    else if (step === 4) scopeFrame('b-body', 'b-scope1', 300, 0);
    // s5「串起来」：把两行的结论并成一行记法（记号不是句子，纪律 3）。
    // 擦除揭示挂在**包装 g** 上（0.15.0）：这一行是从两行比较里"串"出来的，
    // 左→右扫出来读作"顺着往下推"，比一次淡入多说了半步。内层写字不给 .in
    // ——擦除本身就是入场，两层入场叠在一起只会互相糊掉。
    if (step === 5){
      var sum = put('b-body', 'g', 'b-sum-w', {class:'reveal'});
      txt(sum, 'b-sum', {class:null, x:540, y:250, 'text-anchor':'middle',
        'font-size':15, 'font-family':MONO, fill:'#f5a623'}, "'1' < '10' < '9'");
    }
    sweep('b-body');
  }

  /** 舞台 C：比较函数的契约（6 句）
   *  逐句对账：s0 引入(要自己传) · s1 <0 排前 · s2 =0 相等 · s3 >0 排后
   *            · s4 只看符号不看数值 · s5 落到 a-b 升序 / b-a 降序
   *  阈值**显式写成常量**，不写推导表达式；s4/s5 各给独立画面，不连停在同态。 */
  function renderC(step){
    only('stC');
    var cases = [
      {sign:'< 0', act:'a 排在 b 前面', col:'#2ecc71', dx:[-100, 100]},
      {sign:'= 0', act:'两者相等',       col:'#8d95a8', dx:[-72, 72]},
      {sign:'> 0', act:'a 排在 b 后面', col:'#ef4d4d', dx:[100, -100]}
    ];
    // 契约态：s1→<0，s2→=0，s3→>0；s4/s5 不再停留 >0（各给独立画面）
    var pick = (step >= 3 && step < 4) ? 2 : (step === 2) ? 1 : (step === 1) ? 0 : -1;
    var c = pick >= 0 ? cases[pick] : null;
    var cy = 224;
    put('c-body', 'rect', 'c-formula', {x:240, y:cy-150, width:520, height:58, rx:12,
      fill:'#161a23', stroke:'#2a3140'});
    // 顶部公式行（0.41.0）：s0 把比较函数拆成三件，s1 起合拢成语法骨架，
    // 右侧接这一拍的契约读数。
    /* 拆解视图的消费者：s0 那句是"要按数值排序，就得**自己传**比较函数"——观众
       先得看清"比较函数"这四个字由什么组成。三件从中心向两侧分开：`(a, b)` 是
       参数、`=>` 是箭头函数的记号、`a - b` 是返回差值。s1 旁白转到契约，三件
       合拢并整体左移，给右边的 `→ < 0` 让出位置——**拆开的整体不会被撤掉，
       而是收成后续五句共用的语法骨架**；这也是它与"拆完即走的入场动画"的分界。
       落点：s0 三件以 500 为心排在 436 / 500 / 564；s1 起装配位在 360 / 424 / 488，
       尾部读数从 528 起写。标签只在 s0/s1 建档：s0 亮着、s1 随合拢淡出，s2 由
       sweep 收走。c-head 在 s0 不建档——这一拍的话头是拆开的三件，不是又一行字。 */
    var TOK_Y = cy - 111;
    var taken = step === 0;
    var TOK = [
      ['c-tok-a', 436, 360, '(a, b)', '参数', '#c9d1e0'],
      ['c-tok-arrow', 500, 424, '=>', '箭头', '#5d6577'],
      ['c-tok-b', 564, 488, 'a - b', '返回差值', '#c9d1e0']
    ];
    TOK.forEach(function(q){
      /* 这一层**不写 transform**：拆解视图的基座由 explode() 的 base 参数给出，
         transform 归 drawExplodes() 独占（见 CSS .explode 边界②）。 */
      var g = put('c-body', 'g', q[0], {class:'explode in'});
      txt(g, q[0] + '-t', {class:null, x:0, y:0, 'text-anchor':'middle', 'font-size':19,
        'font-family':MONO, fill:q[5]}, q[3]);
      if (step <= 1)
        txt(g, q[0] + '-lab', {class:null, x:0, y:15, 'text-anchor':'middle', 'font-size':11,
          fill:'#8d95a8', opacity: taken ? 1 : 0}, q[4]);
    });
    explode('c-fn', TOK.map(function(q){ return q[0]; }), {
      base: TOK.map(function(q){ return [taken ? q[1] : q[2], TOK_Y]; }),
      gap:36, amount: taken ? 1 : 0});
    if (step >= 1){
      var headFill, headText;
      if (step === 4){ headFill = '#f5a623'; headText = '·  只看符号，不看数值'; }
      else if (step === 5){ headFill = '#f5a623'; headText = '→  升序 · b - a 降序'; }
      else { headFill = c.col; headText = '→  ' + c.sign; }
      var head = txt('c-body', 'c-head', {x:528, y:cy-111, 'text-anchor':'start', 'font-size':19,
        'font-family':MONO, fill: headFill}, headText);
      /* 荧光笔标记（0.27.0）的**唯一消费者**：s4 这句是整幕的结论（"只看符号"），
         给它在字后面垫一道测出来的琥珀带——划线动作发生在"这句话被说出来"的同一拍。
         s5 不再调用，带子被 sweep 收掉，画面只剩"落到升降序"那行新结论——标记是
         一次性的"现在看这句"，不是永久高亮（永久高亮会让 s5 看起来还没讲完）。
         为什么只给琥珀句：红字配亮带对比度不足 4.5:1，红字那一路要走 .strike
         （见 CSS .mark 边界②与 renderD）。 */
      if (step === 4) markBehind('c-body', 'c-mark', head);
    }
    // a / b 两个方块：常驻节点，契约态之间**滑过去**（transform 由 .nt 补间）；
    // s4/s5 收拢居中、描边变橙把视线压到符号上。
    var aX = pick >= 0 ? 500 + cases[pick].dx[0] : 448;
    var bX = pick >= 0 ? 500 + cases[pick].dx[1] : 552;
    var boxStroke = (step === 4 || step === 5) ? '#f5a623' : null;
    /* 提牌投影（0.23.0）：**谁排在前面，谁被提到台面上方**。三条契约各给一格：
         · `a - b < 0` → a 起、b 不落（a 排在 b 前面）；
         · `a - b = 0` → 两枚一样高（"相等"在这台仪器上的形状就是同高）；
         · `a - b > 0` → b 起（a 排在 b 后面）；
       s0 / s4 / s5 都落在台面上（没在比这一对、或这一句交给倾侧盘与描边色说话）。
       为什么值得再加一条轴：横向位移说的是"**结果**里谁在左"，抬升说的是
       "**次序**里谁在前"——两者正交，同一句判决可以说两遍而不会互相解释
       （位移轴已被 .tilt 的倾侧占用为 −/0/+ 的符号读数，抬升是空着的那一条）。
       档位只写 `data-lift`，抬多少、影子多长全在令牌与 CSS 里（纪律 1）；
       投影层是**纯包装**，位置归外层 `c-a`/`c-b`（由 .nt 补间），描边归内层
       rect——见 CSS「提牌投影」边界 ⑤。 */
    [['a','#4d90f0', aX], ['b','#f5a623', bX]].forEach(function(q){
      var g = put('c-body', 'g', 'c-' + q[0], {transform:'translate(' + q[2] + ',' + cy + ')'});
      var lift = pick === 0 ? (q[0] === 'a') : pick === 1 ? true : pick === 2 ? (q[0] === 'b') : false;
      var lf = put(g, 'g', 'c-' + q[0] + '-lf', {class:'lift', 'data-lift': lift ? '1' : '0'});
      put(lf, 'rect', 'c-' + q[0] + '-r', {x:-52, y:-40, width:104, height:80, rx:13,
        fill:'#1c212c', stroke: boxStroke || q[1], 'stroke-width':2});
      txt(lf, 'c-' + q[0] + '-t', {x:0, y:13, 'text-anchor':'middle', 'font-size':34,
        'font-weight':'700', fill:q[1]}, q[0]);
    });
    /* 倾侧定盘（0.21.0）：三句契约对应一台**只有三档**的符号盘——返回负数左端沉、
       返回零持平、返回正数右端沉。`a − b` 是 −1 还是 −99 都落在同一格上，"离散
       三档"本身就是"只看符号，不看数值"那个结论的形状（换成连续倾角就演歪了）。
       三条口径：① 倾角终态写在呈现属性 `data-pan` 上，切掉补间（导出 / 减少动效）
       落的是"这一拍该倾哪边"，不是没收到的水平起点；② 旋转层是**纯包装**：支点
       三角与刻度留在它外面当静止参照，否则包围盒中心就不是支点，倾侧会绕着一个
       飘忽的点转（边界见 CSS `.tilt` ③）；③ 这层旋转不进 `getBBox()`（实测三档同为
       [406,280,188,12]），相机取景与 §5 的连线几何判定都看不见它——命中倒是跟着变换
       走（见 `.tilt` 边界 ⑤），所以**要拿坐标判定的东西别挂 `.tilt`**。 */
    if (pick >= 0){
      var gp = pick === 0 ? '-1' : (pick === 1 ? '0' : '1');
      put('c-body', 'line', 'c-rail', {x1:402, y1:306, x2:598, y2:306,
        stroke:'#2a3140', 'stroke-width':1});
      put('c-body', 'line', 'c-rail-mid', {x1:500, y1:299, x2:500, y2:313,
        stroke:'#394052', 'stroke-width':1.5});
      txt('c-body', 'c-rail-neg', {x:386, y:311, 'text-anchor':'end', 'font-size':15,
        'font-family':MONO, fill:'#5d6577'}, '−');
      txt('c-body', 'c-rail-pos', {x:614, y:311, 'text-anchor':'start', 'font-size':15,
        'font-family':MONO, fill:'#5d6577'}, '+');
      put('c-body', 'path', 'c-fulcrum', {d:'M500,290 L492,304 L508,304 Z',
        fill:'#2a3140'});
      // 梁与两枚托盘都画在同一水平线上：包围盒的竖直中心才落在那根梁上（②）
      var beam = put('c-body', 'g', 'c-beam-w', {class:'tilt in', 'data-pan':gp});
      put(beam, 'line', 'c-beam', {x1:412, y1:286, x2:588, y2:286, stroke:'#8d95a8',
        'stroke-width':3, 'stroke-linecap':'round'});
      put(beam, 'circle', 'c-pan-l', {cx:412, cy:286, r:6, fill:'#1c212c',
        stroke:'#8d95a8', 'stroke-width':2});
      put(beam, 'circle', 'c-pan-r', {cx:588, cy:286, r:6, fill:'#1c212c',
        stroke:'#8d95a8', 'stroke-width':2});
    }
    if (pick === 1) txt('c-body', 'c-eq', {x:500, y:cy+14, 'text-anchor':'middle',
      'font-size':30, 'font-weight':'700', fill:'#8d95a8'}, '=');
    // 图内短标注（**不是口播原句**）：s4「只看符号」、s5「升降序」各给一个独立标签——
    // 这些是图元的标注/公式，与旁白那句话不同（判据见 stage.md §2 纪律 3）
    var footFill, footText;
    if (step === 4){ footFill = '#8d95a8'; footText = '符号相同 = 结果相同：只看 ± 与 0'; }
    else if (step === 5){ footFill = '#2ecc71'; footText = 'a - b → 1 9 10   升'; }
    else if (pick === -1){ footFill = '#8d95a8'; footText = '（比较函数决定 a 与 b 的先后）'; }
    else { footFill = c.col; footText = c.act; }
    txt('c-body', 'c-foot', {x:500, y:cy + (step === 5 ? 96 : 120), 'text-anchor':'middle',
      'font-size':16, 'font-family':MONO, fill: footFill}, footText);
    // s5 是这一幕唯一"两句一件事"的收尾：升序 / 降序各摆一条真实序列，
    // 而不是把旁白再念一遍——两个方向同时在场，才看得出"取个反就掉头"。
    // 降序那一行用**右→左**的擦除（0.15.0）：这一行的新意不在"多一行字"，在
    // "方向反了"，擦出来的方向替观众说了这半句。c-foot 从 s0 就活着（只换文本），
    // 不能中途换爹，所以只包这一条新建档的。
    if (step === 5){
      var dn = put('c-body', 'g', 'c-dn-w', {class:'revealL'});
      txt(dn, 'c-dn', {class:null, x:500, y:cy+128, 'text-anchor':'middle',
        'font-size':16, 'font-family':MONO, fill:'#4d90f0'}, 'b - a → 10 9 1   降');
    }
    sweep('c-body');
  }

  /** 舞台 D：布尔值陷阱（6 句）
   *  管线归这一幕，**被排的那个数组归世界层**：s4 主角三个数被搞乱（POSE.messed），
   *  于是"错误发生在数据上"这件事看得见，而不是在角落重画一版假数组。 */
  function renderD(step){
    only('stD');
    // 逐句对账：s0 写出那个错的写法 · s1 判它错（红）· s2 true/false 亮出来
    // · s3 false 折成 0 · s4 数据被搞乱 + 不报错 · s5 给出正确写法
    var wrong = step >= 1, branchOn = step >= 2, zero = step >= 3, messy = step >= 4;
    // 管线在 s3 才长出右边「0」那一段。没长出时整条右移配平重心，长出后归位——
    // d-rig 是常驻节点，这一次平移由 .nt 补间成可见的运动，不是画面自己跳。
    var G = put('d-body', 'g', 'd-rig', {transform:'translate(' + (zero ? 0 : 93) + ',0)'});
    put(G, 'rect', 'd-src', {x:150, y:110, width:290, height:66, rx:12,
      fill: wrong ? 'rgba(239,77,77,.08)' : '#161a23',
      stroke: wrong ? '#ef4d4d' : '#2a3140'});
    var srcT = txt(G, 'd-src-t', {x:295, y:151, 'text-anchor':'middle', 'font-size':18,
      'font-family':MONO, fill: wrong ? '#8d95a8' : '#c9d1e0'}, '(a, b) => a < b');
    /* 反证划线（0.27.0）的**唯一消费者**：s0 先把错写法摆上来（完整、正常字色），
       s1 判它错的那一拍，红笔从左往右划掉，同时字压暗一档。
       为什么字不跟着换成红色：这一刻画面里已经有三处红（外框、input 的 tint、
       后面的 false），再红一行字，四个红块互相抢，"哪一笔是新发生的"就看不见了；
       字压到 #8d95a8、红只留给那条线，划线本身才是这一拍的动词（合成对比度
       5.37:1，见 CSS .strike 边界③）。
       划线挂在 d-rig 里：s3 管线右移配平时它跟着走，不会留在原地指向空气；
       s1 之后每一步都重新声明（wrong 从 s1 起为真），所以到 s5 那行仍是划掉的
       ——"旧写法被否掉"是持久状态，不是一次性动画。 */
    if (wrong) strikeThrough(G, 'd-src-x', srcT);
    put(G, 'line', 'd-link', {x1:446, y1:143, x2:536, y2:143, stroke:'#2f3646', 'stroke-width':2});
    txt(G, 'd-link-t', {x:491, y:133, 'text-anchor':'middle', 'font-size':11,
      fill:'#5d6577'}, '求值');
    put(G, 'rect', 'd-true-r', {x:544, y:86, width:120, height:48, rx:10, fill:'#1c212c',
      stroke: branchOn ? '#2ecc71' : '#2a3140', 'stroke-width':2});
    txt(G, 'd-true-t', {x:604, y:117, 'text-anchor':'middle', 'font-size':17,
      'font-weight':'600', fill: branchOn ? '#2ecc71' : '#5d6577'}, 'true');
    put(G, 'rect', 'd-false-r', {x:544, y:152, width:120, height:48, rx:10,
      fill: branchOn ? 'rgba(239,77,77,.12)' : '#1c212c',
      stroke: branchOn ? '#ef4d4d' : '#2a3140', 'stroke-width':2});
    txt(G, 'd-false-t', {x:604, y:183, 'text-anchor':'middle', 'font-size':17,
      'font-weight':'600', fill: branchOn ? '#ef4d4d' : '#5d6577'}, 'false');
    /* 词拍（0.39.0）的消费者②：s2 这句把 true / false 挨着念（"真或假"）——念到
       "真"框 true，念到"假"框 false。两张卡这一步同时被落点灯照着，词拍不抢灯：
       灯说"看这两个"，括号说"**现在**念到这一个"。一个词只框一件东西，两件东西
       就两条 cue——词拍不做"集合点名"（那是 .brace 的活）。 */
    if (step === 2){
      cue('d-true-r', '真');
      cue('d-false-r', '假');
    }

    if (zero){
      put(G, 'line', 'd-fold', {x1:680, y1:176, x2:760, y2:176, stroke:'#ef4d4d', 'stroke-width':2});
      put(G, 'rect', 'd-zero-r', {x:766, y:152, width:110, height:48, rx:10,
        fill:'rgba(239,77,77,.12)', stroke:'#ef4d4d', 'stroke-width':2});
      txt(G, 'd-zero-t', {x:821, y:184, 'text-anchor':'middle', 'font-size':20,
        'font-weight':'700', 'font-family':MONO, fill:'#ef4d4d'}, '0');
      txt(G, 'd-zero-lab', {x:821, y:222, 'text-anchor':'middle', 'font-size':12,
        fill:'#8d95a8'}, '被当成「相等」');
    }
    if (messy){
      // 从「0」画一条线到被搞乱的那排数：错不在管线，在数据上
      put('d-body', 'path', 'd-harm', {class:'draw', pathLength:1, fill:'none',
        stroke:'#ef4d4d', 'stroke-width':1.5, opacity:.7, 'marker-end':'url(#ah)',
        d:'M821,202 C821,258 760,270 692,276'});
      txt('d-body', 'd-quiet', {x:196, y:306, 'text-anchor':'middle', 'font-size':13,
        fill:'#ef4d4d'}, '不报错');
    }
    if (step === 5) {
      /* 正确写法那一行用**羽化揭示**（0.17.0）：这一幕前面全是红（错法、被搞乱
         的数据、不报错），最后一行是绿——它是结论而不是"又一行字"。硬边擦除
         （.reveal）读起来像切纸，太机械；软边掠出来读起来像"这行自己浮上来"，
         和它"答案终于出现"的角色对得上。
         三条口径：① 挂在**包装 `<g>`** 上，内层 `txt` 不给 class（put 会给新
         建档塞 'nt in'，擦除/羽化本身就是入场，两层入场叠一起只会互相糊掉——
         与 0.15.0 那两个消费者同一写法）；② 这一层不可点（.featherR 自带
         pointer-events:none），它只是一行字，不是热区；③ 截图模式一刀切掉
         animation 后落在完整可见的定格上（静止态 --feather = 134%）。 */
      var fixw = put('d-body', 'g', 'd-fix-w', {class:'featherR'});
      txt(fixw, 'd-fix', {class:null, x:500, y:374, 'text-anchor':'middle',
        'font-size':16, 'font-family':MONO, 'font-weight':'600', fill:'#2ecc71'},
        '(a, b) => a - b');
    }
    /* 落点灯（0.22.0）：这一幕是"一条管线逐段长出来"，画面里同时有五个方块，
       旁白每句只点其中一个。以前靠颜色点亮（branchOn/wrong 那些开关），但颜色
       说的是"对错"，不是"现在看这里"。这里把"现在看这里"交给灯：洞外的东西
       **还在场、还看得见**，只是退到背景——正好是"讲解顺序"该长的样子。
       三条口径：① 每一步自己声明，没声明就是灭（begin() 归零，纪律①）；
       ② s4 故意不照：那一句的主角是**世界层**被搞乱的那排数，给管线打光会把
       注意力拉到错的地方；③ s0/s5 也不照——首尾两句是全景，打灯反而窄了。
       灯照的是 transform 属性里的**目标**位置（camBox），不是补间半途的位置。 */
    if (step === 1) spotOn(['d-src']);
    else if (step === 2) spotOn(['d-true-r', 'd-false-r']);
    else if (step === 3) spotOn(['d-false-r', 'd-zero-r']);
    sweep('d-body');
  }

  /** 舞台 E：稳定性（4 句）
   *  逐句对账：s0 稳定(引入) · s1 相等元素保序 · s2 多级排序好用 · s3 同分维持姓名顺序
   *  s2/s3 各给独立画面，不连停在同态。
   *  卡片按**人**建档（'e-r-小明'）而不是按行号：同分的两个人在结果列里各自占哪一行
   *  会变，"人"才是这里的主角——按行建档的话，换序时高亮会跟着行号跳到别人身上。 */
  function renderE(step){
    only('stE');
    var sorted = step >= 1;
    var before = [['小明',90], ['小红',90], ['小刚',80]];
    var after = [['小刚',80], ['小明',90], ['小红',90]];
    [[0,'e-l',before], [1,'e-r',after]].forEach(function(q){
      var col = q[0], pre = q[1], data = q[2];
      var ox = 208 + col * 584;
      var G = put('e-body', 'g', 'e-col' + col, {});
      txt(G, pre + '-h', {x:ox, y:100, 'text-anchor':'middle', 'font-size':13, fill:'#5d6577'},
        col === 0 ? '录入顺序' : '按分数排序后');
      if (col === 1 && !sorted){
        txt(G, 'e-q', {x:ox, y:230, 'text-anchor':'middle', 'font-size':22, fill:'#3d465a'}, '?');
      } else {
        data.forEach(function(s, i){
          var y = 150 + i * 72;
          // 同分 90 的是小明/小红，排完后落在 i=1、2 —— 相对顺序没变，这才是"稳定"
          var hi = col === 1 && sorted && s[1] === 90;
          // 0.29.0 动效目的审计续：右列三张结果卡**错峰落位**（0 / .06 / .12s，
          // 从上往下自然读序）——s1 的话头是"相等元素保序"（两条连线 + 两条 ride
          // 同拍出发），三张卡再同拍淡入就成了"一次铺满"，把注意力从话头上撕走。
          // 左列录入顺序 s0 整体揭晓是它自己的话头，不加 delay（0.28.0 同一口径：
          // 每个镜头只讲一件事，其余按先后排）。
          var card = put(G, 'g', pre + '-' + s[0],
            {transform:'translate(' + ox + ',' + y + ')',
             style: col === 1 ? '--delay:' + (i * .06).toFixed(2) + 's' : null});
          put(card, 'rect', pre + '-' + s[0] + '-r', {x:-146, y:-26, width:292, height:52, rx:11,
            fill: hi ? 'rgba(46,204,113,.10)' : '#1c212c',
            stroke: hi ? '#2ecc71' : '#394052', 'stroke-width':2});
          txt(card, pre + '-' + s[0] + '-n', {x:-106, y:8, 'text-anchor':'middle', 'font-size':18,
            'font-weight':'600', fill:'#e9ecf3'}, s[0]);
          txt(card, pre + '-' + s[0] + '-s', {x:92, y:8, 'text-anchor':'middle', 'font-size':18,
            'font-family':MONO, fill:'#f5a623'}, String(s[1]));
        });
      }
    });
    // s1「相等元素保序」：把同分的两个人从左列的录入位连到右列的结果位——
    // 连线是画出来的（.draw），斜着走才说得清"位置变了，先后没变"。
    /* 收拢退场的第二个消费者（0.19.0，用 .tuckL 与 s1 那条 .tuckR 配成一对）：这两条
       连线是**从左列画到右列**的，所以退场按**原路**收——右边先没、左边最后没，读起来
       是"顺着来路撤"。旧写法是 s2 不再引用 → sweep 当场撤走，线是"啪"地消失的；现在
       让它在 s2 多停一拍收出去，s3 起不再引用才真撤（消费者自己负责"多写一步"，
       这就是边界 ① 说的那个前提：收拢的对象必然在前一步已经被写过）。
       与 a-arcs 同一条边界 ⑤：这个 g 是纯包装，只有 `gone` 一个 class 在动，
       opacity/描边都留在内层那两条 line 上。 */
    if (step >= 1 && step <= 2){
      var ties = put('e-body', 'g', 'e-ties',
        {class: step === 1 ? 'tuckL' : 'tuckL gone'});
      [['小明',150,222], ['小红',222,294]].forEach(function(p){
        put(ties, 'line', 'e-tie-' + p[0], {class:'draw', pathLength:1,
          x1:354, y1:p[1], x2:646, y2:p[2], stroke:'#2ecc71', 'stroke-width':1.5, opacity:.55});
      });
    }
    /* 沿线抵达（0.20.0）：同分的两个人各自沿自己那条连线**走到右列去**。
       .draw 说的是"这两个位置之间有一条路"，这一层说的是"人真的沿这条路过去了、
       并且留在了终点"——两句合起来才说完 s1 那句"相等元素保序"。四个口径：
         · **s0 就建档、停在路头**（data-go=0），s1 起换档：补间发生在步与步之间，
           renderer 只写档位不排程（纪律 1）。s0 那一步右列还是一个 `?`，标记站在
           左列卡片边上不泄露结果，读作"还在原地"；
         · 路线写在呈现属性 `style` 上，坐标与那条 line 的 x1/y1→x2/y2 **同一个数组
           里出来**：两处各抄一遍数字，改了列宽就会跑偏；
         · **不挂在 e-ties 那一层里面**：那一层 s2 起挂 `.tuckL gone`，clip-path 会把
           走在半途的标记一起裁掉（`.tuck*` 边界 ④/⑤ 那条"要全程在场的东西不放收拢
           层里"）。标记要留在台上，就得是自己的节点；
         · 到了 s2、s3 标记留在终点不再动——它承担的是"这个人落在哪一行"的位置信息，
           s3 那道括注（同分 · 顺序不变）正是指着这两枚说的（关掉动效也一样在场，
           见减少动效兜底那三条）。
       箭头（`M 4 -5 L 10 0 L 4 5`）朝 +x：`offset-rotate:auto` 会把它对准路线方向，
       不用 JS 反解角度（实测那条 292×72 的斜线上自动转了 13.86°）。 */
    [['小明',150,222], ['小红',222,294]].forEach(function(p){
      var route = "--route:path('M 354 " + p[1] + " L 646 " + p[2] + "')";
      /* 行进余像（0.32.0）：先建尾巴、后建头——同位置时头压住尾（CSS 口径 ④）。
         两枚余像各晚 --trail-step 的 1 / 2 倍出发；行程 ~300 单位，0.07s/0.8s
         = 8.75%，实测（三条补间一起 pause 到 t=400ms）头 50%、尾 41.25% / 32.5%，
         屏幕间距 23.8 / 22.1px——够读成"一串"而不断成"三个东西"。余像只描圆环
         （不带箭头、不带字），透明度递减；到站两环收在头下（5.9 < 6）。 */
      [1, 2].forEach(function(i){
        var wk = put('e-body', 'g', 'e-wake-' + p[0] + '-' + i,
          {class:'ride wake', 'data-go': step >= 1 ? '1' : '0',
           style: route + ';--wake-i:' + i});
        put(wk, 'circle', 'e-wake-' + p[0] + '-' + i + '-c',
          {r: i === 1 ? 5.2 : 4.4, fill:'none', stroke:'#2ecc71',
           'stroke-width':1.4, opacity: i === 1 ? .5 : .25});
      });
      var rd = put('e-body', 'g', 'e-ride-' + p[0],
        {class:'ride', 'data-go': step >= 1 ? '1' : '0',
         style: route});
      put(rd, 'circle', 'e-ride-' + p[0] + '-c', {r:6, fill:'#2ecc71'});
      put(rd, 'path', 'e-ride-' + p[0] + '-a', {d:'M 4 -5 L 10 0 L 4 5', fill:'none',
        stroke:'#2ecc71', 'stroke-width':2});
    });
    // s2「多级排序时特别有用」：标出「两级」这个动作，与 s1 区分。
    // 挂在两列中间的空白处——右列抬头行(100)和卡片(150 起)都在这条线上方/下方，
    // 贴在列头上就会撞字（实测过）。
    if (step === 2) txt('e-body', 'e-lv', {x:500, y:352, 'text-anchor':'middle', 'font-size':12,
      'font-family':MONO, fill:'#f5a623'}, '两级：姓名 → 分数');
    // s3「同分的人维持姓名的顺序」：给并列的两人补一道集合括注（0.34.0）——
    // 旧写法是右下角一行 e-note（"90 分两行 · 小明在小红前"），说的是一个**事实**；
    // 括注说的是**关系**："这两张卡属于同一组"（同分），标签再补上组内规则。
    // 括的取数是两张 90 分结果卡的并集（小明、小红），不是整列——小刚不在这组里。
    if (step === 3) braceUnder('e-body', 'e-brace',
      ['小明', '小红'].map(function(nm){ return 'e-r-' + nm; }), '同分 · 顺序不变');
    sweep('e-body');
  }

  /** 舞台 F：开场 / 结尾提问。世界层在旁边打底（开场 bench 一排影子、结尾
   *  answer 那排带引号的数），问题本身留在抬头那一行。 */
  function renderF(which){
    only('stF');
    el('f-q').textContent = which === 'open' ? '[10, 9, 1].sort()  →  ?'
                                             : '🤔 为什么是 [1, 10, 9] ？';
    /* 词拍（0.39.0）的消费者①：开场这句把三个数挨着念一遍（"10、9、1"）——
       旁白念到哪个数，世界层里那一张就套上四角括号。三枚括号依次留下，读到句末
       是一排"刚被点过名"的题目；这就是词拍与 badge / callout 的分工：它们回答
       "这是什么"，词拍回答"**现在**在念谁"。
       目标在世界层（跨幕常驻），renderer 跑在 worldFor 之前看不到它们——但 cue()
       只登记 key，几何由 cueGeom() 在**念到这个词的那一拍**现量（题面三张卡这一步
       刚建档，入场补间还没落定，所以还要跟踪到 --cue-settle；见 stage.md）。
       "1" 在本句出现两次（"10" 里一次、末尾一次），nth:2
       取后面那一个——**不写 nth 会框在 "10" 上**，这是词拍最常见的作者错误。 */
    if (which === 'open'){
      cue('w-10', '10');
      cue('w-9', '9');
      cue('w-1', '1', {nth:2});
    }
  }

  /** 舞台 G：巧合（5 句）
   *  s0「一二三看着挺对」→ 只有位数相同那一行，站在正中
   *  s1「这是巧合」→ 引线把判词挂到同一行的行题上（callout）
   *  s2「位数相同时恰好一致」→ 位数不同那一行**长出来**，原本居中的行让位上移——
   *     这是常驻图元才有的编排：建行是建档，让位是补间，不是整屏重画一次；判词
   *     跟着行一起上移（同一个 callout key，签组 transform 由 .nt 补间）
   *  s3「位数不同就破了」→ 聚焦破功那行，另一行焦点弱化（材质退档，镜头不管）；
   *     判词沿引线收回到圆点（gone）
   *  s4「别让碰巧的成功骗过你」→ 两行都恢复正常，新签挂到翻车那张卡右侧 */
  function renderG(step){
    only('stG');
    var two = step >= 2;
    /** 一行三卡：坐标只由"第几行"和"三卡等距"决定，两版共用同一套落点。 */
    function cells(G, prefix, nums, col){
      var span = (nums.length - 1) * 132;
      nums.forEach(function(v, i){
        var cell = put(G, 'g', prefix + '-' + v,
          {transform:'translate(' + (500 - span / 2 + i * 132) + ',0)'});
        put(cell, 'rect', prefix + '-' + v + '-r', {x:-46, y:-34, width:92, height:68, rx:12,
          fill:'#1c212c', stroke:col, 'stroke-width':2, opacity:.85});
        txt(cell, prefix + '-' + v + '-t', {x:0, y:11, 'text-anchor':'middle', 'font-size':28,
          'font-weight':'700', 'font-family':MONO, fill:col}, v);
      });
    }
    // s3「位数不同就破了」：聚焦翻车那行——另一行走焦点弱化档位
    // （filter 材质 + opacity 同步退档），镜头不管，靠明暗分主次。
    // 0.31.0 动效目的审计续（声画对齐）：s2 旁白讲的是"位数相同时恰好一致"
    // （话头 = same 行 1/2/3），diff 行（红色"位数不同"标签 + 1/2/10 三卡）
    // 这时候**也建档淡入**就抢话头——与 0.28.0 renderB 同构（没轮到的内容
    // 不该满亮度登场）。修法同一套：s2 的 diff 行走弱化档位（在但不在重点上），
    // s3「位数不同就破了」才升为话头。
    var dimSame = step === 3;
    var GS = put('g-body', 'g', 'g-same', {transform:'translate(0,' + (two ? 232 : 258) + ')',
      'data-dim': dimSame ? 1 : 0, opacity: dimSame ? .45 : 1});
    txt(GS, 'g-same-lab', {x:500, y:-50, 'text-anchor':'middle', 'font-size':13,
      fill:'#2ecc71'}, '位数相同 · 都是 1 位');
    cells(GS, 'g-same', ['1','2','3'], '#2ecc71');
    if (two){
      var dimDiff = step === 2;
      var GD = put('g-body', 'g', 'g-diff', {transform:'translate(0,352)',
        'data-dim': dimDiff ? 1 : 0, opacity: dimDiff ? .45 : 1});
      if (step === 2)
        txt(GD, 'g-diff-lab', {x:500, y:-50, 'text-anchor':'middle', 'font-size':13,
          fill:'#ef4d4d'}, '位数不同 · 1 位 / 2 位');
      /* 0.40.0 对照窗的消费者：同一行、同一组落点，两版只差"第 2、3 位是谁"。
         s2（旁白还在讲"位数相同就恰好一致"）只露数值序 A（at 0），diff 行整体
         走弱化档；s3 旁白说"位数不同就破了"，接缝用一整趟从 A 扫到 B——读者看
         着同一行原地换成字符串序（1, 10, 2），"同一个位置、换一条规则"变成可见
         的读数，而不是两张图来回切。s4 停在 B 上，引线钉住最右侧的 2。
         行题与版本签**不同时出场**：s2 用行题说明"这一行为什么不同"，s3 起行题
         退场、两枚版本签接管同一行——窄屏上行题与"字符串序"会挤在同一基线上，
         这不是字号问题，是两行信息不该同时抢一条线。 */
      cells(put(GD, 'g', 'g-diff-a', {}), 'g-diff-a', ['1','2','10'], '#ef4d4d');
      cells(put(GD, 'g', 'g-diff-b', {}), 'g-diff-b', ['1','10','2'], '#ef4d4d');
      compare('g-diff', 'g-diff-a', 'g-diff-b',
        {at: step >= 3 ? 1 : 0, dim: dimDiff,
         labels: step >= 3 ? ['数值序', '字符串序'] : null});
    }
    // 0.38.0 引线标注的消费者②③：判词说得清"是哪一行"，就不再靠读者自己找。
    // s1–s2 签挂在 same 行的行题上方，**跟着行一起上移**（s2 那一行让位时由 .nt
    // 补间，不是原地重落）；s3「巧合就破了」沿引线收回到圆点——收回的方向读作
    // "这句判词失效了"，比忽然消失多一层因果。s4 换一枚新签，钉在翻车那张卡上：
    // 两行已经排满，旧徽标挤在行间，引线把它挂到右侧外面，压不到行题。
    // 0.40.0 起 diff 行有两版，翻车那张卡的 key 归字符串序（B）：s4 场上只剩 B，
    // 签挂在最右侧的 2 外面——中间那张 10 的正下方已经贴着取景窗下沿，塞不下签；
    // 挂右缘既不压卡，也不与上方的行题抢位置。
    if (step >= 1 && step <= 3)
      callout('g-luck', 'g-same-lab', '巧合', {side:'t', col:'#f5a623', gone:step >= 3});
    if (step === 4)
      callout('g-flip', 'g-diff-b-2', '位数不同就翻车', {side:'r', col:'#f5a623'});
    sweep('g-body');
  }

  var RENDER = {
    'opening': function(){ renderF('open'); },
    'seg-1': renderA,
    'seg-2': renderB,
    'seg-3': renderG,
    'seg-4': renderC,
    'seg-5': renderD,
    'seg-6': renderE,
    'closing': function(){ renderF('close'); }
  };

  // ══ ③ 字幕带：字幕文案唯一来自时间轴 ══════════════════════════════════
  // sentAt() 给出当前句，capShow(hit.sentence) 把这一句口播原文直接写进画布——
  // 念什么就显什么；页面不维护第二份字幕文案（理由与 gap-hold 见 stage.md §4）。
  // `hl:true` 的那一句是结论，用主色点一下（标在 narration-source.json 的 `hl` 里，
  // build_timeline 落到句子身上，见 script.md §1）。**强调色只有这一个**——
  // 红/绿那套语义色留给画面本身，字幕带不做第二套颜色编码。
  /** 写一条字幕：**文案就是这一句本身**，页面里不留第二份。
   *  只有开场前 / 课程结束时传 null 收起；场景与句间空档不调用本函数，
   *  字幕停在上一句上（不清空、不闪白，见 stage.md §4）。
   *  说话人标签是同一句数据的派生视图：`#cap-speaker` 显示 `s.speaker`
   *  （对话讲稿由 build_timeline 从 speakers[label] 透传，见 script.md §1），
   *  无 speaker 时留空——它不碰 `#cap-text`，字幕唯一来源的契约不受影响。 */
  function capShow(s){                     // s = sentAt() 返回的当前句；null = 收起
    if (!s || !s.text){ show('cap', false); capSent = null; capProgWrite(0); capLitWrite(0); return; }
    var t = el('cap-text');
    // 文本真的变化才重触发翻句微动效（.capLift）；同句重显（如 pause 后恢复）
    // 不重放——空档保留上一句的契约下，别让字幕每停一句就"跳"一次。
    if (t.textContent !== s.text){
      t.textContent = s.text;
      t.classList.remove('capLift'); void t.getBoundingClientRect(); t.classList.add('capLift');
    }
    t.setAttribute('fill', s.hl ? '#f5a623' : '#c9d1e0');
    capHl(t, !!s.hl);
    capSent = s;                      // 细线要跟的"当前这句"：空档里也认它（见 tick）
    capMeasure(t);
    var sp = el('cap-speaker');
    if (sp){ sp.textContent = s.speaker || ''; }
    show('cap', true);
  }
  /** 结论句划重点（0.14.0）：色带的几何**从字幕自己量**——x/宽取当句 bbox，
     纵向只压下半截字身（像马克笔划过去，不糊住整行）。量而不是算，是因为字号
     有两套口径：桌面 17、小屏分档 26（layout.md §4），手写常数必然错位。
     非结论句写 0 宽：既是收起也是下一句的生长起点。
     位移全交给 CSS transition（纪律 1：这里不排程、不轮询）。 */
  function capHl(t, on){
    var m = el('cap-hl');
    if (!m) return;
    var x = 500, w = 0;
    if (on){
      var bb = t.getBBox();
      x = bb.x; w = bb.width;
      m.setAttribute('y', (bb.y + bb.height * .52).toFixed(1));
      m.setAttribute('height', (bb.height * .5).toFixed(1));
    }
    m.setAttribute('x', x.toFixed(1)); m.setAttribute('width', w.toFixed(1));
    // CSS 几何属性优先（可补间）；上面那两笔呈现属性是"不支持时仍落终态"的兜底，
    // 两者同源同一次写，不会漂出第二套状态。
    m.style.x = x + 'px'; m.style.width = w + 'px';
  }
  /** 句内进度细线（0.16.0，"时间刻度层"第一条）：把"这一句念到哪儿了"划在字幕自己
     下面。与划重点同口径的地方是几何**从字幕现量**（桌面 17 / 小屏 26 两套字号，
     写常数必错位）；刻意不同的地方是这里只写呈现属性、不写 style、不挂 transition
     ——它是时钟的逐拍读数（和 #fill 同类），补间会让它永远落后于正在念的那个字。
     capSent/capGeo 都存在句子对象与现量结果里，不另开一份状态：进度 = currentTime
     的纯函数，回拖就倒回去，暂停就停住，导出截图页那一帧落的也是那一秒的真读数。
     量一次、逐拍只写 width：getBBox() 是同步布局查询，把它留在每帧路径上等于给
     逐帧循环加一条不该在那儿的重排（stage.md §5）。 */
  var capSent = null, capGeo = null;
  function capMeasure(t){
    var p = el('cap-prog');
    if (!p) return;
    var b = t.getBBox();
    capGeo = {x: b.x, w: b.width, y: b.y + b.height + 1.5, h: 2};
    p.setAttribute('x', capGeo.x.toFixed(1));
    p.setAttribute('y', capGeo.y.toFixed(1));
    p.setAttribute('height', capGeo.h.toFixed(1));
    p.setAttribute('width', '0');              // 换句即归零：新句从 0 开始长
  }
  function capProgWrite(t){
    var p = el('cap-prog');
    if (!p) return;
    if (!capSent || !capGeo || !(capSent.duration > 0)){
      if (p.getAttribute('width') !== '0') p.setAttribute('width', '0');
      return;
    }
    var k = Math.max(0, Math.min(1, (t - capSent.start) / capSent.duration));
    var w = (capGeo.w * k).toFixed(1);
    if (p.getAttribute('width') !== w) p.setAttribute('width', w);   // 同值不重写
  }
  /** 跟读点亮（0.19.0）：把"这一句念到哪儿了"落在**字本身**上——念过的保持全亮，
     未念的压到 --lit-floor 那一档灰阶地板（对比度实测见 CSS「跟读点亮」④）。
     与 capProgWrite 同一条口径，也刻意不同的一条：细线写 width（几何），这一层只写
     `--lit`（一个注册成 `<percentage>` 的读数），两者都是 currentTime 的纯函数、
     逐拍写、不挂 transition、不进 reduced-motion 清单。
     停靠点用 118% 这一档做满亮（= 100% + --lit-ramp）：k=1 时软过渡带正好落到元素
     之外，整行在不透明段上；k=0 时带子落在 0% 之外，整行都在地板上。所以
     "没有活跃句子"（capSent 为 null）走满亮而不是清零——带子已收起，别在收起态
     留一个"整句压暗"的计算值，导出与回拖时那一帧读起来会像 bug。
     同值不重写：这一层每帧都跑，写在 style 上会每次都触发一次重算。 */
  var LIT_FULL = 118;                 // --lit 的满亮档，与 @property initial-value 同数
  function capLitWrite(t){
    var el2 = el('cap-text');
    var k = (!capSent || !(capSent.duration > 0)) ? 1
          : Math.max(0, Math.min(1, (t - capSent.start) / capSent.duration));
    var v = (LIT_FULL * k).toFixed(1) + '%';
    if (el2.style.getPropertyValue('--lit') !== v) el2.style.setProperty('--lit', v);
  }

  /* ── 逐字解码（0.26.0，kinetic typography 的 decode / scramble 读法）─────────
     画面里的**术语**不写成"已经定好的字"，而是让它在被念到的那一句里**从噪声里一个字
     一个字定住**——旁白说到"先转成字符串"时，观众看着那五个字被逐个认出来，读作"这个
     词正在被推导出来"，而不是"这块屏幕刚打印出一行结论"。
     与 0.19.0 的跟读点亮同一族（都是 currentTime 的逐拍纯函数、回拖跟得回、暂停停得住），
     但**刻意不同的一条**：点亮只压暗、永远可读，所以 reduce 下照旧跟着嘴；解码在未定
     住的那些格里**本身就是不可读的字**，那对晕动/读屏用户是减分不是加分——所以 reduce
     与导出截图模式一律直接落完整的词（前沿实现同一口径：resolved text 才是内容本体，
     scramble 只是它的入场）。五条边界：
       ① **不许用随机数**：前沿库（GSAP ScrambleText 一类）内部是随机取字符，官方文档
          自己写了"逐帧渲染要 --concurrency=1 才复现得一致"。本仓库导出 mp4 是每帧一次
          冷启动 seek，随机一次就等于**同一秒的两帧是不同的字**。这里的字面由 (目标字符,
          下标, 句内进度) 现算，同一个 t 永远给同一个串（测试按这个钉死）。
       ② **字宽不许漂**：徽标的药丸底宽是按文案长度算的（badge 里那一行 w=），而解码
          途中换的是**别的字**——非等宽字体下 Latin 池里 'i' 与 'm' 差一截，画面会抖。
          建档时把终态宽度现量出来钉进 `textLength` + `lengthAdjust=spacingAndGlyphs`，
          解码期间整串的推进量被钉死在同一个数上。实测：四字词自然推进量 55.968 → 钉
          56.0，k 从 0 到 1 的十格采样里 `getComputedTextLength()` 全是 56.0、药丸底宽
          全是 77.413，一格都没抖；五字词 69.994 → 钉 70.0 同样恒定。
          ⚠ 量的必须是 `getComputedTextLength()`（**推进量**）而不是 `getBBox().width`
          （**墨盒**）：两者对同一串就不等（五字词实测 69.994 vs 70.134），而墨盒在解码
          途中还会自己抖——`spacingAndGlyphs` 是按字符重新分配边距的，k=.5 那一格的噪声
          字「较」墨宽溢出，`getBBox().width` 读到 56.467（多 0.467），前后九格都是 56.0。
          钉墨盒等于把整串压窄，而药丸底是按长度写的、不会跟着窄，字就贴到边上去了。
       ③ 池按**字符类**分：CJK 换 CJK（全角同宽，就算不钉 textLength 也不漂）、数字换
          数字、字母换字母——噪声长得像它要变成的东西，才读作"还没定住"而不是"换了一
          门语言"。
       ④ **前 --decode-lead 走完，末尾留白给读者**：解码贴着句尾才定住等于没演（旁白
          已经念完，观众还没看到完整的词）。走完之前每一格都还剩没定的字。落定节奏是
          `round((1-(1-k/lead)²) × 字数)`（0.33.0 缓出：前几字快定、末字从容沉底，
          不再线性逐字蹦），末字其实在 `lead × (1 − sqrt(.5/字数))` 就定了：四字词
          实测 k=.465 还是"默认规符"、k=.47 起整词"默认规则"（lead=.72 是最晚上限而不是
          末字定住那一拍），五字词在 .492。回拖可复现：.465 → .47 → .465 三次同一串。
       ⑤ 登记表按步重建（begin() 清空）：**这一步有没有在解码**与画面状态一样是
          (scene, step) 的纯函数，导出冷启动 seek 到那一帧照样是该解码的那一帧。 */
  var DEC_POOL = {
    cjk: '码序形值则符底较稳判对排前后数',
    digit: '0123456789',
    alpha: 'abcmoxzds',
    other: '·+×'
  };
  var DEC_LEAD = -1;
  function decodeLead(){                 // 读法同 ffThreshold()：设计期参数，一次就缓存
    if (DEC_LEAD < 0){
      var n = parseFloat(getComputedStyle(document.documentElement)
        .getPropertyValue('--decode-lead'));
      DEC_LEAD = (n > 0 && n <= 1) ? n : .72;
    }
    return DEC_LEAD;
  }
  /** 第 i 格在进度 k 上的噪声字面：由 (目标字符, i, k) 现算，**没有随机数**（边界①）。
     0.33.0 补一条诚实约束：池子若恰好算到**真字自己**（CJK 池里含"则"等字），
     就顺延一格——未定的字不该提前"看起来定了"，读者的注意力不该被假完整骗走。 */
  function decGlyph(ch, i, k){
    var pool = (ch >= '0' && ch <= '9') ? DEC_POOL.digit
             : (ch.toLowerCase() !== ch || /[a-z]/i.test(ch)) ? DEC_POOL.alpha
             : (ch.charCodeAt(0) > 0x2e7f) ? DEC_POOL.cjk
             : DEC_POOL.other;
    var idx = (i * 7 + Math.floor(k * pool.length * 3)) % pool.length;
    if (pool.charAt(idx) === ch) idx = (idx + 1) % pool.length;   // 噪声≠真字
    return pool.charAt(idx);
  }
  function decodeArm(n, text){
    n.removeAttribute('textLength');                       // 先撤钉，量的才是自然宽度
    var w = n.getComputedTextLength();   // 量**推进量**（advance），不是 getBBox 的墨盒
    n.setAttribute('textLength', w.toFixed(1));
    n.setAttribute('lengthAdjust', 'spacingAndGlyphs');
    DECODE[n.dataset.key] = {n:n, text:text};
  }
  /** 逐拍写：与 capProgWrite / capLitWrite 排在同一处（**换句分支之后**），因为要靠
     capSent——写在前面就会拿上一句的时长算这一句的进度（0.16.0 那条实测教训）。 */
  function decodeWrite(t){
    for (var key in DECODE){
      var d = DECODE[key], out = d.text;
      var full = window.__coursewareShotMode || mqReduce.matches ||
                 !capSent || !(capSent.duration > 0);
      if (!full){
        var len = d.text.length;
        var k = Math.max(0, Math.min(1,
              (t - capSent.start) / capSent.duration / decodeLead()));
        /* 0.33.0 落定节奏从线性改**缓出**：`res = round((1-(1-k)²) × 字数)`。
           线性等距蹦字读成"打字机"——每字一视同仁，正是动效目的审计要砍的机械
           逐字；缓出的导数 2(1−k) 在 k 大时趋 0，于是前几字快速定住、末字从容
           沉底（旁白念到词尾本来就该放慢，读作"这个词被认出来了"而不是"逐字
           报数"）。末字落定点也从 `lead×(N−.5)/N`（四字 .63 / 五字 .65）提前到
           `lead×(1−sqrt(.5/N))`（四字 .465 / 五字 .492）——整词更早完整，留给
           读者的静置更长（lead=.72 仍是最晚上限，这句没变）。 */
        var e = 1 - (1 - k) * (1 - k);
        var res = Math.min(len, Math.round(e * len));
        if (res < len){
          var s = d.text.slice(0, res);
          for (var i = res; i < len; i++) s += decGlyph(d.text.charAt(i), i, k);
          out = s;
        }
      }
      if (d.n.textContent !== out) d.n.textContent = out;   // 同值不重写（每帧都跑）
    }
  }

  /** 数字落定的时长：只从令牌读（--dur-roll），改名删名 parseFloat 得 NaN 落回
      默认档 .5s（与位移 --dur-move 同档的口径）。与 depthShift 读 --par-far 同一模式。 */
  function rollDur(){
    var cs = getComputedStyle(document.documentElement);
    var d = parseFloat(cs.getPropertyValue('--dur-roll'));
    return isFinite(d) && d > 0 ? d : 0.5;
  }
  /** 数字落定（0.37.0，count roll）：计数读数从旧值滚到新值，中间值按 audio 时钟
     现算（easeOutExpo，与 --ease-out 同族）。三条边界：
       ① 终值写在呈现属性 data-count 上，由 put() 每步落；COUNT 每步清空、renderer
          重挂——"这一步有没有数字在滚"是 (scene, step) 的纯函数，导出冷启动 seek
          到那一帧也照样是该滚的一步；
       ② **导出截图与 reduced-motion 落终值**——数字是"量"不是"进度"，定格里要
          读得到"比较了 3 次"而不是"滚到 2.4 次"（与 transition 原语同一口径：
          关的是过程，档位照留；--lit / 细线那些真读数才逐拍留中间值）；
       ③ 逐拍写 textContent、同值不重写（与 --lit / capProgWrite 同一读数区、
          同一"每帧都跑"的代价口径）。 */
  function countRollWrite(t){
    var full = window.__coursewareShotMode || mqReduce.matches;
    for (var key in COUNT){
      var c = COUNT[key];
      if (full){ if (c.n.textContent !== c.final) c.n.textContent = c.final; continue; }
      var p = Math.max(0, Math.min(1, (t - c.t0) / c.dur));
      var e = 1 - Math.pow(2, -10 * p);                  // easeOutExpo（--ease-out 同族）
      var v = c.from + (c.to - c.from) * e;
      if (v === 0) v = 0;                                // 过零那一帧不许显示 "-0.0"
      var s = c.dec ? v.toFixed(c.dec) : String(Math.round(v));
      if (c.n.textContent !== s) c.n.textContent = s;    // 同值不重写（每帧都跑）
    }
  }

  /** 量条（0.42.0，meter）：几何量读数从旧长滚到新长，中间长度按 audio 时钟现算
     （easeOutExpo，与数字落定同族）。它和 countRollWrite 是同一个"量"的两张皮——
     数字滚字身、量条滚长度，所以**量不是进度**：导出截图与 reduced-motion 落
     scale(1 1) 全满（定格里读得到"这条有多长"），live 播放逐拍滚中间长度。三条边界：
       ① 登记口在 put()：data-meter 的 rect 是量条（自然宽 = 全量），目标值变化那
          一步登记进 METER（from = 旧宽/新宽）；首次建档与长度未变都不滚（入场照旧
          走 .in，同宽不重写，上一步打断的 scale 由 put() 归位）；
       ② 起点是句首（stepT0），与 countRollWrite 同一只时钟、同一个 --dur-roll 拍；
       ③ 逐拍写 transform 属性（scale(sx 1)，等宽 1e-4 档）、同值不重写；.meter 的
          transition:none 让 CSS 不参与（.nt 的 width/transform 补间会与滚动的 scale
          双重叠加）；只做 rect，圆头在缩放中会被压扁——要圆头就把圆角画在外层。 */
  function meterWrite(t){
    var full = window.__coursewareShotMode || mqReduce.matches;
    for (var key in METER){
      var m = METER[key];
      if (full){ var fs = 'scale(1 1)'; if (m.n.getAttribute('transform') !== fs) m.n.setAttribute('transform', fs); continue; }
      var p = Math.max(0, Math.min(1, (t - m.t0) / m.dur));
      var e = 1 - Math.pow(2, -10 * p);                  // easeOutExpo（--ease-out 同族）
      var s = m.from + (m.to - m.from) * e;
      if (p >= 1) s = m.to;                              // 收尾那一帧不许留 0.999 的缝
      if (s <= 0) s = 0;                                 // 过零那一帧不许出负长度
      var st = (s === 1) ? 'scale(1 1)' : 'scale(' + (+s.toFixed(4)) + ' 1)';
      if (m.n.getAttribute('transform') !== st) m.n.setAttribute('transform', st);  // 同值不重写
    }
  }

  /* 词拍的令牌缓存（0.39.0）：与 ffThreshold / rollDur 同一口径——词拍参数是设计期
     的舞台参数，不是运行期开关，读一次就缓存；改名删名 parseFloat 得 NaN，落回默认档。 */
  var CUE_T = null;
  function cueTokens(){
    if (CUE_T) return CUE_T;
    var cs = getComputedStyle(document.documentElement);
    function n(name, dflt){
      var v = parseFloat(cs.getPropertyValue(name));
      return isFinite(v) ? v : dflt;
    }
    CUE_T = {pad:n('--cue-pad', 7), arm:n('--cue-arm', 14),
             lead:n('--cue-lead', .08), pause:n('--cue-pause', 1.2),
             settle:n('--cue-settle', .56)};
    return CUE_T;
  }
  /** 一个字符在词窗估算里占几个"字数"：标点按 --cue-pause 折算成停顿，空白最轻。
   *  它不是音素级对齐，只是把这一句的时长按可读的权重摊开——中文口播的标点停顿
   *  约 0.2s（范本平均字速 0.153s/字，即 1.3 字），取 1.2 略保守（宁早勿晚）。 */
  function cueWeight(ch){
    if (/[，。、；：！？,.;:!?…—]/.test(ch)) return cueTokens().pause;
    if (/\s/.test(ch)) return .3;
    return 1;
  }
  /** 词窗起点（秒）：第 nth 次出现的 word 之前的权重 ÷ 全句权重 × 句长，再往前让
   *  --cue-lead 一拍、夹在句首。找不到 / 空词返回 null（整条不画，与 callout 同口径）。
   *  纯函数：只吃 (cue, sentence)，不读历史——导出冷启动 seek 到同一秒得到同一个词窗
   *  （纪律 1）。 */
  function cueAt(c, s){
    var text = (s && s.text) || '';
    var idx = -1, from = 0, i;
    for (i = 0; i < c.nth; i++){
      idx = text.indexOf(c.word, from);
      if (idx < 0) return null;
      from = idx + c.word.length;
    }
    var T = cueTokens(), pre = 0, mid = 0, total = 0;
    for (i = 0; i < text.length; i++){
      var w = cueWeight(text.charAt(i));
      if (i < idx) pre += w;
      else if (i < idx + c.word.length) mid += w;
      total += w;
    }
    if (!(total > 0) || !(mid > 0)) return null;
    var dur = +s.duration || 0;
    var t0 = s.start + pre / total * dur - T.lead;
    return Math.max(s.start, t0);
  }
  /** 逐拍写 .on：同一条 cue 从词窗起点一直亮到本步结束——标记**累积**，一句点三次
   *  就是三道括号依次留下；导出每帧截在句末，所以成片里读得到"这一句点过谁"。
   *  `capSent` 是字幕当前这一句：空档里仍停上一句，标记照旧在；换步时 CUE 与
   *  #cues 整层一起重建，标记随步清零（(scene, step) 纯函数，纪律 1）。
   *  **几何也在这里补**：词窗打开的那一拍先量一道，再在句首后的 --cue-settle 窗口内
   *  逐拍重量（同一 d 不重写）。为什么不放 drawCues：本步刚建档的目标还在从占位
   *  尺寸补向真尺寸，建层时量到的是半截盒；词到之前量又会把一帧的入场误差冻死。
   *  窗口过后目标在本句内不再动，量一次就够——不是每帧都量。
   *  这是**读数**不是动效：与 --lit / #cap-prog / 数字落定同族，不进 reduced-motion
   *  清单；被切掉的是 CSS transition（关过程不关档位）。 */
  function cueWrite(t){
    var settleT = stepT0 + cueTokens().settle;
    for (var i = 0; i < CUE.length; i++){
      var c = CUE[i];
      if (!c.node) continue;
      var t0 = capSent ? cueAt(c, capSent) : null;
      var on = t0 !== null && t >= t0;
      // 还没量过（首次打开 / seek 到句中）：补一道；入场窗口内：跟着目标重量。
      if (on && (c.measT < 0 || t < settleT)) cueGeom(c);
      if (on !== !!c.on){ c.on = on; c.node.classList.toggle('on', on); }
    }
  }

  // ══ ④ 侧栏：参考要点（renderNotes）══════════════════════════════════════
  // 侧栏 = 常驻结构化文档（小结/扩展/注意 + 可选 code 短代码行 / kv 对照行 / at 跳转锚），
  // 不产证据（interactions.md §1）：不随旁白高亮、不读 data-kp；加载时渲染一次，
  // **播放中不同步**。at 是唯一例外：点击只是替用户 seek 一下，走带逻辑本身不读侧栏。
  // 要做"可观测判断"的手感实验一律走画布门禁，这里只留挂不上转折点的纯手感对照。
  var NOTES = [
    { ico:'🔤', title:'默认是字符串序', open:true,
      s:'不传比较函数时，元素先转成字符串，再按字符逐个比较。',
      x:'所以 [10,9,1] 会得到 [1,10,9]。',
      c:'想按数值排，必须自己传比较函数。',
      code:'// 结论，不是 bug\n[10,9,1].sort() → [1,10,9]', at:4.939 },
    { ico:'🔎', title:'逐位比较', open:false,
      s:'从左到右，第一个不同的字符定胜负；前缀相同则短的更小。',
      x:'"1" vs "10"：首位相等，短的没有第二位，算小。',
      c:'比较的是"字符"，不是"数值"——反直觉的根源。',
      code:'"1" < "10"  → true', at:20.846 },
    { ico:'🎲', title:'位数相同才碰巧一致', open:false,
      s:'[1,2,3] 看着对，只是因为位数恰好相同。',
      x:'一旦位数不同，字符串序和数值序就分道扬镳。',
      c:'别被这个巧合骗过。',
      code:'[1,2,3].sort() → [1,2,3] ✓ 巧合', at:44.722 },
    { ico:'⚖️', title:'比较函数只看符号', open:false,
      s:'返回 负 / 零 / 正，分别代表 a 在 b 前 / 相等 / a 在 b 后。',
      x:'(a,b)=>a-b 就把数值排序交还给手写逻辑。',
      c:'返回布尔值是常见错误（见「返回数字，不是布尔值」）。',
      kv:[['返回 < 0','a 排在 b 前'],['返回 0','相等'],['返回 > 0','a 排在 b 后']], at:60.404 },
    { ico:'🔢', title:'返回数字，不是布尔值', open:false,
      s:'(a,b)=>a<b 返回 true/false，会被当成 1 / 0。',
      x:'',
      c:'结果是乱序，而且不报错——最隐蔽的坑。',
      kv:[['(a,b) => a < b','✗ 返回布尔'],['(a,b) => a - b','✓ 返回数字']], at:78.426 },
    { ico:'⚓', title:'稳定排序', open:false,
      s:'比较结果为 0（相等）的元素，保持原有的相对顺序。',
      x:'同分时谁先录入，谁就排在前面。',
      c:'JS 的 sort 自 ES2019 起保证稳定。', at:94.599 }
  ];
  function renderNotes(){
    var host = el('notes');
    NOTES.forEach(function(n){
      var li = document.createElement('li');
      li.className = 'note'; li.dataset.open = n.open ? '1' : '0';
      // 折叠头是 <button> 不是 <div>：div 上只挂 click，键盘 / 屏幕阅读器
      // 根本进不来——全局 :focus-visible 也救不了没有 tabindex 的元素
      var head = document.createElement('button'); head.className='note-h'; head.type='button';
      head.setAttribute('aria-expanded', n.open ? 'true' : 'false');
      var ico = document.createElement('span'); ico.className='n-ico'; ico.textContent=n.ico;
      var title = document.createElement('span'); title.textContent=n.title;
      var caret = document.createElement('span'); caret.className='n-caret'; caret.textContent='▾';
      head.append(ico,title,caret);
      var body = document.createElement('div'); body.className='note-body';
      var inner = document.createElement('div'); inner.className='n-inner';
      // 三类信息等级不同（CSS §③）：小结 = 正文不给标签，扩展/注意留暗色小字标签。
      // 空值直接跳过——曾经无条件渲染三行，x 留空时会多出一条"只有标签没有正文"的断行。
      [["s",null,n.s],["x","扩展",n.x],["c","注意",n.c]].forEach(function(row){
        if (!row[2]) return;
        var line=document.createElement('div'); line.className='n-row '+row[0];
        if (row[1]){
          var tag=document.createElement('span'); tag.className='n-tag '+row[0]; tag.textContent=row[1];
          line.appendChild(tag);
        }
        var txt=document.createElement('span'); txt.className='n-txt'; txt.textContent=row[2];
        line.appendChild(txt); inner.appendChild(line);
      });
      // code：结论式短代码行（每行 ≤26 字符，窄栏不折行），// 开头的行降为暗色注释。
      // 全部走 textContent——侧栏文案来自构建脚本，不给它经 HTML 解析的机会。
      if (n.code){
        var pre=document.createElement('div'); pre.className='n-code';
        var lines=n.code.split('\n');
        lines.forEach(function(line, i){
          if (line.indexOf('//') === 0){
            var cm=document.createElement('span'); cm.className='cm'; cm.textContent=line;
            pre.appendChild(cm);
          } else pre.appendChild(document.createTextNode(line));
          if (i < lines.length-1) pre.appendChild(document.createTextNode('\n'));
        });
        inner.appendChild(pre);
      }
      // kv：并列的「记法 → 结论」速记行（一条用 code，两三条并列判决用 kv）。
      if (n.kv){
        var box=document.createElement('div'); box.className='n-kv';
        n.kv.forEach(function(p){
          var k=document.createElement('span'); k.className='kv-k'; k.textContent=p[0];
          var v=document.createElement('span'); v.className='kv-v'; v.textContent=p[1];
          box.append(k,v);
        });
        inner.appendChild(box);
      }
      // at：跳转锚。只写 currentTime，与点进度条同一 seek 语义（timeupdate 兜底重画），
      // 不碰播放/暂停态——侧栏对走带逻辑保持只读。
      if (typeof n.at === 'number'){
        var jb=document.createElement('button'); jb.className='n-jump'; jb.type='button';
        jb.textContent='\u21e8 看这一节 '+fmt(n.at);
        jb.addEventListener('click', function(){ audio.currentTime = n.at; });
        inner.appendChild(jb);
      }
      body.appendChild(inner); li.append(head,body);
      li.querySelector('.note-h').addEventListener('click', function(){
        li.dataset.open = (li.dataset.open === '1') ? '0' : '1';
        this.setAttribute('aria-expanded', li.dataset.open === '1' ? 'true' : 'false');
      });
      host.appendChild(li);
    });
  }
  renderNotes();

  // ══ ⑤ 门禁：唯一的证据通道。五种形态各一（数量与题型怎么选见 interactions.md

  var GATES = [
