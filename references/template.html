           `.3em` = 3.9px，范本八句 tagline 实测 Range 行度**全为 1**，最长那句
           （closing 那句 22 字）散开档字宽 293.5 → 382.2px，容器 886px——余量够，
           `text-wrap:balance` 不会中途把句子劈成两行。
       ④ 窄屏关掉，是**按余量**关的而不是"实测会断"：500px 档字号升到 14px、容器
           掉到 449px，最长那句散开档实测 315 → 411.6px，仍是一行但只剩 37px 余量。
           作者文案比范本长一点就断行，而断行落在哪一秒跟着帧变——那是抖，不是收拢。
           所以 `@media (max-width:560px)` 分支里把这条关了（实测关后 `animationName`
           为 `none`、类名还挂着，字一个字不少）。 */
  .gather{animation:gatherIn var(--dur-gather) var(--ease-out) backwards}
  @keyframes gatherIn{from{letter-spacing:var(--track-open)}to{letter-spacing:0}}
  /* 擦除揭示（0.15.0，前沿做法：wipe reveal）：不是"淡进来"，而是**从一侧扫出来**——
     像擦掉一块遮布。用在"这一行/这条线是刚刚长出来的"那种场合，方向本身带信息
     （左→右读作"往后推演"，右→左读作"回溯"），比同质的淡入多一层语义。
     四条边界，都是实测出来的：
       ① 只裁剪不位移——`getBBox()` 全程不变（实测 300 / 464.3 两值不动），所以
          相机取景、窄屏兜底与 QA 几何判定一概不受影响；命中测试同理跟着裁，
          被擦掉的那半截点不到，不会留下"看不见但点得着"的幽灵区；
       ② 挂在**包装 <g>** 上而不是图元本身：`clip-path` 与 `.nt` 的 transform
          补间同节点会互相干扰（裁剪盒跟着缩放走），分层之后各管各的；
       ③ 终态要**显式写成 `inset(0 0 0 0)`**，不能偷懒只写 from。只写 from 时，隐式
          to 取元素自身的 `clip-path`（默认 `none`），而 `inset()` 与 `none` **不可插值**，
          浏览器按 discrete 处理——实测整条动画只有"全遮"和"全显"两个画面、中间在
          50% 处硬跳一下，那是闪，不是擦。写成两端都是 `inset()` 才连得上补间
          （实测同一条动画采到 24.6% / 46.3% / 63.1% …一路连续的 inset 值）；
          元素自己的计算值仍是 `none`，动画跑完（fill-mode 不写 forwards）落回
          完整揭示，导出截图页一刀切掉 animation 后同样落在**完整揭示**的定格上
          （实测切掉后 left/right 命中都为 1、计算值回到 none），与循环动画
          0% = 静止态那条纪律同源；
       ④ 与 `.in` 一样用 `backwards`：延迟期间停在"还没擦出来"，而不是先闪现再擦。
     fill-mode 不写 forwards：钉住终态会让下一次 setAttribute 的 opacity 被压住
     （见上面舞台运动学 ②）。 */
  @keyframes wipeR{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
  @keyframes wipeL{from{clip-path:inset(0 0 0 100%)}to{clip-path:inset(0 0 0 0)}}
  .reveal{animation:wipeR var(--dur-reveal) var(--ease-out) backwards}
  .revealL{animation:wipeL var(--dur-reveal) var(--ease-out) backwards}
  /* 收拢退场（0.19.0，.reveal 的反函数）：仓库此前的退场只有一条词汇——写
     `opacity:0` 再等 `sweep()` 撤走，**读过的那一行忽然没了**。.reveal 已经证明
     方向本身带信息（那一条写的是"左→右读作往后推演，右→左读作回溯"），.tuck 把
     同一件事反过来讲：沿行进方向把行**收走**，读起来是"这行刚讲完、让位给下一句"。
     方向口径与 `.reveal` 一脉相承，说的是**裁切线往哪儿走**：`.tuckR` = 线自左向右移
     （左端先没，与 wipeR 揭示的走向同向，读作"往后推演式地收"）；`.tuckL` = 线自右向左
     移（右端先没，与 wipeL 同向，读作"顺着来路撤"）。方向反了就是另一句话——与 .reveal
     那两条同一条纪律（见 stage.md §3.4）。
     为什么走 **transition** 而不是 animation——这是本轮最要紧的一条判断，它决定了
     这原语能不能不污染取景、截图与可及性：
       ① 0.18.0 否决过"用 transition 驱动 dashoffset"，理由是新建档的节点没有
          "上一状态"可补间。这里前提恰好相反：收拢的对象**必然在前一步已经被写过**
          （它就是被念过的那一行），复用节点就地改 clip-path 天然有完整行程
          （实测逐帧采到 0% → 3.70 → 7.41 → 11.10 → 14.79 → 18.52 → 22.21 → 25.90%
          一路连续）。于是四条边界全部落成正面效果：冷启动第一步直接落终态
          （读过的东西本就该不在台上，与纪律 1 纯函数口径一致）；导出截图页
          `transition:none` 一刀切后落在那一秒的真实档位，**不需要见旗分支**；
          没有 `fill:forwards` 钉死终态；class 不摘也不会重放（对照 0.14.0
          `swF/swB` 那个"下一次入镜重放旧动画"的坑——那里是 animation，必须靠 JS
          摘干净；这里是属性档位，摘与不摘都落同一张定格）。
       ② 两端都必须是**带四个长度的 `inset()`**，写成 `none` 就不可插值
          （0.15.0 那条 discrete 教训，与 `.reveal` 关键帧同一条纪律）。
       ③ 挂**纯包装 `<g>`**：这一层除了 `gone` 不再写别的状态——位移、透明度、描边一律
          放内层图元（`put()` 会把它拼成 `nt tuckR`，同节点的后果见下面 ⑤）。范本两个
          消费者与 .reveal / .featherR 同写法：外层管这一条 clip-path，内层各归各的 key。
       ④ **百分比参考的是元素自己的包围盒（fill-box），不是 viewBox**——实测同一条
          `inset(0 0 0 85%)` 打在 600 长（起点 40）的组上剩 91px 可见、裁切线落在
          550 = 40 + 600×85%；打在 200 长（起点 400）的组上剩 31px、裁切线落在
          570 = 400 + 200×85%。两条都在自己宽度的 85% 处，所以一档写法对任意长的
          一行都成立。**但 85% 收不干净**：外扩的 `-15%` 让右端多出 15% 的余量，
          实测停在 355~400 那 46px 上（而且 `elementFromPoint` 仍命中，是个能点着的
          残角）。收拢档因此必须取 `100% + 15% = 115%`，把裁切线推到余量之外，
          实测静止档 `inset(-15%)` 的墨量与完全不裁逐值相同（1444）——
          `inset(0 0 0 0)` 会沿 fill-box 边缘把**描边与 `marker-end` 箭头啃掉**
          （同一根弧线掉到 1410）。
          代价是这一层不可当热区用：`getBBox()` 全程不变（实测 [200,220,300,20]），
          命中跟着裁，收拢到 85% 那一档整行中段已点不着（`elementFromPoint` 落回
          `svg`）——**需要 Learner 点的图元不要收拢，让它留在台上或撤走**。
       ⑤ **`.nt` 与 `.tuck*` 不能同节点**——本轮实测的一条静默坑，不是理论担忧。
          `put()` 给每个新建档的节点无条件塞 `class:'nt in'`，传了 `class` 就拼成
          `nt <你的>`；而 `.nt` 声明的是**整条 transition 简写**（transform/opacity/fill/
          stroke/几何 十几项，不含 clip-path），`.tuck*` 也声明简写（只含 clip-path）。
          两条撞在一个节点上时，**赢的那条把输的那条整串清单清掉**（简写就是全属性重新
          赋值，不是合并清单）——实测 `.tuckR` 在源序更靠后，所以它赢：计算值
          `transition-property` 只剩 `clip-path` 一项，同节点上 `transform` 每帧读到的都
          是终值 320、`opacity` 每帧都是终值 .2，**一步落档**。把 class 属性里的顺序换成
          `tuckR nt` 再测一遍，结果逐值相同——**谁赢只看 CSS 源序，不看 class 写法顺序**，
          所以这条没法靠"把 tuckR 写前面"绕开。外层管 clip-path、内层管 transform 那种
          分层写法两路都连续（实测外层收拢 26.5 → 73.2 → 94.8 → … → 115% 与内层
          位移 100.8 → 201.6 → … → 320 同时逐帧在跑）。所以：`.tuck*` 只挂在纯包装 g 上，
          那个 g 自己不再写任何 `.nt` 会补间的属性，收拢只靠 `gone` 这一个 class，
          不跟着换 opacity——下面两个消费者都照此写。
     与 `.reveal` 同属"裁剪类"，所以命中与取景的口径一致：`getBBox()` 不受影响，
     相机取景与 QA 几何判定看不见这一层。 */
  .tuckR,.tuckL{clip-path:inset(-15% -15% -15% -15%);
        transition:clip-path var(--dur-tuck) var(--ease-out)}
  .tuckR.gone{clip-path:inset(-15% -15% -15% 115%)}
  .tuckL.gone{clip-path:inset(-15% 115% -15% -15%)}
  /* 羽化揭示（0.17.0，前沿做法：mask 渐变停靠点补间）：与 .reveal 同一句话
     "这一行是刚长出来的"，但**边缘是软的**——clip-path 的边界是一条硬边，扫过去
     像切纸；mask 的渐变带推过去像光晕掠出，读起来更轻，适合"结论/记法"这种
     不想打扰观众的内容。四条边界都是实测出来的：
       ① **静止态必须是全显**：驱动变量 --feather 注册成 `<percentage>`，
          initial-value 取终值 134%（不透明段占到 calc(134% − 34%) = 100%，
          整条遮罩带已移出元素右侧）。这一条同时兜住三种"动画没跑"的情形：
          不支持 @property（替换后仍是合法 100%，遮罩直接全开）、不支持
          CSS mask（声明作废、完整可见）、导出截图页一刀切掉 animation
          （落回元素自身值 = 全显）。**内容绝不锁进可能不跑的门**（纪律③），
          与 0.16.0 滚动入场那条同一口径；
       ② **mask 不裁命中测试**——这是它和 clip-path 最关键的区别，实测：把
          rect 左半边遮掉之后，`document.elementFromPoint` 打在那半边**照样命中
          rect**（clip-path 同样操作则不命中）。所以羽化层必须自带
          `pointer-events:none`：宁可"这一层不可点"，也不能留一块
          "看不见却点得着"的幽灵区（.reveal 靠裁剪天然没有这个问题）。
          **需要 Learner 点的图元一律用 .reveal，不用 .featherL/R**；
       ③ 挂在**包装 `<g>`** 上，不进 .nt 的 transition 清单：mask 的参考盒是元素
          包围盒，跟 .nt 的 transform 补间同节点会一起被缩放（0.15.0 那条
          clip-path 教训同一课）。实测 `getBBox()` 全程 [4,6,292,28] 一格不动，
          所以相机取景、窄屏兜底与 QA 几何判定不受影响；
       ④ 两端都写百分比、且用 `backwards`：动画从 0%（全遮）推到 134%（全显），
          fill-mode 不写 forwards——跑完落回元素自身的 134%，与 .reveal 同口径。
     实测逐帧采到 0% → 27.9% → 53.0% → 78.2% → 103.3% → 134% 一路连续的
     --feather，像素层也确认是**从左到右逐段显影**（右端最后落地）；走
     transition 那条（renderer 只写目标档位的口径）同样采到 0/19.5/41.9/64.2/
     86.5/108.9% 的中间值。 */
  @keyframes feSoft{from{--feather:0%}to{--feather:134%}}
  .featherR,.featherL{pointer-events:none;mask-repeat:no-repeat;
        animation:feSoft var(--dur-feather) var(--ease-out) backwards}
  /* 遮罩带 = 34% 宽的斜坡 + 其后全不透明；**方向只由 gradient 轴向决定**，
     补间本身两头共用一条 keyframes（90deg 的 0% 在左、270deg 的 0% 在右）。 */
  .featherR{mask-image:linear-gradient(90deg,#000 0 calc(var(--feather) - 34%),
                        transparent var(--feather) 100%)}
  .featherL{mask-image:linear-gradient(270deg,#000 0 calc(var(--feather) - 34%),
                         transparent var(--feather) 100%)}
  /* 章节头翻场微动效：只在**真的换节**时由 tick() 重触发（同字幕翻句的口径——
     文本没变就不重放）。它是"你换了一节"的位置 cue，不承担信息：入场用
     backwards，终态就是元素本来的样子，导出切掉动画后定格不变。 */
  .chapter.chFlip{animation:chFlip var(--dur-ch) var(--ease-out) backwards}
  @keyframes chFlip{from{opacity:0;transform:translateY(6px)}}

  /* 字幕翻句微动效：只在文本真的变化时由 capShow 重触发（.capLift），
     纯 transform 上浮——检查器查的是 opacity/visibility 链，动效不影响
     字幕可见性判定；空档保留上一句（capShow 不调用）也不会误触发。 */
  #cap-text.capLift{animation:capLift var(--dur-cap) var(--ease-out) backwards}
  @keyframes capLift{from{transform:translateY(6px)}}

  /* 结论句划重点（0.14.0，kinetic typography 的克制版）：`hl:true` 那一句除了换色，
     再沿自己的字宽划一道半透明色带——给"这是结论"一个**连续的动画**，而不是只换个颜色。
     几何取自 `#cap-text` 自己的 `getBBox()`，所以小屏字号分档（字幕 26px）天然跟着走，
     不补第二套口径。`x` / `width` 是 SVG 的 CSS 几何属性（Chrome 152 实测可补间：
     宽从 0 长到 136.4px），同时把值也写进呈现属性——不支持这两条 CSS 属性的浏览器
     直接落终态，定格仍是"划完的样子"。
     **非结论句一律写 0 宽**：收起与起点是同一次写，下一句结论才会"长出来"而不是瞬现。
     只写状态、不排程（纪律 1），导出截图页切掉 transition 后落在完整色带上。 */
  #cap-hl{fill:var(--key);opacity:.22;pointer-events:none;rx:2;
          transition:width var(--dur-hl) var(--ease-out),x var(--dur-hl) var(--ease-out)}
  /* 跟读点亮（0.19.0，karaoke ink）：句内细线说"这句念到哪儿了"（读数落在**线**上），
     这一层把同一件事落在**字本身**上——念过的字保持全亮，未念的字压到一档灰阶地板。
     它是字幕的**派生视图**，不是第二份文案：文本仍只有 `#cap-text` 一份，
     点亮只是当句 bbox 与 currentTime 的函数，QA 比对节点不变。
     四条口径，前两条与前两轮同源，后两条是本轮新量出来的：
       ① **逐拍写、不挂 transition**：与 `#cap-prog` 完全同一条理由——它是时钟读数，
          补间只会让它永远落后于正在念的那个字。所以它**不进 reduced-motion 清单**
          （关了动效它也得跟上嘴），也不需要见旗分支（截图那一帧落的正是那一秒）。
       ② **用 mask 而不是 clip-path**：理由只有一条——这一层要的是"压暗"，不是"裁掉"。
          clip-path 只有在与没有两种，未念的字会整颗消失，那就不再是跟读（"读过的"与
          "没读到的"必须在同一行里同时可读）；mask 的两个停靠点是同一条渐变的两侧，
          软边天然给出"还没念到，但看得见"。
          顺带把 QA 那一侧的量补齐（本轮实测，别按"mask 才安全"想当然）：**两者都不改
          `getClientRects()`**——给 `<text>` 加 `inset(-15% -15% -15% 60%)` 之后
          `getClientRects().length` 仍是 1、`getBBox()` 仍是 255 / 222.5 逐值不动，
          `check_gates.py` 的 `captionShown()`（祖先链样式 + 零尺寸）与相机取景都看不见
          这一层。真正被裁的只有**命中测试**（同一把尺子上 0.15 / 0.5 两处点不着、
          0.85 照旧命中，与 0.15.0 `.reveal` 那条一致）——字幕带不是热区，所以这一条
          在本层无感，但它正是 `.tuck` 那边"需要 Learner 点的图元不要收拢"的由来。
       ③ **静止态必须是全亮**：`--lit` 的 initial 取 **118% = 100% + --lit-ramp**，
          停靠点落到元素之外，整行落在不透明段上。不支持 @property（`calc(var(--lit) -
          var(--lit-ramp))` 替换后仍是合法百分比、遮罩全开）、不支持 CSS mask（整条声明
          作废）、JS 一次都没写过（开场前带子本就收起）这三种"没跑"的情形都落在
          **整句可读**上（纪律③）。写 100% 就把每句末尾那 18% 永久留在地板上——
          静止态变成"句尾永远没念到"，纪律③直接不合格。
       ④ **地板档要按合成后的颜色过对比度**：`--lit-floor:.85` 是把 stop-opacity 合成到
          真实字色与真实底色的结果（口径见 §8"半透明按合成后的颜色算"，取值过程见 :root
          那段注释）。实测两档字色对两档底色：非结论 7.97 / 8.53:1，结论 6.08 / 6.53:1；
          再往下压一档（.72）墨量差确实更大（255 制均值差 20.4 → 38.9），但结论那档只剩
          4.76:1，等于把"这一句是结论"的字压到贴线；往回到 .92 那档墨量差只有 10.6，
          肉眼分不出念没念过——跟读这层就白做。三档 k 的墨量单调（见测试里那条比例断言）。
     mask 的参考盒是被遮元素自己的包围盒（`#cap-text` 的 bbox），横向起止跟着当句字宽
     走，与色带、细线同一套现量口径；`text-anchor:middle` 不用改——遮罩作用于**渲染后
     的字身**，与排式无关。 */
  #cap-text{mask-image:linear-gradient(90deg,#000 0 calc(var(--lit) - var(--lit-ramp)),
                        rgba(0,0,0,var(--lit-floor)) var(--lit) 100%)}
  /* 句内进度细线（0.16.0，"时间刻度层"第一条）：结论色带说"这句是结论"，这条细线说
     **"这一句念到哪儿了"**——卡拉OK / 现在播放进度条借过来的做法，但它落在字幕自己的
     宽度上，不新增一行常驻 UI。三条口径都是刻意的：
       ① **只写呈现属性、不挂 transition**：它是时钟的逐拍读数（和 #fill 同类），
          补间会让它**永远落后于正在念的那个字**——细线的意义正是"跟上嘴"。
          也正因为终态就在属性上，导出截图页一刀切掉 transition/animation 之后
          每帧落在的都是那一秒的真实进度，不需要见旗分支（runtime.md §7）；
       ② 几何从 `#cap-text` 现量（capShow 里存一次），与结论色带同一口径——
          桌面 17 / 小屏 26 两套字号，写常数必错位；
       ③ 细线在**字幕自己那一列**里，横向起止跟着 bbox 走，所以说话人标签
          （左端 x=44 起）不会被它压住。它是字幕带的派生视图，**不是第二份文案**，
          QA 比对节点仍是 #cap-text。 */
  #cap-prog{fill:var(--key);opacity:.5;pointer-events:none;rx:1}
  /* 视差景深（0.14.0）：镜头挪一次时**远景比近景走得慢**——单层运镜只说明"看哪儿"，
     两层速度差才说明"画布是有深度的空间"。#depth 与 #cam 是兄弟节点、同一个坐标
     空间，位移量因此就是世界坐标；不放进 #cam 是因为那里已经有一层 transform
     属性值，再叠 CSS transform 会互相顶掉。背景是纯装饰（不进 contentBox，不承载信息）。 */
  /* 对焦（0.35.0）：镜头推近的确认拍。取景窗只回答"框住哪儿"，失焦把"该看哪儿"
     从构图升级成景深——#depth 是远景层（点阵 + 柔光），镜头推得越深它越虚，推回
     即复原。状态由 camSet() 按取景窗倍率现算写进 --defocus，CSS 只补间过程；
     filter 与 transform 共用派生时长 --cam-dur——对焦和运镜是一回事，不引入第二套
     时钟。reduced-motion 与导出截图切掉补间后落当步真实档位（锐 = 0px / 虚 = 当步值）。 */
  #depth{--defocus:0px;filter:blur(var(--defocus));
         transition:transform var(--cam-dur) var(--ease-out),
                    filter var(--cam-dur) var(--ease-out)}

  /* ── 落点与过场（0.22.0）：移动聚光 / 快进掠擦 / 浮层离散进出 ─────────────
     三条都在回答"下一步该看哪儿、刚才到这儿来路变了没有、这块浮层正在进出"，
     用的却是三个不同层面：#spot 动的是**遮罩几何**、#ffwd 动的是**独立 translate
     属性**、.pregate 动的是**离散属性 display**。共同点：终态都不动内容——关掉
     动效之后画面一格不少。 */

  /* 移动聚光（0.22.0，attention 的空间版）：0.13.0 的 `[data-dim]` 说的是"这一格
     退到背景"（改的是**材质**，挂在图元自己身上），这一条说的是"看这一点"——
     图元一个都不改，只在它们上面盖一块暗幕、裁开一个洞，并把洞**移到下一步要讲
     的那个东西上**。洞会走位是这一条的全部新意：位置本身携带信息（讲解从写法框
     走到 true/false，再走到 0），材质弱化说不出"往哪儿看"，镜头推拉又要付出
     构图变化（洞在哪儿观众不必重新适应画面）。七条口径全是实测出来的：
       ① **幕深是反推的，不是挑的**：洞外留着的是要当参照读的正文。按 §8
          「半透明按合成后的颜色算对比度」逐档合成后取 --spot-k=.15（读数与推导
          过程见 :root 那条令牌注释；.18 起主色就掉出"4.5 线 + 三成余量"）；
       ② **mask 不裁命中测试**（0.17.0 那条在这里同样成立）：整层 pointer-events
         :none，洞外的 hotspot 照常可点——实测洞压在热区上，elementFromPoint 仍
          落回热区节点。别拿这层当事件对象；
       ③ 坐标用 **`<length>`（viewBox 单位）而不是 `<percentage>`**：注册成
          `<length>` 后 `circle var(--spot-r) at calc(var(--spot-x) + var(--spot-bleed)) …`
          的参考盒是遮罩定位盒，SVG 上实测 = 元素的 fill-box——**暗幕自己那块盒子**，
          不是 viewBox。加了 bleed 之后盒子左上角在 −600，所以洞心的两个数要在
          CSS 里**加回同一个 --spot-bleed**（markup 里 rect 的坐标是这份补偿的
          另一半）。长度而非百分比：JS 写进来的是 camBox() 现量的 viewBox 数字，
          换百分比就得先除一次盒子尺寸，而那个尺寸是跟着 bleed 动的数；
          口径本身实测过——把幕深临时调到 1、软边调到 200 单位横切洞沿逐像素读
          遮盖率，50% 那一点落在"局部单位 × 相机倍率"的预测位置 ±3px 内，证明
          这些长度走的是元素本地单位、镜头推拉时洞跟着缩放；
       ④ **洞心从 camBox() 现量**，不写常数（与划重点、跟读同一口径）：目标挂在
          嵌套的 `<g>` 里（范本 s2 那两个框在 d-rig 的 translate 下）时，写死的
          数字会跟着父层平移跑偏；
       ⑤ 这层是**全局的**，不随 `sweep()` 撤走：所以每一步开头由 begin() 归零，
          renderer 不声明就是没有聚光（纪律①：这是状态复位，不是计时）；
       ⑥ 洞外的那部分仍然**在场**：这一层不改 opacity / fill / 材质，只加暗——
          与 `[data-dim]` 可以叠用，但同一格里别指望两者互相补偿；
       ⑦ 幕要盖住的是**整个取景框**，不是 viewBox：暗幕住在相机里按世界坐标铺，
          倍率钳位下限 .85 时可见区宽达 1000/.85 ≈ 1176 单位，窗心贴台口时左右各
          超 588（竖直 396/.85 ≈ 466，上下各超 233）。照 0,0→1000,460 铺，幕沿会
          在镜头拉开时进画，读数变成"画面里凭空多出一条不暗的边"——那带的还是
          错的信息（纪律③）。所以四边各向外多铺 --spot-bleed（推导与实测漏值见
          :root 那条令牌注释）。 */
  #spot{fill:var(--spot-ink);opacity:0;pointer-events:none;mask-repeat:no-repeat;
        mask-image:radial-gradient(circle var(--spot-r)
                        at calc(var(--spot-x) + var(--spot-bleed))
                           calc(var(--spot-y) + var(--spot-bleed)),
                        transparent 0 var(--spot-r),
                        #000 calc(var(--spot-r) + var(--spot-soft)));
        transition:--spot-x var(--dur-spot) var(--ease-out),
                   --spot-y var(--dur-spot) var(--ease-out),
                   --spot-r var(--dur-spot) var(--ease-out),
                   opacity var(--dur-spot) var(--ease-out)}
  /* 开合挂在**呈现属性**上而不是 var(--spot-k) 的补间上：不支持 @property 的浏览器
     里 --spot-x/y/r 不补间，但 var() 替换仍然成立（初值是合法长度），遮罩照常裁出
     一个落在终位的洞——降级掉的是行程，不是内容。--spot-k 不注册就是这个理由。 */
  #spot[data-on="1"]{opacity:var(--spot-k)}

  /* 快进掠擦（0.22.0，时间跳转的确认拍）：0.13.0 的 camBlur 说的是"镜头挪了一下"
     （**空间**运镜的代价），这一条说的是"播放头跳了一下"（**时间**运镜的代价）。
     课堂上跳着看是常态——拖进度条、点章节刻度、按 ←/→ 跳 8 秒、答完门禁被拽回
     场景起点，这些时刻画面直接换了一格，学习者却不知道自己"走了多远"。三枚
     雪佛龙掠过去就是那句"刚才跳了一段"。五条口径：
       ① **只在真的跳了一句以上才演**：阈值从令牌 --ff-min 读（JS 里不写死第二个
          数，口径同 --par-far），正常逐拍前进与它差五倍；
       ② **事件不是状态**（与 .flow / .rip 同一课）：关键帧两端 opacity 都是 0、
          静止态也是 0，掠完什么都不留——导出截图页一刀切掉 animation 之后这一层
          隐形，成片里不会多出三枚箭头；
       ③ **擦洗期间不演**：手指还按在条上时"来路变了"是看得见的（0.16.0 的意图
          升级那三层读数正在动），与 camBlur / sceneSlide 同一口径；
       ④ 方向**跟着时间符号走**：往后跳 = 反向掠 + 雪佛龙镜像。镜像走独立的
          `scale` 属性、行程走独立的 `translate` 属性，两个通道各写各的，不会像
          `transform` 简写那样互相顶掉（0.13.0 / 0.21.0 那条"独立变换属性"的用法）；
       ⑤ 它在 #cam **之外**（见 HTML 那条注释）：说的是走带不是画面内容，所以
          不跟镜头缩放；代价是洞外的取景框会裁掉两端，行程因此要长过画布宽。 */
  #ffwd{opacity:0;pointer-events:none;fill:none;stroke:var(--dim);stroke-width:3;
        stroke-linecap:round;stroke-linejoin:round;
        transform-box:fill-box;transform-origin:50% 50%;scale:1;
        --ff-from:calc(var(--ff-travel) * -1px);--ff-to:calc(var(--ff-travel) * 1px)}
  #ffwd.go{animation:ffSweep var(--dur-ff) linear}
  /* 后退档：雪佛龙镜像（独立 `scale` 属性）+ 行程反向（两个 token）。两档都朝
     **自己指的那边**掠——快进向右掠出、快退向左掠出；反过来（箭头朝右却往左飞）
     读起来是"倒带"，方向自相矛盾。实测：`data-dir=f` 时 `translate` 的计算值从
     −520px 走到 +520px（viewBox 单位），折成设备像素 ±449px（×.864）；雪佛龙本体
     宽 74 单位（实测 getBoundingClientRect 63.9px）、静止位在画布中心，极位时
     rect 落在 877..941 而画布只到 893——约四分之三在画外，被 #frameClip 裁着进出。 */
  #ffwd[data-dir="b"]{scale:-1 1;--ff-from:calc(var(--ff-travel) * 1px);
                      --ff-to:calc(var(--ff-travel) * -1px)}
  @keyframes ffSweep{from{translate:var(--ff-from) 0;opacity:0}
                     20%{opacity:var(--ff-peak)}70%{opacity:var(--ff-peak)}
                     to{translate:var(--ff-to) 0;opacity:0}}

  /* ── 重量与预备（0.23.0）：挤压落位 / 预备后蓄 / 提牌投影 ─────────────
     三条都是"12 项动画原则 → 网页落地"那张对照表里的格子，而本仓库此前没有词：
     原则表里 Slow In/Out（缓动令牌）、Arc（.ride 的 offset-path）、
     Follow Through（.stag 错峰 / --ease-spring）、Staging（#spot / [data-dim]）、
     Exaggeration（弹簧过冲）都已经有对应物，唯独**挤压与拉伸**、**预备动作**、
     **次要动作（投影跟着主动作走）**三格一直空着。空着的代价不是"不好看"，是
     课堂上三个说法没法说出口：判词**落下来**了（有重量）、主角**要跳**了
     （先蓄一下）、这一对被**拿起来**比（离开了台面）。 */

  /* 挤压落位（`.settle`，Squash & Stretch 的落地版）：一个东西落到该在的那一格时
     先被压扁、再回弹收住，读作"它有质量"。五条边界：
       ① **两头由同一对令牌镜像出来**：拉伸档 = `calc(2 − --squash-x)` /
          `calc(2 − --squash-y)`，也就是绕 1 镜像——压扁 1.14×.84 与拉长 .86×1.16
          是同一个旋钮的两面，作者只改一档，行程形状不变；
       ② **体积近似守恒**（原则表要的是"压扁时体积不变"，这里只能取二维面积）：
          同一枚徽标（`a-rule`）冻结九个档位，屏幕矩形面积——静止 77.41×30.97 = 2396.9；
          压扁那一格（t=160）88.213×26.03 = 2296.1（**−4.2%**）；0% 拉长那一格
          66.576×35.92 = 2391.4（**−0.2%**）；70% 回弹那一格 75.092×32.204 = 2418.3
          （**+0.9%**）。镜像写法 `calc(2 − x)` 让拉长那一格天然比压扁那一格更接近
          守恒——观感上要的正是"砸下去那一下亏一点、弹起来那一下赚一点"，比强行开方
          取 1/x（压扁格 1.14×.877 = 100.0%）少一分橡皮感；
       ③ **支点在接触边**（`transform-origin:50% 100%` +
          `transform-box:fill-box`）：压扁时底边不动、只有顶边往下砸。九个冻结档位的
          下沿读数**一个不差全是 514.05**。原点若退回默认的 50% 50%，同一格（t=200）
          底边抬到 512.51——**抬离接触线 1.54 设备px**，约为那一格高度损失（3.10px）的
          一半：那不是落地，是悬浮（0.21.0 `.tilt` 那条"盒中心必须正好是支点"的同一课，
          只是这里要的支点恰好是包围盒底边中点，天然成立）；
       ④ **走独立 `scale` 属性，不碰 `transform`**：徽标的位移由 `transform`
          呈现属性承载（`.nt` 补间它），挤压若写进 transform 会把位移整条顶掉
          （0.13.0 那条老账）。独立属性与属性值各走各的通道，两层合成；
       ⑤ **只挂纯包装 `<g>`**：`.settle` 只声明 `animation`，因此**不抢 `.nt` 的
          transition 简写**（与 0.20.0 `.bloom` 同一判据）；但同一节点上不能再有
          第二条 `animation`——徽标的淡入 `.in` 留给内层图元，两层各演各的。
     曲线用 **linear**：行程的形状已经写进四个档位里了。同一节点上把
     `animation-timing-function` 换成 --ease-out 再冻结一次：**t=105ms（25%）就读到
     1.13742×.842954**，压扁那一格被提前到整段行程的四分之一；t=200ms 已经回到
     .998411×1.00657（肉眼等于静止），70% 那格只剩 0.97×1.04 的一点余量——等于把
     "砸下去—弹起来"演成"一开头就砸完"。linear 下 105ms 是 1.04421×.949474（还在半路）、
     160ms 才是 1.13949×.840595（压扁那一格落点）。
     `backwards`、不写 forwards：静止态 = 元素自己的 `scale:none` = 单位阵（实测
     自然演完之后 `getAnimations()` 为空、scale 读回 none），
     导出切掉 animation 之后落回"稳稳在那一格"的那张定格（纪律③）。 */
  @keyframes settleIn{
    0%{scale:calc(2 - var(--squash-x)) calc(2 - var(--squash-y))}
    38%{scale:var(--squash-x) var(--squash-y)}
    70%{scale:.97 1.04}
    100%{scale:1 1}}
  .settle{transform-box:fill-box;transform-origin:50% 100%;
          animation:settleIn var(--dur-settle) linear backwards}

  /* 预备后蓄（`.wind`，Anticipation 的落地版）：**起跳之前先往下沉一点**——
     原则表那句"物体在向前运动之前会发生细微的向后移动"。这里要的正是它：主角那排
     数字被收上架子（世界 y 232 → 84，主角自己还从 k=1 缩到 k=.46）时，如果直接走，
     观众读作"被系统搬走了"；先沉 `--wind-back` 单位再起来，才读作"它自己跳上去的"。
     五条边界：
       ① 行程挂在**独立 `translate` 属性**上，位移本体在 `transform` 呈现属性上
          （由 `.nt` 补间）——两条通道合成，谁也不顶谁（`.swF` / `#ffwd` 同族写法）。
          合成顺序 translate → rotate → scale → transform，所以 `translate` 走的是
          **父层（世界）坐标系**：在 shelf 那一格（主角自己 `scale(.46)`）量三种写法
          的屏幕位移——独立属性写 `translate:0 9px` 动 **13.997 设备px**、同一串走
          `transform` 列表且排在 `scale(.46)` **之后**只剩 **6.439**（正好被自己的 k
          缩掉）、排在**之前**又是 13.997。既然父层坐标系这一点是白送的，这一层买的
          就不是"躲开缩放"，而是**不占主角的 `animation` 位子**：主角那层的简写已经
          被 `.in` 占着，同节点再来一条就把入场淡入顶掉了（0.19.0 老账的另一面）；
       ② **幅度与方向都是令牌，不写在 JS 里**：`--wind-back` 给量，
          `--wind-dx/--wind-dy` 给轴向（默认只有竖直那一档，横向预备把
          `--wind-dx` 写在节点上即可，符号就是方向）；renderer 只写"这一步蓄不蓄"，
          不排程、不计帧（纪律 1）；
       ③ 曲线 **--ease-in-out**：一去一回是对称行程，用 --ease-out 会把"沉下去"
          演成急刹车、把"回来"演成滑行，读起来就不像蓄力了；
       ④ **主动作得为它让出那一拍**（这条是量出来的，不是美学判断）：位移走
          `--dur-move .5s` 的 --ease-out，前 95ms 已经走完大半行程，蓄力若只是"叠在
          上面"就被顶得看不见。同一拍逐 rAF 采主角屏幕 y（起点 348.17）：
            · 只蓄不让（原方案）：**最高点仍是 348.17，dip = 0.00 设备px** —— 蓄力层
              自己确实算出了 8.995px 的位移，可它在屏幕上完全没有回头，观众看不见；
            · 让 95.2ms 不蓄（对照组）：屏幕 y 先沉到 **416.75**（dip 68.58px，因为镜头
              在这一拍正往推近，被让出来的那 95.2ms 里旧位置在画面上一路下沉）；
            · 让 95.2ms 且蓄（**范本现状**，回归用例同一次跑里复量）：**429.17**，
              dip 81.00px —— 蓄力自己在屏幕上多推下来的那 12.4px 才是"它要跳"。
          所以 `--wind-hold:calc(--dur-wind * .34)` = .0952s，取的是**关键帧蓄满那一格**
          （屏幕上的最低点落在它之后的 110~126ms，因为那一拍还叠着镜头推近，两件事
          不是同一个读数）：预备是主动作的**前缀**，不是同时叠上去的第二笔；
       ⑤ 那一拍走 **transition-delay 长档**，不写 transition 简写：简写会把 `.nt`
          那份十七项清单整条顶掉（0.19.0 老账），长档只改延迟、清单与时长照旧
          ——实测挂上让拍之后 `transitionProperty` 与 `transitionDuration` 与不蓄力的
          那一步**逐字符相同**（十七项、transform .5s / opacity .4s / …），只有
          `transitionDelay` 从十七个 `0s` 变成一格 `0.0952s`。
          它必须落在**被补间的那一层**，而 `.wind` 自己在上一层，所以选择器写
          `.wind > g`（蓄力层在场 = 它的主角让拍；平时没有 `.wind`，让拍也就无从
          谈起——档位与延迟是同一个来源，不是两处状态）。
          代价说清楚：这一层的**所有**补间一起晚 95.2ms 起步，主角这层只有
          transform / opacity 有意义，屏幕上看不出来。 */
  @keyframes windIn{0%{translate:0 0}
                    34%{translate:calc(var(--wind-dx) * 1px) calc(var(--wind-dy) * 1px)}
                    100%{translate:0 0}}
  .wind{--wind-dx:0;--wind-dy:var(--wind-back);
        animation:windIn var(--dur-wind) var(--ease-in-out)}
  /* 让拍挂在**被补间的那一层**（主角 g 自己）而不是蓄力层：蓄力层只有 animation、
     没有补间可延。用 `.wind > g` 而不是给主角再写一个 class，是为了让"档位与延迟
     同一个来源"——蓄力层在场 = 它的主角让拍，不存在两处状态各写一遍的对不齐风险。
     特异度 (0,1,1) 压得住 `.nt` 的 (0,1,0)：减少动效那一块里要显式把它归零——
     实测把这条长档原样重述到媒体块**之后**，`transition-property` 仍是 `none`
     （`.nt` 那行在管），而 `transition-delay` 回到 `0.0952s`：清单空了的时候延迟
     确实不动任何东西，但兜底不该在页面上留一个"等着补间"的读数。 */
  .wind > g{transition-delay:var(--wind-hold)}
  /* 两端都是 `translate:0 0`、静止态也是 0：**事件不是状态**（与 .flow / .rip /
     #ffwd 同族）——切掉 animation 之后这一层什么都不留，位移照旧由呈现属性承载，
     导出帧落在"已经跳上去"的那一格；让拍与蓄力在 reduced-motion 里一起归零。 */

  /* 提牌投影（`.lift`，Secondary Action 的落地版：投影跟着主动作走）：把一块牌
     **提到台面上方**，靠的不是位移而是**影子**——影子从没有长出来、跟着越拖越长，
     观众才读得出"它离开台面了"。这一条说的是"谁是被拿起来比的那一对"，与颜色
     （对错）、灯（注意力）、弱化（参照）都是不同的轴。五条边界（数字全部来自
     Chrome 152 冻结采样与屏幕对拍）：
       ① **投影走 `filter:drop-shadow()`，不走 `box-shadow`**：SVG 的 `<g>` / `<rect>`
          没有盒——同一份 `0 14px 20px` 打在 `c-a-r` 与 `c-a-lf` 上，计算值读得到
          （`rgb(255, 0, 0) 0px 14px 20px 0px`），屏幕对拍 28836 个采样点**变了 0 个**；
          同一份写在一个 HTML 盒上，2408 个采样点里 2005 个变了。drop-shadow 走
          **内容的 alpha 形状**，卡片与字的影子分开、不糊成一个方框；
       ② 驱动变量 `--elev` 注册成 `<length>`，**initial 取 0px = 还在台面上**：
          不播 / 不能播 / 导出切掉 transition 三种情形都落在"没有投影、没有抬升"
          那一格（纪律③；与 --feather 取 134%、--lit 取 118% 同一条口径，只是
          这一族的终值恰好是零档）；
       ③ 抬升量与影子**都由同一个 --elev 派生**（`translate:0 calc(--elev * -1)`
          与 drop-shadow 的两个 calc），所以影子永远跟着牌走，不会出现"东西抬起
          来了、影子还在原地"那条假 3D。系数 1.5 / 1.2 说的是**影子比抬升走得远**
          ——真实光源在台面上方时，物体抬起，影子同时变长变淡。逐帧读数：清单里
          只留 `--elev` 那一档，t=122ms 时 `--elev`=3.09456px / 影子偏移=4.64184px /
          模糊=3.71347px，33 帧里偏移与 1.5× 的最大偏差 **0.00001px**、模糊与 1.2×
          为 0——派生关系逐帧成立，所以**影子不需要自己再补间一次**（把 `filter`
          也列进清单是第二套补间，量出来一样对，但多一套就多一处会不同步的地方）。
          影子的墨量是真的落在台面上：把这一层钉成 `translate:0 0`（只投影不抬）之后
          与"完全没抬"那格对拍，卡片下沿那条 106×19 的台面带里**变暗 1430 点、变亮 0 点**，
          而同状态重拍两次的噪声地板是 0 点；
       ④ 档位写在呈现属性 `data-lift="1"` 上：它承担的是"这一对被拿起来比"的
          状态读数，所以 reduced-motion 关的是**补间不是档位**（与 `#cap-hl` /
          `.tilt` / `.ride` 同一判断）——实测这一档下 `transition-property` 落 `none`，
          而 `--elev:5px`、`translate:0px -5px`、影子 `0px 7.5px 6px` 全部读得到；
       ⑤ **只挂纯包装 `<g>`**：`.lift` 自己声明 `transition` 简写，与 `.nt` 同
          节点会互相顶掉（0.19.0 那条老账）；位置、描边一律留给外层与内层。
     `pointer-events` 不禁：drop-shadow 与 mask 一样**不裁命中测试**——抬起那一格里
     牌中心的 `elementFromPoint` 仍落回字节点 `c-a-t`（不是这一层、不是灯），下沿外
     8px 落回台面 `rect`；这一层本来就盖在牌上，不需要额外退命中。 */
  .lift{filter:drop-shadow(0 calc(var(--elev) * 1.5) calc(var(--elev) * 1.2) var(--lift-ink));
        translate:0 calc(var(--elev) * -1);
        transition:--elev var(--dur-lift) var(--ease-out)}
  .lift[data-lift="1"]{--elev:var(--lift-hi)}

  /* 换位弧凸（`.swap`，0.25.0，list-reorder 的落地版）：**换位不是瞬移，也不是钻洞**——
     排序课三张卡重排成序那一步（seg-1 s2，[10,9,1] → [1,10,9]），'1' 从 x=700 直穿到
     x=300，从另两张卡中间"隧道式"穿过，读不出"换了位置"。这一族把直线位移（照旧走
     `.nt`）与一条**垂直抛物线**（offset-path，两端都回原点）叠在两层上：抛物线只在
     换位那一步演，"越过"与"让位"一目了然。五条口径：
       ① 包装层 `w-<v>-swp` 挂在蓄力层**之外**（`w-<v>-swp` → `w-<v>-ant` → `w-<v>`）：
          offset-path / offset-distance 是独立的呈现属性，不与内层 transform（槽位）或
          animation（.in）抢位置——同节点两条 transition 简写会互相顶掉（.lift 老账），
          分开成层就各演各的；
       ② 档位挂在呈现属性上（`data-go`），弧凸路径写进 `--swap-route`（**路线是数据**，
          与 `.ride` 同一条口径）：`M 0 0 Q 0 -2·rise 0 0` 是垂直抛物线，控制点 = 峰值
          ×2（二次贝塞尔 50% 处到峰，两端都在原点 = 换位完成 = 无偏移）；offset-rotate
          必须 0deg——不写的话默认 auto，卡会顺着竖直路径的切线被转成 90°；
       ③ 峰值由**行程**现算（JS 读三枚令牌，见 poseWorld）：新老槽位距离 × --swap-k、
          封顶 --swap-rise、短于 --swap-min 的平移不演弧凸（位移短 = 平移，不算换位），
          于是[10,9,1] → [1,10,9] 这一步只有越过整行的 '1' 有弧凸，让位的两张直行；
       ④ 换位判据写在 worldFor（见 JS）：**本幕内第一次"可见"换序**——两个姿势都在台
          上（op>0）。扫到就算数（sticky），所以"排好了 → 收上架子"那一步不重放；灯灭
          着的换位（off → messed）不演弧凸：看不见位置，谈不上"越过"；同一幕第二次可
          见换序（范本没有）data-go 已驻 1，弧凸不再重演——直线位移照常，不撒谎；
       ⑤ reduced-motion 与导出关的是 **transition**：`data-go` 与 --swap-route 的终值都
          在呈现属性上，一刀下去直接落"换位完成"那一格，一格信息不少（与 .ride / .tilt
          同一判断，见媒体块那一行）。 */
  .swap{offset-path:var(--swap-route);offset-distance:0%;offset-rotate:0deg;
        transition:offset-distance var(--dur-move) var(--ease-in-out)}
  .swap[data-go="1"]{offset-distance:100%}

  /* 拖尾跟随（`.trail`，0.26.0，12 项动画原则里的「跟随与重叠」overlapping action）：
     一个物体的各部分不会在同一瞬间停住——兔子落地之后耳朵还在动。网页侧的落地版是
     **主体先走，从属者各晚一格**。范本的消费者是世界层那三张卡在换位那一步：越过整行
     的那一张（行程最长）是主动作、rank 0，两张让位的按行程排 rank 1 / rank 2——于是
     "它先动，它们才让开"读得出来，而不是三张卡约好同一毫秒一起瞬移（0.25.0 那条
     list-reorder 的补集：弧凸管"怎么走"，这一条管"谁先动"）。六条口径：
       ① **只写长档 `transition-delay`，绝不重述 `transition` 简写**：主角节点身上已经
          挂着 `.nt` 那份十七项清单，再写一份简写就把它整条顶掉（0.19.0 / 0.23.0 老账，
          `.wind > g` 同一课）；实测挂上之后 `transitionProperty` / `transitionDuration`
          / `transitionTimingFunction` 三个读数与不挂时**逐字符相同**，只有 delay 变。
          delay 写成**一个值**会重复给清单里那十七项（computed 从 17 个 `0s` 收成
          一个 `0.14s`）——要的就是这个：整张卡（位移 + 淡入 + 辉光）一起晚一格，
          而不是只有 transform 晚、别的原地追。
       ② 先后**只从 --trail-step 一处派生**（`calc(var(--trail-step) * var(--trail-r))`）：
          把 .07s / .14s 抄成两份字面量就是第二个数（口径同 --wind-hold / --par-far）。
          rank 写在元素自己身上（`style="--trail-r:2"`）——排位的**事实**属于那个节点，
          档距的**尺度**属于令牌，两边各管一半。
       ③ `--trail-r` **故意不注册**：它是排位的读数（常量替换进 calc），不是要补间的
          行程；注册成 `<number>` 只是让它多一条"能被补间"的可能（口径同 --spot-k /
          --squash-x / --cam-pan）。未注册时 `calc(.07s * 2)` 照样求得出 `0.14s`（实测）。
       ④ **同一步只许一个让拍来源**：上架子那一步（`shelf`）0.23.0 已经借过一拍
          （`.wind > g{transition-delay:var(--wind-hold)}`）。它带元素选择器、特异度
          (0,1,1) 压过 `.trail` 的 (0,1,0)，实测那一步三张卡的 delay 仍是 `0.0952s`
          而不是 `0.0952s` 与 `.14s` 抢方向盘——拖尾在那里自动退让，不需要 JS 判姿势。
       ⑤ 走的是 transition 不是 animation：**事件不是状态**，但档位是读数——rank 由
          (scene, step) 现推（`poseWorld` 里按行程排），复用同一 key 换位置才演得到，
          建档那一步没有"上一计算值"、直接落终态（与 `.nt` / `.swap` 同一口径）。
       ⑥ reduced-motion 关的是**这一层的先后**：媒体块里 `.trail{transition-delay:0s}`
          一行归零。不写这一行，全局 `transition-duration:.01ms` 的钳制**管不到 delay**
          （0.18.0 在 animation-delay 上踩过同一坑，这是它的 transition 孪生兄弟），
          减少动效的人仍然会看到让位的两张卡各晚 70 / 140ms 才落。 */
  .trail{transition-delay:calc(var(--trail-step) * var(--trail-r, 0))}

  /* 换位弧痕（`.traces`，0.36.0，arc diagram 的"事后读法"）：换位那一步有 .swap 的
     弧凸（0.25.0）与 .trail 的先后（0.26.0），可两条都活在**行程里**——旁白念完停在
     句末、导出截一张定格，画面只剩"排好了"，看不出来刚才谁越过了谁。弧痕把同一段
     行程留成一组静态虚弧（旧槽位 → 新槽位），换完就停在那儿，直到这一排不复存在
     （收起 / 搞乱 / 被下一次换位取代）。几何全在 JS 的 traceAt / drawTraces，这里
     只管长相。五条边界：
       ① 虚、细、灰：这是"来过"的痕迹，不是这一步要读的内容。颜色取 --trace-ink
          （.5 的灰），比注记（--scope-ink .78 / --brace-ink .55）再轻一档；虚线
          让它在任何底上都是"参照系"，而不是又一笔结论（--strike 是删除线、
          .mark 是荧光带，两条都亮得多，这里刻意不跟它们抢）；
       ② 无箭头，方向交给**起点的小圆点**（空心圆圈，与弧同色、同粗细）。三条弧
          同时在场时，箭头会把它们读成三个"指向"；圆点只回答"它从哪一列出发"，
          安静得多，也与 .swap 里"越过整行的只有一张、让位的两张直行"同一个读法；
       ③ 只淡入（.in），不描画：描画（.draw）要靠 stroke-dasharray 从 1 到 0，而
          虚线自己的图案也占着 dasharray（同一节点两条图案会互相顶掉，0.18.0 老账）；
          更要紧的是语义——弧痕本来就是"已经在的痕迹"，不是"正在画出来"；
       ④ 不挂 vector-effect：它与卡片同属世界坐标，镜头推近时线跟着粗一档才像
          "长在画布上"（.crisp 那条分栏线是**注记**，不是世界物，两者口径不同）；
       ⑤ reduced-motion 与导出不需要单开兜底：弧痕没有位移、没有补间，只有 .in
          那一下淡入，而 ntIn 只写 from{opacity:0}——媒体块与导出页一刀切掉
          animation 后落在**满显**的同一张定格上，一格信息不少（与 .brace 同款）。 */
  .traces{pointer-events:none}
  .traces path{fill:none;stroke:var(--trace-ink);stroke-width:1.5;
               stroke-dasharray:4 7;stroke-linecap:round}
  .traces circle{fill:none;stroke:var(--trace-ink);stroke-width:1.5}

  /* ── 随动层（0.24.0）：三条都跟着一个连续量走 ─────────────────────────
     上面几组补的都是"演一次"的词汇（入场 / 揭示 / 落位 / 重量与预备），这一组
     三条都**没有"演完"这一说**：镜头跟着这一步真的走了多少（①位移定拍——消费者
     是上面那两行 #cam / #depth，它们共读派生值 --cam-dur）、辉光跟着指针落在
     哪儿（②触点辉光）、色温跟着这一段在课程的哪一档（③色温定调）。
     三条共用的口径：终态不是关键，**读数才是关键**，所以驱动量要么注册（能被
     逐帧补间）、要么挂在呈现属性上（能被测试与导出读到），没有一条靠 JS 排时长。 */

  /* 触点辉光（`.hot`，0.24.0，pointer-following highlight 的盒内版）：指针落在哪一块、
     落在这一块哪儿，光就在哪儿亮起来，并且**跟着指针走**——不是跟到那一下为止。
     与 0.22.0 的 #spot 是两套轴、可以同场：那条说的是"观众该看画面哪儿"（导演的
     手，罩在整个画布上、裁一个洞），这条说的是"你的手在这儿"（手的回话，只长在
     这一块自己盒里）。六条边界（读数见 stage.md §3.4）：
       ① 光心走**注册属性** --hot-x / --hot-y，不走 left/top：改 left/top 是每来一个
          pointermove 就重排一次（门禁卡里全是流内条目），改注册属性只重绘；这一层
          同时拿到补间——不注册的话指针快速划过时光是**整档跳**，不是跟（与 --spot-x
          0.22.0 那条同一个理由）；
       ② 位置用 **px（盒内坐标）**而初值兜在 `50%`：`<length-percentage>` 两种都收，
          JS 有盒就写 px、没有盒（display:none）什么都不写，光落在盒中心这个
          "跟着尺寸走的中性格子"上——静止、不能播、被导出切掉 transition 三格同落点；
       ③ 半径 `--hot-r` **不随块尺寸走**（64px 常数）：这是"手大的那一圈"，比选项药丸
          （高 29px）大一圈、比排序条目（高 41px）也大一圈，读起来是"光从指下漫出来"
          而不是"整块被刷亮"（刷亮是 :hover 那条 border-color 已经在做的事，不重复）；
          真要跟着尺寸走就把 `--hot-r` 换成百分比——百分比在 radial-gradient 里是
          **靠边求值**的（0.21.0 `.gather` 那条 fill-box 教训反过来用会别扭），
          本轮实测否决，见 stage.md 那一节；
       ④ **不用 `:hover` 写这一层**：媒体查询与 headless 这两处都赌不起——实测 Chrome
          152 headless 里 `hover:hover`、`pointer:fine`、`any-hover:hover` 三个全报
          false（触屏上同样为 false），`:hover` 原语在这套 QA 里永远读成"没跑通"；
          写成 JS 的呈现属性 `data-hot` 之后，它与 --hot-x/y 一起构成"指针在场与否 +
          在场哪儿"的读数，测试摸得到、导出截图摸得到（导出时没有指针 → 不亮）。
          代价也说清楚：`:hover` 那条 CSS 自有的"移出即灭"这里要 JS 补（leave / cancel
          各写一次），多指触屏上先抬的那根手指会把另一根的手指下的光关掉，这是这一条
          已知的粗糙处，本轮不解；
       ⑤ `pointer-events:none` + `border-radius:inherit`：这一层不抢命中（洞压在热区上
          照常可点，与 #spot / 涟漪 同一课），圆角跟着宿主走所以**不需要 overflow:hidden**
          ——background 本来就被自己的圆角裁住，宿主那层裁不裁都无所谓（`.hs` 是 50%、
          `.opt` 是 999px，两种都落在盒内）；
       ⑥ **注册成 `inherits:true` 才有这一层**（本轮实测纠正的一条）：数据写在宿主、
          画在宿主的伪元素，而伪元素在继承树里是宿主的**子节点**——注册时写成
          `inherits:false`，宿主上那个数根本进不去，`getComputedStyle(o,'::before')
          .getPropertyValue('--hot-x')` 永远读回初值 `50%`，计算出来的背景是
          `radial-gradient(64px, …)`（连 `at` 都被省掉），"光跟着走"整条没跑，而页面
          看上去是"亮了"的。改成 true 之后逐帧读数是 21.1 → 44.35 → 67.6px。
          "只让这一块看见"靠的是 `.hot::before` 这个**选择器**，不是靠继承开关——
          两者搞混过一次，记在这里。 */
  .hot{position:relative}
  .hot::before{content:"";position:absolute;inset:0;border-radius:inherit;
        background:radial-gradient(var(--hot-r) at var(--hot-x) var(--hot-y),
                                   var(--hot-ink), transparent 70%);
        opacity:0;pointer-events:none;
        transition:opacity var(--dur-hot) var(--ease-out),
                   --hot-x var(--dur-hot) linear,
                   --hot-y var(--dur-hot) linear}
  .hot[data-hot="1"]:not(:disabled)::before{opacity:1}
  /* 放行之后光要按灭：`data-locked="1"` 之后条目还会被指针划过，但这时候"这儿有个
     可以点的东西"已经过期了——辉光说的是"手可以在这儿做事"，放行之后就不该再说。
     这一条写在上面那条**之后**：两边特异度同为 (0,3,0)，靠源序压过去（0.15.0 折叠
     面板那一族同一课：兜住不住不看长相，看写在哪儿）。 */
  [data-interaction][data-locked="1"] .hot[data-hot="1"]::before{opacity:0}

  /* 色温定调（`data-mood`，0.24.0）：整段气氛跟着"这一段在课程的哪一档"走——
     不是给内容加颜色（对错有 --ok / --bad、重心有灯），是**只换氛围层的色温**：
     页面顶部那圈光晕与画布底上一层柔光，两处都不承载信息。三档几乎只换色相、不换
     亮度（"几乎"两个字是边界 ①② 量出来的），这是这一条能压在内容全部底下的理由。
     四条边界（推导与逐档读数见 stage.md）：
       ① 三档 --tint 的**相对亮度实测几乎相等**（calm .015813 / turn .015381 / key
          .015368，最大差 2.9%）：所以换档动的是色温不是明暗。按 §8 的口径在 python
          里合成后逐档算（不是看截图平均亮度），三支底色（#1c212d / --panel / #161a23）
          × 六支墨色共 54 格里，**对比度在三档之间最大偏移 1.90%**；最险的那格是判词红
          #ef4d4d 对最深一档 #161a23——不加柔光 4.841，压上三档分别 4.749 / 4.772 /
          4.754，全在 4.5 线以上；
       ② `--tint` 注册成 `<color>` 且 **inherits:true**：JS 只在 documentElement 换一次档，
          柔光矩形与页面光晕各自继承同一个值——实测注册的 `<color>` 会把**补间中的
          逐帧值**继续传进 SVG（`<defs>` / `<pattern>` 里的图元同样吃到），所以
          消费者不必各写一条 transition（一个数只补间一次）。补间走的是 **sRGB 逐通道
          线性 × 页面 --ease-out**：把 #0e1f4b → #08261f 钉在 300 / 600 / 900ms 上读回
          rgb(9, 36, 41) / rgb(8, 38, 33) / rgb(8, 38, 31)，与"按 cubic-bezier(.22,1,.36,1)
          求出进度、再逐通道插值"的预测**逐格相同**；Oklab 路径在同三格差 40+ 个通道
          单位，本轮实测排除。路径中点那一格的**相对亮度可以比两端低 10%**（.01501
          vs .015813 / .015368——sRGB 直线在深色对的中段本来会暗一下），但这一层只有
          .28 不透明度、又压在最深的底色上，合成后 54 格里没有一格的对比度跑出两端
          所夹的区间超过 0.06%："只换色相不换亮度"能成立靠的是这两条叠在一起，
          不是三档 L 相等单独能证的；
       ③ `--dur-mood` 1.2s 是全仓库最长的一档：比最长的运镜（.78s）还长，气氛不该
          比一次推拉抢眼；也正因为它长，中途换档**不会跳**——注册属性在补间中改目标值，
          浏览器从当前值重新起算（擦洗时来回拖过章节线，色温来回游而不是闪），这条
          是"随动"二字在这轮的另一半含义；
       ④ 档表**没登记的段落继承上一档**，不回落 calm：气氛是连续量不是事件，把它当
          "每步必须声明"来清掉，就会在段间空档里白演一次 1.2s 的变色（与 #spot 那种
          每步归零的层正好相反——那层归零是因为"这一步没指东西"是可读的，
          "这一段没有气氛"不可读）。 */
  :root{transition:--tint var(--dur-mood) var(--ease-out)}
  :root[data-mood="calm"]{--tint:var(--tint-calm)}
  :root[data-mood="turn"]{--tint:var(--tint-turn)}
  :root[data-mood="key"]{--tint:var(--tint-key)}
  /* 画布那一层柔光：铺在**视差层里**（#depth 内、点阵之上），所以它跟着远景一起漂、
     被取景框裁着，永远不进内容层；四边各多出 900 单位与点阵同宽，镜头推拉时露不出
     边。`pointer-events:none`：这一层本来就盖在内容**下面**、按道理抢不到命中，
     仍然明写——与 #spot / 涟漪 同一口径，装饰层一律不许当事件对象。 */
  #depth .wash{fill:var(--tint);opacity:var(--tint-wash);pointer-events:none}

  /* 对位镜（0.30.0，前沿做法：technical-drawing dimension line / 两级取景）：
     0.22.0 的 #spot 说的是"看画面上的哪一块"（导演的灯，罩在整块画布上），
     0.13.0 的 [data-dim] 说的是"哪一块退到背景"（材质）。这两条都在改变被看
     东西的**亮度**；但"这一步在比哪两个字符"是一个**关系**，灯和压暗都说不出来
     ——两个字符都亮着，它们之间那条"正在被放在一起量"的线仍然不存在。这一条
     把摄影/工程制图里的**量规**借过来：一条细尺架在两个被比的字符上方，两端
     落点、中间读数（i=0 / i=1），换位时整把尺平移一格。
     四条口径（都是这套页面的老纪律，换了个对象）：
       ① **只做注解，不碰内容**：尺子画在单元格上方（y = 行基线 −36），两端落在
          格心外 24 单位——不压字、不压 vs、不抢已有点亮的 fill；它的 stroke / 字
          色只取 --scope-ink 一支，不与"对/错"语义色混用。读数写 `i=0` 这种短
          记号，不写句子（纪律 3）。
       ② **换位走 transition、换行走重建**：同一行内 i 变 0→1 是**同一把尺平移**
          （transform 补间，--dur-scope）；换到另一行比较时旧尺撤走、新尺从零
          **量过去**（`.draw` 只在新建档那一下跑）——两件事的语义不同，动法也不
          同：同一行的位置是连续的，换行是一次新的测量。
       ③ **两端落点由格距推、不量 bbox**：格宽 42、列距 46 是 renderB 自己的
          坐标声明（与 b-c-.. 的 rect 同一个数），尺子从它们推；字幕带那种两套
          字号、要跟着文本长的东西才必须现量（0.14.0 / 0.15.0）。这里没有第二套
          字号，量 bbox 只会把测量口径又抄一遍。
       ④ **纯装饰层**：pointer-events:none，不参与命中；它不进 #world（视差层），
          几何也恒在 stB 既有包围盒内（标题 y=52 压着顶、格列 309–697 压着左右），
          contentBox 的兜底取景读数不会因为多一把尺而变。`.scope` 与 `.nt` 同节点
          时，这一条会把 .nt 的整串 transition 清单换成只补 transform（0.19.0 /
          0.23.0 的简写老账）——正是想要的：尺子只该平移，子图元各归各的入场。 */
  .scope{pointer-events:none;
         transition:transform var(--dur-scope) var(--ease-out)}
  .scope path{fill:none;stroke:var(--scope-ink);stroke-width:1.5;
              stroke-linecap:round;stroke-linejoin:round}
  .scope text{fill:var(--scope-ink);letter-spacing:.02em}

  /* 集合括注（0.34.0）：一条花括线从两端同时合拢到下方中点，把几枚已有图元括成
     "同一组"（分块 / chunking）——0.30.0 的对位镜量的是"这两个之间"，这里说的是
     "这几个是一伙的"，关系不同，原语也不同。几何全部由 braceUnder() 从被括节点
     的 getBBox() 现量（pad 12 / gap 16 / 括深 10 / 括尖 6 / 圆角 9），CSS 只管
     外观与"不吃指针"：
       · 括线用 --brace-ink（绿 .55）——是关系线不是高亮，压在深底上刚读得清；
       · 标签用满浓度 --ok：注解是这一步要说出口的那半句，比括线重一档；
       · 两条臂都是 .draw（pathLength=1），dash 从各自外端收到共用括尖，读成
         "两端向中间合拢"；写成一条 path 会从头扫到尾，读成"划线"；
       · 纯装饰层 pointer-events:none，不进 #world，也不参与命中；
       · 静止态（dash 满线、标签不透明）就是终态：减少动效与导出截图那两刀切掉
         animation 后，落在同一张定格上，不需要为它单开兜底规则。 */
  .brace{pointer-events:none}
  .brace path{fill:none;stroke:var(--brace-ink);stroke-width:1.5;
              stroke-linecap:round;stroke-linejoin:round}
  .brace text{fill:var(--ok);letter-spacing:.02em}

  /* 引线标注（0.38.0）：给一件**已经在场**的东西挂一句话——一枚落在它边缘的圆点、
     一条先直后斜的引线、一块压在引线尽头的注记药丸。它补的是徽标（badge）的盲区：
     徽标只写坐标，观者得自己猜"这句话说的是谁"；引线把"这是谁的注记"画成一条连续
     的路径（空间连续性），眼睛不用在画面里找答案。
     五条接线口径：
       · 几何全部由 layoutCallout() 从被注节点的 boxIn() 现量（圆点 3.5、引线外伸
         10、签离点 16 / 12、签内边距 18、字 12）；作者只给 key / 指谁 / 短句 /
         朝哪边，换卡片宽窄、换位置都不回头改数（与 braceUnder 同一条纪律）；
       · **三种时序**（点 → 线 → 签）：点用 .in（建档即现），线用 .draw 且把 --delay
         推到 --dur-in 的 .22，签再用 calloutLand 晚到 --dur-draw 的 .72——读序是
         "这儿 → 连过去 → 是这句话"，不是三件东西一起淡入；
       · 签落地走**反向缩回**：calloutLand 只写 from 的 translate（--c-dx/--c-dy），
         位移方向与引线相反（从所指处退回自己的位置），终态是元素自己的 0；与
         .settle 同一课——事件不是状态，切掉动画就落在已落好的定格上；
       · **注记跟着对象走**：位置写在签组的 transform 属性上，复用同一 key 时由 .nt
         补间——被注的那一行上移，注记跟着上移，不是原地重落一次（空间连续性）；
       · **退场沿引线收回**：gone 把 stroke-dashoffset 推到 1，线从签那头缩回圆点，
         签与点同时淡掉。收的方向与画的方向相反，读作"这句话被收回去了"，而不是
         忽然消失（与 .tuck* 同一族：读过的东西让位要比长出来快）。
     pointer-events:none；药丸垫底用 --callout-bg 的**实色**（理由见 :root 令牌注释）。
     `.callout .lead` 的 transition 顶掉 .nt 简写是**已知且想要的**：这条路径只需要
     d（跟着对象挪）与 stroke-dashoffset（收回）两项，别的属性都不补间。 */
  .callout{pointer-events:none}
  .callout .lead{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;
                 stroke-opacity:.75;
                 transition:d var(--dur-grow) var(--ease-out),
                            stroke-dashoffset var(--dur-tuck) var(--ease-in-out)}
  .callout .dot{stroke:var(--callout-bg);stroke-width:2}
  .callout-lab{animation:calloutLand var(--dur-in) var(--ease-out) backwards;
               animation-delay:calc(var(--dur-draw) * .72)}
  .callout-lab rect{fill:var(--callout-bg);stroke-width:1;stroke-opacity:.55}
  @keyframes calloutLand{from{opacity:0;translate:var(--c-dx,0) var(--c-dy,0)}}
  .callout.gone .lead{stroke-dashoffset:1}
  .callout.gone .callout-lab,.callout.gone .dot{opacity:0}
  /* 关系连线（0.43.0）：两个已在场的图元之间"关系成立"那一步，一条细线从 a 的边缘
     长到 b 的边缘。stroke-dashoffset 是 JS 逐拍的读数（1=未长、0=全长）——**不挂
     transition**，与 .meter 同一课：dashoffset 每帧现算，再叠一条 transition 就是
     双缓动。d 走 transition：换句时两端现量重写 d，端点跨步移动时线跟着补间（与
     .callout .lead 同款）。标签透明度同样由 JS 逐拍写（生长过半浮现 / 收回时淡出），
     终态在属性上。线只做"关系"这一件事，不替代 callout（标注）/ brace（括组）。 */
  .conn{pointer-events:none}
  .conn .line{fill:none;stroke:var(--conn-ink);stroke-width:var(--conn-w,1.5);
              stroke-linecap:round;stroke-linejoin:round;pathLength:1;
              stroke-dasharray:1;stroke-dashoffset:1;
              transition:d var(--dur-grow) var(--ease-out)}
  .conn .lab{fill:var(--conn-ink);font-size:12;font-weight:600;text-anchor:middle;
             dominant-baseline:central}
  /* 细节镜（0.44.0）：把一件已在场图元的某一小块"拿到眼前"放大。与 callout（说谁）/
     brace（括一组）/ connect（什么关系）同一张"纯注解层"纪律：pointer-events:none、
     中性墨色、不碰语义色。三层各干一件事：
       · lid 只做平移——镜心跟着目标走，走 transition（--dur-move），读作"镜子跟着
         那块东西挪"，而不是原地重落一次；
       · zoom 只做缩放——scale 由 JS 逐拍写（loupeTock），**不挂 transition**（与
         .meter / .conn 同一课：逐拍再叠补间就是双缓动）；
       · mag 只做 translate(-观察点)——把观察点搬到 lid 原点，zoom 再以原点为心放大。
     **变换顺序是 scale 在外、translate 在内**：P′ = k·(P − u)；写反了内容会飞出
     镜圈（实测踩过，见 loupePos 注释）。
     镜圈：lens 是半透明实底（压住外面的内容，读作"镜片"），ring 是一圈细边；两者
     `transform-box:fill-box` + `transform-origin:center`，入场从 .72 弹到 1。
     镜里是**布局那一刻的定格副本**（cloneNode 克隆目标子树并递归摘 id）：不重放
     克隆体自己的入场（.copy * 关掉 animation / transition），也不跟 .nt 补间的中间
     帧——读者看镜时对象已经落位，镜读的是"放大后的结果"。 */
  .loupe{pointer-events:none}
  .loupe .lens{fill:rgba(20,24,32,.96);stroke:var(--loupe-ink);stroke-width:1.5;
               stroke-opacity:.9}
  .loupe .ring{fill:none;stroke:var(--loupe-ink);stroke-width:1;stroke-opacity:.4}
  .loupe .stem{fill:none;stroke:var(--loupe-ink);stroke-width:1;stroke-opacity:.55;
               stroke-linecap:round;pathLength:1}
  .loupe .lid{transition:transform var(--dur-move) var(--ease-out)}
  .loupe .lens,.loupe .ring{transform-box:fill-box;transform-origin:center;
                            animation:loupeIn var(--dur-in) var(--ease-out) backwards}
  .loupe .copy,.loupe .copy *{animation:none!important;transition:none!important}
  .loupe.gone{opacity:0;transition:opacity var(--dur-tuck) var(--ease-in-out)}
  @keyframes loupeIn{from{opacity:0;transform:scale(.72)}}

  /* 词拍（0.39.0）：旁白念到哪个词，画面上那件东西就套上四角括号。它不是"又一个
     注记"——引线标注（0.38.0）说的是"这句话在说谁"，词拍说的是"**此刻**在念谁"：
     注记是空间关系，词拍是时间关系。四段 L 形借相机取景框的语法，只标四角、不封口
     ——封口会读成"可点的卡片"，四角读作"正在被取景 / 被点名"。
     六条口径：
       · **只做一层注记，不碰目标**：括号画在 #cues 这一层（#cam 的倒数第二个孩子，
         在 #spot 之下），目标的几何、透明度、滤镜、命中区一个字都不动——与
         [data-dim] / #spot / .halo 那些"在目标身上加东西"的装置相比，这一条是
         最安全的位置：cue 可以落在任何图元上，包括要 Learner 点的热区；
       · **几何在词到的那一拍量，并跟到入场落定**：drawCues() 只建空括号（不带 d），
         cueGeom() 在词窗打开时从 boxIn(node,'cam') 取 bbox，外扩 --cue-pad、臂长
         --cue-arm（再按短边 30% 收敛、下限 5），此后在 --cue-settle 窗口内逐拍重量。
         **不能在建层时量一次**：本步刚建档的卡，占位框宽 96 会经 .nt 补向真宽 76；
         范本开场的 10/9/1 实测——建层那一刻量到 57.6 宽的盒（96×.6），落定后只有
         45.6，括号左右各胖 6 单位。作者只给"谁"和"哪个词"，不填坐标；
       · **状态不是动画**：opacity 0→1、scale .94→1 走 transition，.on 由 cueWrite()
         按 audio 时钟逐拍写。导出截图 / 减少动效切掉 transition 后落的是 after-change
         style（括号完整、无缩放），也就是"这一句念到哪儿"的真实档位——与 #spot /
         #cap-hl 同族（关的是补间不是状态）；这一族**不进** reduced-motion 清单的
         animation:none，因为括号的出现本身就是读数；
       · **累积**：从词出现到本步结束都不撤，一句点三次就是三道括号依次留下。
         导出每帧截在句末，所以成片里读得到"这一句点过谁"；下一步 drawCues() 重建
         整层，标记随步清零（与本步的 CUE 表同一生命周期，纪律 1）；
       · **中性白**：墨色取 --cue-ink（.66 的浅灰白），不用主色、不用红绿。cue 说的是
         "正在被念到"，不是"重要"（主色 / #spot）也不是"对错"（语义色）；
       · **恒定屏幕线宽**：.crisp 逐图元挂（vector-effect 不继承），镜头推到 1.8 时
         括号仍是 1.5px 的注记，不跟着内容变粗（与 .scope / .brace 同口径）。
     pointer-events:none：纯注解层，不能挡住底下的热区。 */
  #cues{pointer-events:none}
  .cue path{fill:none;stroke:var(--cue-ink);stroke-width:1.5;
            stroke-linecap:round;stroke-linejoin:round;
            transform-box:fill-box;transform-origin:50% 50%;
            opacity:0;scale:.94;
            transition:opacity var(--dur-cue) var(--ease-out),
                       scale var(--dur-cue) var(--ease-out)}
  .cue.on path{opacity:1;scale:1}

  /* 对照窗（0.40.0）：一扇窗里同时站着"改前 / 改后"两版，接缝扫到哪儿，哪一版
     占到哪儿。四条接线口径：
       · **两版互补裁切**：A 裁左侧 `inset(0 0 0 r)`、B 裁右侧
         `inset(0 calc(100% - r) 0 0)`。只裁 B 的话，A 的透明缝会把字/线透到 B
         这一半来（两层文字互相叠），所以必须两半严格互补；接缝线盖在交界上，
         1px 的舍入误差也看不出来。
       · **补的是注册变量，不是 clip-path**：`--cmp-r` 注册成 `<percentage>` 后
         由 CSS 自己插值，`clip-path` 每帧只做替换；A/B 是兄弟节点，两边读同一个
         旧值、走同一个 `--dur-cmp`，不会一前一后。`[data-cmp]` 的属性选择器
         与 `.nt` 同特异度，但写在 `.nt` 之后，`transition` 清单只剩 `--cmp-r`
         ——这是**已知且想要的**：两版只该裁，不该顺手补间别的属性（0.19.0 /
         0.23.0 那条简写老账，这次是有意接管）。
       · **帧矩形是几何锚**：`drawCompares()` 往 A/B 各塞一枚 `fill:none` 的
         矩形（宽高 = 窗），把两版的 reference box 钉成同一扇窗。`clip-path` 的
         百分比以引用盒为分母；没有这枚矩形时，内容少的版本会按自己的小 bbox
         裁，接缝和标签对不上。矩形不画、不吃指针、`data-helper="cmp"` 让
         `sweep()` 不把它当普通图元收走。
       · **接缝是状态，不是动画**：`--cmp-r` 是每一步的读数；`--dur-cmp` 只决定
         从上一读数走到这一读数用多久（见 drawCompares 的 cmpDur）。导出 /
         reduced-motion 切掉 transition 后落的是这一拍的 `--cmp-r`，不是半截；
         擦洗时把时长写成 0s，手指到哪儿接缝到哪儿。
     四角只画 L 形取景框、不封口：封口会读成一张卡片，L 角读作"同一扇观察窗"。
     接缝的 40 单位扫描光用 `--cmp-wash` 的低透明渐变，不是高亮——它标的是
     "读到这儿"，不是"这一条重要"。 */
  .cmp-frame{pointer-events:none}
  [data-cmp="a"]{clip-path:inset(0 0 0 var(--cmp-r));
                 transition:--cmp-r var(--dur-cmp,.45s) linear}
  [data-cmp="b"]{clip-path:inset(0 calc(100% - var(--cmp-r)) 0 0);
                 transition:--cmp-r var(--dur-cmp,.45s) linear}
  .cmp-seam{transition:transform var(--dur-cmp,.45s) linear}
  .cmp-line{fill:none;stroke:var(--cmp-seam);stroke-width:1.5;stroke-linecap:round}
  .cmp-corner{fill:none;stroke:var(--cmp-ink);stroke-width:1.2;
              stroke-linecap:round;stroke-linejoin:round}
  .cmp-lab{fill:var(--cmp-before);font-weight:600;letter-spacing:.08em}
  .cmp-lab.after{fill:var(--cmp-after)}

  /* 动效可及性兜底（WCAG 2.3.3，前沿动画实践标配）：系统开了"减少动态效果"时，
     入场/补间/呼吸全部压成不可感知，循环动画停掉、终态保留——内容不依赖动效，
     关闭后每一帧仍是同一张正确定格（与导出截图页同口径）。 */
  @media (prefers-reduced-motion: reduce){
    .stage[data-state="idle"] .veilplay{animation:none}
    .el,.el.on{transition:none}
    #cam,.nt,.bar-fill{transition:none}
    .in,.pop,.draw,.pulse,.gate,.gate.leaving,.gate .g-card>*{animation:none}
    /* 沿线流光（0.18.0）关的是 **animation**，静止态本来就落在"光段在路头之外"
       （stroke-dashoffset = --flow-seg，实测整条路上零像素光段），所以关掉之后
       这一层直接隐形、留给它下面那条 .draw 底线——画面仍是"一条完整的连线"，
       一格信息不少。与 .reveal / .featherR 同一课：兜底落的正是终态。
       这一行**不需要抬特异度**（与 0.15.0 折叠、0.16.0 侧栏、0.17.0 掠光那三条
       不同）：.flow 的基础规则写在 §③ 动效原语区（本块之前），同特异度 (0,1,0)
       时源序后者胜，媒体块在这边赢。那三条之所以要抬，是因为它们的基础规则
       写在媒体块**之后**。 */
    .flow{animation:none}
    /* 门禁这一族（0.18.0 补）：**上面那行抢不过**——`.gate{…animation:gateIn…}` 与
       `.gate .g-card>*{…animation:cardIn…}` 写在 §②b 门禁那一段里，源序排在**本块之后**，
       同特异度时后来者胜（与 0.15.0 折叠、0.16.0 侧栏入场、0.17.0 掠光完全同一课：
       兜底不是写了就生效，要真的盖过基础规则）。带 `#gate` 抬到 id 特异度才落得上。
       这一条在 0.18.0 之前一直没被发现，是因为 §⑤ 那条 `animation-duration:.01ms!important`
       的时长钳制把动画压成不可感知——**但 animation-delay 不在钳制范围内**：门禁卡片一挂
       自动错峰（.stag），减少动效下三张卡片仍然按 0 / 60 / 120ms 依次出现，那正是该关掉的
       "一个接一个动"。所以这不是锦上添花：不抬特异度，本轮的 .stag 就是在给可及性加回归。
       旧那行的选择器整串保留（它同时兜住 `.in/.pop/.draw/.pulse`，那四条基础规则写在本块
       之前，正常生效），只在这里补门禁三条。 */
    #gate,#gate.leaving,#gate .g-card>*{animation:none}
    #cam.blurpass{animation:none}   /* 运镜模糊同关：镜头照旧补间，只是不糊 */
    #cap-text.capLift,
    .interaction-feedback.is-correct,.interaction-feedback.is-wrong{animation:none}
    /* 0.13.0 新增动效同口径兜底：章节头翻场关掉；按压手感（:active 的 scale）与
       焦点弱化本来就是"状态即终态"，过渡被上面的 transition:none 收掉后直接落档。 */
    .chapter.chFlip{animation:none}
    /* 0.14.0 三项同口径：换场位移关掉（内容直接落位，一格信息不少）；视差层不跟
       镜头漂（#cam 的补间已被上面收掉，镜头照旧到位）；划重点不逐帧生长，
       但 x/width 是**属性上的终态**，所以关掉过渡后色带仍然完整划在那一句上——
       它承担的是"这是结论"的强调，不是纯装饰，不能跟着一起关。 */
    .el.swF,.el.swB{animation:none}
    #depth{transition:none}
    #cap-hl{transition:none}
    /* 0.15.0 三项同口径。擦除揭示是入场装饰，关掉后内容直接完整在场（终态本来就是
       clip-path:none，没有"半截揭示"留在定格上）；几何生长挂在 .nt 上，已被上面
       那行 transition:none 收掉，框宽照旧落属性、一步到位；折叠面板两头都关——
       高度补间关掉后 display 切换随即生效（allow-discrete 没有时长就没有"撑住"），
       展开即完整可见、收起即整条退出可访问树，noteIn 的淡入同关。
       折叠这条兜底要**多带一层元素选择器**才真的落上：`.note-body{...transition:...}`
       那条基础规则在源序上排在**本块之后**，特异度又同为 (0,1,0)——后来者胜，单写
       `.note-body{transition:none}` 会被它顶掉（实测收起态的计算值仍是 `height, display`，
       这时兜住画面的是 §⑤ 那条 `.01ms!important` 的时长钳制，不是这一行）。`li.note`
       把特异度抬过基础规则、`li.note[data-open="1"]` 抬过展开态各一级，两头才都关成 none。 */
    .reveal,.revealL{animation:none}
    /* 收拢退场（0.19.0）关的是 **transition**，且兜底落的正是终态：`gone` 那一档
       本来就在呈现属性上，时长一收就是"该行不在台上"，与冷启动 / 导出截图页同一张
       定格——不演，但读过的东西不该在台上这件事仍然成立。这一行不需要抬特异度：
       基础规则 `.tuckR,.tuckL{...transition:...}` 写在本块**之前**、同为 (0,1,0)，
       后来者胜（与 0.15.0 折叠 / 0.16.0 侧栏 / 0.17.0 掠光那三条**要**抬的特异度
       正相反：那三条的基础规则源序在本块之后，这一条不在——兜底要不要抬，取决于
       基础规则写在哪，不取决于它长什么样）。
       `--lit` 不在这一栏里：它和 #cap-prog 同一类，是时钟的逐拍读数不是动效，
       关了动效它也得跟上嘴（见 CSS「跟读点亮」①）。 */
    .tuckR,.tuckL{transition:none}
    /* 羽化揭示同口径：关掉动画后落在**元素自己的 --feather**（注册值 134% =
       整条遮罩带已移出右侧）上，也就是完整可见——与 .reveal 关掉后落
       `clip-path:none` 完全对齐，没有"半截羽化"留在定格上。 */
    .featherR,.featherL{animation:none}
    /* 掠光：关掉 animation、伪元素本身留着（静止态 background-position 就停在
       盒外 120%，本来就看不见）。兜底行必须**带 id 抬特异度**：那条
       `.gate-next .go.shine::after` 写在 §④ 播放器行那一段里，源序排在**本块之后**，
       朴素同形选择器会被它顶掉（(0,3,0) 平手时后来者胜）——与 0.15.0 折叠、
       0.16.0 侧栏入场同一课：兜底不是写了就生效，要真的盖过基础规则。
       掠光是纯装饰，关掉后按钮仍是那颗完整的按钮。 */
    #gate-next .go.shine::after{animation:none}
    li.note .note-body,li.note[data-open="1"] .note-body{transition:none;animation:none}
    /* 0.16.0 同口径，但三条各不相同，值得逐条说：
       · 擦洗态几何（条变厚 / 刻度变长）是 transition——关时长即直接落 9px/16px，
         意图升级这件事仍然看得见，只是不"长"过去；
       · 气泡弹簧是 animation——关掉后气泡照旧出现（opacity 的 data-on 分支不是动效），
         只是不再弹；
       · 侧栏滚动入场整条**撤掉**（animation:none）：它唯一的"起点"是 keyframe 里的
         opacity:0，动画不跑就根本没有隐藏态，六条要点一格不少地在那儿。
       句内进度细线**不在这一栏里**——它不是动效，是时钟的逐拍读数（见 #cap-prog）。 */
    .bar,.bar .tick{transition:none}
    .bar .tip.tipPop{animation:none}
    /* 侧栏滚动入场整条**撤掉**，且必须多带一层 `ul.notes>` 才落得上：入场那条写在
       `.notes` 那一段里，源序排在**本块之后**——两边都不带 id，谁后谁赢，单写
       `li.note{animation:none}`（特异度 (0,1,1)）会被它顶掉。`ul.notes>li.note` 抬到
       (0,2,2) 才真的压过去，实测减少动效下六条要点常显、不再随滚淡入。与 0.15.0
       折叠面板那条同一课：兜底行不是写了就生效，要**真的盖过基础规则**才生效。
       不能只靠下面 §⑤ 那条 `animation-duration:.01ms!important` 钳制兜住：滚动时间线
       要求 duration 为 auto，被钳成 0.01ms 后落哪一格是实现说了算——一条装饰性的
       入场不该把"内容看不看得见"押在没测过的边界上。
       句内进度细线**不在这一栏里**——它不是动效，是时钟的逐拍读数（见 #cap-prog）。 */
    ul.notes>li.note{animation:none}
    /* 当面与抵达（0.20.0）三条同口径，兜底落的都正是终态，所以关掉之后画面仍是
       同一张定格：
         · 翻面关 **transition**（父层 transform 与两面的 visibility 都要关）：
           `data-over` 本就在呈现属性上，一刀下去直接落"背面在场"那一格，正面
           visibility 立刻 hidden——没有"翻到一半侧立"留在定格上。三条基础规则
           都写在本块**之前**（§③ 动效原语区），特异度各自持平或更低，源序后者胜，
           **这一族不需要抬特异度**（与 .tuck 同、与掠光/侧栏相反：要不要抬只看
           基础规则写在哪）；
         · 沿线抵达关 **transition**：`data-go` 在属性上，关掉即落 100%，标记停在
           路线终点——它承担的是"这个人已经到了这一行"的位置信息，不能连位置一起关，
           与划重点那条 #cap-hl 同一判断（关的是补间不是终态）；
         · 行进余像（0.32.0）只归零 **delay**：那一层的位移由 `.ride` 的同一份
           transition 管，本块前面已一刀关掉；`transition-delay` 是另一条长档，
           时长钳制管不到它（与 `.trail` 边界⑥同一本账）。归零之后余像与头同拍
           落 100%，叠在头下——"到站"那一格一像素不多；
         · 圆形绽开关 **animation**：静止态 `clip-path:circle(75%)` 已在元素自己身上
           （实测与完全不裁逐像素相同），关掉即整格全显，与 .reveal / .featherR
           "关掉落在完整揭示"同一条纪律③。 */
    .flip,.flip .face,.flip .faceB{transition:none}
    .ride{transition:none}
    .wake{transition-delay:0s}
    .bloom{animation:none}
    /* 定盘与成形（0.21.0）三条同口径，兜底落的都正是终态：
         · 倾侧关 **transition**：`data-pan` 本就在呈现属性上，一刀下去直接落
           "这一拍该倾哪边"那一格——它承担的是符号读数，不能连倾角一起关
           （与 0.20.0 `.ride`、0.14.0 划重点同一判断：关的是补间不是终态）；
         · 字距归位关 **animation**：两头都是长度，不跑就落回元素自己的正常排布
           （实测 `animationName` 为 `none`、计算值 `normal`，与 `to` 那档 `0` 排宽
           逐值相同）——一行副题一个字不少，与 .bloom 那条"关掉落在完整揭示"同源；
         · 涟漪关 **animation** 之后必须**什么都不显**：它的静止态写在元素身上
           （`scale:0;opacity:0`），关掉的正是"这一拍没有涟漪"那一格。兜底行要
           带 `#gate-block` 抬特异度：基础规则写在 §⑤ 门禁卡片那一段里，源序排在
           **本块之后**，朴素同形选择器会被它顶掉（与 0.15.0 折叠 / 0.17.0 掠光 /
           0.16.0 侧栏那三条同一课——兜底不是写了就生效，要真的盖过基础规则）。 */
    .tilt{transition:none}
    .gather{animation:none}
    #gate-block .opt.rip::after{animation:none}
    /* 落点与过场（0.22.0）三条同口径，但**关掉的层数不一样**：
         · 移动聚光关 **transition**、不关那一层暗幕：洞心的 `--spot-x/y/r` 与开合的
           `data-on` 都在呈现属性上，一刀下去直接落"这一步该聚在哪一块"——它承担的
           是注意力的位置信息，不能连洞一起关（与 `.tilt` / `.ride` / `#cap-hl` 同一
           判断：关的是补间不是终态）。两条基础规则都写在本块**之前**（§③ 动效原语
           区），`#spot` 同为 (1,0,0)、源序后者胜，不需要抬特异度；
         · 快进掠擦关 **animation**：这是纯装饰的确认拍，静止态 `opacity:0` 本来就
           在元素自己身上——关掉之后画布上什么都不留，与 .flow / 涟漪 同一课。
           兜底行**要带 `#ffwd.go`** 与基础规则同形（(1,1,0)）才压得住：写成
           `#ffwd{animation:none}` 抢不过排在后面的 `.go` 那条（与 0.15.0 折叠、
           0.17.0 掠光、0.21.0 涟漪同一课：兜底要真的盖过基础规则）；
         · 浮层离散进出关 **transition**：`display` 的离散补间一停，`hidden` 随即
           生效，进出都是即时落档——"这块浮层在 / 不在"这件事仍然读得出（与 0.15.0
           折叠面板那条完全同形：allow-discrete 没有时长就没有"撑住"）。基础规则
           `.pregate{...transition:...}` 在 §②c、源序排在**本块之后**且同为 (0,1,0)，
           所以要带 `#pregate.pregate` 抬到 (1,1,0) 才落得上。 */
    #spot{transition:none}
    #ffwd.go{animation:none}
    #pregate.pregate{transition:none}
    /* 重量与预备（0.23.0）三条同口径，但**关掉的层数不一样**：
         · 挤压落位关 **animation**：静止态就是元素自己的 `scale`（`none` = 单位阵），
           一刀下去落"稳稳在那一格"，没有"压扁一半"的定格留在画面上——与 .bloom /
           .gather / .flow 同一课；
         · 预备后蓄关 **animation**：两端与静止态都是 `translate:0 0`，**事件不是
           状态**，关掉之后什么痕迹都不留，位移照旧由 `transform` 属性承载；
           随它挂上去的**让拍**（`.wind > g` 的 transition-delay）也一起归零——
           兜底不是"先停 95ms 再瞬移"。这一行与基础规则同形、同特异度 (0,1,1)，
           靠源序在后面压住（实测归零后读回 `0s`）；
         · 提牌投影关 **transition**、不关档位：`data-lift` 与 `--elev` 的终值都在
           呈现属性与注册初值上，一刀下去直接落"这一对被提起来"那一格——它承担的
           是状态读数，不能连影子一起关（与 `#cap-hl` / `.tilt` / `.ride` / `#spot`
           同一判断）。
       这四行**都不需要抬特异度**：基础规则全部写在本块**之前**的 §③ 动效原语区，
       同特异度时源序后者胜（与 0.19.0 `.tuck`、0.20.0 三件套、0.21.0 `.tilt`
       同一侧；掠光 / 折叠 / 侧栏那三条要抬，是因为它们的基础规则在本块**之后**）。
       清单里也不许出现 `--elev` / `data-lift` / `--squash-x`：关的是补间与事件，
       不是档位读数。 */
    .settle{animation:none}
    .wind{animation:none}
    .wind > g{transition-delay:0s}
    .lift{transition:none}
    /* 换位弧凸（0.25.0）关 **transition**、不关档位：`data-go` 与 --swap-route 的终值
       都在呈现属性上，一刀下去直接落"换位完成"那一格——排好了就是排好了，不演那一
       段抛物线，一格信息不少（与 .ride / .tilt / #spot 同一判断：关的是补间不是终态）。
       这一行**不需要抬特异度**：基础规则写在本块**之前**的 §③ 动效原语区，同为
       (0,1,0)，源序后者胜。清单里也不许出现 --swap-k / --swap-rise / --swap-min /
       data-go：那是把"换位完成"的状态读数一起关掉（纪律③）。 */
    .swap{transition:none}
    /* 随动层（0.24.0）三条同口径，关的都是**补间**不是读数：
         · 位移定拍**不用另写一行**——#cam 那行 `#cam,.nt,.bar-fill{transition:none}`
           与 #depth 自己那行早就把它们收掉了；换成派生时长 --cam-dur 之后这一族
           兜底一个字都不用改，因为关的是整条 transition 简写，与时长从哪儿求的值
           无关（实测两条的计算值都落 `all 0s ease 0s` / property 为 none）；
         · 触点辉光关 **transition**、不关光：`data-hot` 与 --hot-x / --hot-y 是
           "指针在场与否、在场哪儿"的读数，减少动效下光仍然亮在指针底下，只是不
           追着走（与 #spot / .tilt / .ride 同一判断：位置信息不许连档位一起关）；
         · 色温定调关在 **:root** 上而不是消费者上：`.wash` 与 `body::before` 读的是
           **继承来的补间值**、自己没有任何 transition，关它们等于关空气；补间只在
           换档的那个元素上，所以兜底也必须写在那儿（实测关后 --tint 一步落档）。
           这一行只动 documentElement 自己——`transition` 不继承，子元素各自的
           补间不受影响。 */
    :root{transition:none}
    .hot::before{transition:none}
    /* 先后与边界（0.26.0）三条同口径，但**关的对象不是一类东西**：
         · 拖尾关的是**这一层的先后**：`transition-delay` 不在全局
           `transition-duration:.01ms` 钳制范围内（0.18.0 在 animation-delay 上踩过
           同一坑，这是它的 transition 孪生兄弟）——不写这一行，减少动效的人仍然会
           看到让位的两张卡各晚 70 / 140ms 才落。基础规则 `.trail` 写在本块**之前**、
           同为 (0,1,0)，靠源序压住，不需要抬特异度；上面那行 `.wind > g` 已经把
           上架子那一步的让拍归零，两条各管各的一步；
         · 解码**没有 CSS 行可写**：它改的是 textContent，不是补间——所以它的兜底只能在
           JS 里认这个偏好（`mqReduce`，见 decodeWrite）。减动效实测：把进度压在 k=.10
           那一格，字面直接是完整的"转成字符串"，一格噪声都不给——未定住的那些格对
           晕动与读屏用户本来就是不可读的字，留着只减分不加信息；
         · 橡皮筋关的是**那一下回弹**：气泡的 `--band` 与端头亮各在一条清单里，两行
           `transition:none` 一刀把两者都收掉，档位照落——`data-band` 仍在、端头仍亮、
           只是不弹（与 #spot / .tilt / .ride 同一判断：关的是补间不是状态读数）。
           `--band` 本身的归零在 JS 里（mqReduce，见 §⑦ 擦洗那一段）：给晕动用户把
           气泡顶出条外再弹回来没有信息量，而"到头了"这件事端头那圈亮已经说了。 */
    .trail{transition-delay:0s}
    .bar .tip{transition:none}
    .bar::after{transition:none}
    /* 批注与迎手（0.27.0）同口径，但关的层数各不相同：
         · 荧光笔与反证划线关 **animation**：两者的终态（整条色带 / 整条红线）都写在
           元素自己身上，一刀下去仍是"这句话被标了 / 被划掉"，不是半截——与 .bloom /
           .flow / .reveal 同一课；
         · 磁吸迎手关 **transition**，且必须带 `#gate` 抬到 (1,2,0)：这两条基础规则
           写在 §④ 播放器行那一段（源序在本块**之后**），朴素选择器会被后来者顶掉。
           JS 侧还有第二道闸（mqReduce，见 §⑦ 磁吸那一段）——CSS 关的是补间，代码
           关的是"根本不写位移"，两头都认同一个偏好；关掉后按钮原地不动，"按得到"
           这件事一格不少（与 #spot / .tilt / .ride 同一判断：位置信息不连档位一起关）。 */
    .mark,.strike{animation:none}
    /* 0.28.0：药丸包装层同款关闭（基础 .mag 规则源序在本块之前，(0,1,0) 靠源序压过） */
    .mag{transition:none}
    /* 0.30.0 对位镜：关的是平移补间，`.draw` 已被上面那条 `.draw{animation:none}`
       收掉；尺子仍落在这一拍该在的位置上，读数一格不少（基础规则源序在本块之前，
       (0,1,0) 靠源序压过）。 */
    .scope{transition:none}
    /* 引线标注（0.38.0）同口径，关的层数分得清：
         · 关 **animation** 的是三种时序（点淡入 / 引线描画 / 签反向缩回）——终态都
           写在元素自己身上（点 opacity:1、线 dashoffset:0、签 opacity:1），一刀下去
           就是一张完整的注记，不是"线画到一半"；
         · 关 **transition** 的是退场收回与位置跟随：`gone` 与标签 transform 都在
           呈现属性上，不演也落"它已经收回 / 它已经跟到新位置"那一格——与 .tuck /
           .settle / #spot 同一判断：关的是补间不是状态读数。
       基础规则全部写在本块**之前**（§③ 动效原语区），同特异度时源序后者胜，
       不需要抬特异度。 */
    .callout .lead,.callout .dot,.callout-lab{animation:none;transition:none}
    /* 词拍（0.39.0）关的是 **transition**，`.on` 留在类上：括号照旧按"这一句念到
       哪儿"出现与累积，只是不再淡入 / 缩放——与上面 #cap-hl / .tuck 同一判断
       （关的是补间不是状态）。本条基础规则写在本块之前，同特异度时源序后者胜，
       不需要抬特异度。 */
    .cue path{transition:none}
    /* 对照窗（0.40.0）关的是 **transition**，`--cmp-r` 留在 A/B 身上：两版仍按
       "这一拍该露多少"互补裁切，只是接缝不再扫过去——与 #cap-hl / .tuck 同一判断
       （关的是补间不是状态读数）。基础规则写在本块之前，同特异度时源序后者胜。 */
    [data-cmp]{transition:none}
    .cmp-seam{transition:none}
    /* 拆解视图（0.41.0）关的是 **transition**，transform 上的目标偏移留在节点上：
       拆开的那一格仍是拆开的，合拢的那一格仍是合拢的，只是不再滑过去——与
       --cmp-r / .cue path 同一判断（关的是补间不是状态读数）。错峰延迟随之失效：
       transition:none 的节点不进入延迟，所有件同帧落位。本条基础规则写在本块之前，
       同特异度时源序后者胜。 */
    .explode{transition:none}
    /* 关系连线（0.43.0）关的是 **transition**：dashoffset 与标签透明度是 JS 逐拍的
       读数，见旗直接落终值（生长落 0 = 线完整、收回落移除）——与 --cmp-r / .cue path
       同一判断（关的是补间不是状态读数）。这里再关掉 d 的补间：换句现量直接落位。
       本条基础规则写在本块之前，同特异度时源序后者胜。 */
    .conn .line{transition:none}
    /* 细节镜（0.44.0）关的是 **transition / animation**：zoom 的 scale 是 JS 逐拍的
       读数，见旗直接落 k（镜里读到放大后的细节）——与 --cmp-r / .conn 同一判断。
       圈与内容的弹入同样归零（callout 的点 / 线 / 签同一族）。gone 的那一格直接
       opacity:0（关系不再需要看：不许停在半透明的中间态）。 */
    .loupe .lid,.loupe .stem{transition:none}
    .loupe .lens,.loupe .ring{animation:none}
    .loupe.gone{opacity:0;transition:none}
    /* 形变（0.45.0）关的是 **transition**，而它本来就没有 d 的补间：中间帧那几条
       采样折线由 morphTock() 逐拍写，见旗（导出 / 减动效 / 擦洗）直接落作者声明的
       那条 d——关掉的是过程，不是档位，定格永远读得到"这一拍该是什么形状"。
       这里归零的是从 .nt 抄来的其余各项（位移、透明度、描边色）。
       本条基础规则写在本块之前，同特异度时源序后者胜。 */
    .morph{transition:none}
    #gate .gate-next .go,#gate .act-row .go{transition:none}
  }

  /* ── ④ 播放器行：**紧贴在画布下面**，与画布共左右边 ──────────────────
     页面级常驻字幕条不属于当前结构；字幕统一留在画布内。
     字幕已经**长在画布里**（画布下缘那条随句刷新的字幕带，见 §② 的 `#cap`）
     —— 页面级那条与它说的**本来就是同一句话**，白白多占一行。
     现在只剩两层，共边的细节都只画一次：**圆角只给外圈**（stage 收上圆角、
     播放器行收下圆角），**分隔线只由 stage 的 border-bottom 出**（播放器行写
     border-top:0），否则两条 1px 就会贴成一条 2px。
     它就是画布下面那条常驻播放器：进度条永远看得见，暂停 / 恢复的入口永远在。
     进度条同时是**章节地图**（每节起点一根刻度，悬停报出该段章节名与时间），
     所以画布上方不需要章节标签行。 */
  .rack{display:flex;align-items:center;gap:11px;padding:9px 14px;background:#101319;
        border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px}
  /* 播放器行的按压手感：五个控件同款缩一下（scale 独立属性，不动布局）。
     进度条不挂——它按下去是"擦洗"，跟手模式（.bar[data-drag]）已经说了这件事。 */
  .rack button:active{scale:.9}
  .rack .pp{width:28px;height:28px;flex:none;border-radius:50%;border:0;cursor:pointer;
            background:var(--key);color:#1a1200;font-size:11px;line-height:1;padding-left:2px;
            transition:filter var(--dur-fast)}
  .rack .pp:hover{filter:brightness(1.12)}
  .rack .rew{width:26px;height:26px;flex:none;border-radius:50%;border:0;cursor:pointer;
             background:rgba(255,255,255,.09);color:var(--fg);font-size:11px;line-height:1}
  .rack .rew:hover{background:rgba(255,255,255,.18)}
  /* 倍速：画面/字幕/门禁全是 currentTime 的函数，改的只是时钟走多快——见 §⑦ 接线 */
  .rack .spd{min-width:34px;height:26px;flex:none;border-radius:13px;border:0;cursor:pointer;
             background:rgba(255,255,255,.09);color:var(--fg);
             font:11px/1 ui-monospace,Consolas,monospace}
  .rack .spd:hover{background:rgba(255,255,255,.18)}
  /* 非 1× 常亮描色：当下时钟被改过速，得一眼看得见，不然读数会对不上嘴 */
  .rack .spd[data-off]{background:var(--key-act);color:var(--key)}
  .rack .fs{width:26px;height:26px;flex:none;border-radius:50%;border:0;cursor:pointer;
            background:rgba(255,255,255,.09);color:var(--fg);display:grid;place-items:center}
  .rack .fs:hover{background:rgba(255,255,255,.18)}
  .rack .fs[hidden]{display:none}          /* display:grid 会盖掉 UA 的 [hidden]，自己补一刀 */
  .fs .ic-out{display:none}
  body[data-fs="1"] .fs .ic-in{display:none}
  body[data-fs="1"] .fs .ic-out{display:block}
  .mute .ic-out{display:none}
  body[data-muted="1"] .mute .ic-in{display:none}
  body[data-muted="1"] .mute .ic-out{display:block}
  .rack .bar{flex:1;min-width:60px}
  .rack .step{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
  /* 门禁开着时本行变灰且不可点：门禁的语义是"答对才继续"，还让点 ▶ 就等于白设。
     但**只变灰、不收起**——学习者的视线在画布上，行没了反而更懵。
     （窄屏悬浮态例外：那本来就要到 3s 自动收起，门禁下直接压成不显形。） */
  .rack[data-gated="1"]{opacity:.5;pointer-events:none}

  /* ②b 门禁：**从画布内浮出** —— 提问本身就是画面的一部分。
     开门禁时抬高舞台的高度下限（下面那条 :has 规则）：画布窄时舞台按 1000/460
     比例算出的高度装不下一张卡，overflow:hidden 会把卡片裁掉；极端情况（矮视口、
     超高卡片）卡片在压暗层内滚动兜底。
     入场分两层：整卡升起（gateIn），卡内三段再依次落位（cardIn + 错开的 delay）——
     题目不是"啪"地砸上来，而是先告诉你"停一下"，再逐层展开。 */
  .gate{position:absolute;inset:10px;z-index:9;display:flex;padding:20px;
        border-radius:12px;overflow:auto;
        scrollbar-width:thin;scrollbar-color:#3a4359 transparent;
        background:rgba(6,8,12,.92);backdrop-filter:blur(4px);
        animation:gateIn var(--dur-gate) var(--ease-out) both}
  .gate[hidden]{display:none}
  /* 出场**不是硬切**：加 .leaving 淡出上移，动画走完再由 JS 盖上 hidden，然后才起播旁白
     （否则旁白在还压着暗的画布底下就开口了，听着像"上一句被切掉、下一句突然开始"） */
  .gate.leaving{animation:gateOut .24s var(--ease-in-out) forwards;pointer-events:none}
  @keyframes gateIn{from{opacity:0;transform:translateY(12px) scale(.985)}
                    to{opacity:1;transform:none}}
  @keyframes gateOut{to{opacity:0;transform:translateY(-8px) scale(.99)}}
  /* 门禁开着时画布内的播放层让位（播放器行在画布外面，由页面写 .rack[data-gated="1"]）。
     用 :has 而不是改 data-state——data-state 记录的是"音频在干什么"，不该被门禁污染。 */
  .stage:has(.gate:not([hidden])) .veilplay{opacity:0;pointer-events:none}
  /* 门禁开着时把舞台抬到至少装得下一张卡；min() 里的视口项保证矮屏上不整块跳出屏幕，
     剩下装不下的由 .gate 的 overflow:auto 滚动兜底。导出探针截图时门禁是关着的，此规则不生效。 */
  .stage:has(.gate:not([hidden])){min-height:min(640px, calc(100vh - 150px));
        min-height:min(640px, calc(100dvh - 150px))}   /* 后一条在支持 dvh 的浏览器接管 */
  .gate .g-card{width:100%;max-width:660px;margin:auto;background:#1e2431;   /* 比 --panel 亮一档才压得住背景；居中靠 auto 边距，align-items:center 配 overflow 会把卡片顶部裁掉且滚不回来 */
        border:1px solid #3a4359;border-radius:14px;padding:18px 20px;
        box-shadow:0 20px 56px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06)}
  .gate .g-card>*{animation:cardIn var(--dur-gate) var(--ease-out) both;
        animation-delay:var(--delay,0s)}
  /* 错峰排程交给 .stag（0.18.0）：原来这里写死三份 nth-child 魔法数（.04/.11/.18），
     runtime 动态生成的交互块一旦多于三项，第四项起延迟落回 0 与第三项同时进；
     少于三项时后面的档位白占着。卡片挂上 .stag 后由 sibling-count() 现算摊薄，
     项数变了也不用回头改 CSS。@supports 不成立时 --delay 空 → var() 接住 0s →
     整组同进，卡片内容一格不少（门禁是学习证据通道，不是装饰，绝不允许看不见）。 */
  @keyframes cardIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  .gate .kick{margin:0 0 9px;font-size:11.5px;letter-spacing:.07em;color:var(--key)}
  .gate .q{font-weight:600;font-size:16.5px;line-height:1.55;margin:0 0 12px}
  .opts{display:flex;gap:8px;flex-wrap:wrap}
  /* 注意别写 `font:13.5px inherit`——font 简写缺字族是整条作废，
     按钮会悄悄回落到正文 15px。逐项写。 */
  .opt{background:var(--panel);color:var(--fg);border:1px solid #333b4d;border-radius:999px;
       padding:7px 15px;cursor:pointer;font-size:13.5px;transition:var(--dur-fast)}
  .opt:hover:not(:disabled){border-color:var(--key);color:var(--key);background:#1e2431}
  /* 选项药丸的磁吸（0.28.0，0.27.0 磁吸迎手的延伸）：.opt 自己挂着
     `transition:var(--dur-fast)` 那条**全属性**简写——同节点再写一条 transition 会把前
     一条整个顶掉（0.19.0 / 0.23.0 老账），所以药丸的位移写在外层 span.mag：这一个只演
     translate，时长与缓动跟放行键同款（--dur-mag + --ease-spring）。JS 写法与 .go 完全
     一致（style.translate + _mag 补偿，见 §⑦ 磁吸那一段）；静止时无 translate = 无
     containing block，.hot 辉光的盒内坐标不受影响（指针在盒内时磁场本来就为 0）。 */
  .mag{transition:translate var(--dur-mag) var(--ease-spring)}
  /* 按压手感（0.13.0）：按下去缩一点——指尖/鼠标按下那一下必须有形变，否则"点没
     点上"只能等两百毫秒后的反馈文字。用**独立 scale 属性**而不是 transform：
     transform 常常已经被控件自己的定位占着，写上去会顶掉位移（.pop 那条注释就是
     这个坑）。实测三档，决定谁能挂：
       · 没有 transform 的按钮（.opt / .rack button / 「继续」键）：中心位移 0；
       · 靠 transform:translate(-50%,-50%) 居中的 .hs：缩到 .9 时中心漂 2.2px——
         因为独立变换属性排在 transform **之前**，scale 把那条居中位移一起缩了；
         下面把 .hs 的居中改用 translate 属性（实测位移 0）；
       · SVG 常驻图元：位移挂在它自己的 transform 属性上，scale 挂同一个节点会
         连"离原点 700"一起缩成 630（实测漂 50.4px，transform-box:fill-box 也救不了）。
         位移挂外层 g、scale 挂内层形状才实测 0 位移——所以 **.pop 依旧只挂在
         没有 transform 的节点**，scale 并没有解锁它，别想省事少画一层。 */
  .opt:active:not(:disabled){scale:.94}
  /* 触点涟漪（0.21.0 之二，前沿做法：Material 系的 touch ripple——按下的那一点
     立刻给一圈确认，不用等两百毫秒后的反馈文字）。一枚圆从**触点**涨满整颗按钮
     再淡掉。五条边界，全是实测出来的：
       ① 静止态与终态**都看不见**（base `scale:0;opacity:0`）：把补间 `pause()` 后
         逐档钉住读——0ms `op .85 / scale 0` → 40ms `.598 / .331` → 310ms（62% 那档）
         `.340 / .987` → 470ms `.0002 / 1` → 500ms 落回 base `0 / 0`；再 `finish()`
         一次，动画已经从 `getAnimations()` 里下场（fill 默认 none，不留最后一帧），
         屏幕上什么都不显。涟漪是 **事件不是状态**，与 0.17.0 掠光 / 0.18.0 流光
         同一族判断——reduced-motion 关掉 animation、导出截图页一刀切掉 animation，
         落的都是"没有涟漪的正常按钮"（实测两种切法后 `::after` 计算值都是
         `opacity:0 / scale:0`），不会留半截琥珀色圆盘压在字上（纪律③：装饰绝不把
         内容锁进可能不跑的门）；顺带一条采法上的教训：headless 里按下之后动画的
         start 要等 ~166ms 才落（前八趟追帧读到的都是 anim 0），**追帧采不到行程，
         只有钉档采得到**；
       ② 圆心走 `left/top:var(--rx)/var(--ry)` + **独立 `translate` 属性**居中，
         不写进 transform：`:active{scale:.94}` 挂在同一颗按钮上，0.13.0 实测过
         "独立变换属性排在 transform 之前，会被 scale 连位移一起缩"——写进
         transform 的那条居中位移按下去就会漂；
       ③ 直径 `--rip-d` 与触点坐标都由 JS **现量**（在 handler 里读 rect；触点到
         四角的最大距离 ×2），写常数要么涨不满、要么白涨一大圈（同 0.14.0 划重点
         "从字幕自己量"）。实测同一颗 84.2×30.9 的选项两个触点：按在 (21.1,21.6)
         → `--rip-d` 133.6px（最远角在右下），按在 (12.6,7.7) → 150.4px（最远角换到
         左上）——圆每次都刚好盖到自己那个最远的角，两档直径差 17px；"现量"这条
         不是洁癖：按住的这段时间 `:active{scale:.94}` 把 rect 缩过（实测 84.2 →
         79.9），提前量好再传进 handler 就会连着触点一起算错。坐标越界（合成的
         pointerdown 打在盒外 +80/−60）时被夹进盒边，写进 `--rx 84.0px / --ry 0.0px`
         → 179.0px，圆不会从按钮外面起头；`clientX/clientY` 缺席（合成的裸
         `PointerEvent` 读出来是 0、不是 NaN，仍走夹取）才落到中心兜底——那条路只防
         "事件对象根本没有坐标"，不是给键盘准备的；
       ④ `pointer-events:none` + 宿主 `overflow:hidden`：伪元素不抢命中（涨到一半
         时 `elementFromPoint` 仍命中按钮本身 `opt rip`，0.17.0 那条同一课：看不见
         的层会挡住热区），涨出圆角盒的部分被裁住不糊到卡片上；`overflow:hidden`
         是这颗药丸自己吃的：实测三颗选项 `scrollWidth == clientWidth`（83/83）、
         `scrollHeight == clientHeight`（29/29），一个字都没被裁；
       ⑤ **只挂在 pointerdown**，不挂 click：涟漪报的是"指尖碰到"这一件事，键盘
         那条路没有触点，硬编一个圆心只会是假的。实测程序化 `click()`（没有
         pointerdown）不挂 `.rip`——判定照走、反馈照出，只是没有涟漪。
     消费者只有选项这颗药丸：hotspot 圈的 `::after` 已经在报 ✓ / ✕ 这个**状态**，
     纯装饰层不去抢一个正在说事实的伪元素。 */
  .opt{position:relative;overflow:hidden}
  @keyframes ripGrow{0%{scale:0;opacity:.85}62%{opacity:.34}100%{scale:1;opacity:0}}
  .opt.rip::after{content:"";position:absolute;left:var(--rx,50%);top:var(--ry,50%);
        width:var(--rip-d,100%);height:var(--rip-d,100%);translate:-50% -50%;
        border-radius:50%;background:var(--rip-ink);pointer-events:none;
        scale:0;opacity:0;animation:ripGrow var(--dur-rip) var(--ease-out)}
  .opt:disabled{cursor:default;opacity:.85}
  .opt[data-selected="1"]{border-color:var(--key)}
  .interaction-feedback{margin-top:9px;font-size:13.5px;color:var(--dim);min-height:18px}
  /* 答对/答错微反馈：答对轻弹入场、答错横向抖动——现代表单反馈的标配手感。
     runtime 每次尝试都 remove+add 状态 class，动画随之重触发；只动
     transform/opacity，检查器读文本与放行状态不受影响。 */
  .interaction-feedback.is-correct{animation:fbOk var(--dur-fb) var(--ease-spring) backwards}
  .interaction-feedback.is-wrong{animation:fbBad var(--dur-fb) var(--ease-in-out)}
  @keyframes fbOk{from{opacity:0;transform:translateY(4px)}}
  @keyframes fbBad{0%,100%{transform:none}20%,60%{transform:translateX(-4px)}
                   40%,80%{transform:translateX(4px)}}
  .interaction-feedback.is-correct{color:var(--ok)}
  .interaction-feedback.is-wrong{color:var(--bad)}
  .gate-next{display:flex;align-items:center;gap:11px;margin-top:11px;padding-top:11px;
             border-top:1px solid #262c3a}
  .gate-next[hidden]{display:none}
  /* 「继续」键与卡里的提交键同款（.gate-next / .act-row 两条路径共用一套样式）。
     磁吸迎手（0.27.0）把 translate 加进这一条 transition：位移是**手指给的**，
     用 --ease-spring（带一点回弹）；filter 那档保持原速。两个属性各写各的时长，
     合成一条简写，不新开第二条 transition（后一条会把前一条整个顶掉）。 */
  .gate-next .go,.act-row .go{background:var(--key);color:#14181f;border:0;border-radius:999px;
                 padding:8px 18px;cursor:pointer;font-weight:600;font-size:13.5px;
                 transition:filter var(--dur-fast),
                            translate var(--dur-mag) var(--ease-spring)}
  /* 放行键掠光（0.17.0，前沿做法：CTA shine）：答对之后"继续"出现的那一下，
     一道高光从左掠到右——邀请点击的动效语言，Stripe / Linear 那类官网的主按钮
     同款。四条边界：
       ① 高光带是**伪元素 + background-position**，不是 mask：这里要的是"加一道
         亮"，不是"遮一块"，用 mask 反而把按钮本体裁掉；
       ② **静止态必须停在盒外**（base `background-position:120% 0`）：keyframes
         两端都写位置（120% → −60%），跑完落回 120% = 看不见；导出截图页一刀切掉
         animation、reduced-motion 关掉 animation，两种情形得到的都是**无光泽的
         正常按钮**——掠光是装饰，不承担状态（实测静止取色 27,35,48 = 纯底色，
         跑动中同一位置 133,137,144 = 高光在场上）；
       ③ `pointer-events:none` + `overflow:hidden`：伪元素盖在文字上不抢点击，
         高光带出界时被圆角盒裁住，不会漏到卡片上；
       ④ 只演一次、由 JS 摘重挂：`.gate-next` 每次 hidden→visible 都可能出现，
         无脑重放会让同一个键被反复刷亮（口径同 0.16.0 气泡的差分判据）。 */
  .gate-next .go{position:relative;overflow:hidden}
  .gate-next .go:not(:disabled)::after{content:"";position:absolute;inset:0;pointer-events:none;
        border-radius:inherit;background:linear-gradient(105deg,transparent 0 42%,
        rgba(255,255,255,.55) 50%,transparent 58% 100%);
        background-size:260% 100%;background-repeat:no-repeat;background-position:120% 0}
  @keyframes passShine{from{background-position:120% 0}to{background-position:-60% 0}}
  .gate-next .go.shine::after{animation:passShine var(--dur-shine) linear}
  /* 提交/继续键同款按压手感：disabled 时不缩（点不动的东西不该有"按到了"的错觉） */
  .gate-next .go:active:not(:disabled),.act-row .go:active:not(:disabled){scale:.94}
  .gate-next .go:hover:not(:disabled),.act-row .go:hover:not(:disabled){filter:brightness(1.1)}
  .gate-next .go:disabled,.act-row .go:disabled{background:#2b3242;color:var(--dim2);cursor:default}
  .gate-next .hint{font-size:12.5px;color:var(--dim2)}
  /* 卡里的提交行（排序题 / 归类型题共用） */
  .act-row{display:flex;align-items:center;gap:10px;margin-top:10px}

  /* hotspot（在图上点部位）：可点区是**盖在静态图上的按钮**，left/top 用百分比——
     跟着图一起缩放；用按钮而不是 SVG 里的 <g>，键盘与触屏才点得到。
     圈里不写字（写了等于给答案），虚线本身就是"这里可以点"的提示。 */
  .hotspot-stage{position:relative;margin:4px 0 12px}
  .hotspot-stage svg{display:block;width:100%;height:auto}
  /* 居中改用**独立 translate 属性**（原先是 transform:translate(-50%,-50%)）：
     独立变换属性排在 transform 之前，所以按压缩放（下面 :active 的 scale）会把
     挂在 transform 上的居中位移一起缩——实测缩到 .9 时圆心漂 2.2px；挪到
     translate 属性上之后实测位移 0，按压时圈还在原位。视觉与命中区都不变。 */
  .hotspot-stage .hs{position:absolute;translate:-50% -50%;border-radius:50%;
        border:1.6px dashed #62708c;background:var(--key-softer);padding:0;
        display:flex;align-items:center;justify-content:center;cursor:pointer;
        font-weight:700;font-size:15px;color:#98a2b8;transition:var(--dur-hover)}
  .hotspot-stage .hs:active{scale:.9}
  .hotspot-stage .hs:hover{border-color:var(--key);background:var(--key-act);color:var(--key)}
  .hotspot-stage .hs[data-hotspot-state="hit"]{border-style:solid;border-color:var(--ok);
        background:rgba(46,204,113,.18);color:var(--ok)}
  .hotspot-stage .hs[data-hotspot-state="hit"]::after{content:"✓"}
  .hotspot-stage .hs[data-hotspot-state="miss"]{border-style:solid;border-color:var(--bad);
        background:rgba(239,77,77,.14);color:var(--bad);cursor:default}
  .hotspot-stage .hs[data-hotspot-state="miss"]::after{content:"✕"}
  [data-interaction][data-locked="1"] .hotspot-stage .hs{cursor:default}

  /* bucket（放进筐）：钩子名 .bucket-item / [data-drop] / [data-drop-slot] /
     [data-bucket-submit] 由运行时逐字匹配，写错的表现是"拖不动"且不报错 */
  .bucket-tray{list-style:none;margin:0 0 10px;padding:8px;min-height:42px;
        display:flex;flex-wrap:wrap;gap:6px;border:1px dashed #333b4d;border-radius:10px;
        background:#1a2029}
  .bucket-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .bucket-drop{border:1px dashed #3a4359;border-radius:10px;padding:9px 10px;background:#1a2029;
        transition:border-color var(--dur-hover)}
  .bucket-drop:hover{border-color:var(--key)}
  .bucket-drop .b-label{display:block;font-size:11.5px;color:var(--dim2);margin-bottom:7px}
  .bucket-slot{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;
        gap:6px;min-height:34px}
  .bucket-item{display:inline-flex;align-items:center;padding:7px 12px;border-radius:8px;
        background:var(--panel);border:1px solid #333b4d;cursor:grab;user-select:none;
        font-size:13.5px;transition:border-color var(--dur-fast),color var(--dur-fast)}
  .bucket-item:hover{border-color:var(--key)}
  /* 触屏点选态（点 A → 点 B，A 挪到 B 的位置）：sequence / bucket 同一视觉语言 */
  .bucket-item[data-picked="1"],.sequence-item[data-picked="1"]{border-color:var(--key);color:var(--key);
        box-shadow:0 0 0 2px rgba(245,166,35,.18)}
  .bucket-item[data-bucket-state="hit"]{border-color:var(--ok);color:var(--ok)}
  .bucket-item[data-bucket-state="miss"]{border-color:var(--bad);color:var(--bad)}

  /* sequence / bucket 共用的拖拽态：原项留流内变淡，浮动克隆跟手（克隆由运行时内联定位）。
     touch-action 取 pan-y 而不是 none：none 能把触屏拖拽喂给手势，代价是手指在条目上
     竖滑时门禁卡片滚不动。pan-y 把竖滑还给页面滚动（拖到一半浏览器会发 pointercancel，
     运行时收到取消不当成点选）；触屏的重排/归筐因此走**点选**主路径（runtime onTap），
     鼠标拖拽完全不受影响（touch-action 只管触屏与手写笔）。 */
  .sequence-item,.bucket-item{touch-action:pan-y}
  .drag-src{opacity:.45}
  .drag-ghost{border-color:var(--key)!important;box-shadow:0 12px 28px rgba(0,0,0,.5);
        transform:rotate(1.2deg)}
  .sequence-list{list-style:none;margin:2px 0 10px;padding:0;display:flex;flex-direction:column;gap:7px}
  .sequence-item{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:9px;
                 background:var(--panel);border:1px solid #333b4d;cursor:grab;
                 font-size:13.5px;user-select:none;transition:border-color var(--dur-fast)}
  .sequence-item:hover{border-color:var(--key)}
  .sequence-item .s-handle{color:var(--dim2);font-size:12px}
  .sequence-item .s-idx{font:11px ui-monospace,Consolas,monospace;color:var(--dim2)}

  /* recall（复述 / 对照）：钩子名 [data-recall-reveal] / .recall-answer 由运行时
     逐字匹配。答案盘由页面填好再解除 hidden——初始必须藏着，露了门禁就白设。 */
  .recall-answer{margin:2px 0 10px;padding:10px 12px;border-radius:10px;
        border:1px solid #333b4d;border-left:3px solid var(--key);background:#1a2029;
        font-size:14px;line-height:1.65;color:var(--dim)}

  /* preGate：跳出画布动画前的 ~1.1s 视觉缓冲。**环要真的走完**——
     "还要等一下"和"卡住了"是两种体感，区别就在这 1.1 秒里有没有东西在动。
     进出场（0.22.0）：这层原来是 `animation:gateIn both`（借门禁那条关键帧）+
     `hidden` 一盖就**硬切**——浮层"啪"地消失，与它下面那条刚走完 1.1s 的环不配套。
     现在换成**离散属性直接补间**（`@starting-style` 给入场一个起点、
     `transition-behavior:allow-discrete` 让 `display` 在退场全程撑住不被摘掉）：
     0.15.0 那条折叠面板用的是同一族能力，但那里补间的是**几何高度**（0↔auto），
     这一条补间的是**整层的显示与位移**——它是本仓库第一条"进出都有过渡、JS 一行
     都不用等"的浮层：`hidden` 仍然由 JS 即时盖上（QA 读的就是这个属性），
     画面那 240ms 的淡出让 CSS 自己管。基础规则留着旧的关键帧写法，认得
     allow-discrete 的浏览器才覆盖（与 0.16.0 滚动入场、0.17.0 color-mix 同一口径：
     不支持的那一头最多损失过渡，不损失内容，也不出现"两层入场叠一起糊掉"）。 */
  .pregate{position:absolute;inset:10px;z-index:8;display:flex;align-items:center;
           justify-content:center;gap:12px;border-radius:12px;background:rgba(6,8,12,.9);
           animation:gateIn .25s ease both}
  .pregate[hidden]{display:none}
  @supports (transition-behavior:allow-discrete){
    .pregate{animation:none;opacity:1;translate:0 0;
             transition:opacity var(--dur-dock) var(--ease-out),
                        translate var(--dur-dock) var(--ease-out),
                        display var(--dur-dock) var(--ease-out)}
    .pregate{transition-behavior:allow-discrete}
    .pregate[hidden]{display:none;opacity:0;translate:0 -10px}
    @starting-style{.pregate{opacity:0;translate:0 12px}}
  }
  .pregate .pg-ring{width:34px;height:34px;flex:none}
  /* 2πr = 2×3.1416×15 ≈ 94.25：dasharray 取周长，dashoffset 从整周长走到 0 */
  .pregate .pg-arc{stroke-dasharray:94.25;stroke-dashoffset:94.25;
           animation:ringFill 1.1s linear forwards}
  @keyframes ringFill{to{stroke-dashoffset:0}}
  .pregate .pg-txt{font-size:14px;color:var(--dim)}

  /* ── ③ 侧栏 ─────────────────────────────── */
  /* 侧栏整块要比背景"亮一档"：卡片底只比页面深一点点时，右边这一列读起来是一列漂着的
     文字而不是一个区域，和左边舞台的重量不匹配。 */
  .col-side{position:sticky;top:18px;display:flex;flex-direction:column;gap:12px;
            max-height:calc(100vh - 36px);max-height:calc(100dvh - 36px);
            overflow:auto;padding-right:2px;
            scrollbar-width:thin;scrollbar-color:#2a3140 transparent}
  .card{background:#1a1f2b;border:1px solid #2b3242;border-radius:12px;padding:13px 14px}
  .card>h2{font-size:11px;letter-spacing:.12em;color:var(--dim);margin:0 0 6px;font-weight:600}

  /* 参考要点：一列"主题行"，**不套第二层框**。
     曾经每张 note 自带边框和底色 = 卡片里再嵌六张小卡，340px 窄栏里六层框反复切割，
     视觉重量全花在容器搬运上。现在分隔只靠一条 1px 发丝线，层级靠**字号与悬挂缩进**：
     标题 14px 实色、正文 13px 暗色、缩进与标题文字左边界对齐。 */
  .notes{list-style:none;margin:0;padding:0}
  .note + .note{border-top:1px solid #232936}
  /* 侧栏滚动驱动入场（0.16.0，本轮唯一"前沿"做法：CSS scroll-driven animation）。
     六条要点在窄栏里本来就要滚着看，让它们**随滚随显**比一次全铺开更贴合阅读顺序，
     而且这条运动不归 JS 管：没有 scroll 监听、没有 IntersectionObserver、没有
     requestAnimationFrame——进度由 `view()` 时间线直接按"元素在滚动容器里的位置"取，
     与本页"renderer 不计时"的纪律同一条方向（时钟在外头，声明在这里）。
     四条边界都是刻意的：
       ① 整块包在 `@supports (animation-timeline: view())` 里。Firefox 正式版还没开
          这个特性，而"隐藏态"只写在 keyframe 的 from 里——不支持的浏览器整块跳过，
          文字一格不少地在那儿可读（渐进增强的正确姿势：把风险放在装饰那侧，
          绝不把内容锁进一个可能不跑的门里）；
       ② `animation-duration:auto` 必须显式写。滚动时间线用**进度**驱动而非秒，
          auto 表示"铺满 animation-range 那段距离"；留着默认的 0s 在某些实现里
          会被当成"没有时长可分配"而直接落终态，看着像没生效；
       ③ `animation-range:entry 0% entry 60%`：从"下边缘刚进栏"跑到"进栏六成"就落定。
          第一版写的是 `entry 0% cover 32%`，实测**静止态就不是 1**：Chrome 152 下
          entry 段只占 cover 全长的 e/(e+v)（条目 45px、栏 533px → 约 8%），cover 32%
          远在"完全进入"之后，于是侧栏**根本不溢出**时下面三条仍停在 0.998 / 0.974 /
          0.845——一条纯装饰的入场，把常驻内容留在了半透明那一格，正是这类做法最常见的
          失败方式。改进取 entry 段内（进度以条目自身高度算），静止时全部落 1；
       ④ 位移挂独立 `translate`（与 0.13.0 起所有位移同一口径），不碰 transform，
          也不碰 `.note-h` 那条 hover 背景过渡。 */
  @keyframes noteReveal{from{opacity:0;translate:0 10px}to{opacity:1;translate:0 0}}
  @supports (animation-timeline: view()){
    li.note{animation:noteReveal var(--ease-out) both;
            /* 长写放在简写**之后**：animation-timeline / animation-range 是否被简写
               重置，各实现口径不一——写在后面就不靠这个假设。duration 显式 auto，
               滚动时间线按"进度"分配时长。 */
            animation-duration:auto;
            animation-timeline:view();
            animation-range:entry 0% entry 60%}
  }
  .note-h{display:flex;align-items:center;gap:9px;padding:10px 4px;width:100%;
          text-align:left;border:0;background:none;appearance:none;font:inherit;
          font-size:14px;font-weight:600;color:var(--fg);cursor:pointer;user-select:none;
          border-radius:8px;transition:background var(--dur-fast)}
  .note-h:hover{background:rgba(255,255,255,.035)}
  .note-h .n-ico{font-size:15px;line-height:1;flex:none;width:21px;text-align:center}
  .note-h .n-caret{margin-left:auto;transition:transform var(--dur-hover);color:var(--dim2);font-size:10px}
  .note[data-open="0"] .n-caret{transform:rotate(-90deg)}
  /* 折叠面板的开合（0.15.0，前沿做法：0↔auto 高度补间）。
     旧口径是 `display:none` + 展开时重放一段 noteIn 淡入——收起没有动画，展开
     "啪"地出现，中间还有一次跳。现在两头都是连续运动：
       ① `interpolate-size:allow-keywords` 让 `height:auto` 参与插值（Chrome 152
          实测开 18→26.2→111、收 111→84.6→18，两个方向都采到中间值）；作者不用
          再猜 max-height 魔数，也不用 JS 量 scrollHeight；
       ② `display` 仍要退到 none（不是"高度 0 就完了"）：残留的 1px 是一方面，更要
          紧的是折叠内容不该被读屏念出来、不该进 Tab 焦点序列。`allow-discrete`
          让 display 参与过渡，实测语义正好是我们想要的——**展开时立刻变 block**
          （高度动画随即开跑），**收起时撑到动画结束才变 none**（ collapse 演得完，
          又不会把 hidden 内容留在可访问树里）；
          一个坑值得单记：`display` 必须**同时出现在 transition-property 清单里**。
          `transition-behavior:allow-discrete` 只管"已经在补间的属性"，没列进去
          就还是即时切换——收起时那一帧就没了流内盒，高度补间没有东西可演，
          实测开合半边有动画、半边是跳的。
       ③ `transition-behavior` 单独一行写，不塞进 `transition` 简写：简写里出现
