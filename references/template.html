    // ③ hotspot：在图上点部位（这张图是卡里那张，见 interactions.md §2「可点区放哪」）
    { scene:'seg-4', at:'end', type:'hotspot', preGate:true,
      q:'「ab」比「abc」小——这个结论是在哪一步定下来的？在图上点出那一步。',
      spots:[{id:'step1', t:'逐位比较并向后推进',
              feedback:'那一步只管"两边这一位都有"的情形，「ab」已经没这一位了。'},
             {id:'step2', t:'都相同就往后一位',
              feedback:'再往后也没有了：短的那个走完了，这时才轮到长度说话。'},
             {id:'step3', t:'短的那个该位缺失就算小', correct:true,
              feedback:'对。长度不同的比较，是在"短的一方没有这一位"时定下来的。'}] },
    // ④ bucket：归类 / 边界（哪些属于"逐位比较"、哪些只在长度不同时才发生）
    { scene:'seg-5', at:'end', type:'bucket', preGate:true,
      q:'这四件事，哪些是"逐位比较"本身、哪些只在长度不同时才发生？',
      items:[{id:'pos',   t:'两边都有这一位，就比大小', correct:'same',
              feedback:'逐位比较就是这件事：从第一位起，逐位比。'},
             {id:'next',  t:'相同就往后挪一位',       correct:'same',
              feedback:'还是逐位比较——只是指针往后走了一步。'},
             {id:'short', t:'短的那个该位缺失',       correct:'diff',
              feedback:'这一步只在长度不同时才会遇到。'},
             {id:'small', t:'它就算小',               correct:'diff',
              feedback:'这是长度不同时的结论，不是逐位比较本身。'}] },
    // ⑤ recall：主动回忆（唯一不判定的形态）。放在**生成性转折点**：逐位比较
    // 刚在 seg-2 讲完，先让消费者用自己的话复述一遍再往下走——检索本身就是教学
    // 动作，点「看参考答案」对照后即放行（runtime.md §2）。与 seg-6 开头的
    // sequence 考同一内容但间隔更远、动作不同（复述 vs 排序），不算重复设卡。
    { scene:'seg-2', at:'end', type:'recall', preGate:true,
      q:'先别看画布：逐位比较里，大小是怎么定出来的？两边都有该位、和位数不一样时，分别是哪种情形？',

  ];
  var gateEl = el('gate'), gateHost = el('gate-host'), gateNext = el('gate-next'),
      gateGo = el('gate-go'), gateHint = el('gate-hint'), preGateEl = el('pregate'),
      gateBlock = el('gate-block'), gateQ = el('gate-q'), gateOpts = el('gate-opts'),
      gateFb = el('gate-fb'),
      gateHot = el('gate-hot'), hotQ = el('hot-q'), hotFb = el('hot-fb'),
      gateBucket = el('gate-bucket'), bkQ = el('bk-q'), bkTray = el('bk-tray'),
      bkFb = el('bk-fb'),
      gateSeq = el('gate-seq'), seqQ = el('seq-q'), seqList = el('seq-list'),
      seqFb = el('seq-fb'),
      gateRecall = el('gate-recall'), rcQ = el('rc-q'), rcA = el('rc-a'),

  // 一张卡一种形态：判定与锁定状态都从这两张表取，别再写 if (type === '…') 的长链
  var CARDS = { choice:gateBlock, hotspot:gateHot, bucket:gateBucket,

  var TYPE_HINT = { choice:'选对答案即可继续', hotspot:'点对部位即可继续',

                    recall:'自己复述一遍，对照参考答案即可继续' };
  function gateType(i){ return (GATES[i] || {}).type || 'choice'; }
  function gateCard(i){ return CARDS[gateType(i)]; }
  var gOpen = -1, gShown = [], gAnswered = [], gateClosing = 0;
  var GATE_OUT_MS = 240;      // 与 CSS 里 .gate.leaving 的 0.24s 对齐

  function clearHot(card){

  }
  // 几种卡片互斥显隐 + 清掉上一题留下的锁定 / 作答标记——locked 不清的话，
  // 下一题刚打开就"看起来已经答对"。运行时的接线标记 bound/gesture 属于持久按钮，
  // **不能在这里清**：清了重接线时会叠第二层监听，表现是"点一下触发两次"。
  function clearGateCards(){
    Object.keys(CARDS).forEach(function(k){
      CARDS[k].hidden = true;

      // 重建选项一并消失，这里无需（也无处）清

  // 先显 ~1.1s 缓冲浮层（里面有会走完的进度环）、同时冻结音频，再揭开题目卡。
  // 计时器句柄要留着：浮层显示期间这道题可能被 seek / resetGates 取消，
  // 届时回调必须作废（gOpen 已不是这道题），否则浮层消失后会揭开一张半开的门禁。
  var preGateTimer = 0;
  function preGateOpen(i, cb){

    var sc = scenes[sceneIndexOf(g.scene)];

      preGateEl.hidden = false;
      clearTimeout(preGateTimer);

  }

  // ── 五个建卡器：只做两件事——写 data-interaction、把动态节点建出来 ──────────
  function buildChoice(g, c){
    c.dataset.interaction = JSON.stringify({
      options: g.opts.map(function(o){
        var opt = {id:o.id, label:o.t, correct:!!o.correct};
        if (g.fb) opt.feedback = o.correct ? g.fb.right : g.fb.wrong;   // fb 可省略（interactions.md §4），缺省交给 runtime 默认话术
        return opt;
      })
    });
    gateQ.textContent = g.q;
    clear(gateOpts);
    g.opts.forEach(function(o){
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'opt hot'; b.textContent = o.t; b.dataset.choiceId = o.id;
      // 磁吸延伸（0.28.0）：药丸外包 span.mag——位移归包装层，药丸自己的
      // transition:var(--dur-fast) 全属性简写不许被顶掉（0.19.0 / 0.23.0 老账，见 §③）
      var m = document.createElement('span'); m.className = 'mag'; m.appendChild(b);
      gateOpts.appendChild(m);
    });
  }
  function buildHotspot(g, c){
    c.dataset.interaction = JSON.stringify({
      options: (g.spots || []).map(function(s){
        return {id:s.id, label:s.t, correct:!!s.correct, feedback:s.feedback};
      })
    });
    hotQ.textContent = g.q;
  }
  function buildBucket(g, c){
    var answer = {}, why = {};
    (g.items || []).forEach(function(it){
      // 判定字段在条目自身（interactions.md §4）：correct=筐 id、feedback=该项反馈。
      // 配错成独立 answer/fb 时这里会静默生成空答案、被运行时 fail-closed——
      // 在源头 warn 一句，控制台直接指向配置格式，而不是只看到"缺少 answer"。
      if (it.correct === undefined)
        console.warn('[gate] bucket 条目 "' + (it.t || it.id || '?') + '" 缺 correct（筐 id），'
          + 'GATES 的 items 每项需要 correct/feedback 字段（见 interactions.md §4）');
      answer[it.id] = it.correct; why[it.id] = it.feedback;
    });
    c.dataset.interaction = JSON.stringify({ answer:answer, feedback:why });
    bkQ.textContent = g.q;
    clear(bkTray); clear(el('bk-same')); clear(el('bk-diff'));    // 重开时洗回待放区
    (g.items || []).forEach(function(it){
      var li = document.createElement('li');
      li.className = 'bucket-item hot'; li.dataset.bucketItem = it.id; li.textContent = it.t;
      bkTray.appendChild(li);
    });
  }
  function buildSequence(g, c){
    // 钩子名逐字对齐 runtime.md §2：.sequence-list / .sequence-item /
    // [data-sequence-submit] —— 类名写错运行时只是不接线、表现"拖不动"
    var cfg = g.seq || {};
    c.dataset.interaction = JSON.stringify({ correct_order: cfg.correct || [] });
    seqQ.textContent = g.q;
    clear(seqList);
    (cfg.items || []).forEach(function(it, n){
      var li = document.createElement('li');
      li.className = 'sequence-item hot'; li.dataset.sequenceId = it.id;
      var handle=document.createElement('span'); handle.className='s-handle'; handle.textContent='⠿';
      var idx=document.createElement('span'); idx.className='s-idx'; idx.textContent=String(n+1);
      var text=document.createElement('span'); text.textContent=it.t || '';
      li.append(handle,idx,text); seqList.appendChild(li);
    });
  }
  function buildRecall(g, c){
    // 钩子名逐字对齐 runtime.md §2：[data-recall-reveal] / .recall-answer。
    // 答案只进配置、不进 DOM——点开那一下由 runtime 填进 rcA 并解除 hidden。
    c.dataset.interaction = JSON.stringify({ prompt: g.q, answer: g.a });
    rcQ.textContent = g.q;
    rcA.hidden = true; rcA.textContent = '';   // 双保险：clearGateCards 已洗过
  }
  var BUILD = { choice:buildChoice, hotspot:buildHotspot,
                bucket:buildBucket, sequence:buildSequence, recall:buildRecall };

  function openGate(i){
    if (gOpen >= 0) return;
    clearTimeout(gateClosing); gateEl.classList.remove('leaving');   // 别接着上一题的淡出
    magClear();   // 磁吸迎手（0.27.0）：上一题留下的 translate 不许带给下一张卡
    var g = GATES[i], t = gateType(i), c = CARDS[t];
    try {
      gateHost.dataset.stepId = g.scene;          // 作答归到这个场景上
      clearGateCards();
      gateNext.hidden = true;
      c.hidden = false;
      BUILD[t](g, c);
      // 动态块必须重新接线。**接在揭开浮层之前**：契约抛错时浮层还挂着 hidden，
      // 学习者不会看到一张永远点不动的半开门禁；错误本身交给 QA/控制台暴露。
      if (window.coursewareStudioWire) window.coursewareStudioWire();
      // 上一题答对时运行时禁用了卡里所有按钮；重开要放回来（否则这一次点不动）
      Array.prototype.forEach.call(c.querySelectorAll('button'), function(b){ b.disabled = false; });

      el('gate-kick').textContent = '播放在这里暂停 · ' + (TYPE_HINT[t] || '');

      preGateOpen(i, function(){

  function closeGate(instant){

    el('rack').inert = false;
    el('veilplay').inert = false;
    delete gateHost.dataset.stepId;     // 别把上一题的场景归属留给下一题 / QA
    // 引导浮层显示期间被取消（seek 走 / resetGates）：浮层也要立刻收，计时器作废
    clearTimeout(preGateTimer); preGateTimer = 0; preGateEl.hidden = true;

    gateEl.classList.add('leaving');

  }
  function resumeFromGate(){

    setTimeout(function(){ audio.play().catch(function(){}); }, GATE_OUT_MS);
  }
  gateGo.addEventListener('click', resumeFromGate);

  // 运行时在答对时写 data-locked —— 观察它，不轮询。
  // 只看**当前开着的那张卡**：几张卡都读会把上一题留下的 locked 当成这一题的放行信号
  function gateLocked(){ return gOpen >= 0 && gateCard(gOpen).dataset.locked === '1'; }
  var gateObs = new MutationObserver(function(){
    if (gOpen < 0 || !gateLocked()) return;
    gAnswered[gOpen] = true;
    var card = gateCard(gOpen);
    Array.prototype.forEach.call(card.querySelectorAll('button'),
      function(b){ b.disabled = true; });
    // 掠光只演"这一行从无到有"那一次：观察者可能因 data-locked 被重写而再进
    // 这条分支（runtime 每次尝试都会写锁定标记），所以**先取 hidden 的旧值**做
    // 差分，再放开显示。判据口径与 0.16.0 气泡、0.14.0 换场同源——差分必须在
    // JS 里、且必须排在状态写入之前，不能指望 CSS 自己认出"这是第一次"。
    var nextShown = !gateNext.hidden;
    gateNext.hidden = false;
    // "是不是最后一题"要按**时间锚点**比，不能按 GATES 数组下标——
    // 声明顺序和播放顺序可以不同（范本就是 seg-6 排在最前），按下标会把文案配反。
    var aMe = gateAnchor(gOpen);
    var last = GATES.every(function(_, k){ return k === gOpen || gateAnchor(k) <= aMe; });
    gateGo.disabled = false;

    // 已经开着的那一行不重放——同一个键被反复刷亮是闪烁，不是邀请）。
    // 重挂口径与章节翻场、字幕翻句同款：摘 → 读一次几何 → 挂。
    if (!nextShown){
      gateGo.classList.remove('shine'); void gateGo.getBoundingClientRect();
      gateGo.classList.add('shine');
    }
    gateGo.focus();
  });

  });

  // 锚点：门禁只在**句子边界**开（interactions.md §3）。
  //   默认（挂场景开头）→ 场景起点：这一场还没开播，掐不到任何话。
  //   at:'end'          → 本场**末句播完**那一刻，也就是场景之间的空档。
  // 旧写法按 index === last 判，那是在末句**开头**就停 —— 正好掐断它要考的那句话。
  // GATES[i].scene 必须命中时间轴场景：配了却不弹的门禁由 check_gates 浏览器冒烟
  // 活动驱动拦下（runtime.md §8），所以这里不再写 `!sc` 兜底——与 preGateOpen 同契约。
  function gateAnchor(i){
    var sc = scenes[sceneIndexOf(GATES[i].scene)];
    var r = sc.runtime, ns = r.narration || [];
    if (GATES[i].at === 'end' && ns.length)
      return ns[ns.length-1].start + ns[ns.length-1].duration;
    return r.start;
  }
  // t 落在哪一场 —— **含场景之间的空档**（t 在 [scene.end, next.start) 仍算这一场）。
  // sentAt() 只认句子区间、空档里返回 null，而 at:'end' 的门禁恰恰开在空档里，
  // 所以门禁不能挂在 sentAt 的返回值上判。
  function sceneIdxAt(t){
    for (var i=0;i<scenes.length;i++){

      if (t >= r.start && t < nxt) return i;
    }
    return -1;
  }
  // 放进 tick() 里每帧调一次（幂等）；**空档里也要调**——at:'end' 的门禁就开在那个空档
  // seek 语义（和"锚点只在自然播放经过时打断"对齐）：
  //   · 一帧跳 0.5s 以上算 seek；落点已经越过锚点的门禁**不追溯打断**（否则进度条
  //     拖到场景中途会被 at-start 门禁拽回起点，用户的跳转被吞掉）；
  //   · 门禁开着时 seek 走 → 收起并**撤销 shown**：没答对的题再经过锚点应当重问；

  var gateLastT = 0;
  function syncGate(){
    // 导出截图模式（export_video.py 注入 __coursewareShotMode）：门禁浮层已被 CSS 压掉，
    // 这里再 return 一下，免得浮层虽不可见仍占着 gOpen 把音频冻结在锚点上。
    if (window.__coursewareShotMode) return;
    var t = audio.currentTime, si = sceneIdxAt(t);
    var jumped = Math.abs(t - gateLastT) > 0.5;
    gateLastT = t;
    if (si < 0){ if (gOpen >= 0) closeGate(); return; }
    var sid = scenes[si].step_id, i = -1;
    for (var k=0;k<GATES.length;k++) if (GATES[k].scene === sid) i = k;
    if (gOpen >= 0){
      if (i !== gOpen){
        if (!gAnswered[gOpen]) gShown[gOpen] = false;   // 没答就跳走：撤销，再经过锚点重问
        closeGate();
      }
      return;
    }
    if (i < 0) return;
    var a = gateAnchor(i);
    if (t < a){
      if (gShown[i] && !gAnswered[i]) gShown[i] = false;   // 回到锚点前：重新武装
      return;
    }
    if (gShown[i] || gAnswered[i]) return;
    if (jumped && t > a + 0.5){ gShown[i] = true; return; } // seek 落在锚点后：不打断这次跳转
    gShown[i] = true;

  }
  function resetGates(){ closeGate(true); gShown = []; gAnswered = []; }
  function gateBusy(){ return gOpen >= 0; }
  function gateAnswered(){ return gOpen >= 0 && !!gAnswered[gOpen]; }

  // ══ ⑥ 主循环 ═══════════════════════════════════════════════════════════
  var lastKey = '';
  var lastSceneIdx = -1;      // 章节头翻场的比对基准（-1 = 还没落过场景）
  // 浏览器 QA 在清空逐句 trace 前调用它：trace 与去重状态必须一起重置，
  // 否则单场景单句课件会把唯一一句误判为“没有再次驱动 renderer”。
  window.__coursewareResetRenderTrace = function(){
    window.__coursewareRenderTrace.length = 0;
    lastKey = '';
  };
  /* 快进掠擦（0.22.0）：时间被**搬动**过，就横掠一道箭头，确认"播放头跳了"。

     一帧的量级（16.7ms × 倍速，2× 也只有 33ms），能过阈值的只有跳转：点进度条、
     点章节刻度、键盘 ±8s、QA 的 __jump。方向跟着差值符号走，回拖就是反向掠——
     与场景换场（sceneSlide）同一个"方向感"口径，只是这一条说的是时间不是内容。
     阈值为什么读 :root 上的自定义属性：它和 --dur-ff / --ff-travel 是同一组舞台
     参数（掠多快、走多远、多大跳转才算"跳"），改一处就行，不必两头对齐。
     四道不演：① 冷启动第一帧没有"上一拍"可比；② 擦洗中——手指在条上跑时每帧
     都是大跳，箭头会连成一条抖；拖动**松手那一拍也不演**，因为 lastT 在擦洗期间

     真实的跳转）；③ 导出截图模式——成片每一帧本来就是 seek 出来的；④ 门禁开着

  var lastT = null, ffThr = -1;

    // 连点两次进度条只演一次（动画还在跑，加同一个 class 是幂等的）。

  function tick(){

    var hit = sentAt(t);

    // 当前章节刻度点亮（"你在哪"位置 cue）：与 tick/场景头同一个 sceneIdxAt
    // （空档算前一场），纯颜色切换，逐拍幂等。
    var si = sceneIdxAt(t);
    for (var q=0;q<TICKS.length;q++) TICKS[q].classList.toggle('on', TICKS[q].dataset.i == si);

    if (hit.scene){
      var idx = hit.sceneIndex;
      // 门禁**不在这里判**：它自己看锚点，与"现在第几句"无关（见下面单独的一次 syncGate()）。
      // at:'end' 的门禁开在末句之后的空档里，而空档不属于任何句子。
      var key = hit.scene.step_id + '#' + hit.index;

      // （句间本来就有几十毫秒的接缝，闪一下空白比多留半秒更难看）
      if (hit.index >= 0 && key !== lastKey){       // 句号变了才重画
        lastKey = key;
        stepT0 = hit.sentence.start;             // 数字落定（0.37.0）滚动的起点：本句句首
        begin();                                  // 开新步：本步没引用的常驻图元随后撤走
        (RENDER[hit.scene.step_id] || function(){})(hit.index);
        worldFor(hit.scene.step_id, hit.index);   // 主角落位（跨幕延续的那三个数）
        drawExplodes();                           // 0.41.0：拆解视图，先合成本步装配位
        drawCallouts(hit.scene.step_id, hit.index); // 0.38.0：世界层落位后再量注记
        drawCues();                               // 0.39.0：词拍括号层，世界层落位之后建空框
        drawCompares();                           // 0.40.0：对照窗，世界层落位之后现量两版并集
        layoutConnects();                         // 0.43.0：关系连线，世界层落位之后现量两端
        layoutLoupes(hit.scene.step_id, hit.index); // 0.44.0：细节镜，世界层落位之后现量观察点
        layoutSegs(hit.scene.step_id, hit.index); // 0.46.0：路径进度，世界层落位之后量弧长、定这一趟
        layoutLoops(hit.scene.step_id, hit.index); // 0.47.0：圈数，世界层落位之后现算落点与每圈时长
        layoutLanes(hit.scene.step_id, hit.index); // 0.48.0：时序带，世界层落位之后现量各 item 并集
        layoutRanges(hit.scene.step_id, hit.index); // 0.49.0：区间窗，世界层落位之后现量那几件的并集
        layoutLimits(hit.scene.step_id, hit.index); // 0.50.0：界线，世界层落位之后量尺子与那颗量
        layoutForks(hit.scene.step_id, hit.index);  // 0.51.0：岔路，世界层落位之后量岔口与各去向盒
        camSet(hit.scene.step_id, hit.index);     // 落镜头：声明过取景窗就推 / 拉 / 摇
        window.__coursewareRenderTrace.push(key);
        capShow(hit.sentence);              // 字幕跟画面同一条命令驱动，不会错位
        el('ch-tag').textContent = segLabel(idx);
        el('ch-title').textContent = hit.scene.content.title || '';
        el('ch-tagline').textContent = hit.scene.content.tagline || '';
        // 章节头翻场：**上面那个分支是"换句"，不是"换节"**——每句都会走进来，
        // 所以这里另存一个场景号比对：只有真换节才抖一下，否则每句都在闪。
        // 重触发口径与 capShow 同款（remove → 读一次几何 → add）。
        if (lastSceneIdx !== idx){
          var fwd = lastSceneIdx < 0 ? 0 : (idx > lastSceneIdx ? 1 : -1);
          lastSceneIdx = idx;
          moodSet(hit.scene.step_id);   // 气氛跟着**这一段**换档（1.2s 游过去，不闪）
          var ch = el('chapter');
          ch.classList.remove('chFlip'); void ch.getBoundingClientRect();
          ch.classList.add('chFlip');
          /* 字距归位（0.21.0）：副题跟着**换节**从散开收成正常排布，读作"新的
             一句进场"。判据与上面翻场同一个（换节不是换句），重触发口径也是同一段
             三段式；挂在 tagline 自己身上而不是 #chapter——翻场动的是整块的位移，
             这一条动的是副题的字距，两层叠在同一节点上会互相看不懂。
             空 tagline（`:empty` 已 display:none）也照挂：没有盒子就没有动画，
             没有副作用，不需要额外的 if。 */
          var tg = el('ch-tagline');
          tg.classList.remove('gather'); void tg.getBoundingClientRect();
          tg.classList.add('gather');
          // 方向感换场（0.14.0）：**前进从右侧进、后退从左侧进**。章节头已经报了
          // "换节"，画面这一层跟着给出"往哪儿换"——回拖进度条重看时方向相反，
          // 观众不用读数字就知道自己是在往前走还是往回走。
          // 判据与翻场同一个（换节，不是换句）；冷启动第一步不演（fwd=0，没有
          // "上一节"可比）；擦洗与导出截图模式下不演（口径同运镜模糊）。
          if (fwd && !scrubbing && !window.__coursewareShotMode) sceneSlide(fwd);

      }
      // 读数与画面同生共死：index<0 的空档里（seek 进场景首句之前的缝隙时可能持续
      // 很久）整行**停在上一句上**，否则读数已翻到新场景、舞台还停在旧场景，两头对不上。
      if (hit.index >= 0){
        // 字幕带必须**认这一拍**：ended 把整条带子收起了（capSent 一起清成 null），
        // 之后把进度条拖回最后那句里，句号没变 → 上面那个换句分支不进 → 带子会一直
        // 空着，而画面、读数、细线全都跟着回来了（实测：回拖后 #cap.on=false 而
        // #cap-text 还有字）。字幕是 currentTime 的纯函数，"这一拍有活跃句子"就必须
        // 有带子。差分用 capSent 而不是 lastKey：同句不重挂、不重量，也就不会每帧
        // 多一次 getBBox（capShow 内部本就按 textContent 决定要不要重放 capLift）。
        if (capSent !== hit.sentence) capShow(hit.sentence);
        // 读数只留"第几节 + 时间"：章节名在画布上方的章节头里，重复出现在这条
        // 窄行里既挤进度条，窄屏下还会溢出（段名动辄十几个字）。
        var stepTxt = (idx + 1) + '/' + scenes.length + ' · ' + fmt(t) + ' / ' + fmt(TOTAL);
        var stepEl = el('step');                       // fmt 秒级变化，避免每帧重写

      }
    } else if (scenes.length && t < scenes[0].runtime.start){
      capShow(null);                    // 开场前：字幕带整条收起（idle 的 CSS 也压着）
    }
    // 句内进度细线（0.16.0）：必须排在**上面那一整块之后**，不是随手跟在 #fill 后面——
    // 换句那一支里 capShow 才写 capSent / capGeo，写在前面就会拿上一句的宽配这一句的
    // 进度（导出截图页每帧只跑一次 tick()，那一帧恰好是换句帧时读到的是空线：实测）。
    // 与 #fill 同为"时钟的逐拍读数"，逐拍写、不补间（口径见 capProgWrite）。
    capProgWrite(t);
    // 跟读点亮（0.19.0）：与细线同一个 k、同一个位置——都在整块换句/换场逻辑**之后**，
    // 因为 capShow 才写 capSent；写在前面会让换句那一帧拿上一句的时长算这一句的亮度。
    // 导出截图页每帧只跑一次 tick()，那一帧落的正是那一秒的读数（口径见 capLitWrite）。
    capLitWrite(t);
    // 逐字解码（0.26.0）：与细线、点亮同一个位置、同一个 capSent——**排在换句分支之后**，
    // 因为解码的进度是"当前这一句念到哪儿"。没有解码项时这一趟就是个空循环。
    decodeWrite(t);
    // 数字落定（0.37.0）：与上面几个逐拍读数同一个位置——换句分支里 put() 才重挂
    // COUNT（目标值写在 data-count 呈现属性上），写在前面会拿上一句的登记表算这一句。
    // 导出截图页每帧只跑一次 tick()：shot 模式下这一趟直接落终值（定格里读"量"）。
    countRollWrite(t);
    // 量条（0.42.0）：与数字落定同一个位置、同一只时钟、同一个 --dur-roll 拍——

    meterWrite(t);
    // 关系连线（0.43.0）：与上面几个逐拍读数同一个位置——layoutConnects() 只在换句

    morphTock(t);
    // 路径进度（0.46.0）：与上面几个逐拍读数同一个位置——layoutSegs() 只在换句分支

    // （与 morph 飞行表同一族理由）。导出截图页每帧只跑一次 tick()：见旗直接落
    // 作者声明的 at（定格里读到"走到这一格"，不是一段没演完的中间态）。

    // 圈数（0.47.0）：与上面几个逐拍读数同一个位置——layoutLoops() 只在换句分支里跑

    // 角度与落点痕都是逐拍读数。它**不随 begin() 清空圈数**：下一步没再声明这件东西，
    // 它停在已经落定的那一圈（与 SEG_P / MORPH 飞行表同一族理由）。导出截图页每帧只
    // 跑一次 tick()：见旗直接落作者声明的 at（定格里读到"绕到第 k 圈"，不是一段没演
    // 完的中间态）。
    loopTock(t);
    // 时序带（0.48.0）：与上面几个逐拍读数同一个位置——layoutLanes() 只在换句分支里跑
    // （建注记、量并集、判上下沿摆不摆得下），实心段长与"现在"针的位置是逐拍读数。
    // 这一族**没有跨步账本**：两个数都是 `(t − stepT0) ÷ dur` 与声明相位的纯函数，
    // 与 capProgWrite / --lit 同一个算式，所以擦洗、逐帧冷启动、导出天然读到同一格。
    // 导出截图页每帧只跑一次 tick()：见旗把句子进度直接当 1 落（定格里读"这几件事
    // 都做完了"，不是针停在半路的中间态）。
    lanesTock(t);
    // 区间窗（0.49.0）：与上面几个逐拍读数同一个位置——layoutRanges() 只在换句分支里跑
    // （建带 / 定起点 / 量并集），窗口从起点往当拍的目标追是逐拍读数。它**不随
    // begin() 清空窗口位置**：下一步没再声明这条窗，它整条摘掉，但"上一拍停在哪儿"
    // 留着——同一个 key 再登记时从原处滑过去，而不是瞬移（与 SEG_P 同族理由，只是
    // 它记的是注记的位置而不是对象的状态）。导出截图页每帧只跑一次 tick()：见旗直接
    // 落作者声明的那一格（定格里读到"取的是这几件"，不是一段没滑完的中间态）。
    rangeTock(t);
    // 界线（0.50.0）：与上面几个逐拍读数同一个位置，但**它不吃时间**——界线位置是尺子
    // 的盒与 at 的纯函数，判定是"那颗量现在长到哪儿"的比较，两样都是现量。它每拍重量
    // 的理由只有一个：量在长（meter 的 scale、对象入场、卡片被挪位），界线要跟着那颗量
    // 的当前位置判"到没到"。没有起点、没有补间、没有跨步账本，见旗时 meter 落满、判定
    // 自然落"越界"。它不随 begin() 清空**判定**：LIM_S 只是"上一拍是界内还是越界"，
    // 用来避免每帧重写 class；节点被摘时连它一起清（否则重建出来的同一个 key 会停在
    // 旧档的颜色上）。
    limitTock();
    // 岔路（0.51.0）：与界线同一个位置、同一个理由——**它不吃时间**。岔口点是 from 盒
    // 朝诸去向重心的边界出口，各支末端取去向盒的边缘再退 gap + head，全是"from 盒 ×
    // 各 to 盒 × at"的现量函数；每拍重算只是因为对象还在入场、还在挪位（世界层逐句对账），
    // 扇面要跟着落位而不是钉在换句那一瞬的旧盒上。没有起点、没有补间、没有跨步账本，
    // 见旗（导出 / 减动效 / 擦洗）不另写兜底：落的就是"清单摆着、走的是声明的那一条"。
    // FORK_S 只是"上一拍选中第几条"，用来避免每帧重写 class；节点被摘连它一起清
    // （否则重建出来的同一 key 会停在上一次的选中档上，读成"还是这条路"）。
    forkTock();
    // 词拍（0.39.0）：与上面几个逐拍读数同一个位置——换句分支里 renderer 才重挂
    // CUE、capShow 才写 capSent，写在前面会拿上一句的登记表算这一句的词窗。
    // 它不是动效：没有动画、没有计时，只把"念到没念到"写成一个 class；几何在词到
    // 的那一拍现量（cueGeom），不预排坐标。
    cueWrite(t);
    // 门禁每帧判一次（幂等）：它自己比锚点，所以**空档里也要判**——
    // at:'end' 的门禁正是开在末句之后的那个空档里。
    // 擦洗期间例外：preGateOpen 会把 currentTime 拽回场景起点，和还按着
    // 进度条的手指抢方向盘；松手后补一次 syncGate，锚点照常触发。
    if (!scrubbing) syncGate();
    // 剩下的情况**什么都不做**，两种子情形：
    // ① 两个场景之间的那 0.4 秒空档 —— 字幕与读数停在上一句上，一进空档就清掉，
    //    每换一节都会闪一下空白，所以这里保留上一句；
    // ② t 已经越过了最后一句 —— 也**不要**在这儿判"课程结束"。实测时间轴声明的
    //    end（115.201）比音频真实长度（115.2002）长那么几毫秒，`t >= end` 永远不成立，
    //    写在这儿就是死代码。结束态改挂在 audio 的 `ended` 上（见 §⑦），那才是真的播完。
  }

  // ══ ⑦ 走带 / 章节刻度 / 侧栏杂项 ═════════════════════════════════════
  // **没有顶部走带**：播放层与门禁浮在画布内；字幕在画布里（§③ 字幕带）；播放器行
  // 常驻在画布下面（见 CSS 的 ④ 播放器行 / `.rack`）。
  // 画布的 data-state 是播放层的唯一开关：idle / playing / paused
  var stage = el('stage');

     0.28.0 延伸：同一套场与令牌也接**选项药丸**（#gate-block .mag 包装层）——学习者
     在几颗选项之间定位时，近的那颗迎一下、远的原地不动（best-k 单选天然只回应一颗）；
     药丸本体挂着自己的全属性 transition，所以位移写在 span 上而不是按钮上（见 §③
     .mag 那条注释）。答对后按钮被禁用，包装层不再迎接——放行键出现前题面已经"过期"。 */
  function magClear(){
    Array.prototype.forEach.call(
      gateEl.querySelectorAll('.gate-next .go, .act-row .go, #gate-block .mag'), function(b){
        if (b.style.translate) b.style.translate = '';
        if (b.dataset.mag) delete b.dataset.mag;
        b._mag = null;
      });
  }
  function magMove(e){
    if (window.__coursewareShotMode || mqReduce.matches ||
        (e.pointerType && e.pointerType !== 'mouse' && e.pointerType !== 'pen')){
      magClear(); return;
    }
    var rootCS = getComputedStyle(document.documentElement);
    var R = parseFloat(rootCS.getPropertyValue('--mag-r')) || 34;
    var P = parseFloat(rootCS.getPropertyValue('--mag-pull')) || 6;
    var best = null, bestK = 0, bestX = 0, bestY = 0;
    Array.prototype.forEach.call(
      gateEl.querySelectorAll('.gate-next .go:not(:disabled), .act-row .go:not(:disabled), #gate-block .mag'),
      function(b){
        if (!b.offsetWidth) return;
        // 药丸包装层（0.28.0）：答对后按钮被运行时禁用（span 没有 disabled），
        // 已放行的题面不许再迎接（口径同辉光 [data-locked] 那一条）
        if (b.matches('#gate-block .mag')){
          var btn = b.querySelector('button');
          if (!btn || btn.disabled) return;
        }
        var cur = b._mag || {x:0, y:0};
        var r = b.getBoundingClientRect(), w = r.width, h = r.height;
        var cx = r.left + w/2 - cur.x, cy = r.top + h/2 - cur.y;
        var px = Math.max(0, Math.abs(e.clientX - cx) - w/2);
        var py = Math.max(0, Math.abs(e.clientY - cy) - h/2);
        var d = Math.sqrt(px*px + py*py);
        if (d > R) return;
        var k = Math.sin(Math.PI * Math.min(1, d / R));
        if (k <= bestK) return;
        var vx = e.clientX - cx, vy = e.clientY - cy;
        var len = Math.sqrt(vx*vx + vy*vy) || 1;
        best = b; bestK = k;
        bestX = vx / len * P * k; bestY = vy / len * P * k;
      });
    Array.prototype.forEach.call(
      gateEl.querySelectorAll('.gate-next .go, .act-row .go, #gate-block .mag'), function(b){
        if (b === best) return;
        if (b.style.translate) b.style.translate = '';
        if (b.dataset.mag) delete b.dataset.mag;
        b._mag = null;
      });
    if (!best) return;
    best.dataset.mag = '1';
    best._mag = {x:bestX, y:bestY};
    best.style.translate = bestX.toFixed(2) + 'px ' + bestY.toFixed(2) + 'px';
  }
  gateEl.addEventListener('pointermove', magMove);
  gateEl.addEventListener('pointerleave', magClear);
  gateEl.addEventListener('pointerdown', magClear);
  gateEl.addEventListener('focusin', magClear);

  tick();
})();
</script>
