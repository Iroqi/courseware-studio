      });
    }
    /* 沿线抵达（0.20.0）：同分的两个人各自沿自己那条连线**走到右列去**。
       .draw 说的是"这两个位置之间有一条路"，这一层说的是"人真的沿这条路过去了、
       并且留在了终点"——两句合起来才说完 s1 那句"相等元素保序"。四个口径：
         · **s0 就建档、停在路头**（data-go=0），s1 起换档：补间发生在步与步之间，
           renderer 只写档位不排程（纪律 1）。s0 那一步右列还是一个 `?`，标记站在
           左列卡片边上不泄露结果，读作"还在原地"；
         · 路线写在呈现属性 `style` 上，坐标与那条 line 的 x1/y1→x2/y2 **同一个数组
           里出来**：两处各抄一遍数字，改了列宽就会跑偏；
         · **不挂在 e-ties 那一层里面**：那一层 s2 起挂 `.tuckL gone`，clip-path 会把
           走在半途的标记一起裁掉（`.tuck*` 边界 ④/⑤ 那条"要全程在场的东西不放收拢
           层里"）。标记要留在台上，就得是自己的节点；
         · 到了 s2、s3 标记留在终点不再动——它承担的是"这个人落在哪一行"的位置信息，
           s3 那句"90 分两行 · 小明在小红前"正是指着这两枚说的（关掉动效也一样在场，
           见减少动效兜底那三条）。
       箭头（`M 4 -5 L 10 0 L 4 5`）朝 +x：`offset-rotate:auto` 会把它对准路线方向，
       不用 JS 反解角度（实测那条 292×72 的斜线上自动转了 13.86°）。 */
    [['小明',150,222], ['小红',222,294]].forEach(function(p){
      var route = "--route:path('M 354 " + p[1] + " L 646 " + p[2] + "')";
      /* 行进余像（0.32.0）：先建尾巴、后建头——同位置时头压住尾（CSS 口径 ④）。
         两枚余像各晚 --trail-step 的 1 / 2 倍出发；行程 ~300 单位，0.07s/0.8s
         = 8.75%，实测（三条补间一起 pause 到 t=400ms）头 50%、尾 41.25% / 32.5%，
         屏幕间距 23.8 / 22.1px——够读成"一串"而不断成"三个东西"。余像只描圆环
         （不带箭头、不带字），透明度递减；到站两环收在头下（5.9 < 6）。 */
      [1, 2].forEach(function(i){
        var wk = put('e-body', 'g', 'e-wake-' + p[0] + '-' + i,
          {class:'ride wake', 'data-go': step >= 1 ? '1' : '0',
           style: route + ';--wake-i:' + i});
        put(wk, 'circle', 'e-wake-' + p[0] + '-' + i + '-c',
          {r: i === 1 ? 5.2 : 4.4, fill:'none', stroke:'#2ecc71',
           'stroke-width':1.4, opacity: i === 1 ? .5 : .25});
      });
      var rd = put('e-body', 'g', 'e-ride-' + p[0],
        {class:'ride', 'data-go': step >= 1 ? '1' : '0',
         style: route});
      put(rd, 'circle', 'e-ride-' + p[0] + '-c', {r:6, fill:'#2ecc71'});
      put(rd, 'path', 'e-ride-' + p[0] + '-a', {d:'M 4 -5 L 10 0 L 4 5', fill:'none',
        stroke:'#2ecc71', 'stroke-width':2});
    });
    // s2「多级排序时特别有用」：标出「两级」这个动作，与 s1 区分。
    // 挂在两列中间的空白处——右列抬头行(100)和卡片(150 起)都在这条线上方/下方，
    // 贴在列头上就会撞字（实测过）。
    if (step === 2) txt('e-body', 'e-lv', {x:500, y:352, 'text-anchor':'middle', 'font-size':12,
      'font-family':MONO, fill:'#f5a623'}, '两级：姓名 → 分数');
    // s3「同分的人维持姓名的顺序」：给并列的两人补一个括注，与 s2 区分
    if (step === 3) txt('e-body', 'e-note', {x:792, y:344, 'text-anchor':'middle',
      'font-size':12, 'font-family':MONO, fill:'#2ecc71'}, '90 分两行 · 小明在小红前');
    sweep('e-body');
  }

  /** 舞台 F：开场 / 结尾提问。世界层在旁边打底（开场 bench 一排影子、结尾
   *  answer 那排带引号的数），问题本身留在抬头那一行。 */
  function renderF(which){
    only('stF');
    el('f-q').textContent = which === 'open' ? '[10, 9, 1].sort()  →  ?'
                                             : '🤔 为什么是 [1, 10, 9] ？';
  }

  /** 舞台 G：巧合（5 句）
   *  s0「一二三看着挺对」→ 只有位数相同那一行，站在正中
   *  s1「这是巧合」→ 落一枚徽标
   *  s2「位数相同时恰好一致」→ 位数不同那一行**长出来**，原本居中的行让位上移——
   *     这是常驻图元才有的编排：建行是建档，让位是补间，不是整屏重画一次
   *  s3「位数不同就破了」→ 聚焦破功那行，另一行焦点弱化（材质退档，镜头不管）
   *  s4「别让碰巧的成功骗过你」→ 两行都恢复正常，收一句判词 */
  function renderG(step){
    only('stG');
    var groups = [
      {k:'same', nums:['1','2','3'],  lab:'位数相同 · 都是 1 位',   col:'#2ecc71', from:0},
      {k:'diff', nums:['1','2','10'], lab:'位数不同 · 1 位 / 2 位', col:'#ef4d4d', from:2}
    ];
    var two = step >= 2;
    groups.forEach(function(g, gi){
      if (step < g.from) return;
      var oy = two ? 232 + gi * 120 : 258;
      // s3「位数不同就破了」：聚焦翻车那行——另一行走焦点弱化档位
      // （filter 材质 + opacity 同步退档），镜头不管，靠明暗分主次。
      // 0.31.0 动效目的审计续（声画对齐）：s2 旁白讲的是"位数相同时恰好一致"
      // （话头 = same 行 1/2/3），diff 行（红色"位数不同"标签 + 1/2/10 三卡）
      // 这时候**也建档淡入**就抢话头——与 0.28.0 renderB 同构（没轮到的内容
      // 不该满亮度登场）。修法同一套：s2 的 diff 行走弱化档位（在但不在重点上），
      // s3「位数不同就破了」才升为话头。
      var dim = (step === 3 && gi === 0) || (step === 2 && gi === 1);
      var G = put('g-body', 'g', 'g-' + g.k, {transform:'translate(0,' + oy + ')',
        'data-dim': dim ? 1 : 0, opacity: dim ? .45 : 1});
      txt(G, 'g-' + g.k + '-lab', {x:500, y:-50, 'text-anchor':'middle', 'font-size':13,
        fill:g.col}, g.lab);
      var span = (g.nums.length - 1) * 132;
      g.nums.forEach(function(v, i){
        var cell = put(G, 'g', 'g-' + g.k + '-' + v,
          {transform:'translate(' + (500 - span / 2 + i * 132) + ',0)'});
        put(cell, 'rect', 'g-' + g.k + '-' + v + '-r', {x:-46, y:-34, width:92, height:68, rx:12,
          fill:'#1c212c', stroke:g.col, 'stroke-width':2, opacity: g.k === 'diff' ? .85 : 1});
        txt(cell, 'g-' + g.k + '-' + v + '-t', {x:0, y:11, 'text-anchor':'middle', 'font-size':28,
          'font-weight':'700', 'font-family':MONO, fill:g.col}, v);
      });
    });
    // 徽标跟着它注释的那一行：s1 只有一行，判词落在行上方；s4 两行已经排满，
    // 就落在"翻车"那一行的右边——居中会把行标签挤在一起（实测过）。
    if (step === 1) badge('g-body', 'g-luck', 500, 132, '巧合', '#f5a623');
    if (step === 4) badge('g-body', 'g-luck', 772, 346, '位数不同就翻车', '#f5a623');
    sweep('g-body');
  }

  var RENDER = {
    'opening': function(){ renderF('open'); },
    'seg-1': renderA,
    'seg-2': renderB,
    'seg-3': renderG,
    'seg-4': renderC,
    'seg-5': renderD,
    'seg-6': renderE,
    'closing': function(){ renderF('close'); }
  };

  // ══ ③ 字幕带：字幕文案唯一来自时间轴 ══════════════════════════════════
  // sentAt() 给出当前句，capShow(hit.sentence) 把这一句口播原文直接写进画布——
  // 念什么就显什么；页面不维护第二份字幕文案（理由与 gap-hold 见 stage.md §4）。
  // `hl:true` 的那一句是结论，用主色点一下（标在 narration-source.json 的 `hl` 里，
  // build_timeline 落到句子身上，见 script.md §1）。**强调色只有这一个**——
  // 红/绿那套语义色留给画面本身，字幕带不做第二套颜色编码。
  /** 写一条字幕：**文案就是这一句本身**，页面里不留第二份。
   *  只有开场前 / 课程结束时传 null 收起；场景与句间空档不调用本函数，
   *  字幕停在上一句上（不清空、不闪白，见 stage.md §4）。
   *  说话人标签是同一句数据的派生视图：`#cap-speaker` 显示 `s.speaker`
   *  （对话讲稿由 build_timeline 从 speakers[label] 透传，见 script.md §1），
   *  无 speaker 时留空——它不碰 `#cap-text`，字幕唯一来源的契约不受影响。 */
  function capShow(s){                     // s = sentAt() 返回的当前句；null = 收起
    if (!s || !s.text){ show('cap', false); capSent = null; capProgWrite(0); capLitWrite(0); return; }
    var t = el('cap-text');
    // 文本真的变化才重触发翻句微动效（.capLift）；同句重显（如 pause 后恢复）
    // 不重放——空档保留上一句的契约下，别让字幕每停一句就"跳"一次。
    if (t.textContent !== s.text){
      t.textContent = s.text;
      t.classList.remove('capLift'); void t.getBoundingClientRect(); t.classList.add('capLift');
    }
    t.setAttribute('fill', s.hl ? '#f5a623' : '#c9d1e0');
    capHl(t, !!s.hl);
    capSent = s;                      // 细线要跟的"当前这句"：空档里也认它（见 tick）
    capMeasure(t);
    var sp = el('cap-speaker');
    if (sp){ sp.textContent = s.speaker || ''; }
    show('cap', true);
  }
  /** 结论句划重点（0.14.0）：色带的几何**从字幕自己量**——x/宽取当句 bbox，
     纵向只压下半截字身（像马克笔划过去，不糊住整行）。量而不是算，是因为字号
     有两套口径：桌面 17、小屏分档 26（layout.md §4），手写常数必然错位。
     非结论句写 0 宽：既是收起也是下一句的生长起点。
     位移全交给 CSS transition（纪律 1：这里不排程、不轮询）。 */
  function capHl(t, on){
    var m = el('cap-hl');
    if (!m) return;
    var x = 500, w = 0;
    if (on){
      var bb = t.getBBox();
      x = bb.x; w = bb.width;
      m.setAttribute('y', (bb.y + bb.height * .52).toFixed(1));
      m.setAttribute('height', (bb.height * .5).toFixed(1));
    }
    m.setAttribute('x', x.toFixed(1)); m.setAttribute('width', w.toFixed(1));
    // CSS 几何属性优先（可补间）；上面那两笔呈现属性是"不支持时仍落终态"的兜底，
    // 两者同源同一次写，不会漂出第二套状态。
    m.style.x = x + 'px'; m.style.width = w + 'px';
  }
  /** 句内进度细线（0.16.0，"时间刻度层"第一条）：把"这一句念到哪儿了"划在字幕自己
     下面。与划重点同口径的地方是几何**从字幕现量**（桌面 17 / 小屏 26 两套字号，
     写常数必错位）；刻意不同的地方是这里只写呈现属性、不写 style、不挂 transition
     ——它是时钟的逐拍读数（和 #fill 同类），补间会让它永远落后于正在念的那个字。
     capSent/capGeo 都存在句子对象与现量结果里，不另开一份状态：进度 = currentTime
     的纯函数，回拖就倒回去，暂停就停住，导出截图页那一帧落的也是那一秒的真读数。
     量一次、逐拍只写 width：getBBox() 是同步布局查询，把它留在每帧路径上等于给
     逐帧循环加一条不该在那儿的重排（stage.md §5）。 */
  var capSent = null, capGeo = null;
  function capMeasure(t){
    var p = el('cap-prog');
    if (!p) return;
    var b = t.getBBox();
    capGeo = {x: b.x, w: b.width, y: b.y + b.height + 1.5, h: 2};
    p.setAttribute('x', capGeo.x.toFixed(1));
    p.setAttribute('y', capGeo.y.toFixed(1));
    p.setAttribute('height', capGeo.h.toFixed(1));
    p.setAttribute('width', '0');              // 换句即归零：新句从 0 开始长
  }
  function capProgWrite(t){
    var p = el('cap-prog');
    if (!p) return;
    if (!capSent || !capGeo || !(capSent.duration > 0)){
      if (p.getAttribute('width') !== '0') p.setAttribute('width', '0');
      return;
    }
    var k = Math.max(0, Math.min(1, (t - capSent.start) / capSent.duration));
    var w = (capGeo.w * k).toFixed(1);
    if (p.getAttribute('width') !== w) p.setAttribute('width', w);   // 同值不重写
  }
  /** 跟读点亮（0.19.0）：把"这一句念到哪儿了"落在**字本身**上——念过的保持全亮，
     未念的压到 --lit-floor 那一档灰阶地板（对比度实测见 CSS「跟读点亮」④）。
     与 capProgWrite 同一条口径，也刻意不同的一条：细线写 width（几何），这一层只写
     `--lit`（一个注册成 `<percentage>` 的读数），两者都是 currentTime 的纯函数、
     逐拍写、不挂 transition、不进 reduced-motion 清单。
     停靠点用 118% 这一档做满亮（= 100% + --lit-ramp）：k=1 时软过渡带正好落到元素
     之外，整行在不透明段上；k=0 时带子落在 0% 之外，整行都在地板上。所以
     "没有活跃句子"（capSent 为 null）走满亮而不是清零——带子已收起，别在收起态
     留一个"整句压暗"的计算值，导出与回拖时那一帧读起来会像 bug。
     同值不重写：这一层每帧都跑，写在 style 上会每次都触发一次重算。 */
  var LIT_FULL = 118;                 // --lit 的满亮档，与 @property initial-value 同数
  function capLitWrite(t){
    var el2 = el('cap-text');
    var k = (!capSent || !(capSent.duration > 0)) ? 1
          : Math.max(0, Math.min(1, (t - capSent.start) / capSent.duration));
    var v = (LIT_FULL * k).toFixed(1) + '%';
    if (el2.style.getPropertyValue('--lit') !== v) el2.style.setProperty('--lit', v);
  }

  /* ── 逐字解码（0.26.0，kinetic typography 的 decode / scramble 读法）─────────
     画面里的**术语**不写成"已经定好的字"，而是让它在被念到的那一句里**从噪声里一个字
     一个字定住**——旁白说到"先转成字符串"时，观众看着那五个字被逐个认出来，读作"这个
     词正在被推导出来"，而不是"这块屏幕刚打印出一行结论"。
     与 0.19.0 的跟读点亮同一族（都是 currentTime 的逐拍纯函数、回拖跟得回、暂停停得住），
     但**刻意不同的一条**：点亮只压暗、永远可读，所以 reduce 下照旧跟着嘴；解码在未定
     住的那些格里**本身就是不可读的字**，那对晕动/读屏用户是减分不是加分——所以 reduce
     与导出截图模式一律直接落完整的词（前沿实现同一口径：resolved text 才是内容本体，
     scramble 只是它的入场）。五条边界：
       ① **不许用随机数**：前沿库（GSAP ScrambleText 一类）内部是随机取字符，官方文档
          自己写了"逐帧渲染要 --concurrency=1 才复现得一致"。本仓库导出 mp4 是每帧一次
          冷启动 seek，随机一次就等于**同一秒的两帧是不同的字**。这里的字面由 (目标字符,
          下标, 句内进度) 现算，同一个 t 永远给同一个串（测试按这个钉死）。
       ② **字宽不许漂**：徽标的药丸底宽是按文案长度算的（badge 里那一行 w=），而解码
          途中换的是**别的字**——非等宽字体下 Latin 池里 'i' 与 'm' 差一截，画面会抖。
          建档时把终态宽度现量出来钉进 `textLength` + `lengthAdjust=spacingAndGlyphs`，
          解码期间整串的推进量被钉死在同一个数上。实测：四字词自然推进量 55.968 → 钉
          56.0，k 从 0 到 1 的十格采样里 `getComputedTextLength()` 全是 56.0、药丸底宽
          全是 77.413，一格都没抖；五字词 69.994 → 钉 70.0 同样恒定。
          ⚠ 量的必须是 `getComputedTextLength()`（**推进量**）而不是 `getBBox().width`
          （**墨盒**）：两者对同一串就不等（五字词实测 69.994 vs 70.134），而墨盒在解码
          途中还会自己抖——`spacingAndGlyphs` 是按字符重新分配边距的，k=.5 那一格的噪声
          字「较」墨宽溢出，`getBBox().width` 读到 56.467（多 0.467），前后九格都是 56.0。
          钉墨盒等于把整串压窄，而药丸底是按长度写的、不会跟着窄，字就贴到边上去了。
       ③ 池按**字符类**分：CJK 换 CJK（全角同宽，就算不钉 textLength 也不漂）、数字换
          数字、字母换字母——噪声长得像它要变成的东西，才读作"还没定住"而不是"换了一
          门语言"。
       ④ **前 --decode-lead 走完，末尾留白给读者**：解码贴着句尾才定住等于没演（旁白
          已经念完，观众还没看到完整的词）。走完之前每一格都还剩没定的字。落定节奏是
          `round(k/lead × 字数)`，末字其实在 `lead × (字数 − .5) / 字数` 就定了：四字词
          实测 k=.60 还是"默认规后"、k=.63 起整词"默认规则"（lead=.72 是最晚上限而不是
          末字定住那一拍），五字词在 .65。回拖可复现：.71 → .72 → .71 三次同一串。
       ⑤ 登记表按步重建（begin() 清空）：**这一步有没有在解码**与画面状态一样是
          (scene, step) 的纯函数，导出冷启动 seek 到那一帧照样是该解码的那一帧。 */
  var DEC_POOL = {
    cjk: '码序形值则符底较稳判对排前后数',
    digit: '0123456789',
    alpha: 'abcmoxzds',
    other: '·+×'
  };
  var DEC_LEAD = -1;
  function decodeLead(){                 // 读法同 ffThreshold()：设计期参数，一次就缓存
    if (DEC_LEAD < 0){
      var n = parseFloat(getComputedStyle(document.documentElement)
        .getPropertyValue('--decode-lead'));
      DEC_LEAD = (n > 0 && n <= 1) ? n : .72;
    }
    return DEC_LEAD;
  }
  /** 第 i 格在进度 k 上的噪声字面：由 (目标字符, i, k) 现算，**没有随机数**（边界①）。 */
  function decGlyph(ch, i, k){
    var pool = (ch >= '0' && ch <= '9') ? DEC_POOL.digit
             : (ch.toLowerCase() !== ch || /[a-z]/i.test(ch)) ? DEC_POOL.alpha
             : (ch.charCodeAt(0) > 0x2e7f) ? DEC_POOL.cjk
             : DEC_POOL.other;
    return pool.charAt((i * 7 + Math.floor(k * pool.length * 3)) % pool.length);
  }
  function decodeArm(n, text){
    n.removeAttribute('textLength');                       // 先撤钉，量的才是自然宽度
    var w = n.getComputedTextLength();   // 量**推进量**（advance），不是 getBBox 的墨盒
    n.setAttribute('textLength', w.toFixed(1));
    n.setAttribute('lengthAdjust', 'spacingAndGlyphs');
    DECODE[n.dataset.key] = {n:n, text:text};
  }
  /** 逐拍写：与 capProgWrite / capLitWrite 排在同一处（**换句分支之后**），因为要靠
     capSent——写在前面就会拿上一句的时长算这一句的进度（0.16.0 那条实测教训）。 */
  function decodeWrite(t){
    for (var key in DECODE){
      var d = DECODE[key], out = d.text;
      var full = window.__coursewareShotMode || mqReduce.matches ||
                 !capSent || !(capSent.duration > 0);
      if (!full){
        var len = d.text.length;
        var k = Math.max(0, Math.min(1,
              (t - capSent.start) / capSent.duration / decodeLead()));
        var res = Math.min(len, Math.round(k * len));
        if (res < len){
          var s = d.text.slice(0, res);
          for (var i = res; i < len; i++) s += decGlyph(d.text.charAt(i), i, k);
          out = s;
        }
      }
      if (d.n.textContent !== out) d.n.textContent = out;   // 同值不重写（每帧都跑）
    }
  }

  // ══ ④ 侧栏：参考要点（renderNotes）══════════════════════════════════════
  // 侧栏 = 常驻结构化文档（小结/扩展/注意 + 可选 code 短代码行 / kv 对照行 / at 跳转锚），
  // 不产证据（interactions.md §1）：不随旁白高亮、不读 data-kp；加载时渲染一次，
  // **播放中不同步**。at 是唯一例外：点击只是替用户 seek 一下，走带逻辑本身不读侧栏。
  // 要做"可观测判断"的手感实验一律走画布门禁，这里只留挂不上转折点的纯手感对照。
  var NOTES = [

  // ══ ⑥ 主循环 ═══════════════════════════════════════════════════════════
  var lastKey = '';
  var lastSceneIdx = -1;      // 章节头翻场的比对基准（-1 = 还没落过场景）
  // 浏览器 QA 在清空逐句 trace 前调用它：trace 与去重状态必须一起重置，
  // 否则单场景单句课件会把唯一一句误判为“没有再次驱动 renderer”。
  window.__coursewareResetRenderTrace = function(){
    window.__coursewareRenderTrace.length = 0;
    lastKey = '';
  };
  /* 快进掠擦（0.22.0）：时间被**搬动**过，就横掠一道箭头，确认"播放头跳了"。

     一帧的量级（16.7ms × 倍速，2× 也只有 33ms），能过阈值的只有跳转：点进度条、
     点章节刻度、键盘 ±8s、QA 的 __jump。方向跟着差值符号走，回拖就是反向掠——
     与场景换场（sceneSlide）同一个"方向感"口径，只是这一条说的是时间不是内容。
     阈值为什么读 :root 上的自定义属性：它和 --dur-ff / --ff-travel 是同一组舞台
     参数（掠多快、走多远、多大跳转才算"跳"），改一处就行，不必两头对齐。
     四道不演：① 冷启动第一帧没有"上一拍"可比；② 擦洗中——手指在条上跑时每帧
     都是大跳，箭头会连成一条抖；拖动**松手那一拍也不演**，因为 lastT 在擦洗期间
     照常更新，松手时的差值本来就小（点一下则是同步的一次大跳，照演：那正是一次
     真实的跳转）；③ 导出截图模式——成片每一帧本来就是 seek 出来的；④ 门禁开着
     时——preGateOpen 会把 currentTime 拽回场景起点，那一次往回搬是"回到问题跟前"，

  var lastT = null, ffThr = -1;

        // 药丸包装层（0.28.0）：答对后按钮被运行时禁用（span 没有 disabled），
        // 已放行的题面不许再迎接（口径同辉光 [data-locked] 那一条）
        if (b.matches('#gate-block .mag')){
          var btn = b.querySelector('button');
          if (!btn || btn.disabled) return;
        }
        var cur = b._mag || {x:0, y:0};
        var r = b.getBoundingClientRect(), w = r.width, h = r.height;
        var cx = r.left + w/2 - cur.x, cy = r.top + h/2 - cur.y;
        var px = Math.max(0, Math.abs(e.clientX - cx) - w/2);
        var py = Math.max(0, Math.abs(e.clientY - cy) - h/2);
        var d = Math.sqrt(px*px + py*py);
        if (d > R) return;
        var k = Math.sin(Math.PI * Math.min(1, d / R));
        if (k <= bestK) return;
        var vx = e.clientX - cx, vy = e.clientY - cy;
        var len = Math.sqrt(vx*vx + vy*vy) || 1;
        best = b; bestK = k;
        bestX = vx / len * P * k; bestY = vy / len * P * k;
      });
    Array.prototype.forEach.call(
      gateEl.querySelectorAll('.gate-next .go, .act-row .go, #gate-block .mag'), function(b){
        if (b === best) return;
        if (b.style.translate) b.style.translate = '';
        if (b.dataset.mag) delete b.dataset.mag;
        b._mag = null;
      });
    if (!best) return;
    best.dataset.mag = '1';
    best._mag = {x:bestX, y:bestY};
    best.style.translate = bestX.toFixed(2) + 'px ' + bestY.toFixed(2) + 'px';
  }
  gateEl.addEventListener('pointermove', magMove);
  gateEl.addEventListener('pointerleave', magClear);
  gateEl.addEventListener('pointerdown', magClear);
  gateEl.addEventListener('focusin', magClear);

  tick();
})();
</script>
</body>
</html>
