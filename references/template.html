<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JavaScript 的 sort() 到底怎么排序</title>
<style>
  :root{
    color-scheme:dark;
    /* 让 height / width 的 auto 关键字参与插值（0.15.0 折叠面板的前提）；
       不支持这条声明的浏览器整条作废，折叠退回"瞬间开合 + noteIn 淡入"。 */
    interpolate-size:allow-keywords;
    --bg:#0d0f14; --panel:#181c25; --line:#252b37;
    --fg:#e9ecf3; --dim:#8d95a8; --dim2:#6b748a;
    --key:#f5a623; --ok:#2ecc71; --bad:#ef4d4d;
    /* 动效设计令牌：缓动与时长集中在 :root 一处，作者改全局节奏不用翻词汇。
       曲线是 easeOutExpo 家族（.22,1,.36,1）——入/补间共用它，退场用 inOut。 */
    --ease-out:cubic-bezier(.22,1,.36,1);   --ease-in-out:cubic-bezier(.65,0,.35,1);
    /* 弹簧缓动：linear() 逐点近似"过冲回弹再落定"（前沿缓动技术，模仿弹簧/橡皮筋
       的物理手感）；浏览器不支持 linear() 时整条声明作废，自动回退到上一值。 */
    --ease-spring:linear(0,.05,.2 10%,.5 25%,.85 45%,1.08 60%,1.15 70%,1.05 82%,.98 92%,1);
    --dur-in:.42s;   --dur-move:.5s;   --dur-pop:.46s;   --dur-draw:.55s;
    --dur-fast:.13s; --dur-gate:.3s;   --dur-pulse:2.4s; --dur-breathe:2.8s;
    --dur-fill:.25s; --dur-cap:.22s;   --dur-fb:.32s;
    --dur-hover:.16s; --dur-veil:.32s; --dur-el:.38s;
    --dur-ch:.22s; --dur-blur:.42s;
    /* 生长与揭示（0.15.0）：--dur-grow 图元几何生长、--dur-reveal 擦除揭示、
       --dur-acc 侧栏折叠面板开合（0↔auto 高度） */
    --dur-grow:.42s; --dur-reveal:.5s; --dur-acc:.3s;
    /* 焦点弱化：降饱和+微压暗的强度与补间时长（--dimmer 走 .nt 的 transition） */
    --dim-focus:.62; --dur-dim:.45s;
    /* 主色的浅色档（0.17.0「材质」）：底色上的淡主色以前每处手写一档
       rgba(245,166,35,.08~.16)，散在六处。收成三档令牌由 --key 现调出来——
       作者换主色时浅色底跟着走，不用满仓找魔法数。实测三条口径：
         · **逐像素同值**：同一块底色上 color-mix(in oklab,…14%) 与手写
           rgba(245,166,35,.14) 取色完全一致（.12/.13/.14 三档都是 54,49,42 /
           56,49,43 / 59,51,42）——这不是换色，是把散落的数收进令牌；
         · **不能拿它做动画**：`color-mix()` 是静态计算函数，transition 接不住
           （实测：改 --num / 改色都只落终态），所以这里只做底色终态替换；
         · **兜底写在 @supports 里，不靠"同名两条声明"**：自定义属性在解析期
           什么都收，`--x:color-mix(…)` 在实现不支持时照样成立，坏的是**替换之后**
           那条 `background`——非法计算值让属性落 `unset`（背景透明），不是退回
           上一行写法。所以基础值给 rgba，认得 color-mix 的浏览器才覆盖（与
           0.16.0 滚动入场同一口径）。
       只收 .08~.16 这一档"浅色背景"；选区 .28 与刻度辉光 .55 各用一次的高透明
       值不为它们造令牌——一个消费者不叫令牌系统。
       SVG 侧那几处淡主色（TONE.amber.box / badge 底 / 点亮格底）**不并进这套令牌**：
       它们不是一个主色的三档，而是 amber / red / blue 三套语义色各自的底色
       （.12 / .13 / .14 各一处）。`fill` 上写 var() 替换是成立的（Chrome 152 实测
       `fill="var(--fc,#f5a623)"` 算得出 rgb(245,166,35)），但把它们并到 --key-soft
       会把"语义色的底"说成"主色的底"——那三处各只有一个消费者，收口收益为零。 */
    --key-soft:rgba(245,166,35,.14);     /* 选中/点亮那一下的底色 */
    --key-softer:rgba(245,166,35,.08);   /* 更轻的一档：hotspot 圈里 */
    --key-act:rgba(245,166,35,.16);      /* 控件被占用（非 1× / hover）的底色 */
    /* 换场与空间（0.14.0）：--dur-swp 方向感换场时长、--dur-hl 结论句划重点时长、
       --dur-tick 章节刻度点亮、--dur-rack 窄屏播放器行浮起、--par-far 远景视差系数
       （0=无限远完全不动，1=与近景同步；JS 从这里读，不在代码里写死第二个数）。 */
    --dur-swp:.34s; --dur-hl:.42s;
    --dur-tick:.2s; --dur-rack:.22s; --par-far:.45;
    /* 时间刻度层（0.16.0）：--dur-scrub 擦洗态几何过渡（条变厚 / 刻度变长）、
       --dur-tip 窥探气泡弹簧落定。句内进度细线**不给时长令牌**——它是时钟的
       逐拍读数（与 #fill 同类），补间只会让它永远落后于正在念的那个字。 */
    --dur-scrub:.18s; --dur-tip:.26s;
    /* 边缘与材质（0.17.0）：--dur-feather 羽化揭示的掠出时长。比硬边擦除
       （--dur-reveal .5s）略长一档：软边要在同样的距离上走出可见的坡度，
       快了读起来是"糊了一下"而不是"羽化出来"。--dur-shine 放行键掠光：一道高光
       走过按钮的时间，比入场类长、比揭示类短——它是"可以点了"的邀请，不是内容。 */
    --dur-feather:.62s; --dur-shine:.9s;
    /* 连线与标注（0.18.0）：--dur-flow 沿线流光的掠出时长——它演的是"这条关系刚被
       走通一遍"，比画线（--dur-draw .55s）长一档：光段要走完一整条路，才读得出
       "从这头到那头"。--flow-seg 光段占路长的比例（pathLength=1 的归一单位，见 .flow）。 */
    --dur-flow:.9s; --flow-seg:.16;
    /* 自动错峰的两只旋钮（0.18.0，公式见 .stag）：档间距默认 .06s，但**最晚一项不超过
       .18s**——与 .st1/.st2/.st3 的 60/120/180ms 三档同一族读数（--stag-cap 就是 .st3
       那一档），组越大间距自动摊薄，不会出现"十项排到 0.6s"。--halo-bg 是标注光环色：
       取**舞台局部的底色**而不是 --bg——标注几乎都落在画布里，而 .stage 是渐变
       （#1c212d → --panel → #161a23），--bg 是页面底，拿它当垫子会在画布上留一圈
       更深的描边、变成"字被圈起来"。取弧线标注所在那一档（y≈110~140）。 */
    --stagger:.06s; --stag-cap:.18s;
    --halo-bg:#1a2029;
    /* 退场与跟读（0.19.0）：--dur-tuck 收拢退场的行程时长。它比揭示（--dur-reveal .5s）
       短一档：**读过的东西让位**要比"刚刚长出来"更快，慢了会挡住下一句的注意力；
       也与运镜错开（运镜 0.24.0 起按行程定拍，地板 .5s——收拢 .42s 仍比最快的镜头短），
       收拢不与推拉抢时长。
       --lit-floor 是未念部分的遮罩灰阶地板（写成 stop-opacity，不是颜色），取 .85。
       这个数是按 §8「半透明按合成后的颜色算对比度」逐档合成的，不是看截图像素平均：
       非结论字色 #c9d1e0 合成后对 panel #1c212d / edge #161a23 = **7.97:1 / 8.53:1**，
       仍在次要文字的 7:1 线以上；结论字色 #f5a623 = **6.08:1 / 6.53:1**——够不到 7:1，
       但过正文的 4.5:1 线且留三成以上余量，而"未念"只是同一句里的临时状态、
       念到即回到 7.94:1 的满档（字幕带承载的是口播原文，按正文那一档判）。
       往下压到 .72，未念与已念的墨量差更大
       （255 制均值差 20.4 → 38.9），但 amber 那一档掉到 **4.76:1**——贴线零余量，否决；
       往上到 .92，差缩到 10.6，"念过 vs 未念"已经看不出来，等于没做。写满 1 同理。
       --lit-ramp 是渐变带宽度：18% 的软过渡既看得清"念到哪个字"，又不像硬边那样
       在字中间劈一道刀口（与 --feather 那条 34% 同源，但读数要更准，所以更窄）。 */
    --dur-tuck:.42s; --lit-floor:.85; --lit-ramp:18%;
    /* 当面与抵达（0.20.0）：三个新原语各按时长一档，档位是跟已有词汇**对齐或错开**
       选的，不是各拍一个数：
         · --dur-flip .6s：翻面演的是"当面对质"——判决换了个说法摊在你眼前，比揭示
           （--dur-reveal .5s）长一档才读得清换了什么，并与运镜同档（0.24.0 起运镜按
           行程定拍，.6s 正落在 .5~.78 这一带的中段），
           所以镜头推进与符号换面落在同一秒里。**可见性交接的半程是从这个数除出来的**
           （`calc(var(--dur-flip) / 2)`，见 CSS「翻面」③），改时长不用回头改第二处；
         · --dur-ride .8s：沿线抵达走的是**真实距离**，时长该按行程给，不当入场压短。
           它与 --dur-flow .9s 差一档（掠光是"关系刚被走通"，人是"抵达并留下"），
           比画线那条 --dur-draw .55s 长一档——线先画完、人后到，读起来才是
           "沿着刚画好的路走过去"（实测 .8s 线性半程采到 50.005%）；
         · --dur-bloom .5s：与 --dur-reveal 同档——同属"揭示"家族，只是形状从直边
           扫描换成圆形绽开，时长没必要另立一档。 */
    --dur-flip:.6s; --dur-ride:.8s; --dur-bloom:.5s;
    /* 定盘与成形（0.21.0）：三条各占一档，档位仍是跟已有词汇**对齐或错开**选的。
         · --dur-tilt .55s：倾侧演的是"判定落了"，与画线（--dur-draw .55s）同档——
           两者都是"一条结论落到画面上"；比翻面（--dur-flip .6s）短一档，因为倾侧
           只报方向、不换内容。落定用 --ease-spring：改变几何的补间允许轻微过冲
           （"空间弹簧"），改变颜色 / 透明度的不允许（"效果弹簧"）——这是前沿动效
           体系（Material 3 Expressive 的 MotionScheme）把弹簧分成两族的判断，与
           本仓库"退场用 inOut、入场用 out"的分族口径是同一件事的两面。实测这一趟
           （+6.5° → −6.5°，把补间 `pause()` 后逐档钉住读）：134ms 还剩 +0.17°、
           138ms 上下过零，385ms（70%）越到 −8.45°（超行程 1.95°，约为 13° 全程的
           15%），551ms 收在 −6.5°；屏幕上左托盘从 439.7 沉到 460.7，过冲那一格
           到 463.8——再多沉 3.1px，读作"盘沉下去了一下"，不是"抖"；
         · --tilt-deg 6.5deg：**只有三档的离散倾角**（− / 0 / +）。连续角度在这里
           是错的——契约只看符号，不看不平衡的程度。档位是量出来的：支点 (500,286)
           到托盘中心 88 单位，倾 6.5° 端点升降 88·sin6.5° ≈ 10 单位，实测两枚托盘
           屏幕 y 相差 21px（439.7 / 460.7）——"哪边沉"一眼读得出来，而托盘半径 6、
           垂直差 20 单位，两盘不会撞在一起；再大一档（10° → 15.3 单位）左托盘就压
           到 y=306 那根刻度轨上；
         · --dur-rip .5s / --rip-ink：涟漪是"收到你点了这一下"的即时确认，比掠光
           （--dur-shine .9s）短、比按压过渡（--dur-hover .16s）长。底色取主色一档
           而不是纯白——白雾会把按钮上的字压过去，主色只经过不停留；
         · --dur-gather .42s：与入场（--dur-in .42s）同档——字距归位**就是** tagline
           的入场方式，不另立一档。--track-open .3em 是"散开"那一头：桌面 13px 下
           即 3.9px，范本八句 tagline 实测在这一档 Range 行度全为 1（最长那句字宽
           293.5 → 382.2px，容器 886px），见 .gather 边界 ③。 */
    --dur-tilt:.55s; --tilt-deg:6.5deg;
    --dur-rip:.5s; --rip-ink:rgba(245,166,35,.26);
    --dur-gather:.42s; --track-open:.3em;
    /* 数字落定（0.37.0）：--dur-roll 是计数读数滚进的一拍。与位移（--dur-move .5s）
       **同档**——数字从旧值滚到新值，和"常驻图元让位"是同一类事：都在改变量，
       不换形状。JS 按 audio 时钟现算中间值（与 --lit 同为逐拍读数，countRollWrite
       只从这一处读时长），改全局节奏只动这一档。 */
    --dur-roll:.5s;
    /* 落点与过场（0.22.0）：三条原语，两条是新时长档、一条是复用旧档。
         · --dur-spot .5s：移动聚光的行程。与位移（--dur-move .5s）**同档**——洞从
           上一格飞到下一格，和"常驻图元让位"是同一类事：都在改变置，不改形状。
           洞不许落在镜头后面——0.23.0 之前运镜恒为 .6s，这条是"短一档、领先 .1s"；
           0.24.0 起镜头时长改成按行程定拍（见下面随动层那条），地板取的就是这一档
           .5s，于是**短程那几趟洞与镜头同时落位、大运镜那几趟洞仍然领先**（最多领先
           .271s）：口径从"总领先 .1s"收窄成"绝不落后"，32 次切换里 5 次领先 / 27 次
           同步，逐句读数见 stage.md §3.4；
         · --spot-k .15 / --spot-ink / --spot-soft 78px：洞外那层暗幕的浓度、墨色与
           软边宽度。**--spot-k 是反推出来的，不是挑出来的**：洞外留着的是要当参照
           读的正文，按 §8「半透明按合成后的颜色算对比度」逐档合成——主色 #f5a623
           对盒底 #1c212c 在 .15 档 = **6.11:1**（4.5 线以上、余量三成六），正文浅
           #c9d1e0 = 7.97:1（与 0.19.0 未念档同一读数，仍在次要文字的 7:1 线以上）；
           往下 .18 主色就掉到 5.77（余量不足三成）、.22 掉到 5.33、.30 只剩 4.52
           贴线——所以幕深封顶 .15。代价说清楚：洞外亮度只保住原来的 **81.9%**，
           这是一层"看得见的偏暗"，不是"压黑"；洞外弱标注 #5d6577 掉到 2.47:1，
           聚光期间它就是陪衬，**要一直读的东西别放到洞外**。
           --spot-soft 78px 是洞沿→满幅的线性过渡带宽（viewBox 单位）。为什么是这个
           量：范本 s2 那一对框是全课**最小的洞**（r=108.8），78 是它半径的 72%——
           再窄，圆沿会在 15% 的幕深下显出刀口（读数：洞沿一圈硬边）；再宽，坡度
           会把洞本身吃掉，落点反倒不清楚。坐标口径实测过：把幕深临时调到 1、软边
           调到 200 横切洞沿逐像素读遮盖率，50% 那一点落在"局部单位 × 相机倍率"的
           预测位置 ±3px 内（200 单位 → 实测带宽 ≈212 设备px，倍率 1.11）——证明
           这些长度走的是元素本地单位，不是设备像素，镜头推拉时洞跟着缩放。
           幕深本身也实测过：四角逐通道与"先合成再算比值"的解析值吻合（底
           #161a23 → 罩后预测 19.6/24.2/33.3，实测 20/24/34）；**量灯罩要用相对
           亮度跌幅，不是 WCAG 比值**——同一对颜色按比值只算出 1.04:1，看着像"没
           变"，按亮度是掉了 15.9%（正文色同样掉 29%），这才是眼睛读到的东西。 */
         /* --dur-ff .34s：快进掠擦与换场（--dur-swp .34s）**同档**——两者都是过场，
           一个改的是画面、一个改的是时间，不该读出两种速度。匀速（linear）：掠过
           没有落点，ease-out 会让它在终点前"刹住"，那正是"停在半途"的误读；
         · --ff-peak .5 / --ff-travel 520：掠擦峰值不透明度与行程半幅（viewBox 单位，
           单程 1040 单位 > 画布 1000，两端都进出画外，被取景框裁着——留在画内的
           掠擦读起来像"抖了一下"，出画的才是"过去了"）；
         · --ff-min 2s：多大一跳才算"跳"。判据不是拍的位数而是一句旁白的长度——
           范本时间轴实测 33 句，句长中位 **2.756s**（最短 .856、最长 6.809、均值
           3.103），句间接缝**恒为 0.40s**（25 处，一处不多一处不少）：2s 这条线取的
           是"跳过大约一句"，而正常逐拍前进与它差五倍，不会误触发。JS 从这里读，
           不在代码里写死第二个数（口径同 --par-far）；
         · --dur-dock .24s：浮层进出坞（离散进出）的时长，沿用原范本里 preGate
           借用 gateIn 时那 .25s 的量级、与门禁退场（.gate.leaving 的 .24s）对齐。
         · --spot-bleed 600px：暗幕向四个方向多出的边。**洞罩必须盖住整个取景框**，
           而暗幕住在相机里、按世界坐标铺——倍率钳位下限 .85 时可见区在世界坐标宽达
           1000/.85 ≈ 1176 单位，窗心挪到台口就左右各超 588（竖直方向 396/.85 ≈ 466，
           上下各超 233）。照 0,0→1000,460 铺会漏出一条不暗的边：实测 seg-5 那四步
           顶边漏 **18.6 设备px**、seg-2 s5 漏 **23.3px**（同一趟逐可见区扫出来的最坏
           值）。600 = 588 加余量。代价说清楚：mask 的定位盒是元素自己的 fill-box，
           原点跟着挪到 −600，所以洞心坐标要在 CSS 里**加回同一个 bleed**——两处共用
           一个令牌，改一处两处一起动（markup 里 rect 的 −600/2200/1660 是这个数的
           另一半，三处必须一起改）。 */
    --dur-spot:.5s; --spot-k:.15; --spot-ink:#06080c; --spot-soft:78px;
    --dur-ff:.34s; --ff-peak:.5; --ff-travel:520; --ff-min:2s;
    --dur-dock:.24s; --spot-bleed:600px;
    /* 重量与预备（0.23.0）：三条补的是 12 项动画原则在网页侧的落地表里、本仓库
       一直没有词的那三格——**挤压与拉伸**（质量）、**预备动作**（先反向蓄一下）、
       **次要动作**（投影跟着主动作走）。档位仍然跟已有词汇对齐或错开选：
         · --dur-settle .42s：与入场（--dur-in .42s）**同档**——徽标落位就是它的
           入场方式，不另立一档（.gather 同一判断）；
         · --dur-wind .28s：预备那一拍必须**短于**主动作（位移走 --dur-move .5s），
           否则"蓄力"会把落点推到主动作结束之后，读起来像两次移动而不是一次起跳；
           峰值按关键帧的 34% 落点算，实测 .0952s（见 .wind）；
         · --dur-lift .38s：与图层浮起（--dur-el .38s）同档——提牌改的是"这一块
           在不在台面上"，属浮起家族，不是揭示家族。
       --squash-* 是挤压那一档的两个分量（体积守恒的近读数见 .settle 注释），
       --wind-back 是蓄力的行程（viewBox 单位），--wind-hold 是主动为此让出的那一拍
       （实测必须让，不让就看不见，见 .wind 边界 ④），
       --lift-hi 是提牌高度，--lift-ink 是投影墨色。 */
    --dur-settle:.42s; --squash-x:1.14; --squash-y:.84;
    --dur-wind:.28s; --wind-back:9; --wind-hold:calc(var(--dur-wind) * .34);
    --dur-lift:.38s; --lift-hi:5px; --lift-ink:rgba(4,6,10,.62);
    /* 换位弧凸（0.25.0）：list-reorder 的"换了位置"读法——排序课两张卡换位时，
       直线穿行读作"从别人身体里钻过去"，叠加一条垂直弧凸才读作"越过 / 让位"。
       三枚令牌只定几何、不定时序（时序走 --dur-move，与位移同一拍，不新开档）：
       --swap-k 行程→峰值的斜率、--swap-rise 峰值封顶、--swap-min 不演弧凸的行程
       下限（位移短于它 = 平移，直行即可）。峰值为正 = 向上越。 */
    --swap-k:.35; --swap-rise:140; --swap-min:250;
    /* 先后与边界（0.26.0）：三条里第一条补的是 12 项动画原则里本仓库一直没落的
       **跟随与重叠**（overlapping action：一个物体的各部分不在同一瞬间停住），第二条
       把"跟着嘴"从字幕带引进画面里的字（kinetic typography 的解码读法），第三条管的是
       **边界的手感**——拖到头了要读得出"到头"，而不是"跟不上了"。
         · --trail-step .07s：拖尾的档距，**先后只有这一处尺度**（不是新时长档；
           .trail 的让位与 .wake 的余像都从这里派生）。实测见 stage.md §3.4（把三条
           补间一起 pause() 后按 currentTime 采样）：主角身体先走，
           晚一格的框在 t=70ms 还停在原位、t=140ms 才动，晚两格的字在 t=140ms 仍不动、
           t=210ms 才动；三档总行程 .5 + .14 = .64s（主角 500ms 落位，两张跟随的卡
           640ms 落位），仍短于沿线抵达（--dur-ride .8s）——再长就读成
           "三个各走各的"而不是"一串被带着走"；0.32.0 的余像用的同一档：
           70/140ms 在 .8s 行程上是 8.75%/17.5%，头尾间距 ~22px，两枚尾巴
           读成"一串"而不断成三个标记；
         · --decode-lead .72：逐字解码在一句旁白的**前 72%** 走完。这个 72% 是"最后一个
           字最晚在此定住"的上限而不是它定住的那一拍：0.33.0 起落定节奏是缓出
           `round((1-(1-k)²) × 字数)`（不再线性等距蹦字——前几字快定、末字从容沉底，
           读作"被认出来"而不是"打字机"），四字词按此式逐字落定，末字实测在 46.5%
           处就成了"默认规则"（.465 还是"默认规符"），五字词在 49.2%。
           余下的五成是留给读者的——解码不许贴着句尾才定住，那时旁白已经念完了；
         · --dur-band .42s / --band-cap 24px / --band-soft 48px：越界橡皮筋的回弹时长
           与那条**非线性**阻尼曲线的两只旋钮（越过 soft 那一格时正好走到封顶的一半，
           再越只逼近不越过，见 .band 边界②）。.42s 与入场 / 落位同档。 */
    --trail-step:.07s; --decode-lead:.72;
    --dur-band:.42s; --band-cap:24px; --band-soft:48px;
    /* 随动层（0.24.0）：前三轮补的是"演一次"的词汇（入场 / 揭示 / 落位），这一轮三条
       都不演一次——它们**跟着一个连续量走**：镜头跟着这一步真的走了多少、辉光跟着
       指针落在哪儿、色温跟着这一段在课程的哪一档。前沿动效体系把这件事叫
       "motion as a function of state"（弹簧之所以取代固定曲线，正是因为它接的是当前
       值与速度而不是"从头播一遍"）。 */
    /* ① 位移定拍：镜头时长不再是一个恒定的 .6s，而是由行程推出来的。两个**读数**由
       JS 写（`--cam-pan` = 平移行程，viewBox 单位；`--cam-zoom` = 相对倍率变化，无量纲），
       两个**权重**与两端封顶只在 CSS 一处——几何归代码、时间归令牌，两边都不留第二个数。
       档位是量出来的（推导与逐档读数见 stage.md §3.4）：
         · --dur-cam-min .5s：与落点灯（--dur-spot）**同档**——地板不能低于灯的这一档，
           否则小行程时镜头会抢在洞前面落位（0.22.0 那条口径，收窄后的说法见上面
           --dur-spot 那条）；擦洗与导出截图模式下 JS 写 0/0，落到的也正是这一档；
         · --dur-cam-max .78s：短于沿线抵达（--dur-ride .8s），那是画面里最长的一趟；
         · --dur-cam-pan .0014s / --dur-cam-zoom .35s：范本八场 33 句实测，32 次镜头切换
           里 15 次真的动了——平移行程 27 → 450 单位、倍率相对变化 0 → .69，折出来的
           时长落在 **.500 → .771s**。其中 **27 次落在 .5s 地板上**（旧写法是恒速 .6s，
           这些趟从此快了 .1s），只有 5 次大运镜被行程接住（.508 / .513 / .700 / .716 /
           .771）。"屏幕速度"（单位/秒）的离散度从 16.5× 收到 12.5×：**抹不平是有意的**，
           短程那几趟的下限由灯（.5s）钉住，再压就要比灯快了（逐句推导表见 stage.md §3.4）。
       **--cam-pan / --cam-zoom 故意不注册**：它们是常量替换、进 calc，不该被补间
       （与 --spot-k / --squash-x 同一条口径）。--dur-cam 这一档就此消失，两个消费者
       （#cam / #depth）一起改读派生值 --cam-dur。 */
    --dur-cam-min:.5s; --dur-cam-max:.78s;
    --dur-cam-pan:.0014s; --dur-cam-zoom:.35s;
    --cam-pan:0; --cam-zoom:0;
    --cam-dur:clamp(var(--dur-cam-min),
                    calc(var(--cam-pan) * var(--dur-cam-pan)
                       + var(--cam-zoom) * var(--dur-cam-zoom)),
                    var(--dur-cam-max));
    /* ② 对焦（0.35.0）：镜头推近的确认拍。取景窗只回答"框住哪儿"，失焦把"该看
       哪儿"从构图升级成景深——远景层 #depth 随取景窗倍率失焦，推回即复原。
       --defocus-in 是开始失焦的倍率（FULL=1×）：范本 18 个非 FULL 取景窗实测，
       11 个 ≤1.29× 是中等景别（seg-4/seg-5 那些 1.13–1.29×），不虚；7 个 ≥1.40×
       （1.40/1.48/1.69/1.75×2/1.80×2）才是真推近，虚。--defocus-max 是 1.8×
       （camCalc 的钳位上限）封顶的失焦半径。推导与口径见 stage.md §3.4「对焦」。 */
    --defocus-in:1.30; --defocus-max:2px;
    /* 换位弧痕（0.36.0）：换位之后的**静态轨迹**。0.32.0 的 `.wake` 只活在行程里，
       一句念完、暂停在句末就看不见"刚才怎么换的"；弧痕把同一段行程留成一条虚弧
       （before/after 的 arc diagram 读法），让"变了什么"在不动的帧里也读得出来。
       三枚令牌只定几何，不定时序（它不演，只现形）：
         · --trace-k .16：弧高 = 行程 × 这个斜率——短移低弧、长移高弧，三条弧自动
           分层，叠在同一行上不会糊成一条；
         · --trace-max 96：弧高上限（viewBox 单位）。范本最长一趟是 '1' 越过整行
           （400 单位 → 64），两格换位（200 → 32）刚好是它的一半；
         · --trace-min 40：低于这条行程不画（那是平移，不是换位——与 --swap-min 的
           250 同一判断，但这里量的是**看得出来的弧**，阈值取小得多）。
       --trace-ink 取 .5 的灰：它是"来过"的痕迹，不是这一步要读的内容；比注记
       （--scope-ink .78 / --brace-ink .55）再轻一档，虚线让它一眼是"参照"。 */
    --trace-k:.16; --trace-max:96; --trace-min:40;
    --trace-ink:rgba(141,149,168,.5);
    /* ③ 触点辉光：--dur-hot 借按压那一档（--dur-hover .16s）的读数，不新立一档——
       光跟着手的速度和"按下去了"是同一件事。--hot-r 是光的半径（本地盒单位，跟着
       按钮自己的尺寸走，见 .hot），--hot-ink 是光的墨色：主色一档压到 .22，比涟漪
       （--rip-ink .26）还轻，因为这一层**不停留**（指针在的时候一直在）。 */
    --dur-hot:.16s; --hot-r:64px; --hot-ink:rgba(245,166,35,.22);
    /* ③ 色温定调：三档 mood 的**相对亮度差只有 2.9%**，所以这层能压在内容底下——
       但"只换色相不换亮度"这句话要按 §8 的合成口径才成立：柔光（--tint-wash .28）
       合成到舞台三档底色上，六支墨色 × 三支底色 = 54 格，三档之间对比度最大偏移
       1.90%（推导与逐格读数见 .mood 那组边界 ①②）。
       --dur-mood 1.2s 是全仓库最长的一档：气氛不该比一次运镜（≤.78s）更抢眼。
       --tint-wash .28 是柔光层的合成比例，这个数直接决定亮度移动的幅度，改动必须
       按 §8 重算对比度。 */
    --dur-mood:1.2s; --tint-wash:.28;
    --tint-calm:#0e1f4b; --tint-turn:#341b0b; --tint-key:#08261f;
    /* 批注三件（0.27.0）：荧光笔、反证划线、磁吸迎手。
       ① 荧光笔标记：--mark-ink 借主色的柔光档（--key-soft，琥珀 .14）——它不是
       新颜色，是"这段话现在要看了"的同一支墨。这个数压着 §8 的合成口径：琥珀字
       #f5a623 衬在 .14 琥珀带上仍是 6.09:1（舞台底 #1c212d）/6.64:1（#161a23），
       但红字 #ef4d4d 只剩 3.43:1 / 3.74:1——所以划线只能落在琥珀关键句上，
       红字只许配"压暗"不许配亮带（见 .mark 边界③）。--mark-tilt -.6° 是手写
       荧光笔的斜度：肉眼刚能看出来，又不至于让带宽露怯。
       ② 反证划线：--strike-ink 用错误红，跟 d-src-t 判错时的字色同一支；
       --dur-strike .34s 借换位那一档（--dur-swp .34s）的节拍——"划掉"和"换位"
       都是把一件事挪出原位，不该比一次淡入（.42s）还慢。--strike-tilt 1.4° 是
       斜线的斜率，左端高、右端低，像从左上往右下划的一笔。 */
    --mark-ink:var(--key-soft); --mark-tilt:-.6deg; --dur-mark:.42s;
    --strike-ink:#ef4d4d; --strike-tilt:1.4deg; --dur-strike:.34s;
    /* ③ 磁吸迎手：--mag-r 是磁场半径（本地盒单位，和 --hot-r 同一口径），
       --mag-pull 是峰值位移——6px 刚够看见"它朝你挪了一点"，再多就变成按钮
       在躲指针。--dur-mag .34s 与 --dur-swp 同档：迎手是位置事件，不是氛围事件。
       位移走 sin(πd/r) 衰减：中心 0、半程 6px、边缘回 0，所以指针划过不会
       把按钮"拽走"再硬弹回来。 */
    --mag-r:34px; --mag-pull:6px; --dur-mag:.34s;
    /* 对位镜（0.30.0）：--dur-scope 是尺子换位的行程。它比镜头（--dur-move .5s /
       --cam-dur .5–.78s）短一档：注解先到位、运镜随后到，眼睛先知道"该看哪一对"。
       --scope-ink 沿用主色的 .78 浓度——一根 1.5px 的细尺压在深底上刚读得清，
       再浓就成了"又一个高亮"。 */
    --dur-scope:.3s; --scope-ink:rgba(245,166,35,.78);
    /* 集合括注（0.34.0）：--brace-ink 是括线的墨色，绿主色的 .55 浓度——与 s1 那
       两条同分连线（#2ecc71 / .55）同档：括线说的是"关系"，不是"高亮"；标签才用
       满浓度 var(--ok)。这里只有墨色、没有行程令牌：括线不补间位置，只画一次，
       合拢的行程复用 .draw 的 --dur-draw。 */
    --brace-ink:rgba(46,204,113,.55);
    /* 引线标注（0.38.0）：--callout-bg 是注记药丸的垫底色。为什么不用 --halo-bg：
       光环那股是**文字描边**的垫子，只跟着字走；注记药丸要盖住它下面的任何图元
       （卡片、连线、点阵），得是一块**实底**，否则字底下的纹理会透过半透明层把
       对比度拉花。取 --bg 与 --panel 之间的一档 #141820：比舞台亮处深、比暗处浅，
       压在任何一层上都能读出边界；边缘另有一道 .28 的灰描边（见 CSS .callout）。
       这里**不给引线墨色令牌**：注记的颜色是作者对这一步的语义声明（蓝=过程、
       琥珀=判词、灰=参照），一支墨色收不住三种。 */
    --callout-bg:#141820;
    /* 关系连线（0.43.0）：--dur-conn 是线"从 a 的边缘长到 b 的边缘"的一拍，与
       --dur-roll .5s 同档——关系成立是叙事事实，不该比一次计数滚动慢；收回同拍。
       --conn-ink 取中性墨灰（反证划线 --strike-ink 压色同款）：线表达的是"关系"
       不是"强调"，琥珀留给标注、红色留给反证。--conn-w 线宽默认 1.5（与引线同款）。 */
    --dur-conn:.5s; --conn-ink:#8d95a8; --conn-w:1.5;
    /* 细节镜（0.44.0）：镜头推近（0.35.0 对焦）说的是"我走近了，远景跟着虚"；
       细节镜说的是"我把这一小块拿到眼前"——取景窗不动、旁边的东西不跟着变。

       （--dur-in .42s）略长、比量条（--dur-roll .5s）略短——它是一次"凑近看"的
       确认，不是一个新东西上台。--loupe-ink 与 --conn-ink 同取中性墨灰：镜表达
       的是"细看"，不是"强调"（琥珀留给标注）、也不是"对错"（语义色留给判定）。
       --loupe-r 52 是 FULL（1000×460）里的 1/9 宽——够放一行 28 号字的三个字符；
       --loupe-k 1.8 让 14px 的细节读成 25px（"第三位字符"才认得出）。 */
    --dur-loupe:.45s; --loupe-ink:#8d95a8; --loupe-r:52; --loupe-k:1.8;
    /* 形变（0.45.0）：--dur-morph 是"同一件东西换了轮廓"的一拍。它比"凑近看"
       （--dur-loupe .45s）略长、比镜头行程（--dur-move .5s）略长一档：轮廓是内容
       本身在变，读者要认出"还是它"——太快像换了一张图，太慢像两个动作。
       --morph-pts 48 是两端各采的点数：折角在中间帧会被摊成 48 段折线，终态永远落回
       作者写的那条 d，所以定格不糊；再翻倍肉眼读不出差别，每帧多几十次
       getPointAtLength 却是实打实的。--morph-min 1.6 是行程地板（用户坐标 px）：
       逐点最大位移不到 1.6px 就不演——那点差别演出来只是抖（与"数值未变不滚"同族）。 */
    --dur-morph:.55s; --morph-pts:48; --morph-min:1.6;
    /* 路径进度（0.46.0）：课堂里唯一一件"本来就该停在半路"的事——一条推导线 /
       流程线走到第几段。上面所有原语都是"抵达 / 出现 / 消失 / 形变"，它们都终将
       落定；进度是**状态**，停在 60% 就是它这一拍的全部内容，不该被当成没演完。
       --dur-path .5s 与 --dur-move / --dur-conn 同档：走一段是位移，不是入场。
       时间走向**分两种**：第一次长出来（0→p）用 easeOutExpo（"画出来"是动作），
       之后每次推进用 linear（"走到 60%"要能被读成比例——ease 会让前 30% 就吃掉
       一半行程，观众对"还剩多少"的判断就错了，与进度条同一课）。
       --path-ghost 是"还没走到"那一段的墨色（同 --conn-ink 的中性灰，压到 .42：
       它是上下文、不是内容）；--path-dash 7 6 是虚线段长/间隔（viewBox 单位，
       不随路径长短变——归一化的百分比虚线上长下短，读起来像两种语法）。 */
    --dur-path:.5s; --path-ghost:rgba(141,149,168,.42);
    --path-dash:7 6;
    /* 圈数（0.47.0）：课堂里另一件没有任何原语覆盖的事——**同一件事反复做**。
       上面全部词表说的都是"一次"：上台、挪位、擦除、形变、走到第几段。而迭代、
       逼近、逐位比较、周期运动说的是"绕了几回、每回落在哪儿"，它是一个**计数 +
       一串落点**，不是一个时长。
       时间**归句子**（与词拍 cueAt 同一课）：一圈多长不由作者填，而是本句时长 ÷
       本步要绕的圈数，夹在 --loop-per-min / --loop-per-max 之间——句子念到哪儿，
       圈就绕到哪儿；句子太短装不下这么多圈时，剩下的**溢到下一步继续**（与 seg
       的"进度跨句保持"同族），而不是把每圈压成看不清的抽搐。
       每圈内部再分两段：走 --loop-run 占比（行程封顶 --dur-loop），其余**停**——
       那一段静止就是确认拍，观众据此数圈。算法动画那一支（Soda / ALGO 起的
       iteration highlighting + 轮次计数）早就把"循环体要有可数的落点"当结论；
       这里把它落成结构，而不是让作者多写一个 class。
       --dur-loop .5s 与 --dur-move / --dur-path 同档：一圈之内是一次位移。
       --loop-mark 是落点痕的墨色（中性灰，与 --path-ghost 同档：痕是"已经绕过的
       回"，是上下文不是话头）；--loop-ink 是游标（开口环 + 3/8 读数）的强调色，
       与徽标 / 引线的 #f5a623 同一支笔。--loop-r 7 是环半径（世界单位），
       --loop-dot 2.2 是落点痕半径。 */
    --dur-loop:.5s; --loop-run:.62; --loop-per-min:.5; --loop-per-max:1.6;
    --loop-mark:rgba(141,149,168,.45); --loop-ink:#f5a623;
    --loop-r:7; --loop-dot:2.2;
    /* 时序带（0.48.0）：词表里有"走到第几段"（drawTo）与"绕到第几回"（loopTo），
       却没有一件事的**并行关系**：这两样是不是同时做的、那一样是不是排在后面。
       并发、流水线、读写重叠、递归的"一路下去再一路回来"，全靠旁白说"同时"两个字，
       画面里没有任何东西在演它。
       这一条把"同时 / 先后"落成**相位**：每条泳道声明自己的启动相位 `phase`
       （0 = 与句子同时起步），带宽与针的位置一律从 audio 时钟现算——作者**不填时间**，
       相位是内容（谁和谁一起），时间是句子（与 loopTo 的"时间归句子"同一条口径）。
       于是所有相位相同 → 几条实心段同速长 = 同时；相位递增 → 阶梯式起步 = 先后。
       一根"现在"针钉在句子进度上，是整条带唯一的时钟证据：观众看针就知道针到哪儿
       了、哪条道还在走、哪条已经到底。
       --lane-h 6 是单条道高（世界单位），--lane-gap 5 是道间距，--lane-pad 11 是
       带沿到对象的净空；--lane-min 40 是带宽下限（对象挤在一列时带子不该细成一条缝），
       --lane-fs 10 是左侧短标签字号。轨道底色走中性灰（--lane-track，与 --path-ghost
       同档：它是上下文不是话头），实心段与针共用强调橙 --lane-ink（与徽标 / 引线
       / 游标同一支笔）。 */
    --lane-h:6; --lane-gap:5; --lane-pad:11; --lane-min:40; --lane-fs:10;
    --lane-track:rgba(141,149,168,.22); --lane-ink:#f5a623;
    /* 区间窗（0.49.0）：词表能说"这条路走到第几段"（drawTo）、"这件东西绕到第几回"
       （loopTo）、"这几件各自做到哪儿"（lanes）——全在时间轴上；没有一条说**取的是
       哪几件**。而 `slice` / `substring` / 二分查找的候选区间 / 滑动窗口 / 分页，讲的
       都是"从第几件到第几件这一段"：宽度本身就是读数，而且它**会走**——同一个宽度
       扫过整排，才叫窗口在滑。
       这一条把"取哪一段"落成一条会移动的取景带：作者只给序列与两个序号，左右切口、
       上下沿、序号读数全从各件的盒现推。
         · 两条竖切口落在**所取那几件的外沿之外 pad**——切口落在件与件之间的缝里，
           所以它读作"从这里切开"，不是"这几件算一组"（后者是 .brace 的活）；
         · 带子在换句那一刻定住起点，之后每一拍往**当拍量到的**目标追（easeOutExpo）。
           对象还在入场 / 还在挪位时，带子跟着它落位，而不是钉在入场前一瞬的位置上；
         · 读数签写 `from–to / n`（0 基，与 slice 同一个口径），整签压回取景窗内；
           `lab` 可以整句换成作者的话，`num:false` 只留带子与切口。
       --dur-range .42s 与 --dur-in 同档：这是**一条注记改位置**的时长，不是过程读数。
       --range-pad 5 是切口到物件外沿的净空（它必须小于相邻两件之间的缝，否则切口
       会压到邻居身上）；--range-cap 7 是切口线向带外伸出的长度（让"切开"这件事
       在上下都看得见）；--range-fs 10 是读数字号。
       --range-wash 是带内底色（强调橙的极浅档，与 .mark / #cap-hl 同一支笔的高亮，
       不是"选中"的蓝）；--range-edge 是两条切口；--range-ink 是读数签。 */
    --dur-range:.42s; --range-pad:5; --range-cap:7; --range-fs:10;
    --range-wash:rgba(245,166,35,.13); --range-edge:rgba(245,166,35,.78);
    --range-ink:#f5a623;
    /* 界线（0.50.0）：整张词表能说"多大 / 到哪儿 / 谁跟谁 / 哪几件 / 几时"，唯一
       说不出的是**够不够**——量与一条界的关系。meter 画"多长"，这一族画"界在哪、
       到没到、过了多少"，于是"预算 / 上限 / 容量 / 安全水位 / 超时 / 误差容限 /
       临界点"这些判断第一次能落在画面上，而不是只在旁白里。
       读法：一条细界线 + 两个端头（T 形，跨在容器的两端）、界外那一侧的淡染区带
       （"这一侧都不行"，它是**常驻**的图注，不是越界才出现）、界线读数（界值；
       越界时多一行"超 N"）。越界那一刻颜色整体切档，是这条原语唯一的"确认拍"。
       九枚读数：
         · --dur-lim .24s：只有颜色在补间（界线、区带、读数一起换档）。它比按压
           （--dur-hover .16s）慢一点、比入场（--dur-in .42s）快——这是"读作一个
           状态变了"，不是"又一个东西上台"；几何一次也不补间（每拍现量现写）。
         · --lim-cap 7：界线向容器外伸出的长度（端头落在这儿），让"界"在容器上下
           都看得见；--lim-fs 10：读数与差值签的字号。
         · --lim-ink #8d95a8 是界线与读数的中性档（它是尺子，不是话头）；--lim-zone
           是界外那侧的淡染；--lim-alert #ef5b4b 与 --lim-hot 是越界档（红是唯一
           一个"这不对"的色，别拿强调橙顶替——橙在这套画面里是"话题"）。
       注意它**不画量**：量由作者自己的图形（通常是 meter 的条）提供，这一族每拍
       现量那颗量的边，所以越线那一帧是真实发生的。 */
    --dur-lim:.24s; --lim-cap:7; --lim-fs:10;
    --lim-ink:#8d95a8; --lim-alert:#ef5b4b;
    --lim-zone:rgba(141,149,168,.12); --lim-hot:rgba(239,91,75,.14);
    /* 岔路（0.51.0）：词表此前说得出"谁跟谁有关系"（connect 一条双边线）、"这几件算
       一组"（.brace）、"取的是哪几件"（range 一段序号）、"两个版本差在哪"（compare
       同窗对照）。说不出的是**从一个岔口出发有几条去路、走了哪条、没走的那条通向
       哪儿**——"返回负数走这支、返回正数走那支""本来可以这么化简，被排除了""四种
       物态里此刻在这一态、按这条规则才会跳走"。此前这些只能靠旁白念：画面上既没有
       一张数得出条数的候选清单，也没有"没走的那条仍然在场"这个读法。
       读法：一枚岔口点（钉在出发对象的边界上，几条支在这里汇成"从这里分出去"）+
       几条扇出去的支（末端各一枚箭头，指向它的去向）+ 选中那一支换档成实线与强调橙、
       其余**保持淡虚线在场** + 岔口外侧一条 `n 条 · →第 k 条` 读数。
       八枚读数：
         · --dur-fork .24s：只有颜色与不透明度在补间（选中档切换），与 --dur-lim 同
           档——读作"选定了哪一条"，不是又画了一条线；几何一次也不补间（每拍现量）。
         · --fork-node 2.6：岔口圆点半径。扇面的汇聚点要有实物，否则几条线只是碰巧
           指向同一处，读不出"从这儿分出去"；--fork-head 7：箭头长，终点按 §5 的口径
           从去向盒外沿再退这一个数（不退就插进盒里，或与盒线叠成一坨）。
         · --fork-gap 2：两端各留的呼吸缝（§5 连线纪律的"2 单位"，写成令牌不留魔法
           数）；--fork-fs 10：支上短签与读数的字号；--fork-pad 6：短签离线出去的法向
           净空——压在支上就读不出它说的是哪一支。
         · --fork-ink #f5a623 是**选中**那一支的档（这一拍的话头），--fork-idle 是未选
           支的中性淡档。未选支**不压暗、也不收走**：它画的是"本来可以去哪儿"，那是
           内容不是干扰；"不用看了"是 [data-dim] 的活，不归这一族。 */
    --dur-fork:.24s; --fork-node:2.6; --fork-head:7; --fork-gap:2;
    --fork-fs:10; --fork-pad:6;
    --fork-ink:#f5a623; --fork-idle:rgba(141,149,168,.55);
    /* 词拍（0.39.0）：旁白念到哪个词，画面上那件东西就套上四角括号。0.19.0 的
       `--lit` 把"跟着嘴"落在**字幕的字**上，0.26.0 的逐字解码把它落在**画面里的
       词**上——这一版落在词**所指的那件东西**上：听见"十和九"，不用自己在六张卡
       里找。前沿对应是卡拉 OK / lyrics 的逐词高亮，与 AI 视频工具的 word-level
       cue（逐词时间戳 → 视觉强调）；本仓库没有词级时间戳，词窗从句子自己的
       text / start / duration 按**字数 + 标点权重**现算，误差 ±1~2 字（见下方
       --cue-pause）。它只决定"什么时候出现"，不承载任何读数。
       六枚读数：
         · --dur-cue .28s：锁定那一拍。比按压（--dur-hover .16s）长、比入场
           （--dur-in .42s）短——它是"应一声"的确认，不是又一个东西长出来；
         · --cue-lead .08s：视觉略领先于声。卡拉 OK 的通行做法（画面早 80~100ms
           人耳才读作"同时"）；夹在句首，不会把第一条括号推到上一句去；
         · --cue-pad 7 / --cue-arm 14：括号离目标 bbox 的外扩与臂长（viewBox 单位）。
           范本时间轴 33 句实测平均字速 **0.153s/字**（102.4s / 668 字），中文口播
           一个逗号顿约 0.2s ≈ 1.3 字；--cue-pause 取 1.2 稍保守（宁早勿晚，再让
           --cue-lead 往前带一点）。臂长再按短边的 30% 收敛、下限 5——40 单位的
           字符格也留得下四个角；
         · --cue-settle .56s：**几何跟踪**的窗口，从本句句首算起。目标可能是这一步
           刚建档的卡，框宽从占位 96 补向真宽 76（--dur-grow .42s），也可能正从
           上一姿势移过来（--dur-move .5s）；词恰好在入场途中被念到时，括号必须
           跟着目标一起长到落定，不能按半截几何定死。取两个入场补间里长的那个
           .5s 再留 60ms 收尾——窗口过后目标在本步内不再动，括号也就不再重量；
         · --cue-ink 中性白 .66：**不用主色、不用语义色**。cue 说的是"正在被念到"，
           既不是"重要"（主色 / #spot），也不是"对错"（红绿）。四角括号借的是
           相机取景框的语法，中性白才读得出"这是旁白在点名"；
         · 括号本身不写 transition：状态（opacity / scale）走 §③ `.cue` 那一条，
           切掉补间后落在"这一句念到哪儿"的括号上（与 #spot / #cap-hl 同族）。 */
    --dur-cue:.28s; --cue-lead:.08s; --cue-pad:7; --cue-arm:14;
    --cue-settle:.56s; --cue-ink:rgba(233,236,243,.66); --cue-pause:1.2;
    /* 对照窗（0.40.0）：两版同框，接缝是读数。它不是又一次"揭示入场"——
       0.15.0 的 `.reveal` 让**一个**版本从无到有；这里两个版本从第一帧就都在场，
       接缝只回答"这一刻，哪一版占到哪儿"。前沿对应是 before/after wipe、
       图片编辑器的 diff slider 与剪辑里的 edit point：观众看的不是转场，而是
       **同一条规则换掉之后，同一个位置变成了什么**。
       为什么必须两个版本同时在场：只揭示 B 时，A 会从 B 的透明缝里透出来
       （文字压文字、连线压连线）；所以 A 也裁，两半严格互补——见 `[data-cmp]`
       那组与 `drawCompares()`。为什么不用 `.reveal`：`.reveal` 是入场，
       切掉动画后落"全显"；对照窗的裁切是**状态读数**，切掉补间必须落"这一拍
       该露多少"，两者不是同一族。
       六枚读数：
         · --dur-cmp-min .45s / --dur-cmp-full 1s：接缝走完全程的时长由**这一趟
           走了多少**现求（delta × full，地板 .45s、封顶 1s，见 drawCompares 的
           cmpDur）。短推一下不该也走满一秒，长扫也不该快得像闪；
         · --cmp-ink：四角取景框的墨色，.28 的中性白——它只定义"这是同一扇窗"，
           不参与强调；
         · --cmp-before / --cmp-after：两侧标签的墨色。改前退到参照灰、改后用主色
           琥珀：不是判对错，是"这一边是新的读数"；
         · --cmp-seam / --cmp-wash：接缝与它的扫描光。琥珀 .9 的细线 + 40 单位宽的
           低透明渐变带，像一条正在读过去的头；不用红色——红在这个仓库里已经承担
           "错误"（--strike-ink / 门禁判错），对照本身不是判决；
         · --cmp-r：**已注册的百分比**（见下方 @property），A 的左裁与 B 的右裁
           都从它派生。注册之后由它自己补间，`clip-path` 每帧重算；这样 A/B 两个
           兄弟节点能共享同一个读数，也不必依赖 `clip-path` 的插值实现。
       一个作者最容易踩的边界：两版必须**同构同框**——同样的坐标、同样的元素，
       只换"值 / 顺序 / 规则结果"。接缝不是拼贴的分界线，它是一条时间读数；
       两版各画各的版式，扫过去只会读成两张图叠在一起。 */
    --dur-cmp-min:.45s; --dur-cmp-full:1s;
    --cmp-ink:rgba(233,236,243,.28);
    --cmp-before:#8d95a8; --cmp-after:#f5a623;
    --cmp-seam:rgba(245,166,35,.9); --cmp-wash:rgba(245,166,35,.10);
    /* 拆解视图（0.41.0）：一组纯包装节点沿一条轴分开，露出"它由哪几件组成"。
       前沿对应是装配图 / 爆炸图（exploded view）、维修手册的分解插画与三维拆解
       动画：观众不是看一个东西**出现**，而是看一个已经成立的整体**被打开**。
       与 0.15.0 的揭示的边界：揭示改变"可见量"（从无到有）；拆解不改变可见量，
       每一件从第一帧就在场，改变的是**件与件之间的距离**。所以它不该拿来当入场，
       只该拿来回答"这个整体里有什么、谁接着谁"。
       三枚令牌：
         · --dur-ex .55s：与描线（--dur-draw .55s）同档，比位移（--dur-move .5s）
           略慢——拆开是"看清楚"，不是"赶去下一处"；合拢仍走这一档，方向由
           amount 的增减决定，不另开一套时长；
         · --ex-stagger .05s：相邻件之间的错峰。拆开时**外圈先走、内圈后走**，
           合拢时反过来（内圈先回、外圈最后落定）——同一个空间规则读两遍，
           像拆装图先卸外盖、装回时先归中轴；
         · --ex-cap .18s：错峰总预算的封顶。件数一多，按件数线性加延迟会让最后
           一件迟到半秒，拆解成了散架；封顶之后 5 件以上也是"一组动作"。
       拆解只写 transform（见 .explode 的边界），不改透明度、不改几何属性；
       所以它不抢 put() 的其它补间，也不会污染 getBBox() 的局部坐标。
       名字先全仓 grep 过，不与 --dur-* / --ex-* 其它令牌撞。 */
    --dur-ex:.55s; --ex-stagger:.05s; --ex-cap:.18s;
  }
  /* 焦点弱化的驱动变量（0.13.0）：注册成 <number> 才能被 transition 逐帧补间——
     未注册的自定义属性只做令牌替换，改值时 filter 会整档跳变。没实现
     @property 的老浏览器里 filter 照常生效（calc 替换后就是合法值），只是没补间。
       **名字必须避开调色板已有的 --dim**：注册是有全局副作用的——一旦
     `syntax:'<number>'`，那十几处 `color:var(--dim)` 的灰色文字就会在计算值阶段
     判为非法（数字填不进 color），整条声明作废、回落到继承色（实测 .step 的
     #8d95a8 变成 #e9ecf3）。所以这里用 --dimmer，并在改任何注册属性名之前先
     全仓 grep 一遍同名令牌。 */
  @property --dimmer{syntax:'<number>';inherits:true;initial-value:0}
  /* 羽化揭示的驱动变量（0.17.0）：注册成 <percentage> 才能被 transition / animation
     逐帧补间，而它**只被 mask-image 的渐变停靠点消费**（见 .feather 那一组）。
     终值 134% 是"整条遮罩带移出元素右侧"的落点：不透明段占到
     `calc(134% − 34%) = 100%`，也就是全显。initial-value 取这个终值，所以
     不支持 @property 的浏览器里 `calc(var(--feather) - 34%)` 替换后仍是合法的
     100%，遮罩直接全开——**内容一格不少**（纪律③：绝不把内容锁进可能不跑的门）。
     名字与 --dimmer 同一课：动手前全仓 grep 一遍，别撞上已有令牌。 */
  @property --feather{syntax:'<percentage>';inherits:false;initial-value:134%}
  /* 错峰排程的驱动变量（0.18.0）：注册成 <time> 且 **inherits:false**，为的是把
     "组内位置"这件事**锁在分组的那一层**：`.stag>*` 只给直接子节点写 --delay，
     孙子节点拿不到（落 initial 0s）。不注册时它只是个继承的 token，会在**每一个
     后代**上重新求值 sibling-index()，于是嵌套建档（`put` 的常态：g 里还有 rect
     与 text）会把同一组里的深层小图元也各自错开——那不是错峰入场，是满屏乱闪。
     实测（注册 + `.stag>*`，三项组的直接子得 0s / .06s，其内部后代全部 0s）。
     名字沿用 .in 已有的 --delay（0.10.0），语法收窄成 <time>：现有写法
     `.st1{--delay:.06s}` 与 `style="--delay:.55s"` 都仍合法，
     非法值（不支持 sibling-index 的浏览器留下的 token）落回 0s = 整组同进。 */
  @property --delay{syntax:'<time>';inherits:false;initial-value:0s}
  /* 字幕逐拍点亮的驱动变量（0.19.0）：注册成 `<percentage>`，**只被 #cap-text 的
     mask 渐变停靠点消费**（见「跟读点亮」那一组）。语义与 --feather 同一条、方向相反：
     --feather 的初值取终值 134%（动画没跑 = 全显），--lit 的初值取 **118% = 100% + 软过渡带
     --lit-ramp（18%）**——停靠点落到元素之外，整行落在不透明段上，静止即全亮。
     这个数**不能写成 100%**：那样 `#000 0 calc(100% − 18%)` 会把每句**末尾那 18%**
     留在灰阶地板上，静止态就成了"句尾永远没念到"，纪律③直接不合格。
     初值取终值，兜住三种"读数没跑"的情形：不支持 @property（`calc(var(--lit) - 18%)`
     替换后仍是合法百分比、遮罩全开）、不支持 CSS mask（整条声明作废）、JS 还没写过
     一次（开场前字幕带本就收起）。名字先全仓 grep 过，不与 --dim / --feather /
     --delay 撞。 */
  @property --lit{syntax:'<percentage>';inherits:false;initial-value:118%}
  /* 对照窗的接缝读数（0.40.0）：注册成 `<percentage>` 且 **inherits:true**。
     两个消费者（A 的左裁 / B 的右裁）是**兄弟节点**，不是父子——值写在 A、B
     各自身上，继承开关在这里不承担"锁在分组层"的职责（与 --delay 的 inherits:
     false 正好相反）。选注册而不是直接 transition `clip-path`：`clip-path` 的
     `inset()` 百分比在不少引擎里按引用盒解析，补间实现也各有差异；注册变量由
     CSS 自己插值，`clip-path` 每帧只做一次 `calc(100% - var(--cmp-r))` 替换，
     A/B 两半天然同步。initial 0% = A 全显、B 全隐：没跑 JS 时对照窗至少是
     "改前那一版"，不是两版都露一半。名字先全仓 grep 过，不与 --cmp-* 其它
     令牌撞。 */
  @property --cmp-r{syntax:'<percentage>';inherits:true;initial-value:0%}
  /* 移动聚光的三个驱动变量（0.22.0）：洞心的 x / y 与洞半径，全注册成 `<length>`
     而不是 `<percentage>`——**单位就是 viewBox 单位**（实测 `circle 150px` 在屏幕上量到
     150 单位 × 相机倍率，走的是元素本地单位）。参考盒是被遮元素自己的 fill-box，
     而这层为了盖住可见区四边各多铺 --spot-bleed（见 :root 那条），盒子的左上角在 −600，
     所以 mask 里的洞心要 `calc(var(--spot-x) + var(--spot-bleed))` 加回同一个数：
     用 `<length>` 才使得上这件事——camBox() 量回来的本来就是 viewBox 单位，直接写数、
     只做一次常数相加；换百分比就得先除一次跟着 bleed 动的盒宽（0.21.0 `.gather` 那条
     "百分比参考 fill-box 不是 viewBox"的教训在这里反过来用）。
     initial 取**画布中偏上**（500px / 198px）而不是 0：万一某一步只写了 data-on
     没写坐标，洞落在画布中间比落在左上角少压住东西。--spot-k（幕深）**故意不注册**：
     它是常量替换、不参与补间，层的开合走 `opacity` 自己的 transition。 */
  @property --spot-x{syntax:'<length>';inherits:false;initial-value:500px}
  @property --spot-y{syntax:'<length>';inherits:false;initial-value:198px}
  @property --spot-r{syntax:'<length>';inherits:false;initial-value:150px}
  /* 提牌海拔的驱动变量（0.23.0）：注册成 `<length>` 才能被 transition 逐帧补间，
     而它**只被两处消费**——`filter:drop-shadow()` 的偏移/虚化，与独立 `translate`
     的抬升量（见 .lift）。initial-value 取 **0px = 还在台面上**：不播、不能播、
     被导出注入 `transition:none` 时都落在"没有投影、没有抬升"那一格，纪律③
     （绝不把内容锁进可能不跑的门）在这里的形态是"**静止即无投影**"，与
     0.17.0 --feather 取 134%（静止即全显）、0.19.0 --lit 取 118%（静止即全亮）
     同一条口径，只是"终值"在这一族里恰好是零档。
     `inherits:false`：海拔是**这一块自己的**状态，不该传给里面的 rect/字（传下去
     会让每个子图元各算一次 drop-shadow）。名字先全仓 grep 过，不与 --dim /
     --elevated 之类的既有令牌撞。 */
  @property --elev{syntax:'<length>';inherits:false;initial-value:0px}
  /* 触点辉光的两个驱动变量（0.24.0）：光心的 x / y 注册成 `<length-percentage>`。
     这一层装在**被点元素自己的盒子**里（border-box），JS 用 getBoundingClientRect()
     现量后换算成盒内 `px` 直接写数；与 0.22.0 --spot-x 那次"用 `<length>` 省掉一次
     除法"的理由不同，这里的兜底必须落回**盒中心**这个跟着尺寸走的格子（display:none
     时 JS 拿不到盒、不写坐标，注册初值就是最后一道读数），所以初值取 `50%`——
     `<length-percentage>` 这一族两种都收，px 写进去照常补间，50% 留着当静止态。
     注册的理由与 --spot-x 同一条：不注册就没有补间，指针快速划过时光会整档跳。
     **必须 inherits:true**——这一条是本轮实测纠正的：注册成 `inherits:false` 时
     写在宿主上的数**根本进不了伪元素**（伪元素在继承树里是宿主的子节点），实测
     `getComputedStyle(o,'::before').getPropertyValue('--hot-x')` 一直是初值 `50%`，
     计算出来的背景是 `radial-gradient(64px, …)`（连 `at` 都被省掉），光"跟着走"
     整条没跑——**数据写在 host、画在 child，中间那一段非得继承不可**。改成 true
     之后同一处读数才落到那一层上：`radial-gradient(64px at 21.1px 21.7px, …)`，
     补间逐帧值 21.1 → 44.35 → 67.6px。"只让这一块看见"靠的是选择器（全仓只有
     `.hot::before` 读这两个名字），不是靠继承开关；嵌套的 .hot 各自有行内值，
     子树读到的是自己那一层写的数，不会串。名字先全仓 grep 过，不与既有的
     --hot-r / --hot-ink 撞。 */
  @property --hot-x{syntax:'<length-percentage>';inherits:true;initial-value:50%}
  @property --hot-y{syntax:'<length-percentage>';inherits:true;initial-value:50%}
  /* 色温定调的驱动变量（0.24.0）：注册成 `<color>` 才能被 transition 逐帧补间——
     未注册时 --tint 只是令牌替换，换档那一瞬间两层氛围（画布柔光、页面光晕）会
     一起跳色，1.2s 的"气氛"就没了。这里**必须**注册成 `<color>` 而不是自己插值
     三个通道：前沿做法（Material 3 的 dynamic color、Vercel/Linear 的主题过渡）
     都是"颜色当一等公民的属性走"，浏览器给的补间才是逐通道线性的。
     `inherits:true` 是这一条能"一处写、多处读"的前提：JS 只在 documentElement 上
     换档，#depth 里的柔光矩形与 body::before 各自继承同一个值——实测注册的
     `<color>` 会把**补间中的值**继续传进 SVG `<defs>` 内部（`<pattern>` 里的
     circle 也吃到），所以不需要给每个消费者各写一条 transition。
     initial-value 取 **--tint-calm 那个数**（#0e1f4b，最平的一档）：不播、不能播、
     被导出注入 `transition:none`、JS 还没写过档，四种"读数没跑"的情形都落在
     "氛围最中性"那一格，纪律③在这里的形态是"**静止即 calm**"。
     两处不能合并成一处是有理由的：`initial-value` 里不许写 `var()`（注册期就要
     一个自足的静态值），所以调色板令牌与这条初值是两个持有者——测试按字符串把
     它们钉在一起，改一处不改另一处就红。 */
  @property --tint{syntax:'<color>';inherits:true;initial-value:#0e1f4b}
  /* color-mix 的覆盖档：认得它的浏览器用现调的浅色，换主色时底色跟着走。
     写成 @supports 而不是"同名两行"——自定义属性解析期什么都收，第二行照样
     成立，坏的是替换后的那条 background（非法计算值 → 属性 unset → 背景透明）。 */
  @supports (color:color-mix(in oklab,red 50%,transparent)){
    :root{
      --key-soft:color-mix(in oklab,var(--key) 14%,transparent);
      --key-softer:color-mix(in oklab,var(--key) 8%,transparent);
      --key-act:color-mix(in oklab,var(--key) 16%,transparent);
    }
  }
  *{box-sizing:border-box}
  /* 背景光晕**不用 background-attachment:fixed**：iOS Safari 对它的支持是坏的
     （键盘弹起/滚动时整层抖动或空白）。改成一条 position:fixed 的伪元素层，
     观感一致：底色铺底，光晕钉在视口顶部。
     0.24.0 起这圈光的**颜色**是色温定调的消费者之一（`var(--tint)`，见 §③ 的
     `data-mood`）：三档等亮度，所以这层跟着换的是色温不是强弱——旧值 #151a26
     的相对亮度 .01038，三档分别是 .01581 / .01538 / .01537（比旧值亮半档，
     三档之间最大差 2.9%）；这层没有文字压在上面（正文都在 stage 与卡片里），
     实测最弱那档墨色 --dim2 #6b748a 落在光晕中心仍有 3.41:1（旧值 3.72:1）。 */
  body{margin:0;color:var(--fg);background:var(--bg);
       font:15px/1.7 -apple-system,"Segoe UI",system-ui,"Microsoft YaHei",sans-serif}
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
       background:radial-gradient(1100px 640px at 50% -8%,var(--tint) 0%,transparent 62%)}
  ::selection{background:rgba(245,166,35,.28);color:#fff}
  /* 键盘焦点必须看得见：交互项一半是运行时动态生成的，全局一条比逐处补更可靠 */
  :focus-visible{outline:2px solid var(--key);outline-offset:2px}

  /* ── ① 进度条：**章节边界直接长在它上面** ─────────────────────────
     原先画布上方还有一行章节胶囊。那是在跟画布抢一行位置，信息又和进度条重复
     ——都是"课程走到哪了"。现在不设那一行：每节起点做成进度条上的一根刻度，
     悬停即报出该处属于哪一节。顶部 / 画布上方都不再有常驻条。
     进度条本身常驻，与 ▶ / ⟲ 一起长在播放器行 .rack 里（位置见下面 ④）。 */
  .bar{position:relative;height:6px;border-radius:3px;background:#242a36;cursor:pointer;
       touch-action:none;   /* 触屏横拖喂给擦洗，不当成页面滚动 */
       transition:height var(--dur-scrub) var(--ease-out),
                  border-radius var(--dur-scrub) var(--ease-out)}
  /* 视觉高度 6px，但命中区上下各扩 7px——细条上瞄准点击太累 */
  .bar::before{content:"";position:absolute;left:0;right:0;top:-7px;bottom:-7px}
  /* 擦洗态变厚（0.16.0「affordance 随意图升级」）：平时这条 6px 的发丝线只管"读到
     哪儿了"，一旦指针落上来 / 按下拖动，它升到 9px——**把"现在可以拖"这件事画在
     你正要指的地方**，而不是在旁边再摆一个可见的把手。三条边界：
       · 只长高、不加 margin：轨道自己占住那几 px，`.rack` 的行高不跟着跳，
         读数与倍速钮一格不动；
       · 圆角跟着高度走（6/3 → 9/4.5），否则 9px 高的条顶着一个为 6px 定的圆角，
         两端会显得发方；
       · 过渡只给 height/border-radius（几何），不给 width：填充的补间是
         `--dur-fill linear`，那是"进度连续滑动"的口径，两者不能混一条清单。 */
  .bar:hover,.bar:focus-visible,.bar[data-drag="1"]{height:9px;border-radius:4.5px}
  .bar-fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:inherit;
            background:var(--key);
            z-index:1;transition:width var(--dur-fill) linear}
  /* 拖动跟手：指针在跑时填充过渡缩短到 50ms，不拖后腿；松手恢复 --dur-fill 滑行到位。 */
  .bar[data-drag="1"] .bar-fill{transition-duration:.05s}
  /* 章节刻度：上下各探出 3px，一眼看出整门课被切成几段。
     2px 宽 / 比条底亮一档——1px 太细，暗底上基本看不见，那这一层信息就白放了。
     纵向用 `top:50%` + 独立 `translate` 居中而不是写死 top:-3px：擦洗态轨道升到 9px、
     刻度同时长到 16px，"居中"这一条公式让两端各探出 (刻度高 − 条高)/2（6/12 → 3px、
     9/16 → 3.5px），不需要为第二种高度再补一套数字，也不会出现"条变厚了刻度却还
     贴在旧顶边"的错位（独立 translate 不参与盒模型、也不进 getBBox——沿用 0.13.0
     那条"独立属性"的教训）。 */
  .bar .tick{position:absolute;top:50%;translate:-50% -50%;width:2px;height:12px;
             background:#5f6a7d;border-radius:1px;z-index:2;pointer-events:none;
             transition:background var(--dur-tick),height var(--dur-scrub) var(--ease-out)}
  /* 当前章节刻度点亮：常驻的"你在哪"位置 cue，纯颜色变化不是循环动画。
     tick.on 由 tick() 按 sceneIdxAt 逐拍维护（reduced-motion 下过渡被关掉）。 */
  .bar .tick.on{background:var(--key);box-shadow:0 0 5px rgba(245,166,35,.55)}
  /* 意图升级时刻度一起长高：与轨道变厚同一次过渡、同一时长，读起来是"这根条整个
     进入可拖状态"，而不是两个各自动画的零件。 */
  .bar:hover .tick,.bar:focus-visible .tick,.bar[data-drag="1"] .tick{height:16px}
  /* 悬停窥探：指着哪一段就报哪一段（连该处时间一起报）。点击仍是自由拖动。 */
  .bar .tip{position:absolute;bottom:15px;transform:translateX(-50%);white-space:nowrap;
            padding:3px 9px;border-radius:6px;background:#232a38;border:1px solid #3b4459;
            font:12px/1.5 ui-monospace,Consolas,monospace;color:var(--fg);
            box-shadow:0 6px 20px rgba(0,0,0,.5);pointer-events:none;
            opacity:0;z-index:3;
            /* 越界橡皮筋（0.26.0）：气泡的横向 overshoot 走**独立 `translate` 属性**，
               `transform:translateX(-50%)` 那条居中一个字不动（0.13.0 / 0.16.0 老账：
               写进 transform 会在落定那一瞬把居中分量丢掉）。`--band` 注册成
               `<length>` 才有"松手弹回"这一格：对照页实测——同一个 `translate:var(--x) 0`
               加同一条 spring 补间，`--x` 注册时 0→16px 逐帧可读（41/82/122ms 上是
               2.79 / 7.51 / 12.67px，484ms 落位），未注册时 13 次采样（每 40ms 一次，
               共 482ms）全是终值 16px，中间一格都不存在。补间清单与 opacity
               **同一条规则里并列**，不再另写一份 `transition` 简写（两份会互相顶掉，
               见 .nt 那条口径）。 */
            translate:var(--band) 0;
            transition:opacity var(--dur-fast),
                       --band var(--dur-band) var(--ease-spring)}
  .bar .tip[data-on="1"]{opacity:1}
  /* 气泡弹簧落定（0.16.0，把 --ease-spring 用进播放器行）：气泡出现时轻弹 7px 落住，
     与它报的那个刻度长高是同一个动作的两半——"这里有你想要的信息"。
     `transform` 里必须把 `translateX(-50%)` 一起写进每一帧：动画期间的 transform
     **整条接管**静态值，只写 translateY 会让气泡在落定那一瞬往左跳半个身位。
     `left` 仍由 JS 逐点写（贴边夹回条内），两者一个走 transform 一个走 left，不打架。
     只在**气泡从无到有**或**指到另一节**时重触发（pointermove 每帧都进，重放会抖）：
     判据留在 JS 的 data-on 差分里，见 §⑦ 悬停窥探。 */
  @keyframes tipPop{from{transform:translateX(-50%) translateY(7px)}
                    to{transform:translateX(-50%) translateY(0)}}
  .bar .tip.tipPop{animation:tipPop var(--dur-tip) var(--ease-spring) backwards}
  /* 越界橡皮筋（0.26.0）的另一半：**到头了**这件事画在条的那一头。指针拖过条的端点时
     JS 不再把播放头跟着手指撒谎（时钟仍是纯读数），而是把超出量按一条**非线性阻尼**
     折成一个横向偏移交给气泡，并给 .bar 挂 `data-band="l|r"`。四条口径：
       ① `--band` 注册成 `<length>`、`inherits:false`、初值 `0px`：0px 就是"没有越界"，
          不写 / 不能写 / 导出三种情形都落在那一格；`inherits:false` 是因为这个读数
          **只属于气泡自己**（谁用谁持有，JS 直接写在 tip 的 style 上，不穿给后代）。
       ② 偏移由 `--band-cap`（封顶）与 `--band-soft`（半程点）两只旋钮折出来
          （`cap · x / (x + soft)`，x 是手指越过端点多少 px）：越过 soft 那一格正好走到
          封顶的一半，再越只逼近不越过。实测这一串：向右越过 12/24/48/96/200px →
          4.80/8.00/12.00/16.00/19.35px，向左越过 40px → −10.91px；松手后从 16px 弹回
          0px 用掉 459ms，中途反向过冲到 −1.68px 一次（`--dur-band` 那条 spring 的尾巴）。
          **线性跟随是错的**——那等于让手指在条外
          100px 也把播放头推出去 100px 的视觉距离，而一整条课件轨也就几百 px。
       ③ 端头那一圈亮（`.bar::after` 的渐变）走 **data-band 档位**而不是 `--band` 的
          数值：它是"哪一头顶到了"的状态读数，减少动效下照样落（关的是补间不是状态，
          与 `.tilt` / `#spot` 同一判断）；而 `--band` 那一格位移在减少动效下由 JS
          直接写 0——给晕动用户弹一下没有信息量。
       ④ 装饰层一律 `pointer-events:none`（与 #spot / 涟漪 / #depth .wash 同一口径）。
          层的次序靠 **z-index 同档 + 生成顺序**：`.bar .tick` 与 `.bar::after` 都是
          z-index:2，而 `::after` 是最后一个子元素——所以这圈亮盖在填充与刻度之上，
          不吃指针、也不需要在 CSS 里再抬一档。 */
  @property --band{syntax:'<length>';inherits:false;initial-value:0px}
  .bar::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
              opacity:0;z-index:2;transition:opacity var(--dur-band) var(--ease-out)}
  .bar[data-band="r"]::after{opacity:1;
    background:linear-gradient(90deg,transparent 55%,var(--key-soft))}
  .bar[data-band="l"]::after{opacity:1;
    background:linear-gradient(270deg,transparent 55%,var(--key-soft))}
  .step{font:12px/1.4 ui-monospace,Consolas,monospace;color:var(--dim);
        white-space:nowrap;text-align:right}

  /* ── 主体：两栏 ─────────────────────────── */
  /* 高屏幕上整块版面垂直居中（margin:auto 而不是 center 对齐：内容一旦超过
     视口高度，auto 会退化成 0，不会像 justify-content:center 那样裁掉顶部）。 */
  /* dvh 跟得住移动端地址栏的收放；不认识的浏览器保留前一条 100vh 兜底 */
  #root{display:flex;min-height:100vh;min-height:100dvh}
  .shell{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start;
         padding:24px 18px;margin:auto;width:100%;max-width:1500px}
  .col-stage{min-width:0}
  .chapter{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin:0 0 10px}
  .chapter .tag{font-size:11px;padding:2px 8px;border-radius:5px;flex:none;
                background:var(--key-soft);color:var(--key)}
  /* 排版留白层（0.17.0，前沿做法：text-wrap:balance + text-box-trim）。两条都
     **不是动效**、不新增时钟，所以不进 reduced-motion 清单，但都过四条纪律，
     逐条在真实 Chrome 里量过：
       · `balance` 让**多行标题每行等长**（340px 容器实测：不均衡两行收在
         [317, 223] → 均衡 [279, 261]，那条长短差 94px 的参差边不再拽视线）；
         **单行标题一格不动**（窄容器 195/195、宽容器 508/508 两档逐值相同），
         所以对短课标题是零成本；`pretty` 不写——它靠空格分词，中文没有空格；
       · `text-box-trim` 收走行盒上下的 leading：`.tagline` 继承正文 1.7 的行高，
         13px 那行实测盒高 22 → 15，而**字身一格没裁**（40px 字在 line-height 1.9
         下墨区 38px，裁与不裁两种情况下都是这 38px）——它只搬留白，不动可读内容；
         挂在 flex baseline 组里也只收自己那一格（同排 h1 盒高 32 不变）；
       · **`text-box-edge` 只写 `text`**：`cap` / `text-alphabetic` / `ex` 在本机
         Chrome 的 `CSS.supports()` 全 false，写上去整条声明作废；
       · 只管 HTML 侧的文本。SVG 的 `<text>` 不换行、它的 x/y 也不在 CSS 清单里
         （0.15.0 实测），字幕带那套排版完全不受影响。
     不支持的浏览器整条声明作废：标题照旧换行、照旧带 leading，一个字不少——
     又是纪律③那条：内容与装饰不能押在同一个可能不跑的门上。 */
  .chapter h1{font-size:19px;margin:0;font-weight:700;text-wrap:balance}
  /* tagline 独占一行：和标题挤同一行时长句会在随机位置断行，起行后整句完整。
     这里**不**为 0.21.0 的 `.gather` 预留 `letter-spacing`：实测 Chrome 把
     `normal` 当 0 参与字距插值（散→收逐帧连续，写不写 0 逐帧同值），但规范上
     `normal` 不是长度、异型端点按 discrete 处理——同型的活交给关键帧自己写两头
     （见 §③ `.gather` 边界 ②），作者的排版规则不必替动效让路。 */
  .chapter .tagline{font-size:13px;color:var(--dim);margin:0;flex:1 1 100%;
                    text-wrap:balance;text-box-trim:trim-both;text-box-edge:text}
  .chapter .tagline:empty{display:none}

  /* CJK 行首标点（0.19.0，前沿做法：text-spacing-trim）。中文排版里全角标点在行首
     还占着**半个字宽**的盒子——一行以「、（、，开头的文案，起笔比后面那些字往右
     缩进半格，两条栏就成锯齿。`trim-start` 正是收这一格的规范属性，本轮在 Chrome 152
     里量过才写进来（量的是**同字号同栏宽的替身**：13px/1.7 与 16px/1.6 两档、
     300px 与 600px 两栏，都带范本侧栏那 34px 缩进）：
       · 行首是「：整行**墨迹**宽 −6.5px @13px 档、−8.0px @16px 档，两档都恰好 0.5em；
       · 行首是汉字：逐值不动（0.0）——它不是"顺手把整行往左推"，只动该动的那半格；
       · 16px 那一档还会**把断点往前挪一个字**：行0 宽 592.016 → 600.016、行1 宽
         232.734 → 216.734（行1 少 16 = 正好一个字，行0 多 8 = 那一个字 16 减掉行首
         省下的 8），两头相加仍是 −8 = 0.5em。省下的那半格本来就是空白，字排得更实，
         这是收益不是副作用；
       · 块盒宽、行数、行高逐值不变。**这条最容易量错**：Range 墨迹才是真变化，
         量块盒宽会得到"零变化"的假结论——本轮第一版探针就踩在这儿，据此差点否掉。
     只给**会换行的 HTML 正文**挂：侧栏三档文案、门禁题干与反馈语、章节 tagline。
     **字幕 `#cap-text` 不挂**，这条同样是量过的：它在 SVG `<text>` 上确实生效
     （17px 档 bbox 宽 −8.511px、`text-anchor:middle` 让 bbox.x 跟着 +4.255px、
     `getClientRects().length` 1→1 不变），但字幕是单行、不换行，收掉的半格只让整句
     往中间挪 4px——**看不见收益，却要动色带与细线现量的那套 bbox 读数**（0.14.0 的
     划重点、0.16.0 的细线、0.19.0 的点亮三处都从它量）。不动。
     不支持的浏览器整条声明作废：标点照旧占那半格，字一个不少（纪律③）。
     它不是动效，不进 reduced-motion 清单，与 0.17.0 排版留白层同一口径。 */
  @supports (text-spacing-trim:trim-start){
    .n-txt,.gate .q,.interaction-feedback,.chapter .tagline{text-spacing-trim:trim-start}
  }

  /* 舞台：宽度决定高度。**宽度 = 左栏宽度，不单独设 max-width。**
     画布比例已经由内容决定（viewBox 比例 ≈ 各场景内容并集的比例），
     再给画布套一个"看着合适"的上限，只会凭空留出一条没人用的竖带
     （实测：上限 840 在 1920 窗口下留出 284px）。
     要收窄整个版面就改 .shell 的 max-width —— 一处上限同时管住两栏。
     它同时是播放层与门禁的定位参照（这两样浮在它内部，见下）。
     **下缘不圆角**：播放器行紧接在它下面，两层共边成一块。 */
  .stage{position:relative;overflow:hidden;
         background:linear-gradient(180deg,#1c212d 0%,var(--panel) 55%,#161a23 100%);
         box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
         border:1px solid var(--line);border-radius:14px 14px 0 0;padding:10px}
  .stage svg{display:block;width:100%;height:auto;aspect-ratio:1000/460}

  /* ── 画布内播放层（替代原先的顶部走带） ──────────────────────────
     显隐只由 .stage[data-state] 决定，state 由页面写：idle / playing / paused
     **锚在底部、不居中**：画面中心常是正文（比如开场那句要人先猜的问题），
     居中的播放键会正好压住它。底部锚定跟画面内容不抢位置。
     padding-bottom 64px 让胶囊停在字幕带**上方**：idle 时字幕本就收着不叠，
     但开播瞬间两层各 0.32s 交叉淡入淡出，压太近会有一帧并排挤在带子里。 */
  .veilplay{position:absolute;inset:10px;z-index:5;display:flex;align-items:flex-end;
            justify-content:center;padding-bottom:64px;border:0;border-radius:12px;
            background:rgba(10,12,17,.46);color:var(--fg);cursor:pointer;font:inherit;
            transition:opacity var(--dur-veil) ease,background var(--dur-veil) ease}
  .veilplay .vp{display:flex;align-items:center;gap:10px;padding:8px 16px 8px 10px;
            border-radius:999px;background:rgba(9,11,16,.74);
            border:1px solid rgba(255,255,255,.12);box-shadow:0 8px 28px rgba(0,0,0,.45)}
  .veilplay .vp-ico{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;
            justify-content:center;background:var(--key);color:#1a1200;
            font-size:14px;padding-left:3px}
  .veilplay .vp-txt{font-size:14.5px;font-weight:600}
  .veilplay .vp-sub{font:12px/1.4 ui-monospace,Consolas,monospace;color:var(--dim)}
  /* 键盘快捷键的唯一曝光位。原先在字幕条右下角，字幕条删掉后搬进开场这一层：
     只看一次就够（开播后播放器行的 ▶ ⟲ 进度条已经把鼠标操作说清了）。 */
  .veilplay .vp-kbd{font-size:11px;color:var(--dim2);white-space:nowrap;
                    border-left:1px solid rgba(255,255,255,.14);padding-left:10px}
  /* idle：压暗 + 呼吸，明确"点这里开始" */
  .stage[data-state="idle"] .veilplay{animation:breathe var(--dur-breathe) ease-in-out infinite}
  @keyframes breathe{0%,100%{background:rgba(10,12,17,.46)}50%{background:rgba(10,12,17,.22)}}
  /* playing / paused：整层收起。暂停时**不压暗**——要能看清停在哪一帧；
     恢复播放的入口在画布下面播放器行的 ▶ 上（就像普通播放器）。 */
  .stage[data-state="playing"] .veilplay,
  .stage[data-state="paused"] .veilplay{opacity:0;pointer-events:none}
  /* 未开始时不放字幕：那时"点这里开始"那颗胶囊就锚在画布底部，字幕带也在那儿，
     两条会叠在一起。语义上也顺——字幕是跟着旁白出现的，旁白没响就没有字幕。 */
  .stage[data-state="idle"] #cap{opacity:0}

  .el{opacity:0;transition:opacity var(--dur-el) ease}
  .el.on{opacity:1}
  /* 方向感换场（0.14.0，前沿做法：direction-aware transition）：**前进**从右侧进、
     **后退**从左侧进——把"课程往前走了一步"这件事画在屏幕上，而不是只换个数字。
     挂在独立 `translate` 属性上（不是 transform）：stage 图层自身没有 transform 属性，
     但用独立属性才与 0.13.0 那条"独立属性先于 transform 合成"的教训同口径，
     也不会顶掉任何作者写在属性上的位移。位移**不进 getBBox()**（实测 100.0 全程不变），
     所以取景、内容包围盒与命中区一律不受影响。只由 tick() 在**换节**时重触发
     （与 .chFlip 同一个判据），擦洗与导出截图模式下不演。 */
  @keyframes swF{from{translate:26px 0}}
  @keyframes swB{from{translate:-26px 0}}
  .el.swF{animation:swF var(--dur-swp) var(--ease-out) backwards}
  .el.swB{animation:swB var(--dur-swp) var(--ease-out) backwards}

  /* ── 舞台运动学：图元常驻，一步只写"该是什么样" ──────────────────────
     renderer 不是动画引擎，是状态函数：它把目标状态写进属性，**补间交给 CSS**。
     导出截图页会一刀切掉 transition/animation（口径见 references/runtime.md §7），
     所以属性值本身就必须是终态——切掉动效拿到的是同一张正确定格，不是半截动画。
     由此三条推论（改舞台前必读）：
       ① 位移/变色只走 transition，不在 JS 里排程（纪律 1）；
       ② 入场用 animation 且 **fill-mode 用 backwards / 不写**——`both`/`forwards`
          会把终态钉在 CSS 上，之后 setAttribute 的 opacity/transform 全被压住；
       ③ 循环动效的 0% 必须等于静息态（导出切掉后落在属性上，不是随机相位）。 */
  #cam{transition:transform var(--cam-dur) var(--ease-out)}
  /* 运镜运动模糊（0.13.0，"速度决定模糊"的前沿做法）：镜头**真的动了**才糊一下——
     推拉摇移时画面短暂失焦、落定即清晰，这是真实摄影机的物理感，也是"观众该在哪
     一步重新找重心"的暗示。三条边界：
       · 只动 filter，不动几何：字幕带在 #cam 之外、取景框在父层裁切，模糊不会
         溢出到字幕带上，也不会改变任何 getBBox / 命中区；
       · 0% 与 100% 都是 blur(0)（循环动画 0% = 静止态那条纪律的同款要求），
         导出截图页一刀切掉 animation 后落在"完全不糊"的定格上；
       · 幅度不够就不糊（camSet 里按位移/倍率变化判阈值）——每步都糊等于没糊，
         还会把注意力从内容上抢走。 */
  @keyframes camBlur{0%{filter:blur(0)}38%{filter:blur(2.2px)}100%{filter:blur(0)}}
  #cam.blurpass{animation:camBlur var(--dur-blur) var(--ease-in-out)}
  /* 几何补间（0.15.0「生长」）：SVG 几何属性同时是 CSS 属性，renderer 用
     setAttribute 改它们时 transition 接得住——框可以**长大**而不是瞬移或重画
     （Chrome 152 实测：rect 改属性后采到中间值 width 45.32 / x 22.66 / rx 4.93，
     circle 采到 cx 203.99 / r 11.06，终态都落回属性）。清单按实测写：
       rect 的 x / y / width / height / rx，circle 的 cx / cy / r，ellipse 的 rx / ry，
       外加 path 的 d（形变 morph，要求两条路径的命令序列同构，否则整条跳档）。
     两条**不在**清单里的，踩到就是白写：
       · `<text>` 的 x / y 不是几何属性（计算值恒为 0px）——文字的位移只能靠
         transform 或独立 translate，别指望写 x 能把一行字滑过去；
       · `<line>` 的 x1 / y1 / x2 / y2 同样没进 CSS（实测计算值为空）——要连线动，
         用 .draw 描线或挂在父 g 的 transform 上。 */
  .nt{transition:transform var(--dur-move) var(--ease-out),opacity .4s ease,
       fill .35s ease,stroke .35s ease,stroke-width .3s ease,
       x var(--dur-grow) var(--ease-out),y var(--dur-grow) var(--ease-out),
       width var(--dur-grow) var(--ease-out),height var(--dur-grow) var(--ease-out),
       rx var(--dur-grow) var(--ease-out),ry var(--dur-grow) var(--ease-out),
       cx var(--dur-grow) var(--ease-out),cy var(--dur-grow) var(--ease-out),
       r var(--dur-grow) var(--ease-out),d var(--dur-grow) var(--ease-out),
       --dimmer var(--dur-dim) var(--ease-out),filter var(--dur-dim) var(--ease-out)}
  /* 形变（0.45.0）：**morph() 独占 d**，所以这一条把 .nt 的清单原样抄一遍、只删掉
     `d`（写在 .nt 之后、同特异度，整串简写以本条为准——见 §3.4.5「CSS 简写互相顶掉」）。
     留着 `d` 就是双重缓动：JS 每帧写的是一条 48 段折线，CSS 的 d 补间再去追自己
     刚写下的那一帧，中间帧永远落在 JS 那一帧的后面，收尾也落不回作者那条精确轮廓
     （与 .meter 的 width、.conn .line 的 dashoffset 同一课）。其余十六项照旧——
     正在变形的图元仍然可以同拍走位移、透明度与描边色。
     为什么不用 .nt 自带的 d 补间：那条要求两条路径**命令序列同构**，否则整条跳档
     （M L L vs M C 直接不补间，实测见 stage.md §3.4.3（15））；形变正是把这个限制
     拆掉——顶点数不同、有弧有角都能连续，代价是中间帧是采样折线。 */
  .morph{transition:transform var(--dur-move) var(--ease-out),opacity .4s ease,
       fill .35s ease,stroke .35s ease,stroke-width .3s ease,
       x var(--dur-grow) var(--ease-out),y var(--dur-grow) var(--ease-out),
       width var(--dur-grow) var(--ease-out),height var(--dur-grow) var(--ease-out),
       rx var(--dur-grow) var(--ease-out),ry var(--dur-grow) var(--ease-out),
       cx var(--dur-grow) var(--ease-out),cy var(--dur-grow) var(--ease-out),
       r var(--dur-grow) var(--ease-out),
       --dimmer var(--dur-dim) var(--ease-out),filter var(--dur-dim) var(--ease-out)}
  /* 路径进度（0.46.0）：一条路分成"已走 / 未走"两截——已走实线、未走虚线。这是
     导航与流程图的通用语法（地图的已行路线、gui.de 的流向线、推导链的"走到这一
     步"）。作者只画一条 `<path>`，drawTo() 替它建一条同 d 的虚线副本垫在下面，
     所以"还剩多少"从来不用作者再画一遍。
     五条边界：
       ① **进度写属性、不挂 transition**：`.seg` 上的 `transition:none` 是刻意的
          ——`stroke-dasharray` 是可动画属性，作者那条路若同时挂了 `.nt` / 自带
          transition，CSS 会追着 JS 每帧写下的值再补一次，收尾落不回精确进度
          （与 `.meter` 的 width、`.conn .line` 的 dashoffset 同一课）；
       ② **初值不可见**：`stroke-dasharray:0 9999` 让"还没开始"就是零可见——实段 0、
          空段比整条长得多，所以整条路不显形。这里必须写**大周期**而不是 `0 1`：
          后者周期只有 1 个用户单位，0/1 交替落在亚像素尺度上，抗锯齿会把它渲染成
          "半透明的实线"（实测整条路仍看得见，只是颜色淡了一半）——那不是"没开始"，
          是"线脏了"；
       ③ **副本不带 id、不抢命中**：`.seg-g` 是纯注解（`data-helper="seg"`，
          prune() 跳过、`pointer-events:none`），与真实路径**同父、紧跟其后**，
          坐标系天然一致——不靠 transform 换算把 d 搬到别的层（那会随镜头缩放
          错位，`#loupes` / `#connects` 那种"单开一层"在这里行不通）；
       ④ **圆头**：`stroke-linecap:round` 让端点读作"走到这里"；平头在细线上
          会被读成"线断了"；
       ⑤ 它**不进** reduced-motion 清单：没有 CSS 补间，逐拍是 JS 的读数，
          见旗（导出 / 减动效 / 擦洗）由 segTock 直接落作者声明的 at。 */
  .seg{transition:none;stroke-linecap:round;stroke-dasharray:0 9999}
  .seg-g{stroke:var(--path-ghost);stroke-dasharray:var(--path-dash);
         stroke-linecap:round;fill:none;pointer-events:none}
  /* 圈数（0.47.0）：一件东西绕 N 回，每回落一站。三层各司其职：
       · `.lp` = **作者交给原语的那一层**（纯包装 <g>）。`transition:none` 是刻意的
         ——每圈的落点是 loopTock() 逐拍写进 `transform` **属性**的，CSS 再补一次
         就成了双重缓动，收尾落不回精确的那一格（与 .meter 的 width、.seg 的
         dasharray 同一课）。要淡入 / 换色挂在这一层的**内容**上，别挂在这一层；
         同理，renderer 不要再给这层写 transform——它归原语独占（与 .explode 同规）。
       · `.lp-cur` = 游标（开口环 + 3/8 读数）与落点痕所在的整层：纯注解，
         `pointer-events:none`，`data-helper="loop"` 让 prune() 不去按 GEN 收它
         （它由 layoutLoops() 自己按 key 建与摘，与 .seg-g 同判据）。
       · `.lp-pop` 是游标里**唯一会动的那一层**：落定那一顿走独立变换属性 `scale`
         （与 `.settle` / `.swap` 同一族写法），定位仍归父层的 transform 属性——
         两个属性互不顶替，一条 transition 简写都不需要（见 §3.4.5「一个节点只写
         一条 transition 简写」）。`.lp-pop` 里那枚 `stroke:none / fill:none` 的
         **隐形整圆不是装饰**：`transform-box:fill-box` 的 50% 50% 取的是 bbox
         中心，而带缺口的弧 bbox 并不在环心上，少了它落定那一顿会连着横向抖一下。
     `prefers-reduced-motion` 清单里**没有它**：没有 CSS 补间，逐拍是 JS 的读数，
     见旗（导出 / 减动效 / 擦洗）由 loopTock 直接落作者声明的那一圈。 */
  .lp{transition:none}
  .lp-cur{pointer-events:none}
  .lp-dot{fill:var(--loop-mark)}
  .lp-arc{fill:none;stroke:var(--loop-ink);stroke-width:1.6;stroke-linecap:round}
  .lp-num{font-size:11;font-weight:700;fill:var(--loop-ink)}
  .lp-pop{transform-box:fill-box;transform-origin:50% 50%;scale:1}
  @keyframes lpTock{from{scale:.62}58%{scale:1.16}to{scale:1}}
  .lp-pop.on{animation:lpTock var(--dur-pop) var(--ease-out) backwards}
  /* 时序带（0.48.0）：几条泳道 + 一根"现在"针，说的是**并行关系**——谁和谁同时、
     谁在谁之后。整族注记由 layoutLanes() 建、lanesTock() 逐拍写宽与针位，所以
     这一族**一条 transition 都不需要**（与 .lp 同一课，只是这里连作者那一层都不碰）：
       · `.ln` = 整条带所在的根：纯注解层，`pointer-events:none`，`data-helper="lane"`
         让 prune() 不按 GEN 收它——它由 layoutLanes() 自己按 key 建与摘（与 .lp-cur /
         .seg-g 同判据）；
       · `.ln-t` 轨道底槽、`.ln-f` 实心段：只写 `x` / `width`，逐拍、无补间（与
         `.meter` 的 width 同一课——JS 每帧写几何，CSS 再补一遍就是双重缓动）；
       · `.ln-n` 是"现在"针（竖线 + 顶端小三角），整条带**唯一**的时钟证据：针到
         哪儿、哪条道就该有多长。描边挂 `.crisp` 钉回屏幕像素，镜头推近时不糊成一条杠；
       · `.ln-lab` 左侧短标签带 `.halo`，压在连线与图元上也读得清；放不下就整组
         标签不画（带宽与针照旧，与 callout / loupe 的"量不到就不注"同一口径）。
     `prefers-reduced-motion` 清单里没有它：没有 CSS 补间，见旗（导出 / 减动效 /
     擦洗）由 lanesTock 把句子进度直接当 1 落——几条实心段一起满、针停在右端。 */
  .ln{pointer-events:none}
  .ln-t{fill:var(--lane-track)}
  .ln-f{fill:var(--lane-ink)}
  .ln-n{stroke:var(--lane-ink);stroke-width:1.2;fill:none}
  .ln-head{fill:var(--lane-ink)}
  .ln-lab{font-size:var(--lane-fs);font-weight:600;fill:var(--lane-ink)}
  /* 区间窗（0.49.0）：一条会移动的取景带 + 两道切口 + 序号读数，说的是**取哪几件**
     ——宽度是读数，移动是内容。整族由 layoutRanges() 建、rangeTock() 逐拍写几何，
     所以这一族**一条 transition 都不需要**（与 .ln 同一课：JS 每帧写几何，CSS 再补
     一遍就是双重缓动，追踪缓动在 rangeTock 里按 easeOutExpo 逐拍算，见 §7.2 的同款）：
       · `.rg` = 整条带的根：纯注解层，`pointer-events:none`，`data-helper="range"`
         让 prune() 不去按 GEN 收它——它由 layoutRanges() 自己按 key 建与摘；
       · `.rg-f` 带内底色：只写 `x` / `y` / `width` / `height`，逐拍、无补间（与
         `.meter` 的 width、`.ln-t` 的 x/width 同一课）。它画在内容**之上**——
         也就是"荧光笔划在整排上"那一档，不是卡片底下的衬色（衬色会被卡片的 fill
         盖掉，只剩两道切口能看见，"取的是这段"就读不出来）；
       · `.rg-e` 两道切口：`width` 恒 1，`height` = 带高 + 2×--range-cap，上下各探
         出去一截，让"这里切开"在物件上下都看得见；填色不描边，避免 1px 描边在
         镜头推近时糊成一条杠（与 `.crisp` 想解决的是同一件事，这里直接用 rect）；
       · `.rg-lab` 读数签带 `.halo`：压在卡片上沿也读得清；整签放不下就压回取景窗，
         宁可往里缩也不能被裁掉（与 `.ln-lab` / `callout` 的"量不到就不注"反着来：
         读数在这条原语里是主角，不能因为挤就整个不画）。
     `prefers-reduced-motion` 清单里没有它：没有 CSS 补间，见旗（导出 / 减动效 /
     擦洗）由 layoutRanges / rangeTock 直接落作者声明的那一格。 */
  .rg{pointer-events:none}
  .rg-f{fill:var(--range-wash)}
  .rg-e{fill:var(--range-edge)}
  .rg-lab{font-size:var(--range-fs);font-weight:600;fill:var(--range-ink)}
  /* 界线（0.50.0）：一条细线 + 两个端头 + 界外的区带 + 读数，说的是**够不够**
     ——量与一条界的关系（过没过、差多少）。这一族与 .rg 相反：几何不补间（每拍由
     limitWrite() 现量现写），补间**只有颜色**（越界那一刻整族切档，--dur-lim）。
     四条边界：
       · `.lim` 是纯注解层：`pointer-events:none`，`data-helper="limit"` 让 prune()
         不按 GEN 收它（由 layoutLimits() 按 key 建与摘）；
       · 界线的细与端头都用 rect 填色、不用 1px 描边——镜头推近时描边会糊成一条杠，
         而 rect 是实的（与 `.rg-e` 同一课）；宽恒 1 视图单位；
       · 区带是**常驻**的，不是越界才长出来：它画的是"这一侧都不行"这个图注，
         越界只换档成红。若让它越界才出现，"界"就变成了"事件"而不是"刻度"；
       · 颜色一律走 class（`.over` / `.hid`），不做每拍写属性——`同值不重写`在这里
         落成"只在判定变了时切一次 class"（LIM_S 就是这件事的唯一账）。
     `prefers-reduced-motion` 清单里没有它：补间只有颜色，见旗（导出 / 减动效 /
     擦洗）切掉 transition 就是终态；判定本身是现量的比较，不是时间决定。 */
  .lim{pointer-events:none}
  .lim-l{fill:var(--lim-ink)}
  .lim-a{fill:var(--lim-ink)}
  .lim-z{fill:var(--lim-zone)}
  .lim-lab{font-size:var(--lim-fs);font-weight:600;fill:var(--lim-ink)}
  .lim-d{font-size:var(--lim-fs);font-weight:700;fill:var(--lim-alert);display:none}
  .lim-l,.lim-a,.lim-z{transition:fill var(--dur-lim)}
  .lim-lab{transition:fill var(--dur-lim)}
  .lim.hid .lim-lab,.lim.hid .lim-d{display:none}
  .lim.over .lim-l,.lim.over .lim-a{fill:var(--lim-alert)}   /* 界值本身不换色：换的是判定，不是刻度 */
  .lim.over .lim-z{fill:var(--lim-hot)}
  .lim.over .lim-d{display:inline}
  /* 岔路（0.51.0）：一枚岔口点 + 几条支 + 每支末端一枚箭头 + 支上短签 + 岔口读数，
     说的是**从一个岔口出发有几条去路、走了哪条**。几何每拍由 forkWrite() 现量现写
     （与 .lim 同一口径），补间**只有颜色**（选中那一支换档，--dur-fork）。五条边界：
       · `.fork` 是纯注解层：`pointer-events:none`，`data-helper="fork"` 让 QA / 探针
         认得出它（prune() 只收带 data-key 且 _g≠GEN 的节点，注记不进那张账——由
         layoutForks() 自己按 key 建与摘）；
       · 支是 `<line>`：`x1/y1/x2/y2` 本来就不在 .nt 的可补间清单里（§3.4.3 (2)），
         这里也不需要——它每帧重算，CSS 再补一遍就是双重缓动（与 .meter / .seg 同课），
         所以 `.fk-a` 的 transition 只列 stroke / opacity，一条简写、不带 all；
       · **未选支常驻淡虚线**，不是"没选就消失"：这条原语的全部内容就是"本来可以
         去哪儿"。`stroke-dasharray` 的切换是瞬的（只有颜色在补间），选中支把它摘掉
         读成"这条路走通了"；
       · 箭头是自己算的三角形 `<path>`、填色不描边，**不用 marker-end**：marker 的
         fill 跟着 marker 自己走，切不到 `.pick` 档上（镜头推近时 1px 描边还会糊，
         与 .rg-e / .lim-l 同一课）；
       · 短签与读数都带 `.halo`：支压在卡片上也读得出字；短签沿法向离线 --fork-pad，
         免得读成"这几支合起来说这一句"。
     `prefers-reduced-motion` 清单里没有它：补间只有颜色，见旗（导出 / 减动效 / 擦洗）
     切掉 transition 就是终态，选中档由当步 `at` 声明。 */
  .fork{pointer-events:none}
  .fk-a{fill:none;stroke:var(--fork-idle);stroke-width:1.4;stroke-dasharray:5 5}
  .fk-h{fill:var(--fork-idle)}
  .fk-n{fill:var(--fork-ink)}
  .fk-lab{font-size:var(--fork-fs);font-weight:600;fill:var(--fork-idle)}
  .fk-r{font-size:var(--fork-fs);font-weight:600;fill:var(--lim-ink)}
  .fk-a,.fk-h,.fk-lab{transition:stroke var(--dur-fork),fill var(--dur-fork),opacity var(--dur-fork)}
  .fk.pick .fk-a{stroke:var(--fork-ink);stroke-dasharray:none}
  .fk.pick .fk-h{fill:var(--fork-ink)}
  .fk.pick .fk-lab{fill:var(--fork-ink)}
  .fork.nolab .fk-lab{display:none}
  .fork.norep .fk-r{display:none}
  /* 拆解视图（0.41.0）：**一条 transition 简写顶掉 .nt**，与 .tuck / .settle 同款
     接线——同特异度、写在 .nt 之后，所以这里列出的属性就是这一层全部会补间的属性。
     四条边界（写错过任何一条，拆解都会静默失效）：
       ① **只挂在纯包装 <g> 上，且这层只用来平移**。drawExplodes() 会从
          transform.baseVal 读回"装配位"，再写"装配位 + 偏移"；如果这层自己还带
          缩放/旋转，读回矩阵只剩 e/f 两个平移量，旋转会被抹平。要转的东西放进
          子节点（与 .lift / .tilt 的"纯包装"同一条）。
       ② **transform 归 drawExplodes() 独占**。renderer 只建节点、给坐标（explode 的
          `base` 参数），**不要**再往这层写 transform：CSS transition 在属性被写下的
          那一刻就用当时的 --ex-delay 起跑，若 renderer 先写装配位、drawExplodes 再
          改延迟，这一趟补间记住的会是上一步的延迟（实测合拢时错峰整个反掉）。
          节点每步由 renderer 重新挂进 EXPLODE，基座坐标每步重给，不靠读回 DOM。
       ③ **位移单位是父坐标系，不是屏幕像素**：镜头缩放会一起放大偏移，这正是
          "拆开的间隙和内容属于同一张图"该有的样子；不要拿屏幕像素去换算它。
       ④ 只带 transform / opacity / filter / --dimmer 四项。纯包装层不该有
          fill/stroke/几何属性；需要它们的东西放进子节点，各自的 .nt 照常工作。
     错峰延迟写在节点上的 --ex-delay（drawExplodes 按距离现算），这里只留一个
     0s 兜底：没有 JS 时（或 reduced-motion 一刀切）落的是终态，不是半拆。 */
  .explode{transition:transform var(--dur-ex,.55s) var(--ease-out) var(--ex-delay,0s),
       opacity .4s ease,
       filter var(--dur-dim) var(--ease-out),
       --dimmer var(--dur-dim) var(--ease-out)}
  /* 焦点弱化（0.13.0，前沿做法：注册变量补间 filter）：同一层里"这一步该看的"
     保持原样，其余图元降饱和 + 微压暗——弱化是**材质变化**而不是消失，观众仍
     知道它在那儿当参照。只碰 filter，**不碰 opacity**：CSS 的 opacity 会盖掉
     renderer 写在呈现属性上的逐句透明度（.45 / .7 这类档位是作者的话），两者
     打架过；弱化强度全在 --dimmer 这一个数上，导出截图页一刀切掉
     transition/animation（filter 不在切掉之列）后，落在的仍是同一张定格。
       put(parent,'g',key,{'data-dim': dimmed ? 1 : 0, opacity: dimmed ? .45 : 1})
     没实现 @property 的浏览器里 --dimmer 不补间、filter 直接跳档——终态一致。 */
  [data-dim="1"]{--dimmer:var(--dim-focus);
      filter:saturate(calc(1 - var(--dimmer) * .72)) brightness(calc(1 - var(--dimmer) * .26))}
  /* 只写 from：to 取元素自身值，所以目标 opacity 是多少都接得住。
     错峰入场：--delay 由 .st1/.st2/.st3 或作者直接写在元素上（如 style="--delay:.08s"），
     一组同幕图元按序上浮——模板门禁卡片就用了同款节奏（见下方 nth-child 延迟）。 */
  .in{animation:ntIn var(--dur-in) var(--ease-out) backwards;
      animation-delay:var(--delay,0s)}
  .st1{--delay:.06s}.st2{--delay:.12s}.st3{--delay:.18s}
  @keyframes ntIn{from{opacity:0}}
  /* 缩放入场只能挂在**没有 transform 属性**的节点上（CSS transform 会顶掉属性值），
     要位移又要点入场的，外层管位移、这一层管入场。 */
  .pop{transform-box:fill-box;transform-origin:50% 50%;
       animation:ntPop var(--dur-pop) var(--ease-out) backwards}
  @keyframes ntPop{from{opacity:0;transform:scale(.82)}}
  /* 画线：配 pathLength="1"，虚线偏移从整条藏到整条显；终态 = 满线 */
  .draw{stroke-dasharray:1 1;animation:ntDraw var(--dur-draw) var(--ease-out) backwards}
  @keyframes ntDraw{from{stroke-dashoffset:1}}
  /* 荧光笔标记（`.mark`，0.27.0，前沿做法：highlighter annotation）：一句关键话被
     划上一道半透明琥珀带。**几何必须量出来**——带宽、起点、斜度都从目标文本的
     getBBox() 现推（markBehind），作者只给一句话和一个 key，不手填坐标；换字号、
     换句长都不用回头改数。
     四条实测边界：
       ① **画在文字后面**：SVG 的绘制顺序就是文档顺序，色带必须 insertBefore 到
          文本节点之前。put() 直接追加会盖在笔画上——半透明层压字等于把字色与带色
          按 alpha 再混一次，琥珀字自己看不出来，换成别的字色就会串色；整行也会
          糊成一块平色，不再有"笔划过去"的层次；
       ② **只给琥珀字配带**：亮带会抬背景亮度，红字 #ef4d4d 衬在 .14 琥珀上只剩
          3.43:1（舞台底 #1c212d）/ 3.74:1（#161a23），跌破 4.5:1；琥珀字 #f5a623
          衬同一条带仍有 6.09 / 6.64:1。所以消费者只许是琥珀——见 renderC s4 的
          c-head；红字要"被划掉"用 .strike，不许用 .mark（见 token 注释①）；
       ③ **斜度靠独立 rotate 属性，不写进 transform**：transform 已被 scaleX 入场
          占用，把 rotate 塞进 keyframes 的 from 端会在 to 端丢掉它；rotate 是独立
          属性，只做静态倾角、不参与补间，导出切掉 animation 后它还在（定格仍是
          那道斜带，与 .tilt 把终态写在 data-pan 上同一纪律）；
       ④ **终态写在元素自己身上**：base transform 只有 rotate，markIn 只写 from 的
          scaleX(0)——animation:none 的两种兜底（减少动效 / 导出截图）都落在完整
          色带，不是"划到一半"。
     带宽 .55 × bbox 高、起点 bbox.x−4、右缘 +8：只压字的下半格，像真的荧光笔从
     基线上一路抹过去；加厚到 .8 会把上一行也罩进来，收窄到 .3 就变成下划线。 */
  .mark{transform-box:fill-box;transform-origin:0 50%;
        rotate:var(--mark-tilt);fill:var(--mark-ink);
        animation:markIn var(--dur-mark) var(--ease-out) backwards;
        pointer-events:none}
  @keyframes markIn{from{transform:scaleX(0)}}
  /* 反证划线（`.strike`，0.27.0）：一句话被判错，红笔从左到右划掉。
     pathLength="1" + dasharray "1 1" + dashoffset 0（与 .draw 同一族归一单位），
     入场只写 from 的 offset:1——终态是一条完整的线，导出/减少动效截断后仍是
     "划掉了"，不是"划到一半"。
     四条实测边界：
       ① **斜线端点在 JS 里算**：水平 <line> 的 fill-box 高为 0，把 rotate 挂在
          transform-box:fill-box 上时旋转盒退化成一条线，不同引擎落点不一；所以
          斜率按 --strike-tilt 直接算进 y1/y2——左端高 tan/2、右端低 tan/2，方向
          就是手划的左上 → 右下（见 strikeThrough）；
       ② **必须画在文字上面**：与 .mark 相反，划线要压过笔画才读得出"作废"；同一
          组里 append 在文本之后，SVG 文档顺序保证它在最上层；
       ③ **文字同时压暗、不换红**：红线是"判定"，字是"证据"——两者都红会互相抢。
          字落 #8d95a8（比正文暗一档，合成对比度 5:1 以上：衬在红 tint 盒上是 5.37:1），红只留给线（renderD）；
       ④ **不挂 .draw**：.draw 的 animation-delay 可被 .st1 改写，那是入场的错峰；
          划线要的是**每一步都在**（s1 划掉之后到 s5 仍是被划掉的那一行），所以
          自建 strikeIn，不继承 .draw 的节奏令牌。
     线宽取 max(2, bbox 高 × .09)：18px 字号得 2px、30px 得 2.7px——细看是笔尖，
     不是删除线字符。 */
  .strike{stroke:var(--strike-ink);stroke-linecap:round;fill:none;
          stroke-dasharray:1 1;stroke-dashoffset:0;
          animation:strikeIn var(--dur-strike) var(--ease-out) backwards;
          pointer-events:none}
  @keyframes strikeIn{from{stroke-dashoffset:1}}
  .pulse{animation:ntPulse var(--dur-pulse) ease-in-out infinite}
  @keyframes ntPulse{0%,100%{opacity:1}50%{opacity:.45}}
  /* 沿线流光（0.18.0，"这条关系刚被走通一遍"）：.draw 说"线存在"，这一条说
     "有一个方向、有一次通过"——一小段光沿路掠过去，从头到尾。口径全部长在
     pathLength=1 的归一单位上（与 .draw 同一族），所以同一条 d 换个 class 就换
     一句话，不用重算 dash 数学：
       stroke-dasharray: var(--flow-seg) 1   → 一个光段(.16) + 一整条空隙(1)
       静止态 stroke-dashoffset: var(--flow-seg)
       @keyframes 从 --flow-seg 走到 -1
     四条实测边界（Chrome 152，CDP 冻结采样 + 像素扫描）：
       ① **静止态 = 看不见**：dashoffset 落在 .16 时，光段整体在路头之外（虚线
          图案往回缩一个光段长），像素扫描整条路上零橙色——不演就没有光，
          导出/关动效天然落回"一条普通线"（纪律③同一口径，终态写在属性上）；
       ② **终态也 = 看不见**：补间终点 -1 把光段推到路尾之外，实测采到
          0.16 → -0.13 → -0.42 → -0.71 → -0.999 一路连续，跑完和静止是同一个
          画面。这不是缺陷，是这条原语的正确语义：掠光是**事件**不是**状态**，
          它不留痕迹；要说"线还在"用 .draw，要说"刚走通过"叠一层 .flow；
       ③ **必须叠在一条看得见的底线上面**：它自己静止时是隐形的，单独挂 .flow
          等于什么都没有。范本的消费者全部按"底线 .draw + 流光 .flow 分两个节点"
          摆（同 d、同坐标，一个画满线一个演掠动），谁也不许单独用 .flow；
       ④ **与 .draw 同节点 = 相互抵消**：两条规则都声明 stroke-dasharray，源序
          后者胜（实测 .draw .flow 叠在一起只剩 .16/1 的图案，线根本画不满）。
          要"先画出来再流光"，就按 ③ 分节点，用 --delay 排先后。
     animation-timing 用 linear：easeOutExpo 会把大半行程挤进路尾，光段在起点
     附近糊一下就走完了，读不出"一路走过去"。--flow-seg 改大只改光段长度，
     两个"看不见"的端点由 calc 关系自动跟着走，不用重算。
     ⑤ **pointer-events:none 是规矩不是可选项**：虚线的**空隙不透明但不可命中**
        （实测 hit 落在 dash 间隙返回的不是这条 path），于是"看不见的流光层"会
        在整条路上挡住底下的热区。流光只是装饰，装饰一律不吃命中。 */
  .flow{stroke-dasharray:var(--flow-seg) 1;stroke-dashoffset:var(--flow-seg);
        animation:ntFlow var(--dur-flow) linear backwards;animation-delay:var(--delay,0s);
        pointer-events:none}
  @keyframes ntFlow{from{stroke-dashoffset:var(--flow-seg)}to{stroke-dashoffset:-1}}
  /* 恒定线宽（0.18.0，相机层的注记不该跟着镜头变粗）：#cam 推到 1.8 时，
     1px 的世界分栏线在屏幕上变 1.8px、糊成一团；vector-effect:non-scaling-stroke
     把描边钉回**屏幕像素**宽度。实测（SVG transform 属性缩放下逐像素扫描）：
     普通描边 0.5/1/2/3× → 2/4/6/10 屏幕像素，nss 恒为 4——正是要的行为。
     两条必须知道的边界：
       ① **它不继承**：写在相机分组（#cam 那层）上等于没写（实测父层计算值
          non-scaling-stroke、子节点 none），必须逐图元挂 .crisp；
       ② **只给注记/参照线用，不给内容图元用**：卡片边框、结论色带这些"世界的
          东西"跟着镜头变粗是对的（那是真实摄影机的前后关系）；分栏线、刻度、
          辅助网格这些"画面上的注记"要的是恒定读数。用错对象，推近后内容会
          显出纸片感（描边不变 = 平面贴图）。 */
  .crisp{vector-effect:non-scaling-stroke}
  /* 自动错峰（0.18.0，前沿做法：sibling-index() / sibling-count()）：一组图元按序
     上浮，节奏不再靠作者数个数写 .st1/.st2/.st3，也不再靠 nth-child 的三份魔法数。
     档间距取 --stagger，但**总时长封顶在 --stag-cap**：组越大，实际间距由
     sibling-count() 现算摊薄——实测同一份 CSS 在 2 / 3 / 6 项的组里分别得到
     0s；0/.06/.12s；0/.036/.072/.108/.144/.18s，**最后一项永远不超过 .18s**
     （总量守恒）。作者往组里加图元不用回头改 CSS，也不用担心十项排到 0.6s。
     四条实测边界：
       ① **减号两侧必须有空格**：写成紧凑的 `sibling-count()-1` 时整条 calc()
          在计算值阶段作废，而动画**照样跑**（animationName 仍是 ntIn），只是
          --delay 落回 initial 0s——整组同时蹦出来，控制台一句话都不报。本轮最容易
          静默通过的一条，静态契约用例锁的就是这两处空格；
       ② **必须锁在分组那一层**：--delay 注册成 `<time>` + `inherits:false`
          （见文件上方那条 @property）。`.stag>*` 写在容器上、只命中直接子节点，
          孙子拿不到 → 落 0s。不注册的话它是个会继承的 token，在**每个后代**上
          各自重算 sibling-index()，而 `put()` 的常态就是嵌套建档（一个 g 里
          还有 rect 与 text），结果是同一组里的深层小图元也各自错开——那不是
          错峰入场，是满屏乱闪；
       ③ **--stag-cap 分母用 max(…, 1) 兜住单项组**：sibling-count() 为 1 时
          分母是 0，整条 calc() 作废（不会退化成 0s 而是非法值），单项组反而
          看不见；
       ④ 不支持这一族函数的浏览器（Firefox 正式版未开）：calc() 作废 → --delay
          落 initial 0s → 整组同时入场，**内容一格不少**。外面那层 @supports
          只是省掉注定作废的声明，不是正确性前提——正确性由 @property 的
          initial-value 负责（纪律③：绝不把内容锁进一个可能不跑的门里）。
     .stag 只声明 --delay，自己不动画；入场动作仍归 .in / 门禁卡片的 cardIn——
     错峰是**排程**、入场是**动作**，分开才各自关得掉（reduced-motion 只关动画，
     排程留着也没有可见效果，不必单独列进兜底清单）。 */
  @supports (animation-delay:calc(1ms * sibling-index())){
    .stag>*{--delay:calc(min(var(--stagger),
                             var(--stag-cap) / max(sibling-count() - 1, 1))
                          * (sibling-index() - 1))}
  }
  /* 标注留白（0.18.0，paint-order:stroke）：压在连线/图元上的短标注最容易被
     "线穿字"糊成一片。给它一圈**垫子色**的描边，并把描边画在字**下面**——读起来
     是"字自己浮起一块垫子"，不是"字被圈起来了"。三条实测口径：
       ① stroke-width 用 **em**：.22em 在 13px 档算出 2.86px（CDP 读 computed
          strokeWidth），`put()` 在小屏把字号统一放大时，留白跟着字号走，不用为
          两档字号各写一份数——字面 px 那版在大字号下明显不够宽；
       ② paint-order 不支持时会**反过来啃字**：描边落在字面上方，同样 .22em 的
          描边把笔画盖细一圈（实测 po:normal 那一行的字明显更瘦）。所以这条不能
          只靠声明——@supports 包住，不认 paint-order 的浏览器连描边都不写，
          退回"就是一行字"，仍是可读定格；
       ③ 垫子色取 --halo-bg（舞台局部底色），不取 --bg（页面底）、也不是 --panel：
          弧线标注落在 .stage 那圈渐变里，用错一档会在字周围留一圈看得见的深色边。
     stroke-linejoin:round 让笔画拐角不炸毛刺。它不是动效，不进 reduced-motion
     清单，与 0.17.0 排版留白层同一口径。 */
  @supports (paint-order:stroke){
    .halo{stroke:var(--halo-bg);stroke-width:.22em;stroke-linejoin:round;paint-order:stroke}
  }
  /* 翻面（0.20.0「当面与抵达」之一，前沿做法：CSS 3D transform 进 SVG）：
     判决换了个说法，不该只换个颜色就算完——在同一块地方把牌子**翻过去**，正面 `vs`、
     背面 `<`，观众亲眼看着它转身。五条边界，第三条是本轮最贵的一条：
       ① **SVG 里 `backface-visibility` 是死的**：HTML 卡片翻面的标准写法（两面各
          `backface-visibility:hidden`）在这里不成立——实测正面翻到 180° 之后
          `getScreenCTM().a` 已经变成 -1（矩阵翻了个面），像素层上那面镜像的字
          **照描不误**。所以交接只能自己管：按时间交接的 `visibility`（见 ③）；
       ② 3D 要在 transform **函数列表**里写全：`perspective(600px) rotateY(θ)` 才有
          透视（计算值落进 matrix3d，实测 θ=0 那一格 m11=1、z 分量 -0.0016667 就是
          perspective 留下的，行程中高度不变、只有宽随角度收），单写 `rotateY` 是
          平面镜像、没有远近。
          相机层里照旧合成（实测 `#cam` scale(1.8) 下 CTM.a 从 +1.8 连续走到 -1.8，
          中途 173.0° 那格不跳档、不裁切）——这一层可以住在镜头下面；
       ③ **交接必须落在侧立那一刻，所以缓动曲线必须两头对称**：两面用
          `transition:visibility 0s linear calc(var(--dur-flip) / 2)`——时长 0、
          只借 delay，把交接钉在行程的一半。而"半程 = 90°"只有对称曲线成立：
          实测 `--ease-in-out`(.65,0,.35,1) 逐 60ms 采样，t=300.5ms 采到 θ=90.0°，
          且同一样点上两面刚从 `visible/hidden` 换成 `hidden/visible`，交接正落在
          刀口上（全程没有一帧两面同显）。换成仓库默认的 `--ease-out`(.22,1,.36,1)
          再测一遍：θ 在 60.5ms 就已过 78.9°、约 65ms 侧立，交接却仍按半程等到 300ms
          ——**背面要在观众眼前倒着走 235ms**，那是穿帮不是翻页。所以这里破例不用
          --ease-out：翻面是这一族里第一枚要求"角度对时间居中"的原语（0.25.0 的 `.swap`
          换位弧凸是第二枚——垂直抛物线一去一回同样要求对称，见 §③）。模板里那枚 vs
          标签实测三个补间一起冻在 t=0/150/300/450/599ms：θ = 0 / 12.7 / 90.0 /
          167.3 / 180°，两面在场情况 v,h → v,h → h,v → h,v → h,v——交接就钉在
          侧立那一采上；
       ④ 挂**纯包装 `<g>`**，两面各是一个 `<text>`：`put()` 把包装拼成 `nt flip`，
          实测该节点计算值 `transition-property` 只剩 `transform` 一项（`.flip` 源序
          在 `.nt` 之后，简写整串顶掉它——与 `.tuck*` 边界 ⑤ 同一课），所以包装层
          除 `data-over` 一律不写别的状态，位移与透明度留给内层。两面拼成 `nt face` /
          `nt face faceB`，特异度 (0,2,0) 压过 `.nt` 的 (0,1,0)，实测
          `transition-property:visibility`、`transition-delay:.3s` 落得上；
       ⑤ 终态在呈现属性上（`data-over`）：导出截图页一刀切掉 transition 后，实测
          背面墨量与"同一行不翻面的字"逐像素相同（69 = 69），正面落 `visibility:hidden`；
          `elementFromPoint` 打在中心命中的是**在场那一面**，没有"看不见却点得着"的
          幽灵面——`visibility:hidden` 天然退出命中树（与 clip-path 裁命中同一族，
          但这里是白赚的：不必自己写 `pointer-events:none`）。
     与 .reveal / .tuck / .ride 同口径：CSS transform 不改 `getBBox()`（实测正面那一格
     翻页前后 bbox 同值 [461.3, 147.35, 37.41, 34.72]，一格不动），相机取景与 QA
     几何判定看不见这一层。 */
  .flip{transform-box:fill-box;transform-origin:50% 50%;
        transform:perspective(600px) rotateY(0deg);
        transition:transform var(--dur-flip) var(--ease-in-out)}
  .flip[data-over="1"]{transform:perspective(600px) rotateY(180deg)}
  /* 背面自带 rotateY(180deg)：父层翻到 180° 时两面合成整 360°，读起来是正的字
     而不是镜像（实测落定 CTM.a = -1 × -1，终态墨量与不翻面的参照逐像素相同）。 */
  .flip .face{visibility:visible;
        transition:visibility 0s linear calc(var(--dur-flip) / 2)}
  .flip .faceB{visibility:hidden;transform-box:fill-box;transform-origin:50% 50%;
        transform:rotateY(180deg);
        transition:visibility 0s linear calc(var(--dur-flip) / 2)}
  .flip[data-over="1"] .face{visibility:hidden}
  .flip[data-over="1"] .faceB{visibility:visible}
  /* 沿线抵达（0.20.0 之二，前沿做法：offset-path / motion path）：.flow 演的是
     "这条关系刚被走通"——一道光掠过去就没了；这一条演的是**有东西走到了终点并且
     留在那儿**。位移沿真实路径发生，不是从 A 淡入到 B。四条边界：
       ① 路线走 `--route`（`path()` 写在呈现属性 style 上）：路径是**数据**不是
          动效，`offset-path:var(--route)` 在计算值阶段做令牌替换（实测计算值
          `path("M 354 150 L 646 222")`）。**不注册 @property**——补间的是
          offset-distance（它自己就是可动画属性），--route 不需要被逐帧插值；
       ② 状态写在属性上：`data-go="1"` 才是 100%，0% 是元素自身值。于是三条退路
          落的都是"抵达之后的那一格"（实测切掉 transition 后 dist 落 100%、锚点停在
          路线终点那一格），冷启动同口径，纪律 1 不受影响；
       ③ `offset-rotate:auto` 让标记自己对准路线方向：实测那条 292×72 的斜线上
          CTM = [0.8243, 0.2033]（含场景 E 相机缩放 0.849），反解 13.86°，与
          atan2(72,292) 逐值相符——箭头/楔形不用 JS 再算一遍角度；
       ④ **用户坐标下的包围盒不变**（bbox 起步/中途/落定三采同值 [-6,-6,16,12]），
          屏幕盒跟着走（实测 r=6 那枚标记中心 x 336.5 → 462.7 → 588.5，
          t=0/400/799ms）——与 clip-path / mask 那两条同一课：**QA 与相机看的是
          包围盒，观众看的是屏幕盒**。标记走到哪儿都不会让取景框为它重算一遍，
          也不会把几何判定带偏；反面就是别拿它当热区、也别让它参与连线几何判定。
     行程逐帧连续且等距：实测 0 → 25 → 50 → 75 → 99.875%（t=0/200/400/600/799ms）。
     缓动写 **linear**：位移是匀速走一段路，套 easeOut 那条家族曲线会读作
     "起步猛冲、到站撞墙上"。落定后锚点与那条 `.draw` 连线右端点重合（±2px）。 */
  .ride{offset-path:var(--route);offset-rotate:auto;offset-distance:0%;
        transition:offset-distance var(--dur-ride) linear}
  .ride[data-go="1"]{offset-distance:100%}
  /* 行进余像（`.wake`，0.32.0，motion trail / afterimage）：`.ride` 说的是"人到
     了那一格"，这一条补的是**路上留下了速度**——同一枚标记的几枚余像各晚一格
     出发，行程中拖在头后，到站后依次叠回头下。它与 `.ride` 是**同一条路线上的
     两层**（`class:'ride wake'`），路线、时长、linear 都只有 `.ride` 那一处定义，
     这一层只加先后与遮挡。六条口径：
       ① **余像不是第二个标记**：只描圆环（`fill:none`）、不描箭头、不写字、
           `pointer-events:none`，透明度逐枚递减——读作"刚从这里经过"，不读作
           "还有一个人"；
       ② **终态仍在 `data-go` 上**：余像与头共用同一条 `--route`、同一个档位；到站
           100% 后全部叠在头下（两环 r 5.2 / 4.4、描边 1.4，外沿 5.9 / 5.1 < 头的
           6，一像素不露头）。导出那一刀（`transition:none!important`）与
           reduced-motion 归零落得都是"到站"这一格，画面不多一笔——与 `.ride`
           同一判断：关的是补间不是终态；
       ③ **先后只从 --trail-step 一处派生**（`calc(var(--trail-step) * var(--wake-i))`，
           与 `.trail` 同源，不新开时长档）：`--wake-i` 是排位（1、2），写在节点
           `style` 上；档距的尺度仍在 :root 一处；
       ④ **余像建在头之前**（DOM 顺序）：同一位置叠着时头压住尾——终态靠遮挡，
           不靠 opacity:0 收场，于是不需要"演完隐藏"的第二套状态；
       ⑤ **只给走得够长的路挂**：行程短于两段拖距（= 行程 × 2 × --trail-step /
           --dur-ride ≈ 17.5%）时，尾巴还没拉开就已到站，只会在原地糊出一圈毛边——
           消费者按路线长度决定挂不挂（与 `.swap` 的 --swap-min 同一判断：几何不够
           就别演）；
       ⑥ reduced-motion 关的是**这一层的先后**（媒体块里 `.wake` 归零 delay）：
           时长钳制（`transition-duration:.01ms!important`）管不到 delay，这一行
           让"关先后"写在本原语自己的清单里、不依赖消费者带不带 `.nt`——范本节点
           都带，实测删掉该行仍是 0s（`.nt{transition:none}` 顺带复了位），
           **别把别人的简写当依托**； */
  .wake{transition-delay:calc(var(--trail-step) * var(--wake-i, 1));
        pointer-events:none}
  /* 圆形绽开（0.20.0 之三，前沿做法：`clip-path: circle()` 关键帧）：.reveal 是直边
     扫描、.featherR 是软边掠出，这一条是**从中心推开一个圆**。用在"这个位置本来该有
     个东西、它空着"的场合（模板拿它开比较式里的空缺格 ∅）：圆从中心长出来读作
     "这块是腾出来的"，而直边扫描读作"往后推演"——那句话在这里是错的。三条边界：
       ① **半径百分比怎么归一**：`circle()` 的百分比按 `sqrt(w²+h²)/√2` 折算，而要盖住
          矩形四角半径得 ≥ 半对角线 `sqrt(w²+h²)/2`——两者一比，**覆盖整盒的下限恒等于
          √2/2 ≈ 70.7%，与长宽比无关**。所以终态取 75% 而不是 100%：实测那张 42×52 的
          空缺格上 50% 咬掉上下边（墨量 142 对 286）、75% 与完全不裁逐像素相同
          （286 = 286）、100% 纯属白给；
       ② 静止态 = 全开（`clip-path:circle(75% at 50% 50%)` 写在元素自己身上），
          关键帧两头都是 `circle()`（同型才可插值——0.15.0 那条 `inset()` ↔ `none`
          的 discrete 教训，实测重放后 0 → 34.97 → 62.41 → 73.78 → 75%
          （t=0/60/150/300/499ms）一路连续，没有硬跳）；不写 forwards，跑完落回
          元素自身值，导出切掉 animation 后同样是全显那一格（实测取消动画后计算值
          仍是 `circle(75% at 50% 50%)`）；
       ③ 挂**纯包装 `<g>`**，且这条是本轮三件套里**唯一不抢 `.nt` 简写的**：
          `put()` 拼成 `nt bloom`，实测该节点 `transition-property` 仍然完整留着
          .nt 那九项（.bloom 只声明 animation）——内层图元照旧享受属性补间。
          clip-path 会裁命中（0.15.0 那条）：实测绽开头 60ms 那一格点不着
          （elementFromPoint 落到身后的 rect），150ms 圆推到 62% 才命中 `b-x00-r`——
          它本来不是热区所以无害，但**要 Learner 点的图元不要开 .bloom**。 */
  @keyframes bloomIn{from{clip-path:circle(0% at 50% 50%)}
                     to{clip-path:circle(75% at 50% 50%)}}
  .bloom{clip-path:circle(75% at 50% 50%);
         animation:bloomIn var(--dur-bloom) var(--ease-out) backwards}
  /* 倾侧定盘（0.21.0 之一，前沿做法：独立 rotate 属性 + 空间弹簧）：一台只有
     **三档**的符号盘——横梁绕支点倾侧，左倾 = 负、持平 = 零、右倾 = 正。它说的
     是"返回值只看符号"这件事本身：倾角不是连续量，`a−b` 是 −1 还是 −99 都落在
     同一格上。五条边界：
       ① **终态在呈现属性上**（`data-pan="-1|0|1"`），与 .ride 的 `data-go` 同族：
           静止态写 `rotate:0deg`、两档写在 `[data-pan]` 分支上，导出与
           reduced-motion 各切一刀落的都是"这一拍该倾哪边"，不是"没收到的起点"
           （实测注入 `transition:none!important` 后三档依次读回 −6.5deg / 0deg /
           6.5deg；reduced-motion 下 `transition-property` 为 `none`、计算值同样是
           该档终值、`getAnimations()` 为空）；
       ② 补间的是**独立 `rotate` 属性**，不写进 `transform`：0.13.0 那条教训
           （同节点写 transform 属性 + 独立变换属性会互相缩放）在这里反过来用——
           横梁自己的位置由子图元的绝对坐标定，旋转这一笔不能去碰 transform，
           否则子坐标一起被卷进函数列表里（实测计算值 `transform` 全程 `none`，
           倾侧只在 `rotate` 上，`transition-property` 也只有 `rotate` 一项）；
       ③ 支点靠 `transform-box:fill-box` + `transform-origin:50% 50%`：fill-box 的
           参照盒是**自己的包围盒**，view-box 才是缺省。两种偷懒都实测过（1280×900
           窗口、屏幕像素）：只把 `transform-box` 退回 `view-box`（origin 仍是 50%）
           → 支点跑到 viewBox 中心 (500,230)，比梁那根线高 56 单位，倾 6.5° 时整根
           梁**平飘 6.7px**（左托盘 368.9 → 375.6）；再省掉 origin（`0 0`）→ 绕
           viewBox 左上角转，左托盘从 (368.9,460.7) 跑到 (399.6,399.1)，屏上位移
           69px——那不是倾侧，是整台仪器平移出画。这条决定了包装层的纪律：**盒中心
           必须正好是支点**——梁与两枚托盘都画在同一水平线上（y=286），包围盒的竖直
           中心才落在那根梁上；往这个 g 里多塞一个"挂在下面的支点三角"，实测包围盒
           从 [406,280,188,12] 胀成 [406,280,188,24]、中心从 y=286 掉到 y=292，支点
           跟着掉下去，倾侧时梁再平移 0.7px（所以支画在包装层**外面**，静止不动）；
       ④ `.tilt` 与 `.nt` 同节点：两条 `transition` 简写互相顶掉（后者源序在胜，
           实测该节点 `transition-property` 只剩 `rotate`）——这是**已知的、且正是
           想要的**：这一层只该有角度在动，位移归外层、描边色归内层（同 0.19.0
           `.tuck` 那条）；
       ⑤ `rotate` 不改 `getBBox()`：实测三档下包装层包围盒**同为 [406,280,188,12]**，
           所以相机取景与 §5 的连线几何判定看不见这层转动。命中却是跟着变换走的
           （playing 态下 `elementFromPoint` 打在倾侧后的左托盘上仍命中 `c-pan-l`，
           这一层 `pointer-events` 是 `auto`）——视觉与热区一致、与几何判定不一致，
           这正是 0.15.0 那条"看不见的东西不能当热区"的反面版本：**要判定的东西别
           挂 `.tilt`，要动的东西别拿它当坐标**。 */
  .tilt{transform-box:fill-box;transform-origin:50% 50%;rotate:0deg;
        transition:rotate var(--dur-tilt) var(--ease-spring)}
  .tilt[data-pan="-1"]{rotate:calc(var(--tilt-deg) * -1)}
  .tilt[data-pan="1"]{rotate:var(--tilt-deg)}
  /* 字距归位（0.21.0 之三，前沿做法：kinetic typography 的收束一拍）：一句副题
     从**散着的字距**收成正常排布，读作"这句话成型了"——标题动画里最常见的收尾
     动作，放在这里替"换节"多带一层"新的副题进场"。四条边界：
       ① 走 **animation 而不是 transition**：tagline 是常驻节点、每节换文本，但
           "散→收"不是两个状态之间的行程（换文本那一拍没有可读的上一档字距），
           而是一次入场；换节那一拍由 JS 摘类 → 读一次盒子 → 挂类重放（同 0.20.0
           `.flip` 的 retrigger 口径），同节内换句**不重放**（实测同节第二次换文本后
           `getAnimations()` 为空、字距仍是落定值）。
       ② 两头**显式同型**（都是 `<length>`）：这里不偷懒只写 `from`。只写 `from` 时
           隐式 `to` 取元素自己的 `letter-spacing`，默认那是 `normal`——规范上
           `normal` 不是长度，异型端点该按 discrete（0.15.0 那条 `inset()` ↔ `none`
           的教训）。实测 Chrome 并不按 discrete 办：基础值留 `normal` 与写 `0` 两组
           逐帧同值（3.9 → 3.23 → 2.62 → … → 2.95e-7px 一路连续），也就是它把
           `normal` 当 0 来插。**这条不写进设计**——赌的是别家引擎不认的宽容，
           把 `to{letter-spacing:0}` 写出来就把它变成引擎无关的同型对，作者的排版
           规则也不必替动效让路（见 §② 排版层那条注释）。落定后 fill-mode 只有
           `backwards`，计算值回到元素自己的 `normal`：实测 `0` 与 `normal` 在 13px
           中文那档排宽逐值相同（117px），静止态与终态同形。
       ③ 它改的是**排宽**，会带动换行，所以这一档要按"最坏那句"选：桌面 13px 下
