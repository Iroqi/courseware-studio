          浏览器不认的关键词是**整条作废**，会把 height 补间一起带走。分开写的
          最坏情况只是 display 立刻切换（收起不演、展开照演），降级仍有得看；
       ④ 关闭态的高度写在基础规则上（`height:0`），`@starting-style` 给展开一个
          起点——没有它，从 none 切 block 的那一帧没有"上一状态"，动画不跑。 */
  .note-body{display:none;height:0;overflow:hidden;
             transition:height var(--dur-acc) var(--ease-out),
                        display var(--dur-acc) var(--ease-out)}
  .note-body{transition-behavior:allow-discrete}
  .note[data-open="1"] .note-body{display:block;height:auto}
  @starting-style{.note[data-open="1"] .note-body{height:0}}
  /* noteIn 那档淡入照旧留着：它是**内容层面**的提示（这一条刚刚展开），
     与面板高度的连续运动是两件事，reduced-motion 下各自关掉。 */
  .note[data-open="1"] .note-body{animation:noteIn .22s ease both}
  @keyframes noteIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  /* 悬挂缩进：正文左边界对齐**标题文字**，不是 emoji 的左边界——标题与正文因此共用
     一条文字栏。注意 emoji 在 15px 字号下实测占 20.6px 宽（emoji 字形比字号宽），
     所以给 .n-ico 钉了 21px 槽宽，缩进 = note-h 左内边距 4 + 槽宽 21 + gap 9 = 34px。
     按字号 15px 算缩进会左偏 ~6px，标题和正文就成了两条错开的栏。 */
  .n-inner{padding:0 4px 11px 34px}
  /* 三类信息**等级不同**：小结就是正文，扩展/注意才是附注。曾三行各配一个药丸标签——
     2 个字的标签在窄栏里挤占字宽，蓝橙红底色又不对读者表意；现在只给后两种留标签，
     且降级成不带底色的暗色小字，小结直接以正文字重承接。 */
  .n-row{display:flex;gap:9px;padding:5px 0;font-size:13px;line-height:1.6;color:var(--dim)}
  .n-row.s{color:#aab2c4}
  .n-tag{flex:none;font-size:11px;font-weight:600;padding-top:1px;opacity:.85}
  .n-tag.x{color:#c9924a}
  .n-tag.c{color:#d4756f}
  .n-txt{color:var(--dim)}
  /* 结论式短代码行：编程课里一行代码顶三行文字。340px 窄栏下可用宽 269px，
     半角 ≤39 字符 / 全角 ≤21 字符不折行（实测值，layout.md §6）——放"一眼看懂的
     结论"，不是完整示例。// 开头的行自动降为暗色注释。 */
  .n-code{margin:6px 0 2px;padding:8px 10px;border-radius:8px;background:#10141c;
          border:1px solid #232936;white-space:pre-wrap;word-break:break-all;
          font:12.5px/1.7 ui-monospace,Consolas,"Courier New",monospace;color:#c9d1e0}
  .n-code .cm{color:#7c8698}
  /* kv 对照行：多条并列的「记法 → 结论」速记，code 的姊妹形态——一条结论用 code，
     两三条并列结论用 kv（如 负/零/正 三契约）。左列等宽记法、右列结论，
     grid 自动排行，不套框；✓/✗ 字形自带语义，不再给判决配色。 */
  .n-kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:6px 0 2px;
        font-size:12.5px;line-height:1.6}
  .kv-k{font-family:ui-monospace,Consolas,"Courier New",monospace;color:#c9d1e0;white-space:pre}
  .kv-v{color:var(--dim)}
  /* 数字落定（0.37.0）：计数读数挂 .roll——tabular-nums 让数字**等宽**，滚动时
     字宽不跳（"12" 与 "3" 占同一个字身），读数元素的位置与 bbox 稳定，不会边滚
     边挤旁边的字。只给画布里的计数读数用；字幕带、等宽 code 不挂（没有滚动，
     挂了也无害，但少一个多余的类）。 */
  .roll{font-variant-numeric:tabular-nums}
  /* 量条（0.42.0）：几何量读数。scale 以条自己的左缘为轴（transform-box:fill-box +
     transform-origin:left center）；`transition:none!important` 是**刻意的**——量条由
     meterWrite 逐拍写 transform 属性（audio 时钟现算中间长度，与数字落定同族、同一
     只时钟），.nt 的 width / transform 补间会与滚动的 scale 双重叠加。要淡入 /
     位移就包一层 <g>（.in 挂包装层），量条自己身上不挂别的 transition。 */
  .meter{transform-box:fill-box;transform-origin:left center;transition:none!important}
  /* 跳转锚：侧栏与时间轴唯一的挂钩。只写 audio.currentTime——与点进度条同一
     seek 语义（timeupdate 兜底重画），不改播放/暂停态、不产证据。 */
  .n-jump{display:inline-flex;align-items:center;gap:5px;margin-top:8px;padding:3px 9px;
          border:1px solid #2b3242;border-radius:999px;font-size:11.5px;color:#8ea1c8;
          background:none;cursor:pointer;transition:border-color var(--dur-hover),color var(--dur-hover)}
  .n-jump:hover{border-color:#4a5670;color:#c9d1e0}

  @media (max-width:1020px){
    .shell{grid-template-columns:minmax(0,1fr)}
    .col-side{position:static;max-height:none;overflow:visible}
  }
  /* 窄屏（手机）：播放器行是 nowrap flex，按钮 + 读数 + 进度条最小宽加起来就顶到
     390px 了——收 gap / 内边距 / 字号，进度条让到 40px；读数兜底可省略号收缩，
     宁可截尾也不许把全屏按钮挤出屏幕。键盘提示对触屏无意义，直接收起。 */
  @media (max-width:560px){
    .rack{gap:7px;padding:8px 10px}
    .rack .bar{min-width:40px}
    .rack .step{font-size:11px}
    .vp-kbd{display:none}
    /* 播放器行改悬浮收起式：默认藏进画布下缘，点画布唤出，3s 无操作收回
       （显隐与计时由 JS 写 data-show，见 §⑦ 尾部）。从流里抽出来才真的"腾出空间"。 */
    .col-stage{position:relative}
    .rack{position:absolute;left:10px;right:10px;bottom:10px;z-index:7;
          border-radius:14px;border-top:1px solid var(--line);
          background:rgba(16,19,25,.94);opacity:0;transform:translateY(12px);
          pointer-events:none;transition:opacity var(--dur-rack) ease,transform var(--dur-rack) ease}
    .rack[data-show="1"]{opacity:1;transform:none;pointer-events:auto}
    /* 门禁开着时唤出播放器行没有意义。隐形必须同时断点击——data-show 的
       pointer-events:auto 与这条同权重在后，不写 none 会留下"看不见的 ▶/⟲"
       压在画布下缘吃掉点击。 */
    .rack[data-gated="1"]{opacity:0;pointer-events:none}
  }
  /* 矮屏（手机横屏）宽有 800+，够不着宽度断点，但画布受高度限制等比缩小后
     小字照样糊——触摸/门禁这类"页面外壳"规则按 宽 ≤560 或 高 ≤560 生效。
     rack 收紧与悬浮只归宽度块（横屏不全屏时播放器行常驻）。 */
  @media (max-width:560px), (max-height:560px){
    /* 触摸目标：26–28px 的圆按钮在手机上偏小（触控规范约 44px）。用透明伪元素
       外扩热区，视觉分毫不动。横向只扩 4px：窄屏 rack 的 gap 收到 7px，
       4+4−7=1px 与相邻热区轻微交叠，按下 DOM 靠后者，影响可忽略；
       上下没有邻居，放心扩 8px。 */
    .rack .pp,.rack .rew,.rack .spd,.rack .fs{position:relative}
    .rack .pp::before,.rack .rew::before,.rack .spd::before,.rack .fs::before{content:"";position:absolute;inset:-8px -4px}
    /* 低端机 GPU 上 backdrop-filter 很贵，而压暗层本就 .92 不透明、blur 几乎看不出来 */
    .gate{backdrop-filter:none;-webkit-backdrop-filter:none}
    /* 小字提级：门禁引导语、标签这类 ≤11.5px 的字在手机上是糊的，统一 +1px */
    .gate .kick{font-size:12.5px}
    .n-tag{font-size:11.5px}
    .n-jump{font-size:12.5px}
    .chapter .tagline{font-size:14px}
    /* 字距归位在窄屏 / 矮屏这一档**关掉**（0.21.0 `.gather` 边界 ④）：关它是按
       **余量**决策，不是"实测会断"——500px 档字号从 13 提到 14、栏宽掉到 449px，
       范本最长那句实测散开档 315 → 411.6px 仍是一行，但只剩 37px 余量；作者文案
       比范本长一点就断行，而"断在哪一秒"跟着帧变，那是抖不是收拢。关掉动画落的是
       静止态（元素自己的 `letter-spacing`），信息一格不少。
       特异度与基础规则 `.gather` 同为 (0,1,0)，源序在后 → 这一条胜（实测关后
       `animationName` 为 `none`、`gather` 类名还挂着）。 */
    .gather{animation:none}
  }
  /* 画布静态文字（场景头 / 字幕）按字号分档提级，与 JS 里 tfs() 的档位同比例
     （≤14 ×2、≤19 ×1.7）；常驻图元由 put() 在写属性时放大。1000 宽的 viewBox 压到手机上
     14px 只剩视觉 5–10px，不救就是看不清的课。
     例外：字幕 17→26 只提 ×1.53——整行长文，按 1.7 档放到 29px 就会换行压图。
     这里只读 html[data-compact]；开关的唯一判定与理由见 JS 的 setCompact()。 */
  html[data-compact="1"] #cap-text{font-size:26px}
  html[data-compact="1"] #cap-speaker{font-size:24px}
  html[data-compact="1"] .stage svg text[font-size="14"]{font-size:28px}
  html[data-compact="1"] .stage svg text[font-size="17"]{font-size:29px}
  html[data-compact="1"] .stage svg text[font-size="27"]{font-size:35px}
  /* 竖屏手机：画布按宽铺开后很矮，画布内文字跟着缩——给一条软提示，不强制横屏。 */
  .rotate-hint{display:none}
  @media (orientation:portrait) and (max-width:560px){
    .rotate-hint{display:block;margin-top:8px;text-align:center;font-size:12px;color:var(--dim2)}
    /* 窄屏下播放器行浮在 col-stage 下缘，正好压在提示上——唤出时让位 */
    .rack[data-show="1"] + .rotate-hint{display:none}
  }

  /* ④b 全屏模式：对整条画布列（舞台 + 播放器行）请求全屏，章节头与侧栏退场。
     门禁浮在舞台内部，照常可用；SVG 靠 preserveAspectRatio=meet 等比居中，
     舞台被拉多高都不会变形。iOS Safari 不支持 Element.requestFullscreen，
     JS 检测后直接收起按钮。 */
  .col-stage:fullscreen{position:relative;display:flex;flex-direction:column;padding:18px 22px;background:var(--bg)}
  .col-stage:fullscreen .chapter{display:none}
  .col-stage:fullscreen .stage{flex:1;min-height:0}
  /* 只撑主画布（.stage 的直接子 svg）；不带后代选择器，否则 preGate 的
     34px 圆环 svg 会被同一条 width/height:100% 拉满整屏。 */
  .col-stage:fullscreen .stage > svg{width:100%;height:100%;aspect-ratio:auto}
  /* 全屏下播放器行走和窄屏一样的悬浮收起式（声明与 ≤560 媒体块成对，改一处两处都要改）：
     常驻会白占一行，全屏的意义就是让画布尽量大；点画布唤出、再点收回。 */
  .col-stage:fullscreen .rack{position:absolute;left:10px;right:10px;bottom:10px;z-index:7;
    border-radius:14px;border-top:1px solid var(--line);background:rgba(16,19,25,.94);
    opacity:0;transform:translateY(12px);pointer-events:none;
    transition:opacity var(--dur-rack) ease,transform var(--dur-rack) ease}
  .col-stage:fullscreen .rack[data-show="1"]{opacity:1;transform:none;pointer-events:auto}
  .col-stage:fullscreen .rack[data-gated="1"]{opacity:0;pointer-events:none}

  /* 晕动 / 减动效偏好：呼吸、入场、环都收掉。动画只负责"好看"，不承担状态；
     JS 等的是 animationend / 自己的计时器，时长趋 0 时两者照常触发。 */
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
                         transition-duration:.01ms!important}
  }
</style>
</head>
<body>
<div id="root">
  <div class="shell">
    <main class="col-stage">

      <!-- ① 章节头：回答"这一节讲什么"。**画布上方只留这一行**——
           "进行到哪一节、整门课多长"由画布下面的进度条承担（章节刻度 + 悬停显名）。 -->
      <div class="chapter" id="chapter">
        <span class="tag" id="ch-tag">准备</span>
        <h1 id="ch-title">JavaScript 的 sort() 到底怎么排序</h1>
        <p class="tagline" id="ch-tagline"></p>
      </div>

      <!-- ② 舞台 = 画布 + 播放层 + 门禁，后两者浮在它内部；字幕长在画布里。
           播放器行紧贴在它下面（见 ④），两层共边成一块。 -->
      <div class="stage" id="stage" data-state="idle">
        <svg viewBox="0 0 1000 460" preserveAspectRatio="xMidYMid meet"
             role="img" aria-label="排序过程可视化">
          <!-- 相机层：整块世界（常驻图元 + 各幕内容）都在它里面，唯一的写手是
               camSet()（见 JS §②）。**字幕带 #cap 与门禁小图在相机之外**——镜头
               怎么推拉，字幕的位置与字号都不动（layout.md §4）。 -->
          <!-- 取景框：相机推近后，**窗外的东西照样画得出来**（可见区是整个 viewBox，
               不是声明的窗），于是被镜头留在身后的内容会一路画到字幕带上，字压字。
               这里给相机套一个固定的取景框：396 以下（分隔线 404 + 字幕 438）是字幕带
               的地盘，镜头怎么推都不许越过去——窗外的内容被**裁掉**，就像真实取景器里
               出画的东西。裁剪挂在包装层上而不是 #cam 上：#cam 自己带 transform，
               clip-path 会跟着它一起被变换，框就漂了。 -->
          <defs>
            <clipPath id="frameClip"><rect x="0" y="0" width="1000" height="396"/></clipPath>
            <!-- 远景纹理：40 单位的点阵。#depth 在镜头与内容**之间**，视差位移由
                 camSet() 按镜头位移的一小部分写进去（--par-far 是系数，不是速度——
                 系数越小读起来越远）。点阵比内容淡两档、不承载信息，也不进
                 contentBox()（那里只认 STAGES 与 #world），所以不会把兜底取景拽偏。 -->
            <pattern id="farDots" width="40" height="40" patternUnits="userSpaceOnUse">
              <circle cx="20" cy="20" r="1.1" fill="#2b323f"/>
            </pattern>
          </defs>
          <g clip-path="url(#frameClip)">
          <!-- 视差远景层：与 #cam 同级、同一个世界坐标系。矩形四周各多出 900：
               镜头平移量 = (500 − k·窗心)，窗心偏一侧且倍率钳到 1.8 时可达上千
               单位，远景按系数跟走也有几百——留边不足会在画面边缘露出"点阵到头
               了"的接缝。宁可多铺（反正被取景框裁着），不留这种缝。
               第二层 .wash 是色温定调（0.24.0）的画布柔光：与点阵同宽同裁，
               浓度只由 --tint-wash 一处定（见 §③）。 -->
          <g id="depth"><rect x="-900" y="-900" width="2800" height="2260"
               fill="url(#farDots)" opacity=".5"/><rect class="wash"
               x="-900" y="-900" width="2800" height="2260"/></g>
          <g id="cam">
            <!-- 箭头只有一枚：弧线 / 连线指方向用。颜色固定，不随描边变——
                 marker 里的 fill 继承不到被标注的图元，模板就不假装能。 -->
            <defs>
              <marker id="ah" viewBox="0 0 9 9" refX="7.5" refY="4.5"
                      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M0 0 L9 4.5 L0 9 z" fill="#8d95a8"/>
              </marker>
              <!-- 对照窗接缝的扫描光（0.40.0）：中间浓、两边透明的 40 单位窄带。
                   颜色走 --cmp-wash（已经是 rgba：中心 stop-opacity 只做形状，
                   不改色）；CSS 变量在 stop 的 style 里求值，改令牌就整条跟着改。 -->
              <linearGradient id="cmpWash" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" style="stop-color:var(--cmp-wash);stop-opacity:0"/>
                <stop offset=".5" style="stop-color:var(--cmp-wash);stop-opacity:1"/>
                <stop offset="1" style="stop-color:var(--cmp-wash);stop-opacity:0"/>
              </linearGradient>
            </defs>
            <!-- 世界分栏线（0.18.0 挂 .crisp）：它是"画面上的注记"而不是世界里的
                 东西——镜头推到 1.8 时，1px 的世界坐标描边在屏幕上变 1.8px 并糊一档，
                 读起来像"线变粗了"而不是"我凑近了"。vector-effect 把描边钉回屏幕
                 像素（实测 0.5/1/2/3× 下普通描边 2/4/6/10px、nss 恒 4px）。
                 **必须逐图元挂**：它不继承，写在 #cam 上等于没写。 -->
            <line class="crisp" x1="0" y1="230" x2="1000" y2="230" stroke="#1b2029" stroke-width="1" opacity=".35"/>

            <!-- 世界层：跨幕常驻的主角数组，不随场景重建（WORLD/POSE 两张表说话） -->
            <g id="world"></g>

            <!-- 舞台 A：三个数字块（seg-1）。标题行写成代码而不是句子——
                 与旁白说的话形不相似，不构成双字幕（判据见 stage.md §2 纪律 3） -->
            <g id="stA" class="el">
              <text x="500" y="52" text-anchor="middle" fill="#8d95a8" font-size="14">🔤 [10, 9, 1].sort() → [1, 10, 9]</text>
              <g id="a-body"></g>
            </g>

            <!-- 舞台 B：字符串逐位比较（seg-2） -->
            <g id="stB" class="el">
              <text x="500" y="52" text-anchor="middle" fill="#8d95a8" font-size="14">🔎 第一位不同就决定大小；都没不同则短的更小</text>
              <g id="b-body"></g>
            </g>

            <!-- 舞台 C：比较函数契约（seg-4） -->
            <g id="stC" class="el">
              <text x="500" y="48" text-anchor="middle" fill="#8d95a8" font-size="14">⚖️ 比较函数的返回值：只看符号，不看数值</text>
              <g id="c-body"></g>
            </g>

            <!-- 舞台 D：布尔值陷阱（seg-5）。结果那三个块归世界层，不在这里画 -->
            <g id="stD" class="el">
              <text x="500" y="46" text-anchor="middle" fill="#8d95a8" font-size="14">🔢 比较函数返回布尔值时会发生什么</text>
              <g id="d-body"></g>
            </g>

            <!-- 舞台 E：稳定性（seg-6） -->
            <g id="stE" class="el">
              <text x="500" y="48" text-anchor="middle" fill="#8d95a8" font-size="14">⚓ 稳定：相等的元素不互换，原来的先后带进结果</text>
              <g id="e-body"></g>
            </g>

            <!-- 舞台 F：开场 / 结尾提问 -->
            <g id="stF" class="el">
              <text id="f-q" x="500" y="196" text-anchor="middle" fill="#e9ecf3"
                    font-size="27" font-weight="700"></text>
            </g>

            <!-- 舞台 G：巧合（seg-3） -->
            <g id="stG" class="el">
              <text x="500" y="46" text-anchor="middle" fill="#8d95a8" font-size="14">🎲 字符串序 vs 数值序：什么时候一致，什么时候不一致</text>
              <g id="g-body"></g>
            </g>

            <!-- 区间窗层（0.49.0）：取景带 / 两道切口 / 序号读数不进任何一幕的子树
                 ——它量的是"这一步取的是哪几件"，而那几件可能住在世界层（跨幕常驻）。
                 放在所有幕之上、其余注记**之下**：带子的底色是"荧光笔划在整排上"，
                 它得压住卡片（衬在卡片底下会被卡片自己的 fill 盖掉，只剩两道切口
                 看得见），却又不该压住引线 / 词拍 / 圈数 / 时序带这些真正的注记。
                 几何一律映到 #cam 的孩子空间（与 #lanes / #loops 同一条口径），
                 镜头推拉时跟着内容一起缩放。每步由 layoutRanges() 按 key 建与摘、
                 rangeTock() 逐拍写几何；指针一律穿透（CSS .rg）。 -->
            <g id="ranges"></g>

            <!-- 界线层（0.50.0）：界线 / 端头 / 界外区带 / 读数。它量的是"这一步在
                 比哪一条界"，参照物（容器）住在世界层或某一幕里，所以不进任何一幕的
                 子树。放在区间窗之上、引线标注之下：界线是压在内容上的标尺（要能压住
                 柱子与卡片才读得出"到这儿了"），读数签又要压在区带之上；而它不该压住
                 引线 / 词拍这些真正的注记。几何一律映到 #cam 的孩子空间，镜头推拉时
                 跟着内容一起缩放。每步由 layoutLimits() 按 key 建与摘、limitTock()
                 逐拍现量那颗量的边并按比较切档；指针一律穿透（CSS .lim）。 -->
            <g id="limits"></g>

            <!-- 引线标注层（0.38.0）：注记不进任何一幕的子树——它量的是"这一步对象
                 最终在哪"，而对象可能住在世界层（跨幕常驻）。单开一层放在所有幕之上、
                 聚光暗幕之下：压住卡片与连线，又不挡灯。每步由 drawCallouts() 重排，
                 sweep() 按 key 收人；指针一律穿透（CSS .callout）。 -->
            <g id="callouts"></g>
            <g id="connects"></g>

            <!-- 岔路层（0.51.0）：岔口点 / 支 / 箭头 / 短签 / 读数不进任何一幕的子树
                 ——它数的是"这一步从这一处出发有几条去路、走了哪条"，而出发对象与
                 去向可能住在世界层（跨幕常驻）。放在关系连线之上、细节镜之下：扇面
                 要能压住单条连线（同一步两者并存时读得出的应是"这一张清单"），又不
                 该挡住镜圈与词拍这些真正的注意力装置。几何一律映到 #cam 的孩子空间
                 （与 #limits / #ranges 同一条口径），镜头推拉时扇面跟着内容一起缩放、
                 不脱开对象。每步由 layoutForks() 按 key 建与摘、forkTock() 逐拍现量
                 现写并按 `at` 切选中档；指针一律穿透（CSS .fork）。 -->
            <g id="forks"></g>

            <!-- 细节镜层（0.44.0）：镜圈 / 茎 / 放大副本不进任何一幕的子树——它量的
                 是"这一步要看清的那一小块"，而目标可能住在世界层（跨幕常驻）。
                 放在连线之上、词拍之下：压住内容，不挡灯；每步由 layoutLoupes()
                 重排、按 key 收人；指针一律穿透（CSS .loupe）。 -->
            <g id="loupes"></g>

            <!-- 词拍层（0.39.0）：四角括号不进任何一幕的子树——它标的是"旁白此刻
                 念到的那件东西"，而目标可能住在世界层（跨幕常驻）、可能就是门禁热区。
                 放在所有注记之上、聚光暗幕之下：压住内容，不挡灯；每步由 drawCues()
                 整层重建（标记随步清零），指针一律穿透（CSS #cues）。 -->
            <g id="cues"></g>

            <!-- 对照窗层（0.40.0）：取景框 / 接缝 / 标签不进任何一幕的子树——它量的是
                 A/B 两版**最终**重合的那扇窗，而两版可能住在世界层；结束对照时
                 标签还要能独立退场。放在词拍之上、聚光暗幕之下：压住内容，不挡灯。
                 每步由 drawCompares() 按 CMP 重画，sweep() 收掉上一步的窗；
                 指针一律穿透（CSS .cmp-frame）。 -->
            <g id="cmp"></g>

            <!-- 圈数层（0.47.0）：游标（开口环 + k/n 读数）与落点痕不进任何一幕的子树
                 ——它们说的是"这件东西绕到第几回、每一回落在哪儿"，而对象可能住在
                 世界层（跨幕常驻）。坐标一律映到 #cam 的孩子空间（世界坐标），所以
                 镜头推拉时游标与痕跟着一起缩放、不脱开对象；描边挂 .crisp 钉回屏幕
                 像素。放在对照窗之上、聚光暗幕之下：压住内容，不挡灯。每步由
                 layoutLoops() 按 key 建与摘，指针一律穿透（CSS .lp-cur）。 -->
            <g id="loops"></g>

            <!-- 时序带层（0.48.0）：几条泳道与那根"现在"针不进任何一幕的子树——它量的
                 是"这几件东西**各自**走到哪儿了"，而对象可能住在世界层（跨幕常驻）。
                 几何一律映到 #cam 的孩子空间（与 #loops 同一条口径），带宽取各 item
                 的水平并集、上下沿留 --lane-pad 净空，摆不下整带就翻到对象上方。
                 每步由 layoutLanes() 按 key 建与摘、lanesTock() 逐拍写宽与针位；
                 指针一律穿透（CSS .ln）。 -->
            <g id="lanes"></g>

            <!-- 移动聚光（0.22.0）：一块盖住**整个取景框**的暗幕，被一枚会走位的洞裁开。
                 它是 #cam 的最后一个孩子——盖在所有幕上面、但不进字幕带（#cap 在相机
                 之外，见下面的注释；整层又被 #frameClip 裁着）。坐标空间与常驻图元
                 一致，所以洞心直接用 camBox() 量出来的 viewBox 单位写。
                 **不要把它裁回 0,0→1000,460**：暗幕在相机里、按世界坐标铺，镜头一拉
                 开（倍率钳位下限 .85）可见区在世界坐标就超出 viewBox，幕沿落在画面里
                 = 一条不暗的边。−600/2200/1660 与 CSS 里的 --spot-bleed 是同一件事的
                 两半，三处（这里的三个数、:root 的令牌、mask 的 calc）必须一起改。 -->
            <rect id="spot" x="-600" y="-600" width="2200" height="1660" aria-hidden="true"></rect>
          </g>
          <!-- 快进掠擦（0.22.0）：时间被搬动过的确认拍。**在 #cam 之外**——它说的
               不是"画面里哪个东西在动"，而是"播放头跳了"，所以不该跟着镜头缩放；
               仍在取景框里，掠到画外的部分被裁掉（--ff-travel 故意让两端出画）。 -->
          <g id="ffwd" data-dir="f" aria-hidden="true">
            <g transform="translate(500,198)">
              <polyline points="-38,-17 -20,0 -38,17"/>
              <polyline points="-10,-17 8,0 -10,17"/>
              <polyline points="18,-17 36,0 18,17"/>
            </g>
          </g>
          </g>

          <!-- ── 字幕带：**画布内的唯一字幕** ──
               为什么在画布里而不在画布下面：每个场景本来就要在底部写一句
               "这一句讲的是什么"，以前分散在各场景自己的 `<text>` 里，位置在
               y=386~436 之间飘、字号 14~18 不等 —— 切换场景时字幕会跳。
               现在收成一条**位置 / 字号固定**的带（分隔线 404、文字 438），
               文案**逐句取时间轴里这一句的口播原文**（见 JS 的 §③ 字幕带），念什么就显什么。
               宽度撑满、居中，像视频硬字幕 —— 它是画面的一部分，不是页面元素。 -->
          <g id="cap" class="el">
            <line x1="40" y1="404" x2="960" y2="404" stroke="#232a38" stroke-width="1"/>
            <!-- 结论句色带：写在 #cap-text **之前**，字压在线上面。几何由 capShow()
                 按当句 getBBox() 现量（见 CSS「结论句划重点」）。它在 #cam 外、
                 与字幕同层，所以镜头推拉不影响它；不是 QA 的比对节点——
                 检查器读的是 #cap-text 的 textContent 与祖先链可见性。 -->
            <rect id="cap-hl" x="500" y="424" width="0" height="17" rx="2"/>
            <!-- 句内进度细线（0.16.0）：写在 #cap-hl **之后**、#cap-text 之前——
                 细线压在色带上面、字压在线上面，三层各司其职。几何同样从当句 bbox
                 现量（capShow 里存一次），宽度由 tick() 按 currentTime 逐拍写

       对已有子节点 append 等于摘下再插回，strikeIn 会在 s3/s5 每一步重放，line 每步
       都重新"划一遍"。只有父层真的不同才搬（消费者没这条路径，留作 helper 的自保）。 */
    var h = node.parentNode || host(parent);
    if (n.parentNode !== h) h.appendChild(n);
    return n;
  }
  /** 对位镜（0.30.0）：一条量规架在这一步正在比的两个位置之间。
   *  调用方只给行基线 baseY 与槽位 k，其余几何从比较列自己的坐标声明推：
   *  两端落在两个被比格的**内侧**外缘再让 3 单位（格半宽 21 → 330+24 / 630−24），
   *  读数取两端中点。三条接线口径：
   *   ① **同一行内换位只推 transform**：整组带 data-k，k 0→1 时 CSS 补间平移
   *      一格（--dur-scope）——"同一把尺被挪到下一对位置上"，位置关系是连续的；
   *   ② **换行/换对是重新量过去**：新 key 从零起笔（.draw 只在新建档那一下跑），
   *      旧尺由 sweep() 撤走——"这是一次新的测量"，不是上一把尺滑过去；
   *   ③ 线 + 两端 tick 写成**一条 path**（M…V…H…V…）：.draw 的 dash 按整条
   *      路径归一（pathLength=1），多子路径会各画各的、接头处闪断；
   *   ④ 纯注释层：group/路径都不吃指针（CSS .scope），读数只写 `i=0` 短记号
   *      （纪律 3），墨色只取 --scope-ink 一支，不碰"对/错"语义色。 */
  function scopeFrame(parent, key, baseY, k){
    var gap = 46, a = 354, b = 606, y = -36, t = 6;   // 354=330+24 / 606=630−24
    var g = put(parent, 'g', key, {class:'scope', 'data-k':k,
      transform:'translate(' + (k * gap) + ',' + baseY + ')'});
    put(g, 'path', key + '-m', {class:'draw', pathLength:1,
      d:'M' + a + ' ' + (y + t) + 'L' + a + ' ' + (y - t) +
        'H' + b + 'V' + (y + t)});
    txt(g, key + '-lab', {class:'in', x:(a + b) / 2, y:y - 15,
      'text-anchor':'middle', 'font-size':10, 'font-family':MONO}, 'i=' + k);
    return g;
  }
  /** 量一个节点在 stop 坐标系里的包围盒：getBBox() 是子坐标系里的数，沿 transform
   *  **属性**一路乘到 stop（与 camBox 同一条教训：getScreenCTM() 读到的是补间半途
   *  的矩阵，而这里要的是"它最终在哪"）。括注只需要轴对齐的并集，旋转/斜切按两角
   *  点取并（同 camBox 的口径）。量不到（display:none、空盒、老引擎没有 DOMMatrix）
   *  就返回 null——宁可不括，也不括一个错的位置（与 spotOn 同口径）。
   *  `flush`（0.44.0 起显式化）：复用节点改了**几何属性**（x / width，不是 transform）
   *  后，getBBox 可能返回上一帧的缓存盒——同帧多量尤甚；要拿新盒就得同位置重插
   *  一次强制重算。但它有代价：DOM 插入会先摘下再插回，节点自己的 CSS 动画
   *  （.in / .draw）会从头重放（stage.md §3.4.5 那条）。所以**只在真的会改几何、
   *  且必须拿到新盒的两个调用点**（connect 的端点）传 true；callout / cue / compare /
   *  brace 的目标多是改 transform 或换文案（bbox 局部坐标不变，矩阵现读就是新位置），
   *  走默认 false，不吃重插的副作用。0.43.0 曾把它写成无条件，等于每句给所有被量
   *  的目标重放一次入场——那是这轮收窄的原因。 */
  function boxIn(node, stop, flush){
    if (flush){
      var p0 = node.parentNode;
      if (p0) p0.insertBefore(node, node.nextSibling);   // 同位置重插：不改渲染顺序，只失效几何缓存
    }
    var bb = node.getBBox();
    if (!bb.width || !bb.height || !window.DOMMatrix) return null;
    var m = new DOMMatrix(), n = node;
    while (n && n !== stop){
      var l = n.transform && n.transform.baseVal;
      if (l && l.numberOfItems){
        var t = new DOMMatrix();
        for (var i = 0; i < l.numberOfItems; i++) t = t.multiply(l.getItem(i).matrix);
        m = t.multiply(m);
      }
      n = n.parentNode;
    }
    var p1 = new DOMPoint(bb.x, bb.y).matrixTransform(m);
    var p2 = new DOMPoint(bb.x + bb.width, bb.y + bb.height).matrixTransform(m);
    return {x:Math.min(p1.x, p2.x), y:Math.min(p1.y, p2.y),
            w:Math.abs(p2.x - p1.x), h:Math.abs(p2.y - p1.y)};
  }
  /** 集合括注（0.34.0）：一条花括线从**两端同时**合拢到下方中点，把几枚已有图元
   *  括成"同一组"。调用方只给父容器、key、被括的节点（id 或节点）和一句短标签，
   *  几何全从 getBBox() 现推——换卡片宽窄、换括几行都不回头改坐标。
   *  四条接线口径：
   *   ① **两半各画各的**：左半从最左外缘起笔、右半从最右外缘起笔，终点同为括尖
   *      （中点下沿再落一头）。两段都是 .draw（pathLength=1），看见的是"两端向
   *      中间收"；若写成一条 path，dash 会从一头扫到另一头，读成"划线"而不是
   *      "总括"（0.30.0 对位镜是一条 path 走完，因为那边读的是"连接"）；
   *   ② **标签晚于线落**：--delay 取 --dur-draw 的 .6——线合拢过大半，字才浮出
   *      来，读序是"先看见括、再看见注"。标签只写短记号（纪律 3），满浓度 --ok；
   *   ③ **纯注释层**：group 与路径都不吃指针（CSS .brace），不碰"对/错"语义色；
   *      括线落在被括内容**下方**（gap 16 + 括深 10 + 括尖 6 + 标签行），横向只比
   *      内容多出 pad 12——范本里 634–950 / 336–368 仍在 FULL 的可见区（x≤990、
   *      y≤394）与字幕带上沿（404）之间，桌面端这一步不必改镜头；窄屏兜底取景
   *      把它读作内容的一部分（它确实是这一步要说的话）。
   *   ④ **复用同一 key 不重放**：class 不变 → .draw/.in 的 animation 不重启
   *      （put 的既有口径），括注只在该步第一次出现时演一次；退回上一步由
   *      sweep() 按 key 整棵收掉。 */
  function braceUnder(parent, key, nodes, label){
    var p = host(parent), u = null;
    (nodes || []).forEach(function(n){
      var q = boxIn(host(n), p); if (!q) return;
      u = !u ? q : {x:Math.min(u.x, q.x), y:Math.min(u.y, q.y),
                    w:Math.max(u.x + u.w, q.x + q.w) - Math.min(u.x, q.x),
                    h:Math.max(u.y + u.h, q.y + q.h) - Math.min(u.y, q.y)};
    });
    if (!u) return null;
    var pad = 12, gap = 16, d = 10, n = 6, k = 9;
    function f(v){ return +v.toFixed(1); }
    var x0 = f(u.x - pad), x1 = f(u.x + u.w + pad);
    var y = f(u.y + u.h + gap), cx = f((x0 + x1) / 2);
    var g = put(p, 'g', key, {class:'brace'});
    // 左半：外端竖直落到平段（Q 圆角），平段走到中点前 k，再拐成括尖。
    put(g, 'path', key + '-l', {class:'draw', pathLength:1,
      d:'M' + x0 + ' ' + y + 'Q' + x0 + ' ' + f(y + d) + ' ' + f(x0 + k) + ' ' + f(y + d) +
        'L' + f(cx - k) + ' ' + f(y + d) +
        'Q' + cx + ' ' + f(y + d) + ' ' + cx + ' ' + f(y + d + n)});
    // 右半：镜像，收笔在同一枚括尖上——两段 dash 同时归零时"合拢"就完成了。
    put(g, 'path', key + '-r', {class:'draw', pathLength:1,
      d:'M' + x1 + ' ' + y + 'Q' + x1 + ' ' + f(y + d) + ' ' + f(x1 - k) + ' ' + f(y + d) +
        'L' + f(cx + k) + ' ' + f(y + d) +
        'Q' + cx + ' ' + f(y + d) + ' ' + cx + ' ' + f(y + d + n)});
    txt(g, key + '-lab', {class:'in', x:cx, y:f(y + d + n + 16),
      'text-anchor':'middle', 'font-size':12, 'font-family':MONO,
      style:'--delay:calc(var(--dur-draw) * .6)'}, label);
    return g;
  }
  /** 引线标注（0.38.0）：给一件**已经在场**的图元挂一句短注记。
   *  调用方只给 key、被注节点（id 或节点）、短句与朝向，几何全在 drawCallouts() 里
   *  现量——与 braceUnder 同一条"不手填坐标"的纪律，但两者量的东西不同：括注量
   *  一组节点的**并集**，这里只量**一个**节点，再把签放到它的某一侧。
   *  四条接线口径：
   *   ① **登记与布局分两拍**：renderer 只 callout() 登记（与 DECODE / COUNT 同表），
   *      真正的量取推迟到 worldFor() 之后——renderer 跑在主角落位之前，世界层还停在
   *      上一步的位置（见 CALL 的注释）。顺序写在 tick() 里，作者零负担；
   *   ② **朝向是构图声明**：'r' / 'l' / 't' / 'b'，默认 'r'。签永远摆在被注盒的
   *      外侧，且横向那两档会**上抬一个签高**（签的右下角靠近圆点），引线因此是一段
   *      先直后斜的折线而不是贴边的横线——读得出"从这儿连过去"；
   *   ③ **量不到就不画**：boxIn() 返回 null（display:none / 空盒）跳过；签比取景窗
   *      还宽、或钳回安全区后会压住被注对象时也跳过——宁可不注，不注一个错位
   *      （与 spotOn / braceUnder 同口径）。安全区取**这一步声明的取景窗**
   *      （CAM[sid][step] || FULL），所以推近的镜头里注记不会被裁到画外；
   *   ④ **复用同一 key 不重放**：class 不变 → .in / .draw / calloutLand 的 animation
   *      不重启（put 的既有口径）；被注对象跨步移动时，签组的 transform 由 .nt 补间
   *      跟着走，读作"注记跟着对象挪"，而不是原地重落一次。
   *  标签文案走 put() 的 text 通道，所以 check_gates.py 的"双字幕"形状比对照样看得见
   *  它（与 badge 同一道防线）；`dec` 与 badge 同义：这个词正在被旁白推出来。 */
  function callout(key, to, s, opt){ CALL.push({key:key, to:to, s:s, opt:opt || {}}); }

  /** 把本步登记的注记全部排一遍：在 tick() 的 worldFor() 之后、camSet() 之前调用。
   *  `win` 用这一步声明的取景窗做安全区；布局完 sweep 收掉上一步没再引用的注记。 */
  function drawCallouts(sid, step){
    var layer = el('callouts');
    if (!layer) return;
    var win = (CAM[sid] || [])[step] || FULL;
    CALL.forEach(function(c){ layoutCallout(layer, c, win); });
    sweep(layer);
  }

  /** 关系连线（0.43.0）：两个已在场的图元之间"关系成立"拉一条细线（比较 / 匹配 /
   *  归并都算）。作者只给 key / 两端元素 key / 可选短标签；几何每帧从 boxIn() 现量
   *  ——端点取各自 bbox 边缘与中心连线的交点、再外伸 2，线贴在两件东西的表面，不是
   *  穿心（与 callout 圆点同一条纪律）。时序分两拍：
   *   · **生长**：首次登记时 dashoffset 从 1 → 0（句首 stepT0 起、--dur-conn、
   *     easeOutExpo，connTock 逐拍写）；复用同一 key 不重放（关系没断，线保持完整）；
   *   · **收回**：`gone:true` 显式声明"关系解除"——线沿原路收回（dashoffset 0 → 1）
   *     再移除，live 播放可见收回，导出帧落在已收回的格上（线不在 = 关系不成立）；
   *   · **不登记即消失**：本步没登记、也没在收回的旧线直接摘掉（与 CALL sweep 同口径）。
   *  标签塞得下才画（中点居中、生长过半浮现）；`pointer-events:none`；线只做"关系"
   *  这一件事，不替代 callout（标注）/ brace（括组）；同一步不要与 #spot 并用。 */
  function connect(key, a, b, opt){ CONN.push({key:key, a:a, b:b, opt:opt || {}}); }

  /** 换句布局：在 tick() 的 worldFor() 之后、camSet() 之前调用（与 drawCallouts 同批）。
   *  只在这一拍建节点 / 跟几何 / 转收回 / 摘旧线；生长与收回的逐拍推进归 connTock。 */
  function layoutConnects(){
    var layer = el('connects');
    if (!layer) return;
    var seen = {};
    CONN.forEach(function(c){
      seen[c.key] = 1;
      if (c.opt && c.opt.gone){ startConnGone(layer, c); return; }
      var g = el('cn-' + c.key);
      if (!g){ g = newConn(layer, c); if (!g) return; }
      placeConn(g, c);
      if (CONN_GONE[c.key]){              // 收回中复活：关系又成立了，线立即回到全长
        delete CONN_GONE[c.key];
        writeConn(g, 0, 1);
      }
    });
    // 摘旧线：本步没登记、也没在收回的 .conn 组直接移除（关系没被声明 = 不存在）
    for (var i = layer.children.length - 1; i >= 0; i--){
      var ch = layer.children[i];
      if (!ch.id || ch.id.indexOf('cn-') !== 0) continue;
      var k = ch.id.slice(3);
      if (!seen[k] && !CONN_GONE[k]) layer.removeChild(ch);
    }
  }

  /** 逐拍推进：每帧调用（与 countRollWrite / meterWrite 同批）。对已登记未 gone 的线
   *  推进生长（句首 stepT0 起），对 CONN_GONE 里的线推进收回；见旗直接落终值——
   *  生长落 dashoffset 0（线完整：定格里读"这两件有关系"）、收回落移除（关系已解除）。 */
  function connTock(t){
    var layer = el('connects');
    if (!layer) return;
    var full = window.__coursewareShotMode || mqReduce.matches;
    CONN.forEach(function(c){
      if (c.opt && c.opt.gone) return;    // gone 走 CONN_GONE
      var g = el('cn-' + c.key);
      if (!g) return;
      if (full){ writeConn(g, 0, 1); return; }
      var dur = connDur(), p = Math.max(0, Math.min(1, (t - g.__t0) / dur)), e = 1 - Math.pow(2, -10 * p);
      if (p >= 1){ writeConn(g, 0, 1); return; }        // 收尾那一帧不许留 0.001 的缝（与 meter 同课）
      writeConn(g, 1 - e, Math.max(0, Math.min(1, (p - .35) / .65)));
    });
    for (var k in CONN_GONE){
      var e2 = CONN_GONE[k];
      if (full){ finishConnGone(layer, k); continue; }
      var p2 = Math.max(0, Math.min(1, (t - e2.t0) / connDur())), ee = 1 - Math.pow(2, -10 * p2);
      if (p2 >= 1){ finishConnGone(layer, k); continue; }   // 收到头：移除（不留 0.999 的缝）
      writeConn(el('cn-' + k), e2.from + (1 - e2.from) * ee, 1 - ee);
      if (p2 >= 1) finishConnGone(layer, k);
    }
  }

  function connDur(){ var d = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--dur-conn')); return isFinite(d) && d > 0 ? d : .5; }
  function f1(v){ return +v.toFixed(1); }
  function f3(v){ return +v.toFixed(3); }   // 细节镜的倍率读数：1 位小数会把 1.656 写成 1.7（起步态差 2.6%）
  /** 一条新线：建包装组 + 线 path，量标签（探针、塞不下不画），记生长起点与当前读数。 */
  function newConn(layer, c){
    var ra = el(c.a), rb = el(c.b);
    if (!ra || !rb) return null;
    var ua = boxIn(ra, el('cam'), true), ub = boxIn(rb, el('cam'), true);
    if (!ua || !ub) return null;
    var p1 = connEdge(ua, ub), p2 = connEdge(ub, ua);
    if (!p1 || !p2) return null;
    if (Math.hypot(p2.x - p1.x, p2.y - p1.y) < 24) return null;   // 贴得太近：不连
    var g = document.createElementNS(NS, 'g');
    g.setAttribute('id', 'cn-' + c.key);
    g.setAttribute('class', 'conn');
    var line = document.createElementNS(NS, 'path');
    line.setAttribute('class', 'line');
    line.setAttribute('pathLength', '1');
    line.setAttribute('stroke-dasharray', '1');
    line.setAttribute('stroke-dashoffset', '1');
    g.appendChild(line);
    layer.appendChild(g);
    g.__t0 = stepT0;                       // 生长起点：本句句首（与 count roll 同拍）
    g.__off = 1;
    if (c.opt && c.opt.label){
      var probe = document.createElementNS(NS, 'text');
      probe.setAttribute('font-size', '12'); probe.setAttribute('font-weight', '600');
      probe.textContent = c.opt.label;
      layer.appendChild(probe);
      var tw = probe.getComputedTextLength ? probe.getComputedTextLength() : 0;
      layer.removeChild(probe);
      if (tw && tw + 16 <= Math.hypot(p2.x - p1.x, p2.y - p1.y)){
        var lab = document.createElementNS(NS, 'text');
        lab.setAttribute('class', 'lab');
        lab.textContent = c.opt.label;
        g.appendChild(lab);
        g.__lab = lab;
      }
    }
    placeConn(g, c);
    return g;
  }
  /** 每帧现量：d 从 a 边缘到 b 边缘、标签中点居中（换句时调用；端点跨步移动时
   *  CSS 的 d transition 负责中间几帧的补间）。 */
  function placeConn(g, c){
    var ra = el(c.a), rb = el(c.b);
    if (!ra || !rb) return;
    var ua = boxIn(ra, el('cam'), true), ub = boxIn(rb, el('cam'), true);
    if (!ua || !ub) return;
    var p1 = connEdge(ua, ub), p2 = connEdge(ub, ua);
    if (!p1 || !p2) return;
    var line = g.querySelector('.line');
    line.setAttribute('d', 'M' + f1(p1.x) + ' ' + f1(p1.y) + 'L' + f1(p2.x) + ' ' + f1(p2.y));
    var lab = g.__lab;
    if (lab){
      lab.setAttribute('x', f1((p1.x + p2.x) / 2));
      lab.setAttribute('y', f1((p1.y + p2.y) / 2));
    }
  }
  /** 显式 gone：把这条线转入收回账本。几何以当前节点为准（换句布局时端点已现量），
   *  from 取当前 dashoffset——线长到一半就解除时，从半截往回收。 */
  function startConnGone(layer, c){
    var g = el('cn-' + c.key);
    if (!g) return;                        // 本就没线：无事可收
    var line = g.querySelector('.line');
    var cur = line ? parseFloat(line.getAttribute('stroke-dashoffset') || '1') : 1;
    if (isNaN(cur)) cur = 1;
    CONN_GONE[c.key] = {t0: stepT0, from: Math.min(1, Math.max(0, cur))};
  }
  /** 写一条线的当前读数：off = dashoffset（0 全长 / 1 未长）、op = 标签透明度；同值不重写。 */
  function writeConn(g, off, op){
    if (!g) return;
    var line = g.querySelector('.line');
    if (line){
      var so = String(+off.toFixed(4));
      if (so !== g.__off){ line.setAttribute('stroke-dashoffset', so); g.__off = so; }
    }
    var lab = g.__lab;
    if (lab){
      var o = String(+op.toFixed(3));
      if (o !== g.__lop){ lab.setAttribute('opacity', o); g.__lop = o; }
    }
  }
  /** 收回完成：移除节点并清账。 */
  function finishConnGone(layer, k){
    var g = el('cn-' + k);
    if (g && layer) layer.removeChild(g);
    delete CONN_GONE[k];
  }
  /** 端点：从 u 的中心朝 v 的中心出发，射线与 u 的 bbox 边缘相交处再外伸 2——线贴
   *  在两件东西的表面，不是穿心。两心重合（或射线过短）时量不出方向，返回 null。 */
  function connEdge(u, v){
    var cx = u.x + u.w / 2, cy = u.y + u.h / 2;
    var dx = v.x + v.w / 2 - cx, dy = v.y + v.h / 2 - cy;
    var ax = Math.abs(dx), ay = Math.abs(dy);
    if (ax < .01 && ay < .01) return null;
    var tx = ax > .01 ? (u.w / 2) / ax : Infinity;
    var ty = ay > .01 ? (u.h / 2) / ay : Infinity;
    var t = Math.min(tx, ty);
    if (!isFinite(t) || t < .01) return null;
    var L = Math.sqrt(dx * dx + dy * dy) || 1;
    return {x: cx + dx * t + dx / L * 2, y: cy + dy * t + dy / L * 2};
  }

  /** 细节镜（0.44.0）：把一件**已经在场**的图元的某一小块"拿到眼前"放大。
   *  镜头推近（0.35.0 对焦）说的是"我走近了，远景跟着虚"；这一条是"取景窗不动、
   *  旁边的东西不跟着变，只有镜里那块被放大"。作者只给 key / 目标 / 观察点
   *  （bbox 内的相对位置，默认中心）与倍率；镜心默认摆到目标**外侧**（默认右），
   *  用一条短茎连回目标边缘——读作"这一块被拿出来看"，而不是"镜盖在原件上"。
   *  六条接线口径：
   *   ① **登记与布局分两拍**：renderer 只 loupe() 登记（与 CALL / CONN 同表），
   *      几何在 layoutLoupes() 里、worldFor() 之后现量——renderer 跑在主角落位
   *      之前，世界层还停在上一步（与 CALL / CUE / CMP 同一个坑）；
   *   ② **镜心在目标外侧、四侧择一**：默认 side:'r'（右缘外 gap 26 + r），放不下
   *      依次试 l / t / b；四侧都放不下（或取景窗比镜还小）时**整个不画**——
   *      宁可不放大，不放大一个错位的块（与 callout 的安全区同口径）；
   *   ③ **镜里是定格副本**：cloneNode 克隆目标子树、递归摘 id（重复 id 会破坏
   *      REG / el()），并摘掉根上的 opacity / data-dim（这一块本来可能退居参照，
   *      但镜里是"看清"，要还原成标准亮度）；CSS .copy * 关掉克隆体自己的
   *      animation / transition——镜里不重放入场，也不跟 .nt 补间的中间帧；
   *      每换句重克隆一次，对象换了位置 / 文案，镜里跟着换；
   *   ④ **三层各干一件事**：lid 只做平移（镜心跟走，走 transition）；zoom 只做
   *      缩放（JS 逐拍写 scale，不挂 transition）；mag 只做 translate(-观察点)。
   *      **变换顺序是 scale 在外、translate 在内**：P′ = k·(P − u)；写反了内容
   *      会飞到镜外（实测踩过：mag 在外时，矩形被搬到 (780,380)，镜里全空）；
   *   ⑤ **时序**：圈与内容从 .72 弹到 1（--dur-in）+ 内容从 k·.92 定到 k
   *      （--dur-loupe、句首 stepT0 起、easeOutExpo，loupeTock 逐拍写）；复用同
   *      key 跨步不重放（p 早已到 1，读数保持 k）；`gone:true` 淡出、下一步不再
   *      登记时由 layoutLoupes 移除；导出 / reduced-motion 落终值（scale 落 k、
   *      圈完整、gone 不可见），定格里读"这一块放大后是什么"；
   *   ⑥ **茎从目标边缘起、到镜圈止**：起点是"观察点 → 镜心"射线与目标 bbox 的
   *      交点（不是观察点本身——从内部起笔会压在字上）；终点收在圈内 2，圈边把
   *      线头盖干净（与 callout 引线同款）。茎短、方向明确，读者一眼看出"镜里
   *      是哪块"。
   *  `pointer-events:none`；镜只做"看清局部"这一件事，不替代 callout（说谁）/
   *  connect（什么关系）/ compare（两版差在哪）。 */
  function loupe(key, node, opt){ LOUPE.push({key:key, node:node, opt:opt || {}}); }

  function loupeDur(){ var d = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--dur-loupe')); return isFinite(d) && d > 0 ? d : .45; }
  function loupeTok(name, dflt){ var v = parseFloat(getComputedStyle(document.documentElement).getPropertyValue(name)); return isFinite(v) && v > 0 ? v : dflt; }

  /** 克隆目标子树当"定格副本"：递归摘 id（防重复 id 破坏 REG / el()），根上摘掉
   *  opacity / data-dim（镜里要看清，不继承"退居参照"的弱化档）。 */
  function loupeClone(node){
    var c = node.cloneNode(true), walk = [c];
    c.removeAttribute('id'); c.removeAttribute('opacity'); c.removeAttribute('data-dim');
    while (walk.length){
      var n = walk.pop();
      if (n.removeAttribute && n !== c) n.removeAttribute('id');
      if (n.children) for (var i = 0; i < n.children.length; i++) walk.push(n.children[i]);
    }
    return c;
  }

  /** 镜心落位：四侧择一（先试声明的 side），只接受**整圈都在取景窗内**的候选；
   *  返回镜心与茎的两端。观察点 → 镜心的射线与目标 bbox 相交处是茎的起点。 */
  function loupePos(u, ux, uy, r, side, win){
    var pad = 6, x0 = win[0] + pad, y0 = win[1] + pad,
        x1 = win[0] + win[2] - pad, y1 = win[1] + win[3] - pad;
    if (r * 2 + 4 > x1 - x0 || r * 2 + 4 > y1 - y0) return null;   // 取景窗比镜还小
    var gap = 26, order = [side || 'r'], all = ['r','l','t','b'];
    all.forEach(function(s){ if (order.indexOf(s) < 0) order.push(s); });
    for (var i = 0; i < order.length; i++){
      var s = order[i], cx, cy;
      if (s === 'r'){ cx = u.x + u.w + gap + r; cy = uy; }
      else if (s === 'l'){ cx = u.x - gap - r; cy = uy; }
      else if (s === 't'){ cx = ux; cy = u.y - gap - r; }
      else { cx = ux; cy = u.y + u.h + gap + r; }
      if (cx - r < x0 || cx + r > x1 || cy - r < y0 || cy + r > y1) continue;
      // 茎起点：观察点 → 镜心的射线与目标 bbox 边缘的交点（t<=2 时就用观察点）
      var dx = cx - ux, dy = cy - uy, L = Math.sqrt(dx * dx + dy * dy) || 1;
      var tx = dx > .01 ? (u.x + u.w - ux) / dx : dx < -.01 ? (u.x - ux) / dx : Infinity;
      var ty = dy > .01 ? (u.y + u.h - uy) / dy : dy < -.01 ? (u.y - uy) / dy : Infinity;
      var t = Math.min(tx, ty), ax = ux, ay = uy;
      if (isFinite(t) && t * L > 2){ ax = f1(ux + dx * t); ay = f1(uy + dy * t); }   // t 是归一化参数，要乘 L 才是单位距离
      // 终点收在圈内 2：圈边把线头盖干净（与 callout 引线同款）
      var sx = f1(cx - dx / L * (r - 2)), sy = f1(cy - dy / L * (r - 2));
      return {cx: f1(cx), cy: f1(cy), ax: ax, ay: ay, sx: sx, sy: sy};
    }
    return null;   // 四侧都放不下：宁可不放大
  }

  /** 建一只镜：茎 + lid（镜底 / 裁剪窗 / zoom / mag / copy / 圈）。层内另挂一条
   *  clipPath（lid 局部坐标，圆心恒在 0,0）——缩放不会把裁剪框一起放大。 */
  function newLoupe(layer, c, node, win){
    var o = c.opt || {};
    var r = o.r || loupeTok('--loupe-r', 52), k = o.k || loupeTok('--loupe-k', 1.8);
    var u = boxIn(node, el('cam'));
    if (!u) return null;
    var at = o.at || [.5, .5];
    var ux = u.x + u.w * Math.max(0, Math.min(1, at[0]));
    var uy = u.y + u.h * Math.max(0, Math.min(1, at[1]));
    var pos = loupePos(u, ux, uy, r, o.side || 'r', win);
    if (!pos) return null;
    // clipPath：与镜一一对应，id 带 key，layout 里按需清理
    var cp = document.createElementNS(NS, 'clipPath');
    cp.setAttribute('id', 'lp-clip-' + c.key);
    cp.setAttribute('clipPathUnits', 'userSpaceOnUse');
    var cc = document.createElementNS(NS, 'circle');
    cc.setAttribute('cx', '0'); cc.setAttribute('cy', '0');
    cc.setAttribute('r', String(Math.max(6, r - 3)));
    cp.appendChild(cc); layer.appendChild(cp);
    var g = document.createElementNS(NS, 'g');
    g.setAttribute('id', 'lp-' + c.key);
    g.setAttribute('class', 'loupe' + (o.gone ? ' gone' : ''));
    var stem = document.createElementNS(NS, 'path');
    stem.setAttribute('class', 'stem draw');
    stem.setAttribute('pathLength', '1');
    stem.setAttribute('d', 'M' + pos.ax + ' ' + pos.ay + 'L' + pos.sx + ' ' + pos.sy);
    var lid = document.createElementNS(NS, 'g');
    lid.setAttribute('class', 'lid');
    lid.setAttribute('transform', 'translate(' + pos.cx + ',' + pos.cy + ')');
    var lens = document.createElementNS(NS, 'circle');
    lens.setAttribute('class', 'lens'); lens.setAttribute('r', String(r));
    var winG = document.createElementNS(NS, 'g');
    winG.setAttribute('class', 'win');
    winG.setAttribute('clip-path', 'url(#lp-clip-' + c.key + ')');
    var zoom = document.createElementNS(NS, 'g');
    zoom.setAttribute('class', 'zoom');
    zoom.setAttribute('transform', 'scale(' + f3(k * .92) + ')');
    zoom.setAttribute('opacity', '0');
    var mag = document.createElementNS(NS, 'g');
    mag.setAttribute('class', 'mag');
    mag.setAttribute('transform', 'translate(' + f1(-ux) + ',' + f1(-uy) + ')');
    var copy = document.createElementNS(NS, 'g');
    copy.setAttribute('class', 'copy');
    copy.appendChild(loupeClone(node));
    mag.appendChild(copy); zoom.appendChild(mag); winG.appendChild(zoom);
    lid.appendChild(lens); lid.appendChild(winG);
    var ring = document.createElementNS(NS, 'circle');
    ring.setAttribute('class', 'ring'); ring.setAttribute('r', String(r));
    lid.appendChild(ring);
    g.appendChild(stem); g.appendChild(lid);
    layer.appendChild(g);
    g.__t0 = stepT0; g.__k = k; g.__r = r;
    return g;
  }

  /** 每句重排：镜心 / 茎 / 观察点现量，镜内副本重克隆（对象可能换了位置 / 文案）。
   *  同 key 跨步**不重放**（__t0 不动，tock 读到 p>=1 就保持 k）。 */
  function placeLoupe(g, c, node, win){
    var o = c.opt || {};
    var u = boxIn(node, el('cam'));
    if (!u) return;
    var at = o.at || [.5, .5];
    var ux = u.x + u.w * Math.max(0, Math.min(1, at[0]));
    var uy = u.y + u.h * Math.max(0, Math.min(1, at[1]));
    var pos = loupePos(u, ux, uy, g.__r, o.side || 'r', win);
    if (!pos) return;
    var lid = g.querySelector('.lid');
    if (lid) lid.setAttribute('transform', 'translate(' + pos.cx + ',' + pos.cy + ')');
    var mag = g.querySelector('.mag');
    if (mag) mag.setAttribute('transform', 'translate(' + f1(-ux) + ',' + f1(-uy) + ')');
    var stem = g.querySelector('.stem');
    if (stem) stem.setAttribute('d', 'M' + pos.ax + ' ' + pos.ay + 'L' + pos.sx + ' ' + pos.sy);
    var copy = g.querySelector('.copy');
    if (copy){
      while (copy.firstChild) copy.removeChild(copy.firstChild);
      copy.appendChild(loupeClone(node));
    }
  }

  /** 换句布局：在 tick() 的 worldFor() 之后、camSet() 之前调用（与 drawCallouts /
   *  layoutConnects 同批）。本步没登记、也没留在 gone 档的镜连同它的 clipPath 一起摘掉。 */
  function layoutLoupes(sid, step){
    var layer = el('loupes');
    if (!layer) return;
    var win = (CAM[sid] || [])[step] || FULL, seen = {};
    LOUPE.forEach(function(c){
      seen[c.key] = 1;
      var node = typeof c.node === 'string' ? el(c.node) : c.node;
      if (!node) return;                        // 目标不在台上：宁可不放大
      var g = el('lp-' + c.key);
      if (!g){ g = newLoupe(layer, c, node, win); if (!g) return; }
      placeLoupe(g, c, node, win);
      g.classList.toggle('gone', !!(c.opt && c.opt.gone));
    });
    // 摘旧镜：本步没登记的直接移除（关系没被声明 = 不看它了）；clipPath 跟着走
    Array.prototype.slice.call(layer.children).forEach(function(ch){
      if (ch.tagName === 'clipPath'){
        var ck = ch.id.replace('lp-clip-', '');
        if (!seen[ck]) layer.removeChild(ch);
        return;
      }
      if (!ch.id || ch.id.indexOf('lp-') !== 0) return;
      if (!seen[ch.id.slice(3)]) layer.removeChild(ch);
    });
  }

  /** 逐拍推进：每帧调用（与 countRollWrite / meterWrite / connTock 同批）。zoom 从
   *  k·.92 定到 k、透明度 0→1（句首 stepT0 起、--dur-loupe、easeOutExpo）；见旗
   *  直接落终值（scale 落 k、透明度 1）——定格里读"这一块放大后是什么"。 */
  function loupeTock(t){
    var layer = el('loupes');
    if (!layer) return;
    var full = window.__coursewareShotMode || mqReduce.matches;
    LOUPE.forEach(function(c){
      var g = el('lp-' + c.key);
      if (!g) return;
      var zoom = g.querySelector('.zoom');
      if (!zoom) return;
      if (full){ zoom.setAttribute('transform', 'scale(' + g.__k + ')'); zoom.setAttribute('opacity', '1'); return; }
      var p = Math.max(0, Math.min(1, (t - g.__t0) / loupeDur()));
      var e = 1 - Math.pow(2, -10 * p);
      if (p >= 1){ zoom.setAttribute('transform', 'scale(' + g.__k + ')'); zoom.setAttribute('opacity', '1'); return; }   // 收尾精确落 k（不留 .999）
      var s = f3(g.__k * (.92 + .08 * e));
      zoom.setAttribute('transform', 'scale(' + s + ')');
      zoom.setAttribute('opacity', String(+e.toFixed(3)));
    });
  }

  /** 形变（0.45.0）：让**同一件东西**换轮廓——旧轮廓连续走到新轮廓，而不是撤掉再
   *  建一张图。前沿对应是 flubber / MorphSVG 那条"轮廓插值"：两端各采同样多的点、
   *  配好顶点对应关系、逐点走线，最后落回目标形状。`.nt` 本来就补间 `d`，但那条要求
   *  两条路径**命令序列同构**（`M L L` 对 `M C` 直接跳档），这一条把限制拆掉：顶点数
   *  不同、有弧有角都能连续，代价是中间帧是采样折线、终态仍是作者那条精确轮廓。
   *  它回答的是"**它自己变了形**"——身份不变、形状变，读出来是连续的一件事；
   *  `.flip` 是同一位置上换了个说法（两面），`compare` 是两个版本叠一扇窗，
   *  `.tuck` / `.reveal` 是让位与上台，都不说"轮廓在变"。
   *  七条接线口径（写错任何一条都会静默退化成一个跳变）：
   *   ① **`d` 归 morph() 独占**：建档时也不要往 put() 的属性表里写 d。put 只在值
   *      不同时覆写属性，于是换句那一步它会把半路的采样折线直接顶成新的目标，
   *      紧接着 morph() 读到的"旧轮廓"已经是新形状 → 无飞行可登记 → 跳档。
   *      正确接线：put 只给 class 与样式，形状只从 morph() 声明。
   *   ② **两端都在节点自己身上现量**：先按旧 d 采一轮，写上 to 之后再采一轮，两次
   *      采样在同一段同步 JS 里，中间那一帧不上屏。不引进 helper 元素，也就不参与
   *      getBBox / prune（对照窗那枚参考盒被自己量进包围盒、窗口越量越大的同一坑）。
   *   ③ **顶点配对**：闭合轮廓先试原序与翻转、再整体旋转，取逐点位移平方和最小的一档
   *      （48×2 次比较，部分和一旦超最优就跳出）。不配对的后果是"两个三角形对转"——
   *      起点差半圈的对应关系会把形变演成扭绞。**不做 flubber 的加权插值**：它补的是
   *      "周长差得多、点位速度不均"，在 48 点与一句的尺度里读不出差别，却要多一倍
   *      采样和一段距离场。开放路径（`opt.open:true`）锚在起点上、不搜配对——搜了
   *      会把线头挪到轮廓中间去。
   *   ④ **终态永远落回作者那条 d**：中间帧才是折线，所以折角在句末是精确的，定格帧
   *      读得到"它就是那个形状"（纪律：状态写在属性上，动画只负责过程）。
   *   ⑤ **首见即建档、不演**（与数字落定 / 量条同口径）：冷启动、导出逐帧、擦洗、
   *      减动效都直接落当步形状——export_video 的每一格永远是精确轮廓，不会有半截。
   *   ⑥ **宁不变形**：不是 `<path>` 的节点原样不动（rect / circle 的形状由自己的几何
   *      属性写着，`.nt` 那条属性补间本来就在兜）；量不到（零长度 / NaN）或逐点最大
   *      位移小于 `--morph-min`（差别小到只是抖）也不演。注意"不演"从来不等于"不落"：
   *      终态在登记那一刻就已经写进 `d` 了，不演的只是中间那些帧。
   *   ⑦ **不与 `.draw` 并用**：两条都在读同一条轮廓的"过程"，读者分不清这是正在被
   *      画出来还是正在换形状；`.morph` 的 transition 清单里也没有 `d`（防双重缓动，
   *      与 .meter / .conn .line 同课）。命中区跟着形状走——这是内容节点本身，
   *      不像注记层要 `pointer-events:none`。 */
  function morphTok(name, dflt){ var v = parseFloat(getComputedStyle(document.documentElement).getPropertyValue(name)); return isFinite(v) && v > 0 ? v : dflt; }
  function morphDur(){ return morphTok('--dur-morph', .55); }

  /** 沿弧长均匀采 n 个点（闭合轮廓取 i/n，不含收尾那一点——它是循环的）。 */
  function morphPts(node, n){
    var L = 0;
    try { L = node.getTotalLength(); } catch (e){ return null; }
    if (!isFinite(L) || L <= 0) return null;
    var pts = [];
    for (var i = 0; i < n; i++){
      var p = node.getPointAtLength(L * i / n);
      if (!p || !isFinite(p.x) || !isFinite(p.y)) return null;
      pts.push([p.x, p.y]);
    }
    return pts;
  }

  /** 给闭合轮廓找一对最省事的顶点对应：原序 / 翻转 × 整体旋转 n 档，比平方和。 */
  function morphAlign(a, b){
    var n = a.length, best = null;
    for (var s = 0; s < 2; s++){
      var q = s ? b.slice().reverse() : b;
      for (var off = 0; off < n; off++){
        var sum = 0, i = 0;
        for (; i < n; i++){
          var p = q[(i + off) % n], dx = p[0] - a[i][0], dy = p[1] - a[i][1];
          sum += dx * dx + dy * dy;
          if (best && sum >= best[0]) break;       // 部分和已超最优：这一档不用算完
        }
        if (i === n && (!best || sum < best[0])) best = [sum, q, off];
      }
    }
    if (!best) return b;
    var out = [];
    for (var j = 0; j < n; j++) out.push(best[1][(j + best[2]) % n]);
    return out;
  }

  /** 采样点写成一条路径；闭合就补 Z（终态不用它——终态是作者那条 d）。 */
  function morphPath(pts, closed){
    var d = 'M' + f1(pts[0][0]) + ' ' + f1(pts[0][1]);
    for (var i = 1; i < pts.length; i++) d += 'L' + f1(pts[i][0]) + ' ' + f1(pts[i][1]);
    return closed ? d + 'Z' : d;
  }

  /** 声明"这个节点这一拍长成 to 这条轮廓"。旧轮廓从节点当前的 d 现读——所以中间

   *  newConn / loupe 的副本同一课）。隐形整圆给 .lp-pop 定支点，见 CSS 边界。 */
  function loopCursor(s){
    var g = LOOP_G[s.key];
    if (g && g.n === s.n && g.pos.parentNode) return g;
    if (g && g.pos.parentNode) g.pos.parentNode.removeChild(g.pos);
    var layer = el('loops');
    if (!layer) return null;
    var T = loopTokens();
    function g0(cls, tag){
      var e = document.createElementNS(NS, tag || 'g');
      if (cls) e.setAttribute('class', cls);

    }
    var cur = g0('lp-cur');
    cur.setAttribute('data-helper', 'loop');
    var dots = g0('lp-dots');
    var pos = g0(null);
    var pop = g0('lp-pop');
    var anchor = g0(null, 'circle');
    anchor.setAttribute('r', T.r);
    anchor.setAttribute('fill', 'none');
    anchor.setAttribute('stroke', 'none');
    var arc = g0('lp-arc crisp', 'path');
    arc.setAttribute('d', loopRingD(T.r, 0));
    pop.appendChild(anchor); pop.appendChild(arc);
    var num = g0('lp-num roll halo', 'text');
    num.setAttribute('x', (T.r + 5).toFixed(1));
    num.setAttribute('y', 3.6);
    num.setAttribute('text-anchor', 'start');
    pos.appendChild(pop); pos.appendChild(num);
    cur.appendChild(dots); cur.appendChild(pos);
    layer.appendChild(cur);
    // k = -1：第一拍只落读数，不演确认拍（跨句续绕时不至于凭空弹一下）
    g = LOOP_G[s.key] = {n:s.n, pos:pos, pop:pop, arc:arc, num:num, dots:dots, k:-1, d:-1};
    return g;
  }

  /** 摘掉一枚游标（连同落点痕）：只摘注记，**不动节点的落点**——绕到第几圈是
   *  对象的状态，注记只是这一步的话头（与 .conn"不登记即消失"同一半，另一半见
   *  SEG_P 那条）。 */
  function removeLoop(key){
    var g = LOOP_G[key];
    if (g){
      if (g.pos.parentNode) g.pos.parentNode.removeChild(g.pos);
      delete LOOP_G[key];
    }
  }

  /** 写这一拍的全部读数：节点的 transform 属性、游标定位、k/n、环口角度、落点痕。
   *  `k` 是**已落定的圈数**（读数写它，不写半圈——"第 3 圈"没有 2.5 圈），
   *  ox / oy 可以是两圈之间的插值，frac 只喂环口（它按占比匀速转，一圈就是一圈）。
   *  痕**不记流水账**：每一圈的位置由落点梯现算（loopWorld），所以冷启动的那一帧
   *  也算得出来——导出与擦洗不会读到"一屏没有痕"的定格（与 drawTo 的 at 同一纪律）。 */
  function loopWrite(s, k, ox, oy, frac, full){
    var n = s.n, T = loopTokens();
    var tx = +s.base[0] + ox, ty = +s.base[1] + oy;
    var tf = 'translate(' + f1(tx) + ',' + f1(ty) + ')';
    if (n.getAttribute('transform') !== tf) n.setAttribute('transform', tf);
    var g = loopCursor(s);
    if (!g) return;
    var w = loopWorld(n, tx, ty);
    if (!w) return;                       // 量不到：节点已经落好，这一拍不动注记
    g.pos.setAttribute('transform', 'translate(' + f1(w.x) + ',' + f1(w.y) + ')');
    // 读数让开本体：环是锚点级的，宽卡片上"1/5"压在对象身上就读成了对象的一部分
    var nx = (Math.max(T.r, w.hw + 4) + 5).toFixed(1);
    if (g.num.getAttribute('x') !== nx) g.num.setAttribute('x', nx);
    g.num.textContent = k + '/' + s.stops.length;
    g.arc.setAttribute('d', loopRingD(T.r, (frac || 0) * 360));
    // 痕：已经落定的每一圈一个小圆点，落在当前位置上的那一枚不画（环就是它）
    var want = 0, i;
    for (i = 1; i <= k; i++){
      var p = loopPos(s, i);
      if (Math.abs(p.x - ox) < .5 && Math.abs(p.y - oy) < .5) continue;
      want++;
    }
    if (g.d !== want){
      while (g.dots.firstChild) g.dots.removeChild(g.dots.firstChild);
      var made = 0;
      for (i = 1; i <= k && made < want; i++){
        var q = loopPos(s, i);
        if (Math.abs(q.x - ox) < .5 && Math.abs(q.y - oy) < .5) continue;
        var wp = loopWorld(n, +s.base[0] + q.x, +s.base[1] + q.y);
        if (!wp) continue;
        var c = document.createElementNS(NS, 'circle');
        c.setAttribute('class', 'lp-dot');
        c.setAttribute('r', T.dot);
        c.setAttribute('cx', f1(wp.x));
        c.setAttribute('cy', f1(wp.y));
        g.dots.appendChild(c); made++;
      }
      g.d = want;
    }
    // 确认拍：落定数真的变了才弹（首拍 k=-1 → 不弹，见 loopCursor）
    if (k !== g.k){
      var first = g.k < 0;
      g.k = k;
      if (!first && !full){
        g.pop.classList.remove('on'); void g.pop.getBoundingClientRect();
        g.pop.classList.add('on');
      }
    }
  }

  /** 直接落定在第 k 圈（起跑点、见旗终态、不演的那些格子都走这一条）。 */
  function loopLand(s, k, quiet){
    var p = loopPos(s, k);
    LOOP_P[s.key] = k;
    loopWrite(s, k, p.x, p.y, 0,
              quiet || scrubbing || window.__coursewareShotMode || mqReduce.matches);
  }

  /** 排这一拍的圈数（worldFor 之后、camSet 之前，与 layoutSegs 同批）。
   *  只做四件事：收孤儿、定这一趟的起止与每圈时长、把起点落进属性、把见旗的格子
   *  直接落终值。**不登记 ≠ 收回**：下一步没再声明这件东西，它停在已经落定的那一圈
   *  （与 SEG_P 同族——绕到的圈数是它的历史，不是这一拍的新内容）；要收就走 gone。 */
  function layoutLoops(stepId, index){
    var full = scrubbing || window.__coursewareShotMode || mqReduce.matches;
    var T = loopTokens(), live = {}, k;
    var sent = sentAt(stepT0).sentence;
    var dur = sent ? +sent.duration : 0;
    if (!isFinite(dur) || dur < 0) dur = 0;
    // ① 孤儿先清：节点被 sweep 摘走 → 注记一起摘，**圈数账本也清掉**（对象不在场了，
    //    "它绕到第几圈"就没有所指；留着只会让重建出来的新节点凭空少绕几圈）
    for (k in LOOP_G){
      if (!LOOP_G[k].n || !LOOP_G[k].n.isConnected){ removeLoop(k); delete LOOP_P[k]; }
    }
    for (k in LOOP_RUN){
      if (!LOOP_RUN[k].n.isConnected){ delete LOOP_RUN[k]; removeLoop(k); delete LOOP_P[k]; }
    }
    // ② 逐条定这一趟
    LOOP.forEach(function(s){
      var n = s.n;
      if (!n.isConnected || typeof n.getBBox !== 'function') return;
      // 档位自动补齐：忘挂 `.lp` = CSS 的 .nt 会去追 JS 每帧写下的落点（双重缓动，
      // 收尾落不回那一格），而且不报错——与 layoutSegs 补 `.seg` 同一处兜底。
      if (!/\blp\b/.test(n.getAttribute('class') || ''))
        n.setAttribute('class', ((n.getAttribute('class') || '') + ' lp').trim());
      var prev = LOOP_P[s.key];
      if (!isFinite(prev)) prev = 0;
      var to = s.gone ? 0 : Math.max(0, Math.min(s.stops.length, s.at));
      live[s.key] = 1;
      s.__prev = prev; s.__to = to; s.__t0 = stepT0;
      var laps = Math.abs(to - prev);
      if (full || laps === 0){
        loopLand(s, to);
        delete LOOP_RUN[s.key];
        if (s.gone){ removeLoop(s.key); delete LOOP_P[s.key]; }
        return;
      }
      var per = s.per > 0 ? s.per : (dur > 0 ? dur / laps : T.min);
      per = Math.max(T.min, Math.min(T.max, per));
      var run = Math.min(per * T.run, T.dur);
      s.__per = per; s.__run = run > 0 ? run : per; s.__dir = to > prev ? 1 : -1;
      loopLand(s, prev);                    // 起点先落进属性：探针 / 导出直接读它
      LOOP_RUN[s.key] = s;
    });
    LOOP_LIVE = live;
    // ③ 本步没再登记、也没在飞的注记：摘掉（落点留在节点身上）
    for (k in LOOP_G) if (!live[k] && !LOOP_RUN[k]) removeLoop(k);
  }

  /** 逐拍（与 segTock / morphTock / connTock 同批）。一圈分两段：走 `--loop-run`
   *  占比（行程封顶 --dur-loop）用 easeOutExpo，剩下的**停**——那段静止就是确认拍，
   *  环口却按整圈占比匀速转（一圈就是一圈，缓动会把"绕完"这件事转歪）。
   *  导出 / 减动效 / 擦洗：直接落声明的那一圈，定格里读到"绕到第 k 圈"，
   *  不是一段没演完的中间态。 */

    var full = scrubbing || window.__coursewareShotMode || mqReduce.matches;
    for (var key in LOOP_RUN){
      var s = LOOP_RUN[key];
      if (!s.n.isConnected){

      }
      if (full){
        loopLand(s, s.__to, true); delete LOOP_RUN[key];
        if (s.gone) removeLoop(key); else if (!LOOP_LIVE[key]) removeLoop(key);
        continue;
      }
      var e = t - s.__t0;
      if (e <= 0){ loopLand(s, s.__prev); continue; }   // 起跑之前（seek 回句首前）
      var laps = Math.abs(s.__to - s.__prev);
      var j = Math.floor(e / s.__per);
      if (j >= laps){
        loopLand(s, s.__to);
        delete LOOP_RUN[key];
        if (s.gone){ delete LOOP_P[key]; removeLoop(key); }
        else if (!LOOP_LIVE[key]) removeLoop(key);       // 越句 spill 到这一步才落完
        continue;
      }
      var lapT = e - j * s.__per;
      var q = Math.min(1, lapT / s.__run);
      var a = s.__prev + s.__dir * j, b = a + s.__dir;
      var pa = loopPos(s, a), pb = loopPos(s, b);
      // 落定那一格必须**精确**是那一格：easeOutExpo 在 q=1 时是 1−2⁻¹⁰=.99902，
      // 会把每一圈推开半像素（与 segTock 的 `p >= 1` 直接落终值同一纪律）
      var eq = q >= 1 ? 1 : 1 - Math.pow(2, -10 * q);     // easeOutExpo：走的那一段
      loopWrite(s, q >= 1 ? b : a,
                pa.x + (pb.x - pa.x) * eq, pa.y + (pb.y - pa.y) * eq,
                Math.min(1, lapT / s.__per), full);
    }
  }

  /* ── 时序带（0.48.0）═══════════════════════════════════════════════════
     词表里有"走到第几段"（drawTo）与"绕到第几回"（loopTo），却没有一件事之间的
     **并行关系**。课堂里"读写重叠""流水线四段同时在不同的工件上""递归一路下去、
     再一路回来"全靠旁白说"同时"两个字，画面里没有任何东西在演它——而"同时"恰恰是
     最难用文字讲清的一件事：观众要么看成"一件接一件"，要么看成"一团一起动"。
     这一条把并行落成**相位**：每条泳道一个启动相位 `phase`（句子进度到了相位才
     起步），之后与句子同速走完剩下的 (1 − phase)。于是
       · 相位全 0 → 几条实心段同速长 = **同时**；
       · 相位递增 → 阶梯式起步 = **先后**；
       · 相位倒序（后声明的先起步）→ **抢跑**，与"从右往左读"的直觉一致。
     作者只声明"谁和谁在一起、谁在谁之后"（items + phase）：带宽与上下沿来自各
     item 在 #cam 里的水平并集（现量），实心段与针的位置来自唯一那只时钟
     （`(t − stepT0) ÷ dur`，与 capProgWrite / `--lit` 同一个算式）。**没有第二个
     数要维护**，也就没有"作者填的时长与句子对不上"这一类错，而且这条带天生没有
     跨步账本——擦洗、逐帧冷启动、导出读的都是同一格。
     四条分工（与形近的原语最容易混的地方）：
       · `drawTo()` = **一条路**自己的已走段（单条、连续、可以停在半路）；
       · `loopTo()` = **一件东西**绕到第几回（单件、离散落点）；
       · `.ride`    = **有人**沿这条路走到那头（移动的是物件，路不变）；
       · `lanes()`  = **几件东西各自**走到哪儿了（多轨、共用同一条时钟，比的正是
         相位差；它不演"顺序执行"本身——那是各步 renderer 的事，它演的是"这几件
         东西在时间上是什么关系"）。 */
  function laneTokens(){
    if (LANE_T) return LANE_T;
    var T = {h:morphTok('--lane-h', 6), gap:morphTok('--lane-gap', 5),
             pad:morphTok('--lane-pad', 11), min:morphTok('--lane-min', 40),
             fs:morphTok('--lane-fs', 10)};
    LANE_T = T;
    return T;
  }

  /** 登记一条时序带。opt：
   *    · items  必填：参与的那几件东西（id 或节点），**一条泳道一个**，声明顺序 =
   *             泳道自上而下的顺序；
   *    · phase  可选：每条道的启动相位（0–1 的句子进度分数），缺省全 0 = 同时起步。
   *             钳到 [0, .9]：相位写 1 就是"永远不开始"，那不是内容而是笔误；
   *    · lab    可选：每条道左侧的短标签（整组放不下就都不画，带宽与针照旧）。
   *  items 为空、或有任一节点不在这一步的台上：整条带静默不登记（半条带比没有带
   *  更误导，与 loupe / callout 的"量不到就不注"同一口径）。
   *  **没有 gone**：这条带记的是"这一句在说哪几件一起"，不是对象的历史——不登记
   *  即摘掉（与 callout / connect 同族，与 SEG_P / LOOP_P 相反）。 */
  function lanes(key, opt){
    var o = opt || {}, it = o.items || [];
    if (!it.length) return;
    var ns = [], ph = o.phase || [], out = [];
    for (var i = 0; i < it.length; i++){
      var n = typeof it[i] === 'string' ? el(it[i]) : it[i];
      if (!n || !n.isConnected) return;                 // 有一件不在场：整条不画
      ns.push(n);
      var v = ph.length ? +ph[i] : 0;
      out.push(isFinite(v) ? Math.max(0, Math.min(.9, v)) : 0);
    }
    LANE.push({key:key, n:ns, phase:out, lab:o.lab || null});
  }

  /** 句子进度（0–1）：整条带唯一的时间读数。见旗（导出 / 减动效 / 擦洗）直接给 1
   *  ——定格里读"这一句念完，这几件事都做完了"，而不是"针停在半路"的中间态。 */
  function laneAt(t, dur){
    if (scrubbing || window.__coursewareShotMode || mqReduce.matches) return 1;
    if (!(dur > 0)) return 1;
    return Math.max(0, Math.min(1, (t - stepT0) / dur));
  }

  /** 第 i 条道的实心比例：相位到了才起步，之后与句子同速走完剩下的 (1 − phase)。
   *  纯函数——同一个 (at, phase) 永远算出同一个数，所以冷启动与直播同一格。 */
  function laneFill(at, ph){
    if (at <= ph) return 0;
    return Math.min(1, (at - ph) / (1 - ph));
  }

  /** 同值不重写：这一族每帧都跑，属性重写一次就是一次布局失效（与 capProgWrite 同课）。
   *  比之前先 String()：数值属性取回来是字符串，`'3' !== 3` 会让"同值不重写"形同虚设。 */
  function laneSet(e, k, v){
    v = String(v);
    if (e.getAttribute(k) !== v) e.setAttribute(k, v);
  }

  /** 按 key 建一条带（轨道 / 实心段 / 标签 / 针），建过就复用。全部 createElementNS、
   *  不进 put()：注记没有"上一状态"要补间，每拍由 laneWrite() 写死（与游标 / 连线
   *  的副本同一课）。道数或标签文字变了就重建——重建比留着旧的更省心，这一步本来
   *  每拍都要重写全部几何。 */
  function laneBuild(s){
    var sig = s.lab ? s.lab.join('|') : '';
    var g = LANE_G[s.key];
    if (g && g.rows.length === s.n.length && g.sig === sig && g.root.parentNode) return g;
    if (g && g.root.parentNode) g.root.parentNode.removeChild(g.root);
    var layer = el('lanes');
    if (!layer) return null;
    var T = laneTokens(), rx = (T.h / 2).toFixed(1);
    var root = document.createElementNS(NS, 'g');
    root.setAttribute('class', 'ln');
    root.setAttribute('data-helper', 'lane');
    var rows = [];
    for (var i = 0; i < s.n.length; i++){
      var row = document.createElementNS(NS, 'g');
      var t = document.createElementNS(NS, 'rect');
      t.setAttribute('class', 'ln-t'); t.setAttribute('rx', rx);
      var f = document.createElementNS(NS, 'rect');
      f.setAttribute('class', 'ln-f'); f.setAttribute('rx', rx); f.setAttribute('width', '0');
      row.appendChild(t); row.appendChild(f);
      var lab = null;
      if (s.lab && s.lab[i] !== undefined && s.lab[i] !== null){
        lab = document.createElementNS(NS, 'text');
        lab.setAttribute('class', 'ln-lab halo');
        lab.setAttribute('text-anchor', 'end');
        lab.textContent = s.lab[i];
        row.appendChild(lab);
      }
      root.appendChild(row);
      rows.push({t:t, f:f, lab:lab, labw:-1, labt:null});
    }
    var nd = document.createElementNS(NS, 'path');      // "现在"针的竖线
    nd.setAttribute('class', 'ln-n crisp');
    var hd = document.createElementNS(NS, 'path');      // 针尖那枚小三角
    hd.setAttribute('class', 'ln-head');
    root.appendChild(nd); root.appendChild(hd);
    layer.appendChild(root);
    g = LANE_G[s.key] = {root:root, rows:rows, nd:nd, hd:hd, n:s.n, sig:sig};
    return g;
  }

  /** 摘掉一条带（只摘注记——这条带本来就没有账本要留）。 */
  function removeLane(key){
    var g = LANE_G[key];
    if (g){
      if (g.root.parentNode) g.root.parentNode.removeChild(g.root);
      delete LANE_G[key];
    }
  }

  /** 标签宽度只在文字变了时量一次（被摘掉显示的元素量出 0，量前先把 `display`
   *  属性临时请回来——这里藏的是**属性**不是 style，读错一处就永远量到 0）。 */
  function laneLabW(r){
    var txt = r.lab.textContent;
    if (r.labw >= 0 && r.labt === txt) return r.labw;
    var off = r.lab.getAttribute('display');
    if (off){ r.lab.removeAttribute('display'); }
    r.labw = r.lab.getComputedTextLength ? r.lab.getComputedTextLength() : 0;
    if (off){ r.lab.setAttribute('display', off); }
    r.labt = txt;
    return r.labw;
  }

  /** 摆一条带并写这一拍的全部读数：量各 item 的水平并集 → 定带宽与上下沿 →
   *  轨道 / 实心段 / 标签 / 针一次写齐。上下沿优先摆在对象**下方**（净空
   *  --lane-pad）；下方放不下整带就翻到上方；两头都放不下（取景窗太矮）整条带
   *  不画并返回 false，由调用方收账。带宽下限 --lane-min：几件东西挤在一列时
   *  带子不该细成一条缝；比并集宽时居中，不让左边那件占便宜。 */
  function laneWrite(s, at){
    var T = laneTokens(), g = laneBuild(s);
    if (!g) return false;
    // 安全区用**本步声明的取景窗**（与 drawCallouts / layoutLoops 同一口径），不是 VIEW：
    // 镜头推到 [230,61,580,120] 那一格时，窗外的世界照样"放不下"，拿 VIEW 判会把带子
    // 摆进看不见的那半截舞台，或反过来在能看见的地方提前翻面。
    var A = s.__win || FULL;     // [x, y, w, h]，与本步声明的取景窗同形
    var cam = el('cam'), u = null, i, b;
    for (i = 0; i < s.n.length; i++){
      b = boxIn(s.n[i], cam);
      if (!b) return false;                       // 有一件量不到：整条不摆（宁缺）
      if (!u) u = {x:b.x, y:b.y, x2:b.x + b.w, y2:b.y + b.h};
      else { u.x = Math.min(u.x, b.x); u.y = Math.min(u.y, b.y);
             u.x2 = Math.max(u.x2, b.x + b.w); u.y2 = Math.max(u.y2, b.y + b.h); }

    var W = Math.max(T.min, u.x2 - u.x);

    // 跟着行走，写在 build 期就会把所有标签叠在同一行上（第 2 条道的字飘在台顶）
    var h2 = f1(T.h);
    for (i = 0; i < g.rows.length; i++){
      var r = g.rows[i], ry = f1(y + i * (T.h + T.gap));

      laneSet(r.t, 'width', f1(W)); laneSet(r.t, 'height', h2);
      laneSet(r.f, 'x', f1(x)); laneSet(r.f, 'y', ry);
      laneSet(r.f, 'width', f1(W * laneFill(at, s.phase[i]))); laneSet(r.f, 'height', h2);
      if (r.lab){
        laneSet(r.lab, 'x', f1(x - 8));
        laneSet(r.lab, 'y', f1(ry + T.h / 2 + T.fs * .34));
      }
    }
    // 标签是"这一条道是谁"，不是第二条注记：整组放不下就都不画，不留一半
    if (g.rows.some(function(r){ return !!r.lab; })){
      var maxw = 0;
      g.rows.forEach(function(r){ if (r.lab) maxw = Math.max(maxw, laneLabW(r)); });
      var on = x - 8 - maxw >= A[0];
      g.rows.forEach(function(r){
        if (r.lab) laneSet(r.lab, 'display', on ? 'inline' : 'none');
      });

    var nx = f1(x + W * at);
    laneSet(g.nd, 'd', 'M' + nx + ' ' + f1(y - 3) + 'V' + f1(y + H + 3));
    laneSet(g.hd, 'd', 'M' + nx + ' ' + f1(y - 3) + 'l-3 -5h6z');

  }

  /** 排这一拍的时序带（layoutLoops 之后、camSet 之前，与其余 layout 同批）。
   *  只做三件事：收孤儿、按当前档位摆一遍（句首那一格）、把本步没再登记的摘掉。 */
  function layoutLanes(stepId, index){
    var live = {}, k;
    var win = (CAM[stepId] || [])[index] || FULL;       // 本步声明的取景窗 = 安全区
    for (k in LANE_G){                                  // ① 节点被摘 → 那条带整条摘
      var gg = LANE_G[k];
      for (var i = 0; i < gg.n.length; i++){
        if (!gg.n[i].isConnected){ removeLane(k); break; }
      }
    }
    var sent = sentAt(stepT0).sentence;
    var dur = sent ? +sent.duration : 0;
    if (!isFinite(dur) || dur < 0) dur = 0;
    LANE.forEach(function(s){
      live[s.key] = 1; s.__dur = dur; s.__win = win;
      if (!laneWrite(s, laneAt(stepT0, dur))) removeLane(s.key);   // ② 摆不下就不画
    });

    for (k in LANE_G) if (!live[k]) removeLane(k);      // ③ 不登记即摘（无账本）
  }

  /** 逐拍（与 loopTock / segTock 同批）。针与实心段都是时钟的纯函数，没有"在飞的
   *  一趟"要收账；摆不下（对象正在入场、并集临时越界）就整条摘掉，下一拍不重试，
   *  等下一次换句的 layoutLanes 再判——避免每帧反复建摘。 */
  function lanesTock(t){
    for (var i = 0; i < LANE.length; i++){
      var s = LANE[i];
      if (!LANE_G[s.key]) continue;
      if (!laneWrite(s, laneAt(t, s.__dur))) removeLane(s.key);
    }
  }

  /* ── 区间窗（0.49.0）═══════════════════════════════════════════════════
     词表已经能说"这条路走到第几段"（drawTo）、"这件东西绕到第几回"（loopTo）、
     "这几件各自做到哪儿"（lanes）——全都在**时间轴**上；没有一条说"取的是哪几件"。
     而 `slice` / `substring` / 二分查找的候选区间 / 滑动窗口 / 分页，讲的都是
     "从第几件到第几件这一段"：宽度本身就是读数，而且它**会走**——同一个宽度扫过
     整排，才叫窗口在滑。此前这件事只能靠旁白说"我们要中间这三个"，画面里没有
     任何东西在说"中间"是哪三个。
     作者只给序列（of）与两个序号（from / to，闭区间、0 基）：左右切口、上下沿、
     序号读数全从各件的盒现推，作者不填坐标。
     四条分工（与形近的原语最容易混的地方）：
       · `.brace` + `braceUnder()` = **这几件算一组**（静态括注、没有序号、不会走）；
       · `#spot` / `[data-dim]`    = **只看这一处 / 其余是上下文**（不是一个区间）；
       · `lanes()`                 = 这几件**各自**做到哪儿了（时间上的并行关系）；
       · `drawTo()`                = **一条路**自己的已走段（路径的比例，不是序号区间）；
       · `range()`                 = **取哪几件**（序号区间：宽度是读数，而且会滑）。 */
  function rangeTokens(){

             fs:morphTok('--range-fs', 10), dur:morphTok('--dur-range', .42)};
    RANGE_T = T;
    return T;
  }

  /** 登记一条取景带。opt：
   *    · of   必填：被取的那一排（id 或节点），声明顺序 = 序号顺序；
   *    · from 可选：起点序号（0 基、**含**），缺省 0；
   *    · to   可选：终点序号（0 基、**含**），缺省 = from（"只取一件"）；
   *             越界夹取到 [0, of.length − 1]，`to < from` 收成 `to = from`；
   *    · lab  可选：读数签的整句文案（缺省 `from–to / n`）；
   *    · num  可选：`false` 时不画读数签，只留带子与两道切口。
   *  of 为空、或有任一节点不在这一步的台上：整条静默不登记（半条窗比没有窗更
   *  误导，与 lanes / loupe / callout 的"量不到就不注"同一口径）。
   *  **没有 gone**：这条带记的是"这一句取的是哪几件"，不是对象的历史——不登记
   *  即摘掉（与 callout / connect / lanes 同族）。 */
  function range(key, opt){
    var o = opt || {}, it = o.of || [];
    if (!it.length) return;
    var ns = [];
    for (var i = 0; i < it.length; i++){
      var n = typeof it[i] === 'string' ? el(it[i]) : it[i];
      if (!n || !n.isConnected) return;                 // 有一件不在场：整条不画
      ns.push(n);
    }
    var last = ns.length - 1;
    var a = Math.round(isFinite(+o.from) ? +o.from : 0);
    var b = (o.to === undefined || o.to === null) ? a : Math.round(+o.to);
    a = Math.max(0, Math.min(last, a));
    b = Math.max(a, Math.min(last, isFinite(b) ? b : a));
    RANGE.push({key:key, n:ns, from:a, to:b, lab:o.lab || null, num:o.num !== false});
  }

  /** 同值不重写：这一族每帧都跑，属性重写一次就是一次布局失效（与 laneSet 同课）。
   *  比之前先 String()：数值属性取回来是字符串，`'3' !== 3` 会让它形同虚设。 */
  function rangeSet(e, k, v){
    v = String(v);
    if (e.getAttribute(k) !== v) e.setAttribute(k, v);
  }

  /** 这一拍的目标那一块：所取那几件的盒并集，四边外扩 --range-pad。切口因此落在
   *  **件与件之间的缝**里而不是压在字上——这是"从这里切开"读得出来的原因。
   *  pad 必须小于相邻两件的缝，否则切口会压到邻居身上（文档里写成边界）。
   *  量不到任一件返回 null（宁缺，不画一条糊在错误位置的带子）。 */
  function rangeBox(s){
    var cam = el('cam'), u = null, i, b;
    for (i = s.from; i <= s.to; i++){
      b = boxIn(s.n[i], cam);

      if (!u){ u = {x:b.x, y:b.y, x2:b.x + b.w, y2:b.y + b.h}; }
      else { u.x = Math.min(u.x, b.x); u.y = Math.min(u.y, b.y);
             u.x2 = Math.max(u.x2, b.x + b.w); u.y2 = Math.max(u.y2, b.y + b.h); }

  /** 按 key 建一条带（底色 / 两道切口 / 读数签），建过就复用。全部 createElementNS、
   *  不进 put()：注记没有"上一状态"要补间，每拍由 rangeWrite() 写死（与 .ln / 游标
   *  的同一课）。节点数不参与结构（带的形状只由四个数决定），所以只需要按 key 复用。 */
  function rangeBuild(s){
    var g = RANGE_G[s.key];

    if (g && g.root.parentNode) g.root.parentNode.removeChild(g.root);

    root.setAttribute('class', 'rg');
    root.setAttribute('data-helper', 'range');
    var band = document.createElementNS(NS, 'rect');
    band.setAttribute('class', 'rg-f'); band.setAttribute('rx', '3');
    var e1 = document.createElementNS(NS, 'rect'); e1.setAttribute('class', 'rg-e');
    var e2 = document.createElementNS(NS, 'rect'); e2.setAttribute('class', 'rg-e');
    var lab = document.createElementNS(NS, 'text');
    lab.setAttribute('class', 'rg-lab halo'); lab.setAttribute('text-anchor', 'middle');
    root.appendChild(band); root.appendChild(e1); root.appendChild(e2); root.appendChild(lab);
    layer.appendChild(root);
    g = RANGE_G[s.key] = {root:root, band:band, e1:e1, e2:e2, lab:lab, labw:0, labt:null, s:s};
    return g;
  }

  /** 摘掉一条带（只摘注记——这条带本来就没有账本要留）。 */
  function removeRange(key){
    var g = RANGE_G[key];
    if (g){
      if (g.root.parentNode) g.root.parentNode.removeChild(g.root);
      delete RANGE_G[key];
    }
  }

  /** 把一块几何写进这条带（四个数一次写齐，逐拍无补间）。读数签：
   *   · 文案只在变了时改（宽度也只在那时量一次）——量之前先把 `display` 属性
   *     **临时请回来**，藏起来的元素量出 0（与 laneLabW 同一个坑）；
   *   · 整签**压回取景窗**：读数是这条原语的主角，宁可往里缩也不能被裁掉；
   *     窗口比签还窄就居中（这时它已经比窗宽，缩不进任何地方）。
   *   · 签在上沿外 6；上方被取景窗顶住了就落到带子下方（别探到画外）。 */
  function rangeWrite(s, q){
    var T = rangeTokens(), g = rangeBuild(s);
    if (!g) return false;
    rangeSet(g.band, 'x', f1(q.l)); rangeSet(g.band, 'y', f1(q.y));
    rangeSet(g.band, 'width', f1(Math.max(0, q.r - q.l))); rangeSet(g.band, 'height', f1(q.h));
    var cap = T.cap;
    rangeSet(g.e1, 'x', f1(q.l)); rangeSet(g.e2, 'x', f1(q.r - 1));
    rangeSet(g.e1, 'y', f1(q.y - cap)); rangeSet(g.e2, 'y', f1(q.y - cap));
    rangeSet(g.e1, 'width', 1); rangeSet(g.e2, 'width', 1);
    rangeSet(g.e1, 'height', f1(q.h + cap * 2)); rangeSet(g.e2, 'height', f1(q.h + cap * 2));
    if (!s.num){ rangeSet(g.lab, 'display', 'none'); return true; }
    rangeSet(g.lab, 'display', 'inline');
    var txt = s.lab || (s.from + '–' + s.to + ' / ' + s.n.length);
    if (g.labt !== txt){
      g.lab.textContent = txt; g.labt = txt;
      var off = g.lab.getAttribute('display');
      if (off === 'none') g.lab.removeAttribute('display');
      g.labw = g.lab.getComputedTextLength ? g.lab.getComputedTextLength() : 0;
      if (off === 'none') g.lab.setAttribute('display', 'none');

    if (w && A[2] > w + 4) cx = Math.max(A[0] + w / 2 + 2, Math.min(A[0] + A[2] - w / 2 - 2, cx));
    else if (A[2] <= w + 4) cx = A[0] + A[2] / 2;

    if (ty < A[1] + T.fs) ty = q.y + q.h + T.fs + 4;     // 上方顶住 → 落到带子下方

  }

  /** 排这一句的区间窗（layoutLanes 之后、camSet 之前，与其余 layout 同批）。
   *  只做三件事：收孤儿、定这一句的起点（上一拍写到的那四个数）、按起点摆一格。
   *  **起点要定住**：窗口从"上一句停在的位置"滑到这一句的位置，而不是瞬移——
   *  这是"窗口会走"这条读法的一半（另一半在 rangeTock 里逐拍追目标）。 */
  function layoutRanges(stepId, index){
    var live = {}, k, g;
    var win = (CAM[stepId] || [])[index] || FULL;        // 本步声明的取景窗 = 读数签的安全区
    var full = scrubbing || window.__coursewareShotMode || mqReduce.matches;
    for (k in RANGE_G){                                  // ① 节点被摘 → 那条带整条摘
      g = RANGE_G[k];
      if (!g.s) { removeRange(k); continue; }
      for (var i = 0; i < g.s.n.length; i++){
        if (!g.s.n[i].isConnected){ removeRange(k); delete RANGE_P[k]; break; }
      }
    }
    RANGE.forEach(function(s){
      live[s.key] = 1; s.__win = win; s.__t0 = stepT0;
      var q = rangeBox(s);
      if (!q){ removeRange(s.key); return; }             // ② 量不到就不画
      var p = RANGE_P[s.key];
      s.__q0 = (!full && p) ? p : null;                  // 起点：上一拍写到的位置
      rangeWrite(s, full ? q : (s.__q0 || q));
      /* 账本记的是"屏幕上现在那一块"，不是"目标"：第一帧也要有起点（否则同一个 key
         第一次登记的下一句会瞬移，而不是从它刚才停的位置滑过去）。 */
      RANGE_P[s.key] = full ? q : (s.__q0 || q);

  }

  /** 逐拍（与 lanesTock / loopTock 同批）。窗口从换句那一刻的起点往**当拍量到的**
   *  目标追（easeOutExpo，--dur-range）：对象还在入场 / 还在挪位时带子跟着它落位，
   *  而不是钉在入场前一瞬的位置上。追上了（p ≥ 1）就改成直写目标——之后对象再动，
   *  带子跟着动，不再补间（否则每一步会再多滑一次）。
   *  见旗（导出 / 减动效 / 擦洗）直接落作者声明的那一格：定格里读到"取的是这几件"，
   *  不是一段没滑完的中间态。 */
  function rangeTock(t){
    var full = scrubbing || window.__coursewareShotMode || mqReduce.matches;
    var T = rangeTokens();
    for (var i = 0; i < RANGE.length; i++){
      var s = RANGE[i];
      if (!RANGE_G[s.key]) continue;
      var q = rangeBox(s);
      if (!q){ removeRange(s.key); continue; }
      if (full || !s.__q0){ rangeWrite(s, q); RANGE_P[s.key] = q; continue; }
      var p = (t - s.__t0) / T.dur;
      if (p <= 0){ rangeWrite(s, s.__q0); RANGE_P[s.key] = s.__q0; continue; }
      var a = s.__q0;
      // 落定那一格必须精确是那一格：easeOutExpo 在 p=1 时是 1−2⁻¹⁰=.99902，
      // 会把窗口停在离目标半像素的地方（与 segTock / loopTock 同一纪律）
      var e = p >= 1 ? 1 : 1 - Math.pow(2, -10 * p);
      var cur = {l:a.l + (q.l - a.l) * e, r:a.r + (q.r - a.r) * e,
                 y:a.y + (q.y - a.y) * e, h:a.h + (q.h - a.h) * e};
      rangeWrite(s, cur); RANGE_P[s.key] = cur;
      if (p >= 1) s.__q0 = null;
    }
  }


  /* ── 界线（0.50.0）────────────────────────────────────────────────────────
     整张词表能说"多大 / 到哪儿 / 谁跟谁 / 哪几件 / 几时"，唯一说不出的是**够不够**：
     量与一条界的关系——过没过、差多少、越线那一刻是不是另一件事。meter 画"多长"，
     这一族画"界在哪、到没到"。于是"预算 / 上限 / 容量 / 安全水位 / 超时 / 误差容限 /
     临界点"这些判断第一次能落在画面上，而不是只在旁白里。
     它自己**不画量**：量由作者自己的图形提供（meter 的条、一根柱子、一条水位），这一族
     每一拍现量那颗量的边（probe）与界线比。所以"越线"是**真实发生的**——发生在量真的
     长过去的那一帧，而不是作者算好放在第几句。不给 probe 就只是一条标尺（"满格到这儿"）。
     三件东西：界线（一条 + 两端 T 形端头，伸出容器外让"界"在上下都看得见）、界外那一
     侧的淡染区带（"这一侧都不行"，**常驻**——它是刻度不是事件，越界才出现就成了"这算
     一个事"）、读数（界值；越界时多一行"超 N"，那才是这条原语的落点）。
     没有跨步账本：界线位置是 of 盒与 at 的纯函数、判定是现量的比较，擦洗 / 逐帧冷启动
     / 导出读同一格。见旗时 meter 落满 → 判定自然落"越界"，不必另写兜底。 */

  /** 令牌缓存（与 rangeTokens 同一口径：设计期参数，读一次就缓存；改名删名落默认档）。 */
  function limitTokens(){
    if (LIM_T) return LIM_T;
    LIM_T = {cap:morphTok('--lim-cap', 7), fs:morphTok('--lim-fs', 10)};
    return LIM_T;
  }

  /** 登记一条界线。opt：
   *    · of    必填：参照物（id 或节点）——界线画在它的盒里，`at` 是它这条轴上的比例；
   *    · at    必填：(0–1) 界线位置，沿**量增长的那个方向**计（x 轴从左往右、y 轴从下
   *            往上；写 .8 = "八成处"），越界夹取到 [0, 1]；
