name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Python deps
        # 测试套件零网络零密钥：唯一非标准库依赖是 REALCLOCK 真实时钟回归
        # 用的 websocket-client（浏览器冒烟/导出走系统 Chrome + ffmpeg）。
        run: |
          python -m pip install --upgrade pip
          pip install websocket-client

      - name: Install ffmpeg and ensure Chrome
        # ubuntu-latest 镜像自带 google-chrome-stable；不存在时兜底安装。
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          if ! command -v google-chrome >/dev/null 2>&1; then
            wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
          fi
          google-chrome --version
          ffmpeg -version | head -1

      - name: Full test suite (static + browser smoke)
        # 浏览器冒烟与导出按环境能力自动启用；REALCLOCK 两类默认跳过。
        run: python -m pytest tests/ -q

      - name: Real-clock browser regression (REALCLOCK=1)
        # 真实 audio.currentTime 回归：字幕翻句延迟有界、任意采样点字幕一致、
        # 门禁真实开/锁/继续、seek 门禁语义与截图模式（详见 tests/test_pipeline_smoke.py）。
        run: REALCLOCK=1 python -m pytest tests/test_pipeline_smoke.py -q -k "RealClock or SeekGate"
